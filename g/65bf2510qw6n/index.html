/* 一列山：后排淡墨先铺，前排再压，才有层叠。
   峰距不等、高矮悬殊、峰体互相咬合，才不像一排锯齿。 */
function mapRidge(x0, y0, x1, y1, rng, o){
  var n = o.n || 3, out = '', i;
  var dx = x1-x0, dy = y1-y0, len = Math.hypot(dx,dy)||1;
  var ux = dx/len, uy = dy/len, nx = -uy, ny = ux;
  /* 主峰位置：中点偏一点，其余向两侧散开 */
  var dom = 0.34 + rng()*0.32;
  var ts = [dom];
  for(i=1;i<n;i++){
    var side = (i % 2) ? 1 : -1;
    var tt = dom + side * (0.20 + 0.26*(Math.floor(i/2)+rng()*0.5));
    ts.push(Math.max(0.02, Math.min(0.98, tt)));
  }
  ts.sort(function(a,b){ return a-b; });
  /* 后排：远峰，淡而更高，向左上让出层次 */
  for(i=0;i<ts.length;i++){
    var tb = ts[i] + (rng()-.5)*0.10;
    var cxB = x0 + dx*tb - uy*2.4 + nx*(rng()-.5)*len*0.05;
    var byB = y0 + dy*tb - 2.1 + ny*(rng()-.5)*len*0.05;
    var hB = Math.max(1.0, o.h*(0.62 + 0.40*rng()));
    out += mapPeak(cxB, byB, Math.max(1.8, hB*(1.34+rng()*0.52)), hB, rng, '0.80', true);
  }
  /* 前排：主峰最浓最高，两侧递减 */
  for(i=0;i<ts.length;i++){
    var tf = ts[i] + (rng()-.5)*0.07;
    var cxF = x0 + dx*tf + nx*(rng()-.5)*len*0.06;
    var byF = y0 + dy*tf + (rng()-.5)*0.7;
    var boost = (i === 0 ? 1.0 : (rng() < 0.5 ? 0.52 + rng()*0.22 : 0.70 + rng()*0.26));
    var hF = Math.max(1.1, o.h*boost*(0.92+rng()*0.18));
    out += mapPeak(cxF, byF, Math.max(1.9, hF*(1.42+rng()*0.56)), hF, rng, '1');
  }
  return out;
}
/* 远山：压在图幅上沿，淡墨一抹，专为收边 */
function mapDistant(H, rng, style, op){
  var out = '';
  var rows = style === 'hill' ? 3 : 2;
  for(var b=0;b<rows;b++){
    var by = 1.2 + b*4.6 + (rng()-.5)*1.6;
    var n = 7 + b*2, x = -10;
    for(var i=0;i<n;i++){

/* 松：瘦塔形剪影 —— 冠窄、层间留缺口，缩到 8px 仍读作树而不是云 */
function mapPine(x, y, s, op){
  var R = [[-3.00,0],[ -1.98,.52],[-1.92,.20],[-1.30,.92],[-1.24,.28],[-.62,1.34],[-.56,.30],[-.42,.30]];
  var d = 'M' + mapN(x,1) + ' ' + mapN(y - 3.00*s,1);
  for(var i=1;i<R.length;i++) d += ' L' + mapN(x + R[i][1]*s,1) + ' ' + mapN(y + R[i][0]*s,1);
  for(var j=R.length-1;j>=1;j--) d += ' L' + mapN(x - R[j][1]*s,1) + ' ' + mapN(y + R[j][0]*s,1);
  d += ' Z';
  var out = '<g opacity="' + op + '">';
  out += '<path d="M ' + mapN(x,1) + ' ' + mapN(y + 0.42*s,1) + ' V ' + mapN(y - 0.60*s,1) + '" fill="none" stroke="rgba(26,34,24,.80)" stroke-width="' + mapN(0.22*s,2) + '" stroke-linecap="round"/>';
  out += '<path d="' + d + '" fill="rgba(21,33,25,.86)" stroke="rgba(18,28,20,.30)" stroke-width="' + mapN(0.10*s,2) + '" stroke-linejoin="round"/>';
  out += '<path d="M' + mapN(x - .10*s,1) + ' ' + mapN(y - 2.86*s,1) + ' L' + mapN(x - .50*s,1) + ' ' + mapN(y - 1.96*s,1) +
    '" fill="none" stroke="rgba(226,230,204,.22)" stroke-width="' + mapN(0.12*s,2) + '" stroke-linecap="round"/>';
  return out + '</g>';
}
/* 一片林子：三五株高低错落 */

/* 棕榈：绿洲边的三两根斜干 */

/* 胡杨：沙地里的疏枝与几点金叶 */

function mapMix(a, b, t){
  var na = parseInt(String(a).replace('#',''),16), nb = parseInt(String(b).replace('#',''),16);
  var r = Math.round(((na>>16)&255)*(1-t) + ((nb>>16)&255)*t);
  var g = Math.round(((na>>8)&255)*(1-t) + ((nb>>8)&255)*t);
  var bl = Math.round((na&255)*(1-t) + (nb&255)*t);
  return '#' + ((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
}
/* 沿折线取样（Catmull-Rom），给河道、山道用 */
function mapSample(pts, n){
  var out = [], m = pts.length;
  if(m < 2) return pts.slice();
  for(var i=0;i<n;i++){
    var t = (i/(n-1))*(m-1);
    var i1 = Math.min(m-2, Math.floor(t)), f = t-i1;
    var p0 = pts[Math.max(0,i1-1)], p1 = pts[i1], p2 = pts[i1+1], p3 = pts[Math.min(m-1,i1+2)];
    var f2 = f*f, f3 = f2*f;
    out.push({
      x: 0.5*((2*p1.x) + (-p0.x+p2.x)*f + (2*p0.x-5*p1.x+4*p2.x-p3.x)*f2 + (-p0.x+3*p1.x-3*p2.x+p3.x)*f3),
      y: 0.5*((2*p1.y) + (-p0.y+p2.y)*f + (2*p0.y-5*p1.y+4*p2.y-p3.y)*f2 + (-p0.y+3*p1.y-3*p2.y+p3.y)*f3)
    });
  }
  return out;
}
/* 由中线生成渐宽的水带（河口宽、源头窄） */
function mapRibbon(pts, w0, w1){
  var sd = mapSample(pts, 46), L = [], R = [];
  for(var i=0;i<sd.length;i++){
    var a = sd[Math.max(0,i-1)], b = sd[Math.min(sd.length-1,i+1)];
    var dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy)||1;
    var nx = -dy/d, ny = dx/d;
    var w = (w0 + (w1-w0)*Math.pow(i/(sd.length-1), 0.8))/2;
    L.push({ x: sd[i].x+nx*w, y: sd[i].y+ny*w });
    R.push({ x: sd[i].x-nx*w, y: sd[i].y-ny*w });
  }
  var d = 'M ' + mapN(L[0].x) + ' ' + mapN(L[0].y);
  for(var j=1;j<L.length;j++) d += ' L ' + mapN(L[j].x) + ' ' + mapN(L[j].y);
  for(var k=R.length-1;k>=0;k--) d += ' L ' + mapN(R[k].x) + ' ' + mapN(R[k].y);
  return d + ' Z';
}

  /* ---- 分块：k-means 聚 3 片，各铺一层柔边色块；所在片淡金高亮 ---- */
function mapZones(r, pos, curId){

  for(g=0;g<K;g++){

      mem.push(arr[i]);

/* ---- 分块 + 计里画方：节点聚成 3 片各铺一层柔边色块，再压极淡方格 ---- */
  out.push('<defs><clipPath id="' + idc + 'lc"><path d="' + land + '"/></clipPath></defs>');

  var coastD = 'M 108 ' + mapN(shore(108));

  /* ---- 水系 ---- */

  var riverPts = wp.length ? wp.slice() : null;

    for(var ai=0; ai<9; ai++){

  /* 大漠与草原：胡杨、绿洲、驼队、砾石、毡帐 —— 让疏朗的地形也有东西可看 */
  function freeSpot(minX, maxY, gapX, gapY){
    for(var t0=0;t0<22;t0++){
      var sx = 3 + rng()*94, sy = H*(0.09 + rng()*(maxY-0.09));
      if(sy > shore(sx) - 6) continue;
      if(nodesPx.some(function(p){ return Math.abs(p.x-sx) < gapX && Math.abs(p.y-sy) < gapY; })) continue;
      if(decorPts.some(function(p){ return Math.abs(p.x-sx) < gapX*0.9 && Math.abs(p.y-sy) < gapY*0.9; })) continue;
      if(sx < minX) continue;
      return { x:sx, y:sy };
    }
    return null;
  }
  if(style === 'desert'){
    for(var dz=0; dz<5; dz++){
      var spotD = freeSpot(0, 0.70, 10, 6.6);
      if(!spotD) continue;
      decorPts.push(spotD);
      var dk = dz % 4;
      if(dk === 0) out.push(mapOasis(spotD.x, spotD.y, 2.0 + rng()*1.0, rng, .82));
      else if(dk === 1) out.push(mapCaravan(spotD.x, spotD.y, 2.0 + rng()*0.5, .70));
      else if(dk === 2) out.push(mapPoplars(spotD.x, spotD.y, rng, 3 + Math.floor(rng()*2), 1.0, .76));
      else out.push(mapRocks(spotD.x, spotD.y, rng, .46));
    }
    out.push(mapRocks(6 + rng()*20, H*(0.16 + rng()*0.30), rng, .34));
    out.push(mapRocks(60 + rng()*30, H*(0.20 + rng()*0.28), rng, .30));
  }else if(style === 'grass'){
    for(var yz=0; yz<4; yz++){
      var spotY = freeSpot(0, 0.66, 10, 6.2);
      if(!spotY) continue;
      decorPts.push(spotY);
      if(yz % 2 === 1) out.push(mapHerd(spotY.x, spotY.y, rng, 3 + Math.floor(rng()*3), 0.90, .58, yz % 4 === 3));
      else out.push(mapYurts(spotY.x, spotY.y, rng, 2 + Math.floor(rng()*2), 0.92, .58));
    }
  }
  /* 补白：找出离已有景物最远的地方，再点几笔林/舍（沙漠换沙丘），免得图面一半空着 */
  function emptiness(x, y){
    var d = 1e9, i, q, dd;
    for(i=0;i<decorPts.length;i++){ q = decorPts[i]; dd = Math.hypot(q.x-x, q.y-y); if(dd < d) d = dd; }
    for(i=0;i<nodesPx.length;i++){ q = nodesPx[i]; dd = Math.hypot(q.x-x, q.y-y); if(dd < d) d = dd; }
    return d;
  }
  for(var gap=0; gap<8; gap++){
    var best = null, bestD = -1;
    for(var gi=0; gi<80; gi++){
      var gxx = 2 + rng()*96, gyy = H*(0.08 + rng()*0.68);
      if(gyy > shore(gxx) - 7) continue;
      var dv = emptiness(gxx, gyy);
      if(dv > bestD){ bestD = dv; best = { x:gxx, y:gyy }; }
    }
    if(!best || bestD < 8.2) break;
    decorPts.push(best);
    if(style === 'desert'){
      var dsel = rng();
      if(dsel < .46) out.push(mapDunes(best.x, best.y, 20 + rng()*12, rng, .34));
      else if(dsel < .74) out.push(mapPoplars(best.x, best.y, rng, 2 + Math.floor(rng()*2), 0.90, .66));
      else out.push(mapRocks(best.x, best.y, rng, .40));
    }else if(style === 'grass'){
      out.push(mapReeds(best.x - 3, best.y, 0.9 + rng()*0.5, .24));
      out.push(mapReeds(best.x + 4 + rng()*3, best.y + 1.6, 0.8 + rng()*0.4, .20));
      var gsel = rng();
      if(gsel < .38) out.push(mapHerd(best.x + 3.4, best.y + 3.4, rng, 3 + Math.floor(rng()*3), 0.92, .60, rng() < .5));
      else if(gsel < .72) out.push(mapHamlet(best.x + 1.2, best.y + 3.0, rng, 2, 0.56 + rng()*0.18, .42));
      else out.push(mapYurts(best.x + 1.8, best.y + 2.6, rng, 2, 0.84, .50));
    }else{
      out.push(mapGrove(best.x, best.y, rng, 3 + Math.floor(rng()*2), 0.82, .32));
      if(rng() < .6) out.push(mapHamlet(best.x + 2.6 + rng()*2.4, best.y + 3.2, rng, 2 + Math.floor(rng()*2), 0.58 + rng()*0.20, .46));
      /* 平原/水乡：补一片阡陌，把大片空田填成「人间」 */
      if((style === 'plain' || style === 'water') && rng() < .55){
        out.push(mapFields(best.x - 7 + rng()*3, best.y + 2.4 + rng()*2.2, 8 + rng()*4, 3.4 + rng()*1.6, rng, .42));
      }
    }
  }
  /* 雾带：三抹横白，压出远近 */
  for(var mi=0;mi<3;mi++){
    out.push(mapMist(-6 + rng()*108, H*(0.14 + rng()*0.46), 34 + rng()*44, rng, 0.14 + rng()*0.10));
  }
  /* 滩涂：岸前一片浅沙，破一破死黑 */
  for(var sh=0;sh<5;sh++){
    var sx2 = -4 + rng()*104, sy2 = shore(sx2) - 1.2 - rng()*2.6;
    out.push('<ellipse cx="' + mapN(sx2,1) + '" cy="' + mapN(sy2,1) + '" rx="' + mapN(4.5+rng()*7,1) + '" ry="' + mapN(0.9+rng()*0.9,1) +
      '" fill="rgba(206,188,148,' + (0.16+rng()*0.12).toFixed(2) + ')" filter="url(#' + idc + 'b2)"/>');
  }
  /* 地表纹理：沙脊风纹 / 草浪 —— 大片空处不至于是张白纸 */
  var texN = style === 'desert' ? 12 : style === 'grass' ? 24 : style === 'plain' ? 10 : 6;
  for(var tx3=0; tx3<texN; tx3++){
    var ty3 = H*(0.10 + rng()*0.64), txx3 = -6 + rng()*104, tlen3 = 13 + rng()*24;
    if(ty3 > shore(txx3) - 4.5) continue;
    if(style === 'desert'){
      out.push('<path d="M ' + mapN(txx3,1) + ' ' + mapN(ty3,1) + ' q ' + mapN(tlen3*0.5,1) + ' ' + mapN(-1.0-rng()*0.9,1) + ' ' + mapN(tlen3,1) + ' ' + mapN(0.2+rng()*0.5,1) +
        '" fill="none" stroke="rgba(58,54,38,' + (0.10+rng()*0.07).toFixed(2) + ')" stroke-width="' + (0.10+rng()*0.05).toFixed(2) + '" stroke-linecap="round"/>');
    }else if(style === 'plain'){
      out.push('<path d="M ' + mapN(txx3,1) + ' ' + mapN(ty3,1) + ' q ' + mapN(tlen3*0.5,1) + ' ' + mapN(-0.5,1) + ' ' + mapN(tlen3,1) + ' ' + mapN(0.1,1) +
        '" fill="none" stroke="rgba(64,58,40,' + (0.07+rng()*0.05).toFixed(2) + ')" stroke-width=".10" stroke-linecap="round"/>');
    }else{
      var gg3 = '<g stroke="rgba(52,66,44,' + (0.20+rng()*0.10).toFixed(2) + ')" stroke-width=".12" fill="none" stroke-linecap="round">';
      for(var gi3=0; gi3<7; gi3++){
        var gx3 = txx3 + gi3*(tlen3/7) + (rng()-.5)*0.7, gy3 = ty3 + Math.sin(gi3*0.8)*0.5;
        gg3 += '<path d="M ' + mapN(gx3,1) + ' ' + mapN(gy3,1) + ' q ' + mapN(0.24,1) + ' ' + mapN(-0.9-rng()*0.4,1) + ' ' + mapN(0.52,1) + ' ' + mapN(-1.4-rng()*0.5,1) + '"/>';
      }
      out.push(gg3 + '</g>');
    }
  }
  /* 水边芦苇（沙漠不长苇，改画沙脊风纹在补白里） */
  if(style !== 'desert'){
    for(var rd=0;rd<9;rd++){
      var qx = -2 + rng()*104;
      out.push(mapReeds(qx, shore(qx) + 0.9, 0.85 + rng()*0.35, .26));
    }
  }

  /* 收尾：上沿压一道淡墨（卷轴天头），再整幅暗角 */
  out.push('<path d="' + land + '" fill="url(#' + idc + 'tg)" pointer-events="none"/>');
  out.push('<path d="' + land + '" fill="url(#' + idc + 'rg)" pointer-events="none"/>');
  var html = defs + out.join('');
  UI._terrCache = { key: key, html: html };
  return html;
}

/* ---------- 道路：画在特效层，随足迹变亮 ---------- */
function mapRoads(r, pos, st){
  var seen = {}, out = '';
  var p = st && st.p ? st.p : null;
  var nodes = r.nodes.slice().sort(function(a,b){ return (a.lv||0)-(b.lv||0); });
  nodes.forEach(function(n){
    var a = pos[n.id]; if(!a) return;
    (n.links || []).forEach(function(to){
      var key = n.id < to ? n.id + '|' + to : to + '|' + n.id;
      if(seen[key]) return; seen[key] = 1;
      var b = pos[to]; if(!b) return;
      var d = mapCurveD(a, b, key, 1);
      var known = !!(p && p.seen && p.seen.nodes && p.seen.nodes[n.id] && p.seen.nodes[to]);
      out += '<path d="' + d + '" fill="none" stroke="rgba(62,46,22,' + (known ? '.50' : '.30') + ')" stroke-linecap="round" stroke-width="' + (known ? .34 : .26) + '" stroke-dasharray="' + (known ? '1.15 1.15' : '.9 1.7') + '"/>';
    });
  });
  return out;
}
/* BFS 最短路 */
function mapPathBetween(fromId, toId){
  if(!fromId || !toId) return null;
  if(fromId === toId) return [fromId];
  var prev = {}, seen = {}, q = [fromId], guard = 0;
  seen[fromId] = 1;
  while(q.length && guard++ < 400){
    var cur = q.shift();
    var node = G.D.NODE_MAP[cur];
    if(!node) continue;
    var lk = node.links || [];
    for(var i=0;i<lk.length;i++){
      var nb = lk[i];
      if(seen[nb]) continue;
      seen[nb] = 1; prev[nb] = cur; q.push(nb);
      if(nb === toId){
        var path = [toId], c = toId;
        while(c !== fromId && prev[c] !== undefined){ c = prev[c]; path.push(c); }
        path.reverse();
        return path.length > 1 ? path : null;
      }
    }
  }
  return null;
}
/* 特效层：道路 / 足迹流光 / 当前所在 */
function mapFxLayer(r, pos, k, st){
  var out = '';
  var p = st && st.p ? st.p : null;
  var cur = p ? pos[p.node] : null;
  if(cur){
    var locked = p && p.node && G.D.NODE_MAP[p.node] && G.D.NODE_MAP[p.node].lv > (p.lv || 1);
    out += '<g class="map-here">' +
      '<circle cx="' + mapN(cur.x) + '" cy="' + mapN(cur.y) + '" r="6.6" fill="none" stroke="rgba(226,184,104,.30)" stroke-width=".35"/>' +
      '<circle class="ph1" cx="' + mapN(cur.x) + '" cy="' + mapN(cur.y) + '" r="4.4" fill="none" stroke="rgba(240,206,132,.55)" stroke-width=".45"/>' +
      '<circle class="ph2" cx="' + mapN(cur.x) + '" cy="' + mapN(cur.y) + '" r="4.4" fill="none" stroke="rgba(240,206,132,.28)" stroke-width=".35"/>' +
    '</g>';
  }
  return out;
}

/* ============================================================
   舆图图标 · 逐字手绘（viewBox -16..16）
   三层：k 墨底 / w 线描 / a 金饰
   ============================================================ */
/* 地名图标见 src/js/97z-glyphs.js（GLYPH / gk / gw / ga / gb / gc） */


var GLYPH_KIND = { '城邑':'城', '寺观':'寺', '水畔':'渡', '山道':'冈', '古迹':'古', '秘境':'窟', '匪寨':'寨' };
function mapGlyphOf(n){
  if(!n) return GLYPH['_'];
  return GLYPH[n.ch] || GLYPH[GLYPH_KIND[n.kind]] || GLYPH['_'];
}
function mapGlyphSvg(n, state){
  return '<svg class="gl" viewBox="-16 -16 32 32" data-st="' + (state || '') + '">' + mapGlyphOf(n) + '</svg>';
}

/* ============================================================
   舆图 · 渲染
   ============================================================ */
function renderMap(){
  var st = UI.st;
  var r = G.D.REGION_MAP[UI.mapRegion] || REGIONS[0];
  var k = mapK();
  var pos = mapCoords(r, k);
  UI._pos = pos; UI._k = k;

  var box = mapRect();
  var u = box.width > 1 ? box.width/100 : 3.9;
  var vb = '0 0 100 ' + (100*k).toFixed(3);
  ['mapSvg','mapFx'].forEach(function(id){
    var el = $(id);
    if(el && el.getAttribute('viewBox') !== vb) el.setAttribute('viewBox', vb);
  });

  /* 州签 */
  var seg = REGIONS.map(function(rg){
    var un = Core.regionUnlocked(st, rg);
    return '<button class="rg' + (UI.mapRegion===rg.id?' on':'') + (un?'':' lk') + '" data-act="region" data-v="'+rg.id+'">'+
      '<b>' + (un ? rg.n : '未至') + '</b><i>' + (un ? rg.sub : rg.lv+' 阶') + '</i></button>';
  }).join('');
  var box2 = $('mapRegions');
  if(UI._mapRegionsHtml !== seg){ UI._mapRegionsHtml = seg; box2.innerHTML = seg; }

  /* 图题 */
  var cart = $('mapCartouche');
  var un2 = Core.regionUnlocked(st, r);
  if(cart) cart.innerHTML = '<div class="ct-v">' + r.n + '舆图</div><div class="ct-s">' + (un2 ? r.sub : '未至') + '</div>';

  /* 静态地形 */
  var svgHtml = mapTerrain(r, pos, k);
  if(UI._mapSvgHtml !== svgHtml){ UI._mapSvgHtml = svgHtml; $('mapSvg').innerHTML = svgHtml; }

  /* 动态层 */
  var fxHtml = mapFxLayer(r, pos, k, st);
  if(UI._mapFxHtml !== fxHtml){ UI._mapFxHtml = fxHtml; $('mapFx').innerHTML = fxHtml; }

  /* 节点排序：当前 > 选中 > 已至 > 可达 */
  var order = r.nodes.slice().sort(function(a,b){
    function w(n){ return (st.p.node===n.id?9:0) + (UI.sel===n.id?7:0) + (st.p.seen.nodes[n.id]?5:0) + (Core.canReach(st,n.id).ok?3:0); }
    var wa = w(a), wb = w(b);
    return wa !== wb ? wb-wa : b.lv-a.lv;
  });

  /* 标签避让（像素空间）；宽屏上图标/字号按 NS 放大，碰撞盒同步放大 */
  var W = box.width > 1 ? box.width : 390;
  var NS = W > 560 ? 1.30 : 1;
  var nodesBox = $('mapNodes');
  if(nodesBox) nodesBox.classList.toggle('big', NS > 1);
  var placed = [];
  function hitu(b, self){
    return placed.some(function(q){
      if(self && q.id === self) return false;
      return b.l < q.r && q.l < b.r && b.t < q.b && q.t < b.b;
    });
  }
  r.nodes.forEach(function(n){
    var p = pos[n.id]; if(!p) return;
    var cx = p.x/100*W, cy = p.y/(100*k)*(box.height > 1 ? box.height : 800);
    placed.push({ id:n.id, l:cx-21*NS, r:cx+21*NS, t:cy-20*NS, b:cy+18*NS });
  });
  var lab = {}, labDx = {};
  var Hpx = box.height > 1 ? box.height : 800;
  if(UI.scale < 1.24){
    order.forEach(function(n){
      var p = pos[n.id]; if(!p) return;
      var cx = p.x/100*W, cy = p.y/(100*k)*Hpx;
      var lw = n.n.length*13.2*NS + 8;
      var halfW = lw/2 + 3;
      var cands = [];
      function cand(k, dx, l, r, t, b){ cands.push({ k:k, dx:dx, box:{ l:l, r:r, t:t, b:b } }); }
      /* 依次：正中上/下 → 左右两侧 → 左右错开的上/下。
         贴边的节点（如风陵黄河渡）靠错开位避开邻格图标，不再硬塞正中位压住别人。 */
      cand('b', 0, cx-halfW, cx+halfW, cy+15*NS, cy+31*NS);
      cand('a', 0, cx-halfW, cx+halfW, cy-37*NS, cy-20*NS);
      cand('r', 0, cx+19*NS, cx+19*NS+lw, cy-3*NS, cy+16*NS);
      cand('l', 0, cx-19*NS-lw, cx-19*NS, cy-3*NS, cy+16*NS);
      var dxs = [lw*0.5+6, -(lw*0.5+6), lw*0.5+22, -(lw*0.5+22)];
      for(var di=0; di<dxs.length; di++){
        var d = dxs[di];
        cand('b', d, cx-halfW+d, cx+halfW+d, cy+15*NS, cy+31*NS);
        cand('a', d, cx-halfW+d, cx+halfW+d, cy-37*NS, cy-20*NS);
      }
      var picked = null, best = null, bestCost = 1e9;
      for(var ci=0; ci<cands.length; ci++){
        var cd = cands[ci], cb = cd.box;
        var inside = (cb.l >= 2 && cb.r <= W-54 && cb.t >= 2 && cb.b <= Hpx-2);
        /* 出框不可接受，重叠按面积惩罚 —— 全冲突时取重叠最小者，而不是硬塞正中 */
        var cost = inside ? 0 : 1200;
        for(var pi=0; pi<placed.length; pi++){
          var q = placed[pi];
          if(q.id === n.id) continue;
          var ox = Math.min(cb.r, q.r) - Math.max(cb.l, q.l);
          var oy = Math.min(cb.b, q.b) - Math.max(cb.t, q.t);
          if(ox > 0 && oy > 0) cost += ox*oy;
        }
        cost += ci*0.6;
        if(cost < bestCost){ bestCost = cost; best = cd; }
        if(cost < ci*0.6 + 0.001) { picked = cd; break; }
      }
      if(!picked) picked = best;
      picked.box.id = n.id; placed.push(picked.box);
      lab[n.id] = picked.k;
      if(picked.dx) labDx[n.id] = picked.dx;
    });
  }else{
    r.nodes.forEach(function(n){ lab[n.id] = 'b'; });
  }

  var yPct = function(y){ return y/(100*k)*100; };
  var nodes = r.nodes.map(function(n){
    var p = pos[n.id]; if(!p) return '';
    var here = st.p.node === n.id;
    var seen = !!st.p.seen.nodes[n.id];
    var reach = Core.canReach(st,n.id);
    var state = here ? 'here' : (seen ? 'seen' : (reach.ok ? 'near' : 'locked'));
    var lk = lab[n.id] || 'b';
    var cls = 'map-node ' + state + (UI.sel===n.id?' sel':'') +
      (lk==='a'?' lab-up':'') + (lk==='l'?' side-l':'') + (lk==='r'?' side-r':'');
    return '<div class="'+cls+'" style="left:'+p.x.toFixed(3)+'%;top:'+yPct(p.y).toFixed(3)+'%" data-act="node" data-id="'+n.id+'">'+
      '<i class="mk">' + mapGlyphSvg(n, state) + '</i>' +
      '<span class="nm"' + (labDx[n.id] ? ' style="margin-left:' + labDx[n.id].toFixed(1) + 'px"' : '') + '>'+n.n+'</span>' +
      '<span class="lv"' + (labDx[n.id] ? ' style="margin-left:' + labDx[n.id].toFixed(1) + 'px"' : '') + '>'+(here?'此地':n.lv+' 阶')+'</span>' +
    '</div>';
  }).join('');
  if(UI._mapNodesHtml !== nodes){ UI._mapNodesHtml = nodes; $('mapNodes').innerHTML = nodes; }

  /* 我在何处 */
  var cur = G.D.NODE_MAP[st.p.node];
  var me = $('mapMe');
  if(me){
    if(cur && cur.region === r.id && pos[cur.id]){
      me.style.display = '';
      me.style.left = pos[cur.id].x.toFixed(3)+'%';
      me.style.top = yPct(pos[cur.id].y).toFixed(3)+'%';
    }else me.style.display = 'none';
  }
  renderNodeCard();
}
function renderNodeCard(){
  var st = UI.st;
  var cur = G.D.NODE_MAP[st.p.node];
  var id = UI.sel, n = id && G.D.NODE_MAP[id];
  if(!n || n.region !== UI.mapRegion){
    id = (cur && cur.region === UI.mapRegion) ? st.p.node : null;
    n = id ? G.D.NODE_MAP[id] : null;

  if(!n){
    var rr0 = G.D.REGION_MAP[UI.mapRegion] || REGIONS[0];
    id = rr0.nodes[0].id; n = G.D.NODE_MAP[id];
  }
  if(UI.sel !== id){
    UI.sel = id;
    document.querySelectorAll('.map-node').forEach(function(b){ b.classList.toggle('sel', b.dataset.id===id); });
  }
  var here = st.p.node === id, seen = !!st.p.seen.nodes[id];
  var reach = Core.canReach(st,id);
  var y = n.yield || {};
  var danger = n.dg>=7 ? '凶险' : n.dg>=4 ? '险地' : n.dg>=2 ? '不太平' : '平川';

  var h = '<div class="mc-main">'+
    '<i class="mc-seal ' + (here?'here':seen?'seen':'near') + '">' + mapGlyphSvg(n, here?'here':seen?'seen':'near') + '</i>'+
    '<div class="mc-t"><div class="mc-n">'+n.n+'</div>'+
      '<div class="mc-m"><span>'+n.kind+'</span><span>'+n.lv+' 阶</span><span class="dg'+(n.dg>=4?' hi':'')+'">'+danger+'</span>'+(here?'<span class="on">在此</span>':'')+'</div></div>'+
    btn +
    '<button class="mc-cue'+(UI.cardOpen?' on':'')+'" data-act="card-more" aria-label="展开地志">'+(UI.cardOpen?'▴':'▾')+'</button>'+
  '</div>';
  if(UI.cardOpen){
    h += '<div class="mc-detail">'+
      '<div class="mc-d">'+esc(n.d)+'</div>'+
      '<div class="mc-y"><span class="k">驻留所得</span><span class="v">修为 '+fmt(y.exp*(1+n.lv*.04))+' · 银 '+fmt(y.silver*(1+n.lv*.04))+' / 四息</span></div>';
    if(n.boss) h += '<div class="mc-y"><span class="k">风声</span><span class="v hi">'+(st.p.bossKills[n.boss]?'那一页已翻过':'此地有人守着')+'</span></div>';
    if(n.npcs && n.npcs.length){
      h += '<div class="mc-np">' + n.npcs.map(function(pid){
        var np = G.D.NPC_MAP[pid]; if(!np) return '';
        return '<button class="mc-npb" data-act="npc" data-id="'+pid+'">'+np.n+'</button>';
      }).join('') + '</div>';
    }
    h += '</div>';
  }
  $('nodeCard').innerHTML = h;
  if(UI.tab === 'map'){
    var cc = mapClamp(UI.pan, UI.scale);
    UI.pan.x = cc.x; UI.pan.y = cc.y;
    mapApply();
  }
}
function tabTo(t){
  UI.tab = t;
  $('view').classList.toggle('map-hidden', t === 'map');
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on', b.dataset.tab===t); });
  $('mapView').classList.toggle('on', t==='map');
  $('toastWrap').classList.toggle('at-map', t==='map');
  $('rewardPop').classList.toggle('at-map', t==='map');
  if(t==='map'){
    if(UI.mapRegion !== UI.st.p.region) UI.mapRegion = UI.st.p.region;
    UI.sel = null; renderMap();
    if(!UI._fitted){ mapFit(); UI._fitted = true; }
    requestAnimationFrame(function(){ if(UI.tab==='map') renderMap(); });
  }
  if(t==='road') UI.unreadLog = false;
  if(t==='bag') UI.bagNew = false;
  $('badgeRoad').classList.toggle('hide', !UI.unreadLog);
  $('badgeBag').classList.toggle('hide', !UI.bagNew);
  mark();
}
function renderView(){
  var el = $('viewScroll');
  var top = el.scrollTop, atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
  var switched = UI._lastTab !== UI.tab;
  var h = '';
  switch(UI.tab){
    case 'road': h = renderRoad(); break;
    case 'hero': h = renderHero(); break;
    case 'bag': h = renderBag(); break;
    case 'lore': h = renderLore(); break;
    default: h = renderRoad();
  }
  el.innerHTML = h;
  el.scrollTop = (switched || UI._resetScroll) ? 0 : ((UI.tab==='road' && atBottom) ? el.scrollHeight : top);
  UI._resetScroll = false;
  UI._lastTab = UI.tab;
}

/* ---------- 弹层出入场：遮罩淡去 + 面板上浮，200ms ---------- */
(function(){
  var _openModal = openModal, _closeModal = closeModal, closeTimer = null;
  openModal = function(type, title, sub, body, foot, data){
    var mask = $('modalMask');
    if(closeTimer){ clearTimeout(closeTimer); closeTimer = null; }
    if(mask) mask.classList.remove('out');
    _openModal(type, title, sub, body, foot, data);
    var box = $('modal');
    var mf = box && box.querySelector ? box.querySelector('.modal-f') : null;
    if(mf && mf.querySelectorAll('.btn').length > 2) mf.classList.add('foot-multi');
  };
  closeModal = function(){
    var mask = $('modalMask');
    if(!mask || !mask.classList.contains('on') || mask.classList.contains('out')){ return; }
    mask.classList.add('out');
    closeTimer = setTimeout(function(){
      closeTimer = null;
      mask.classList.remove('out');
      _closeModal();
    }, 200);
  };
})();

/* ---------- 创角：给出身选项补上图标、水印、属性小签 ---------- */
(function(){
  var ORIGIN_ICON = { wu:'sword', shu:'scroll', shang:'coin', gu:'wine' };
  function originOf(key){
    for(var i = 0; i < ORIGINS.length; i++){ if(ORIGINS[i].id === key) return ORIGINS[i]; }
    return null;
  }
  function escTxt(s){
    if(typeof esc === 'function') return esc(s);
    return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }
  function paint(){
    var grid = $('originGrid');
    if(!grid || !grid.children) return;
    for(var i = 0; i < grid.children.length; i++){
      var btn = grid.children[i];
      if(!btn.getAttribute || btn.getAttribute('data-art') === '1') continue;
      var o = originOf(btn.getAttribute('data-v'));
      if(!o) continue;
      var oneLine = String(o.d || '').split('。')[0];
      var tags = '', bonus = o.bonus || {};
      for(var k in bonus){
        if(bonus.hasOwnProperty(k)) tags += '<span class="oc-tag">' + (ATTRS[k] || k) + ' +' + bonus[k] + '</span>';
      }
      if(o.silver) tags += '<span class="oc-tag gold">银 +' + o.silver + '</span>';
      btn.innerHTML = '<i class="oc-char" aria-hidden="true">' + o.ch + '</i>' +
        '<span class="oc-top"><span class="oc-ico">' + svgIcon(ORIGIN_ICON[o.id] || 'seal') + '</span>' +
        '<span class="oc-name">' + o.n + '</span></span>' +
        '<span class="oc-line">' + escTxt(oneLine) + '</span>' +
        '<span class="oc-tags">' + tags + '</span>';
      btn.setAttribute('data-art', '1');
    }
  }
  function boot(){
    paint();
    setTimeout(paint, 30);
    setTimeout(paint, 180);
    var grid = $('originGrid');
    if(grid && window.MutationObserver && !grid._artWatch){
      var mo = new MutationObserver(function(){ paint(); });
      mo.observe(grid, { childList:true });
      grid._artWatch = mo;
    }
  }
  if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', boot); }
  else { boot(); }
})();

/* ---------- 特效队列 ---------- */
function handleFx(list){
  var st = UI.st;
  list.forEach(function(f){
    switch(f.k){
      case 'dmg':
        floatText(f.text, f.crit?'crit':'dmg', f.side);
        SFX.play(f.side==='self' ? (f.crit?'hurt':'hit') : (f.crit?'crit':'hit'));
        break;
      case 'hit':
        Visual.impact('hit', f.side, f.crit);
        if(st.combat){ if(f.side==='self') st.combat.lastEnemySwing = ts(); else st.combat.lastSwing = ts(); }
        break;
      case 'skill':
        Visual.impact('skill','enemy',f.crit); SFX.play('skill');
        if(st.combat) st.combat.lastSwing = ts();
        break;
      case 'heal': floatText(f.text,'heal','self'); break;
      case 'gain': floatText(f.text,'gain',''); break;
      case 'toast': toast(f.text); break;
      case 'win': Visual.burst('win'); SFX.play('win'); break;
      case 'boss': Visual.burst('boss'); reward('首 领 退 走'); break;
      case 'lose': SFX.play('lose'); toast('不敌，退到一旁歇了许久','red'); break;
      case 'level': Visual.burst('level'); SFX.play('level'); reward(f.text); break;
      case 'art': reward('习 得 · '+f.text); SFX.play('loot'); break;
      case 'place': reward(f.text); break;
      case 'combatStart':
        SFX.play('event');
        if(UI.tab !== 'road') tabTo('road');   // 交手时统一让出行迹页，别把战斗埋在人物/行囊面板下面
        break;
      case 'move': SFX.play('step'); break;
      case 'event': if(st.event) showEvent(); break;
      case 'lore': toast('见闻 +1 · '+f.text,'jade'); break;
      case 'stele': toast('碑上旧字 · '+f.text,'jade'); break;
      case 'tell': toast('破绽已现，抢在他发力前','red'); Visual.impact('tell','enemy',false); SFX.play('tell'); break;
      case 'break': Visual.impact('break','enemy',true); floatText('截 势','break','enemy'); reward('截势'); SFX.play('break'); break;
      case 'goal': Visual.burst('goal'); reward('志 · '+f.text); SFX.play('goal'); toast(f.text,'jade'); break;
      case 'bossStart': Visual.burst('boss'); Visual.flash('red'); break;
      case 'choice': break;
      default: break;
    }
  });
  if(list.length) mark();
}
function UI_Tick(now){
  if(UI.modalType === 'event' && !UI.st.event) closeModal();
  if(UI.dirty){
    renderView();
    if(UI.tab==='map') renderMap();
    renderSkills();
    UI.dirty = false;
  }
  if(now - UI.lastHud > 160){
    UI.lastHud = now;
    renderHud(); renderStage(); skillsCd();
    var tb = $('travelBar');
    if(tb && UI.st.travel) tb.style.width = clamp((1 - UI.st.travel.left/UI.st.travel.total)*100, 0, 100)+'%';
    var ll = UI.st.log.length, el = UI.st.p.bag.filter(function(x){ return !!x.uid; }).length;
    if(ll > UI._logLen && UI.tab !== 'road') UI.unreadLog = true;
    if(el > UI._eqLen && UI.tab !== 'bag') UI.bagNew = true;
    UI._logLen = ll; UI._eqLen = el;
    // 药囊角标只在「药变多了」的时候点红，看一眼药囊就退色
    var medsN = countMeds(UI.st);
    if(UI._medCount === null) UI._medCount = medsN;
    else if(medsN > UI._medCount && UI.modalType !== 'med'){ UI.medNew = true; renderSkills(); }
    UI._medCount = medsN;
    $('badgeRoad').classList.toggle('hide', !UI.unreadLog);
    $('badgeBag').classList.toggle('hide', !UI.bagNew);
  }
}

/* ============================================================
   17. 启动 · 主循环 · 前后台衔接
   ============================================================ */
(function(){
  var st = null, started = false;

  function bindStatic(){
    document.querySelectorAll('.tab').forEach(function(b){ b.dataset.act = 'tab'; b.dataset.v = b.dataset.tab; });
    $('btnChar').dataset.act = 'char';
    $('btnIdle').dataset.act = 'idle';
    $('btnExplore').dataset.act = 'explore';
    $('btnAuto').dataset.act = 'auto';
    $('btnMed').dataset.act = 'med';
    $('btnSkill').dataset.act = 'skillq';
    $('mapZoomIn').dataset.act = 'zoomin';
    $('mapZoomOut').dataset.act = 'zoomout';
    $('mapReset').dataset.act = 'reset-map';
    $('mapHome').dataset.act = 'map-home';
    $('stageToggle').dataset.act = 'stage-toggle';
    document.addEventListener('click', onClick);
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && UI.modalType && UI.modalType!=='event') closeModal(); });

    // 舆图：单指拖移、双指捏合、双击复位；拖出边界回弹
    var mc = $('mapCanvas');
    var pts = {}, gest = null, tapT = 0, tapX = 0, tapY = 0, pinched = false;

    function localOf(e){ var r = mapRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; }
    function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
    function mid(a,b){ return { x:(a.x+b.x)/2, y:(a.y+b.y)/2 }; }

    mc.addEventListener('pointerdown', function(e){
      if(e.target.closest('.map-tools')) return;
      pts[e.pointerId] = localOf(e);
      try { mc.setPointerCapture(e.pointerId); } catch(err){}
      var ids = Object.keys(pts);
      if(ids.length === 1){
        var p = pts[e.pointerId];
        var nodeEl = e.target.closest ? e.target.closest('.map-node') : null;
        UI.drag = { x:p.x, y:p.y, px:UI.pan.x, py:UI.pan.y, moved:false, onNode:!!nodeEl, nodeId:nodeEl?nodeEl.dataset.id:null };
        gest = null;
      } else if(ids.length === 2){
        pinched = true;
        var a = pts[ids[0]], b = pts[ids[1]];
        gest = { kind:'pinch', d0:Math.max(1,dist(a,b)), s0:UI.scale, m0:mid(a,b), pan0:{x:UI.pan.x,y:UI.pan.y} };
        UI.drag = null;
      }
    });

    mc.addEventListener('pointermove', function(e){
      if(!pts[e.pointerId]) return;
      pts[e.pointerId] = localOf(e);
      var ids = Object.keys(pts);
      if(gest && gest.kind === 'pinch' && ids.length === 2){
        var a = pts[ids[0]], b = pts[ids[1]];
        var d = Math.max(1, dist(a,b)), m = mid(a,b);
        var s1 = clamp(gest.s0 * d/gest.d0, 0.7, 1.9);
        UI.scale = s1;
        UI.pan.x = m.x - (gest.m0.x - gest.pan0.x) * (s1/gest.s0);
        UI.pan.y = m.y - (gest.m0.y - gest.pan0.y) * (s1/gest.s0);
        mapApply();
        UI.dragged = true;
        return;
      }
      if(!UI.drag) return;
      var dx = pts[e.pointerId].x - UI.drag.x, dy = pts[e.pointerId].y - UI.drag.y;
      if(Math.abs(dx)+Math.abs(dy) > 6){ UI.drag.moved = true; UI.dragged = true; }
      var r = mapRect();
      UI.pan.x = UI.drag.px + dx;
      UI.pan.y = UI.drag.py + dy;
      // 越界时阻尼，松手回弹
      var c = mapClamp(UI.pan, UI.scale);
      if(UI.pan.x !== c.x) UI.pan.x = c.x + (UI.pan.x-c.x)*0.32;
      if(UI.pan.y !== c.y) UI.pan.y = c.y + (UI.pan.y-c.y)*0.32;
      mapApply();
    });

    function endPointer(e){
      delete pts[e.pointerId];
      var ids = Object.keys(pts);
      if(ids.length === 0){
        // 两指先后抬起也要记住这是一次捏合，否则缩过头的回弹判断会失效
        var wasPinch = pinched;
        pinched = false;
        gest = null;
        if(UI.drag){
          var moved = UI.drag.moved, p0 = UI.drag;
          UI.drag = null;
          if(!moved && !wasPinch){
            var now = ts();
            if(!p0.onNode && now - tapT < 300 && Math.abs(p0.x-tapX) < 26 && Math.abs(p0.y-tapY) < 26){
              mapFit(true);
              setTimeout(function(){ if(UI.tab==='map') renderMap(); }, 260);
              tapT = 0;
            } else { tapT = now; tapX = p0.x; tapY = p0.y; }
          }
        }
        if(wasPinch && UI.scale < 0.9){
          UI.scale = 1; UI.pan.x = 0; UI.pan.y = 0;
        }
        // 指针捕获后 click 落在画布上，节点选中在这里补
        if(UI.drag === null && !wasPinch && p0 && !p0.moved && p0.nodeId){
          UI.sel = p0.nodeId; UI.cardOpen = false;
          document.querySelectorAll('.map-node').forEach(function(b){ b.classList.toggle('sel', b.dataset.id===p0.nodeId); });
          renderNodeCard();
        }
        var c = mapClamp(UI.pan, UI.scale);
        UI.pan.x = c.x; UI.pan.y = c.y;
        mapApply(true);
        if(UI.tab === 'map') setTimeout(function(){ if(UI.tab==='map') renderMap(); }, 240);
        setTimeout(function(){ UI.dragged = false; }, 80);
      } else if(ids.length === 1){
        var p = pts[ids[0]];
        UI.drag = { x:p.x, y:p.y, px:UI.pan.x, py:UI.pan.y, moved:true };
        gest = null;
      }
    }
    mc.addEventListener('pointerup', endPointer);
    mc.addEventListener('pointercancel', endPointer);

    // 隐藏 / 熄屏 / 关页
    function onHidden(){ if(st) Core.save(st); }
    document.addEventListener('visibilitychange', function(){
      if(!st) return;
      if(document.hidden){ onHidden(); }
      else {
        Core.advance(st, ts());
        var rep = Core.flushReports(st);
        UI.dirty = true; UI_Tick(ts());
        if(rep){ if(!UI.modalType) showOffline(rep); else st.reports.push(rep); }
      }
    });
    window.addEventListener('pagehide', onHidden);
    window.addEventListener('beforeunload', onHidden);
    var rzT = 0;
    window.addEventListener('resize', function(){
      clearTimeout(rzT);
      rzT = setTimeout(function(){
        Visual.resize();
        if(UI.tab === 'map'){
          var c = mapClamp(UI.pan, UI.scale);
          UI.pan.x = c.x; UI.pan.y = c.y;
          mapApply();
        }
      }, 120);
    });
  }

  function setup(){
    $('setup').classList.add('on');
    $('originGrid').innerHTML = ORIGINS.map(function(o){
      return '<button class="origin '+(o.id===UI.origin?'on':'')+'" data-v="'+o.id+'">'+
        '<div class="onm">'+o.ch+' · '+o.n+'</div><div class="odd">'+esc(o.d)+'</div></button>';
    }).join('');
    $('originGrid').addEventListener('click', function(e){
      var b = e.target.closest('.origin'); if(!b) return;
      UI.origin = b.dataset.v;
      document.querySelectorAll('.origin').forEach(function(x){ x.classList.toggle('on', x.dataset.v===UI.origin); });
      SFX.play('click');
    });
    $('btnStart').addEventListener('click', function(){
      SFX.unlock(); SFX.play('event');
      var name = ($('setupName').value||'').trim() || '无名';
      var s = Core.newState(UI.origin, name);
      Core.save(s);
      $('setup').classList.remove('on');
      start(s, null);
    });
  }

  function start(s, rep){
    st = s; UI.st = s; UI.mapRegion = s.p.region; UI.sel = null; UI.setupDone = true;
    SFX.setOn(s.settings.sound !== false);
    Visual.init($('scene'));
    bindStatic();
    tabTo('map');
    Core.drainFx(s);
    UI.dirty = true; UI_Tick(ts());
    if(s.event){ showEvent(); if(rep) s.reports.push(rep); }
    else if(rep) showOffline(rep);
    started = true;
    requestAnimationFrame(loop);
    setInterval(fallback, 1000);
  }

  function loop(){
    if(!started || !st) return;
    var now = ts();
    Core.advance(st, now);
    if(now - (UI._lastGoal||0) > 500){ UI._lastGoal = now; Core.checkGoals(st); }
    handleFx(Core.drainFx(st));
    Visual.frame(now, st);
    UI_Tick(now);
    if(now - (UI._lastAmb||0) > 4000){
      UI._lastAmb = now;
      var wx = Core.weatherOf(st, now);
      if(wx !== st.weather){ st.weather = wx; UI.dirty = true; }
      var hh = new Date(now).getHours();
      SFX.ambient(st.weather || '晴', (hh >= 19 || hh < 6) ? 'night' : 'day');
    }
    if(!UI.modalType && st.reports.length){
      var rep = Core.flushReports(st);
      if(rep) showOffline(rep);
    }
    if(now - (UI._lastSave||0) > 5000){ UI._lastSave = now; Core.save(st); }
    requestAnimationFrame(loop);
  }
  function fallback(){
    if(!started || !st) return;
    var now = ts();
    Core.advance(st, now);
    if(document.hidden){
      Core.drainFx(st);
      Core.save(st);
      UI.dirty = true;
    }
  }

  var loaded = null;
  try { loaded = Core.load(); } catch(e){ loaded = null; }
  if(!loaded) setup();
  else {
    Core.advance(loaded, ts());
    var report = Core.flushReports(loaded);
    start(loaded, report);
  }
})();

(function(){try{if(typeof window!=='undefined'&&window.__copyApply){var r=window.__copyApply({"arts.changquan.d":"势法端正朴拙，起落收放皆有绳墨。看似平淡无奇，实乃各家武法根基。","arts.chunyang.d":"气沉丹田，微温生发。纯阳之劲流注十二经脉，周身不惧寻常寒侵与阴柔暗劲。","arts.duanmendao.d":"刀势大开大合，劈砍刚烈直截。绿林好手所持，招式不留余地，皆是搏命硬拼手段。","arts.dugu.d":"无常势亦无常招，随敌变而变。破尽诸般兵刃路数，唯快唯准，意到剑随。","arts.guibei.d":"吐纳放缓至若有若无，精气收敛入骨，闭息半日即如深眠调摄，复原极快。","arts.huandao.d":"刀走连环，招招衔接若狂风扑浪。一刀劈出便无断绝，逼得对手无处立足借力。","arts.huashanjian.d":"剑势堂皇正大，奇绝相生。看似平正，实则招招封堵去路，以正守局，以险取胜。","arts.hunyuan.d":"外功内修，合二为一。发劲时内力透肤而出，绵韧沉着，能穿厚甲伤敌内腑。","arts.jianqi.d":"凝深厚内力于指端射出，去势如破帛裂石，十步之内取人咽喉，无形无影。","arts.jiuyang.d":"体内气机浑厚雄浑，生生不息。外力无论多强，自以纯阳温和之劲化解化生。","arts.lei_zhang.d":"掌未至而气先行，罡劲横扫如滚雷炸空，势沉力大，专震慑对手心神气血。","arts.lingbo.d":"循六十四卦周天错步，忽东忽西，飘忽难测。踏水掠波，敌手刀剑难以近身。","arts.luohanchui.d":"直进直取，力发脚跟。发力时若山崩木裂，拳风刚猛沉重，专断敌方护体硬劲。","arts.qingfengjian.d":"走势轻灵飘逸，剑如杨柳点水。「白云出岫」一式后发先至，专破对手前招破绽。","arts.qinggong.d":"提气敛身，足尖点草即起。虽非上乘秘法，练至纯熟亦能踏沙踏泥不陷。","arts.tang_an.d":"腕力微抖暗动机括，数十枚淬毒透骨细针如雨泼出，笼罩方圆丈余退路。","arts.tiyun.d":"凌空借力拔身数丈，步步凌虚。变招自如，宛若凭虚御风。","arts.tuna.d":"引气归于气穴，绵绵若存，呼吸悠长沉缓，缓缓化解体内滞塞杂气。","arts.xianglong.d":"刚劲沉雄无匹。吐纳之间掌力如巨浪拍岸，掌风隐带破空轰鸣，正面无从招架。","arts.xuewu.d":"足不沾尘，急行若轻风掠地。踏过雪野冰原，回身不见半点痕迹。","enemies.assassin.d":"玄布裹面，藏身夜色阴影。步法微不可闻，袖中短匕淬满幽蓝剧毒。","enemies.bai_di.d":"凭栏俯瞰三峡怒涛，抛盏腾空。双掌翻云倒海，混元力道雄霸巴蜀。","enemies.bandit.d":"伏于乱石灌木间的亡命之徒，见财起意，手中破刀毫无规矩路数。","enemies.boatman.d":"久历风浪的江洋死客，手中竹篙点水如箭，招招扫人下盘与面门。","enemies.du_xing.d":"身法如烟，游走黑夜之间。黑白两道重金悬榜，却难觅其藏身去向。","enemies.guan_bing.d":"自关外败退下来的残兵，甲破矛钝，却满身军阵搏杀的暴戾凶性。","enemies.guan_qi.d":"乱发蒙面，目光凌厉如刃。刀势狂暴倾泻，一眼即勘破周身破绽。","enemies.guan_wai.d":"单刀横行关外的狂徒，双手拖曳斩马重刃，在残雪中拖出血槽。","enemies.hei_dian.d":"笑迎孤客却在袖底暗藏剔骨尖刀，脚下机关重重，专做买卖黑账。","enemies.hu_ba.d":"仰头摔碎烈酒粗碗，提起三股托天排叉，排山倒海般迎头砸来。","enemies.hu_lang.d":"身裹黑狼长裘，仰天狂吼。腰间弯刀饮过无数鲜血，凶威盖压塞北。","enemies.hu_shang.d":"重金雇来的冷血杀手，神情沉漠。拔剑不见虚招，招招只取性命。","enemies.hu_wei.d":"水寨哨头，通晓水路合围之术。劈挂单掌带风，截杀一切靠近外人。","enemies.hui_kong.d":"合十宣号，紫红袈裟猛振。沉肩递出金刚伏魔铜杖，刚猛扫荡诸邪。","enemies.huo_zun.d":"赤足立于炽热熔岩口，周遭空气蒸腾泛白，出手间烈焰翻卷扑面。","enemies.jian_zhong.d":"须发银白，青衫褴褛。手无寸铁，两指凝气成芒，随手划出裂空剑鸣。","enemies.jiang_san.d":"自后堂晃出，指间精铁骰子翻飞作响。笑容可掬，眼底杀机毕露。","enemies.liao_kong.d":"白发覆肩，倚天剑如秋波出鞘。拂尘微展，瞬息封住方圆气机。","enemies.ma_zei.d":"驰骋荒漠的悍寇，借战马冲撞之势挥动弯刀，刀过处尘土激扬。","enemies.monk_bad.d":"破门叛寺的弃徒，单手拖动沉重熟铜棍，棍风呼啸，出手尽取要害。","enemies.ouye_ying.d":"深潭残渊上升起一道古剑淡影，剑意穿空刺目，犹带昔年铸熔精魂。","enemies.rogue.d":"挽袖插棍堵在巷口，三两成群，专寻孤身软弱行客勒索铜钱。","enemies.sha_dao.d":"铁巾蒙面，手拎百斤齿钉大棒，狂风沙浪之中见人便砸，凶狠无伦。","enemies.sha_wei.d":"以古法锁紧铁甲的机关卫俑，刀枪不入，挥动石刃守护废城地宫。","enemies.sha_zang.d":"黄沙王座上霍然起立，枯槁双掌挥洒，漫天流沙随掌力枯荣卷杀。","enemies.swordsman.d":"青衫破旧，笠檐压眉。腰间佩带旧剑，目光如野犬般紧盯着行囊。","enemies.tang_ren.d":"双手缩于袖内，面无表情。身上机括微鸣，稍有动静便射飞针。","enemies.tang_wu.d":"铁判官面具遮面，双袖一抖，百枚淬毒透骨针如飞蝗倾泻而出。","enemies.thug.d":"膀阔腰粗，指套精铁尖刺，一身跌打横练，专为档口收账行凶。","enemies.tian_xia.d":"孤立于风雨绝巅，按剑四顾。平生只求一败，一剑拔出寒气漫山。","enemies.wu_ming_ke.d":"负黑布长匣缓步独行，每一步落定皆平稳如山，令人捉摸不透深浅。","enemies.xi_yu_dao.d":"西域胡刀快疾无影，身形回旋如狂沙，一刀削出不留活口。","enemies.xue_ren.d":"身披白熊旧皮，须眉皆凝白霜。居极寒之峰，十指坚硬如铁钩。","events.e_bamboo.opts.1.d":"提身法自竹梢借力点掠","events.e_bamboo.opts.1.fail.1":"竹梢反弹力猛，落足微沉震晃了内息。","events.e_bamboo.opts.1.ok.1":"踏梢破空而过，出林时于石崖采得一株老紫灵芝。","events.e_bamboo.opts.1.t":"掠梢踏行，借竿腾挪","events.e_bamboo.opts.2.d":"倾听林涛参悟剑式节律","events.e_bamboo.opts.2.fx.1":"竹弯而不折，风过无形。剑意悄然趋于圆通。","events.e_bamboo.opts.2.t":"立定听风，参悟招意","events.e_bamboo.opts.3.d":"拔取嫩笋充饥生津","events.e_bamboo.opts.3.fx.1":"清凉甘甜入喉，乏累顿消，力气渐复。","events.e_bamboo.opts.3.t":"掘取鲜笋，生食润喉","events.e_bamboo.text":"修竹万竿耸天，山风吹起竹浪如万马崩腾，清寒与隐伏杀机交融。","events.e_bandit.opts.1.d":"按剑挺身，直面迎敌","events.e_bandit.opts.1.t":"拔刃出鞘，正面荡寇","events.e_bandit.opts.2.d":"展轻功自众寇头顶掠行","events.e_bandit.opts.2.ok.1":"足点树梢纵身飞过，群贼未及触及衣角，徒留破口喝骂。","events.e_bandit.opts.2.t":"点石腾身，借木越顶","events.e_bandit.opts.3.d":"丢下银两免起争端","events.e_bandit.opts.3.fx.1":"匪首接银掂了掂，挥刀让开道途一侧。","events.e_bandit.opts.3.t":"掷银买路，免动干戈","events.e_bandit.text":"山坳乱石间一声尖哨，数柄雪亮朴刀自林中杀出，汉子跨前厉声断喝留财。","events.e_beggar.opts.1.d":"施予碎银，广结善缘","events.e_beggar.opts.1.fx.1":"老丐眼底精光微敛，用破竹片在泥地划下一道避险方位。","events.e_beggar.opts.1.t":"恭谨布施，赠以盘缠","events.e_beggar.opts.2.d":"听其含混不清的醉中长吟","events.e_beggar.opts.2.fx.1":"老丐醉眼微睁，含混哼道：「北山老柏下，莫踏死人踪……」言毕倒头鼾睡。","events.e_beggar.opts.2.t":"盘膝静听，参悟醉歌","events.e_beggar.opts.3.d":"江湖多莫测，不可轻履险地","events.e_beggar.opts.3.fx.1":"行出十数步回首看去，破垣下空空荡荡，唯余泥地一处寸深足印。","events.e_beggar.opts.3.t":"不沾是非，抽身而退","events.e_beggar.text":"残垣墙根卧着一名污面老丐，破碗结满寒霜，指节粗厚覆满老茧。","events.e_bell.opts.1.d":"以内力直面钟波震颤淬身","events.e_bell.opts.1.t":"钟下沉身，内力承劲","events.e_bell.opts.2.d":"细察僧徒踏步击撞之势","events.e_bell.opts.2.ok.1":"见其木杵进击腰马沉凝，正合外功发力根本，心中顿悟借力之法。","events.e_bell.opts.2.t":"打量武僧，察看发劲","events.e_bell.text":"古刹铜钟轰然撞响，声浪推山逐浪。耳鼓轰鸣之际，丹田滞涩内气亦被震荡动摇。","events.e_boat.opts.1.d":"付清船资，静待渡江","events.e_boat.opts.1.fx.1":"小舟剪浪而过，对岸苍茫群山迎面压来，江阔云低，胸襟顿开。","events.e_boat.opts.1.t":"登舟横渡，去往对岸","events.e_boat.opts.2.d":"接过竹篙运双臂气力破浪","events.e_boat.opts.2.ok.1":"双臂发劲篙落浪裂，轻舟猛窜数丈。艄公击掌称奇，执意不收渡费。","events.e_boat.opts.2.t":"代撑沉篙，以力御水","events.e_boat.opts.3.d":"清波之下审视江底水相","events.e_boat.opts.3.t":"注视江底，探看动静","events.e_boat.text":"江心一叶扁舟荡波破水。斗笠艄公长篙微划，水花翻起，平展如一线素绢。","events.e_brawl.opts.1.d":"运轻功不沾红尘斗杀","events.e_brawl.opts.1.fx.1":"身形如风掠过长街，围观游侠皆赞少侠一身利落身法。","events.e_brawl.opts.1.t":"踏虚掠影，飘然穿过","events.e_brawl.opts.2.d":"催内力震开交锋二人","events.e_brawl.opts.2.ok.1":"掌风如怒浪推涌，沉雄力道震退二人兵刃。二人面如土色，抱拳悻悻散去。","events.e_brawl.opts.2.t":"引劲截击，强行止戈","events.e_brawl.opts.3.d":"冷眼参详二人开阖路数","events.e_brawl.opts.3.t":"抱臂观势，静看破绽","events.e_brawl.text":"长街当中两名提刀草莽赤目对峙，刃光霍霍，四方百姓纷纷抱头退避。","events.e_caravan.opts.1.d":"互换所知西域前路地势","events.e_caravan.opts.1.ok.1":"商首递过半张羊皮水草残录：「出了此峡，便是流沙死窟了。」","events.e_caravan.opts.1.t":"探询前道，求取水图","events.e_caravan.opts.2.d":"各自行路，不相纠葛","events.e_caravan.opts.2.t":"作揖别过，两下珍重","events.e_caravan.text":"断壁背风处，西域驼队伏卧歇息。胡商按刀警戒，驼袋满载异邦香料与珍宝。","events.e_chain1.opts.1.d":"将残图收入囊底护好","events.e_chain1.opts.1.fx.1":"图上墨迹虽残，隐约指向淮北千重山峦与大漠古道。","events.e_chain1.opts.1.t":"贴身收存，誓探其踪","events.e_chain1.opts.2.d":"弃之旧地，免惹是非","events.e_chain1.opts.2.t":"合匣置回，不沾纠葛","events.e_chain1.text":"残匣暗槽之中压着半张兽皮旧图，墨线断在山渊深处，边角带有火燎残痕。","events.e_chain2.opts.1.d":"循图纹方位查探崖缝暗格","events.e_chain2.opts.1.ok.1":"石门微震露出暗格，取出一册梯云纵轻身遗篇，图上线条直指西域大漠。","events.e_chain2.opts.1.t":"攀岩摸穴，暗启机窍","events.e_chain2.opts.2.d":"描摹图记以备后用","events.e_chain2.opts.2.t":"拓下印记，留待后查","events.e_chain2.text":"荒山苔崖之上，赫然削着一道古月图纹，与囊中所藏皮图残痕严丝合缝。","events.e_chain3.opts.1.d":"探入剑宗前朝玄秘石殿","events.e_chain3.opts.1.fx.1":"地台之上古兵寒芒未褪，昔年前辈掩埋的绝学古藏终于得见天日。","events.e_chain3.opts.1.t":"按剑拾级，直下幽冥","events.e_chain3.opts.2.d":"以黄沙封穴留待后世","events.e_chain3.opts.2.t":"封存石门，免扰旧梦","events.e_chain3.text":"大风掀开狂沙，千载地门终于重现天日。石级蜿蜒深陷沙底，阴寒地风呼啸上涌。","events.e_chess.opts.1.d":"拈白子点向死地生门","events.e_chess.opts.1.ok.1":"一子落枰，弃子开道反吞大龙。局势陡然翻转，胸间兵戈剑招豁然通透。","events.e_chess.opts.1.t":"落子险峰，反客为主","events.e_chess.opts.2.d":"敛子归瓮，收敛心神","events.e_chess.opts.2.fx.1":"胜负不过方寸残枰，欣然收子，心中再无滞碍。","events.e_chess.opts.2.t":"收拾散子，不溺局中","events.e_chess.text":"老松覆荫处列着青石棋坪，黑白搏杀正凶。黑棋被围待毙，白棋虽盛，腹地却有隐患。","events.e_ferry.opts.1.d":"回宿暂歇，不渡浊流","events.e_ferry.opts.1.t":"静待天青，候浪渐平","events.e_ferry.opts.2.d":"踏湿板上舟迎浪争渡","events.e_ferry.opts.2.ok.1":"扁舟破开浊流逆浪前行，天色渐白时，已稳立江南对岸。","events.e_ferry.opts.2.t":"重赏求舟，顶风破浪","events.e_ferry.text":"暴雨导致江流浑浊猛涨，缆索绷紧如弦。老艄公蹲在船头默默吐烟，任风扯乱蓑笠。","events.e_fish.opts.1.d":"买下沉匣一探究竟","events.e_fish.opts.1.t":"解囊买断，博取机缘","events.e_fish.opts.2.d":"催动外功蛮劲帮渔户拉拽","events.e_fish.opts.2.t":"出手相助，合力起网","events.e_fish.opts.3.d":"细看残铁所刻断代文印","events.e_fish.opts.3.ok.1":"辨识出这是当年水师所遗落的铅鞘，渔户感激之余，奉送厚礼相谢。","events.e_fish.opts.3.t":"拂净泥锈，辨识官印","events.e_fish.text":"太湖鱼档千帆杂沓。渔夫当街剖鳞，沉重粗网中竟拖出一只覆满水锈的铜匣。","events.e_frost.opts.1.d":"燃枯枝取暖烹酒壮胆","events.e_frost.opts.1.fx.1":"篝火跳跃，烈酒穿喉如刀，寒意尽退。","events.e_frost.opts.1.t":"架柴生火，烹温烈酒","events.e_frost.opts.2.d":"顶彻骨寒意锤炼筋骨","events.e_frost.opts.2.t":"披霜疾走，抗风炼体","events.e_frost.opts.3.d":"看日出东方，体悟阴阳交替","events.e_frost.opts.3.t":"仰望启明，静候红日","events.e_frost.text":"晓月未坠，寒霜覆满荒野枯草，呵气化白，四方冷肃如封。","events.e_ghost.opts.1.d":"潜入后室搜检藏处","events.e_ghost.opts.1.ok.1":"神龛暗扣轻动，起出一枚触手微润的古玉雕佩。","events.e_ghost.opts.1.t":"拨网探看，寻检暗格","events.e_ghost.opts.2.d":"煞气太盛，莫惊往生孤影","events.e_ghost.opts.2.fx.1":"掩上残破木板，风过长草，心头重归寂静。","events.e_ghost.opts.2.t":"合掩破门，安步退出","events.e_ghost.text":"荒宅门庭颓圯，蛛网蒙尘。前堂积灰足有半指，神龛内却端放着一尊青铜剑座。","events.e_herb.opts.1.d":"施展身法探入深涧采芝","events.e_herb.opts.1.t":"系绳下探，凌空探取","events.e_herb.opts.2.d":"取其精华以待后缘","events.e_herb.opts.2.t":"折采芝叶，留存宿根","events.e_herb.text":"绝壁危岩背阴处，斜生数株紫血灵芝，肉厚如伞，隐泛微光，药香顺风散逸。","events.e_hermit.opts.1.d":"诚敬请益身法运转要法","events.e_hermit.opts.1.ok.1":"老翁点指笑道：「足随风走，如落叶翻水。」轻轻点拨，身法关隘尽消。","events.e_hermit.opts.1.t":"整装长揖，向翁问道","events.e_hermit.opts.2.d":"拢柴煮水奉茶以侍","events.e_hermit.opts.2.t":"拾柴添火，烹泉侍奉","events.e_hermit.opts.3.d":"不打扰长者垂钓机锋","events.e_hermit.opts.3.t":"轻步绕行，避扰清修","events.e_hermit.text":"道旁青岩坐着白须老翁，手持光竹无线无饵，虚垂云海，仪容闲雅若仙。","events.e_horse.opts.1.d":"以相马法辨识脚力品相","events.e_horse.opts.1.ok.1":"识出此马确系塞外良驹，转手倒卖间获利颇丰。","events.e_horse.opts.1.t":"查验齿口，相看骨架","events.e_horse.opts.2.d":"展沉雄掌力勒抚惊马","events.e_horse.opts.2.fx.1":"双掌如铁桩扼住辔头，烈马渐驯，围观胡客齐声呼好。","events.e_horse.opts.2.t":"纵步拦缰，降服烈马","events.e_horse.opts.3.d":"不沾喧闹自马群穿行","events.e_horse.opts.3.t":"侧身避让，淡然漫步","events.e_horse.text":"塞外马市嘶鸣动地，尘土弥漫。胡客争执间，一匹黑鬃神骏甩鬃踢腾，骨格雄奇。","events.e_ink.opts.1.d":"买下上等老松烟墨防身","events.e_ink.opts.1.fx.1":"古墨入手冰凉沉重，最宜拓录古卷秘籍。","events.e_ink.opts.1.t":"重金求购，买藏古墨","events.e_ink.opts.2.d":"细看匠人运力揉料法度","events.e_ink.opts.2.ok.1":"看墨工腕力吞吐回环，虚实相生，暗合太极卸力机巧，大有所得。","events.e_ink.opts.2.t":"观工研磨，参悟沉稳","events.e_ink.opts.3.d":"借松烟雅香澄清杂念","events.e_ink.opts.3.t":"静嗅香气，宁神涤虑","events.e_ink.text":"老墨庄内松烟香气如兰。樟木架上墨锭齐整，黑亮如镜，分量沉定。","events.e_loom.opts.1.d":"观飞梭疾驰领悟机括手法","events.e_loom.opts.1.fx.1":"飞梭进退极速细密，竟从中勘破暗器连珠同发的借力关窍。","events.e_loom.opts.1.t":"凝视梭动，揣摩暗器","events.e_loom.opts.2.d":"以敏锐指法抢接断线","events.e_loom.opts.2.fail.1":"手上力道未收住，扯断了丝头。","events.e_loom.opts.2.ok.1":"两指如兰拂穴，连引数十乱丝不断。坊主感佩，赠礼相谢。","events.e_loom.opts.2.t":"展指相援，续接乱丝","events.e_loom.opts.3.d":"买上好云缎缝制护身软心","events.e_loom.opts.3.fx.1":"云缎贴身穿戴，温润柔韧，身法愈见飘逸。","events.e_loom.opts.3.t":"挑购软缎，衬缝内甲","events.e_loom.text":"机杼之声轧轧不绝。织妇飞梭如穿花引蝶，素锦如匹倾泻，光润如霞。","events.e_lost.opts.1.d":"施轻身功法翻上青瓦高墙","events.e_lost.opts.1.ok.1":"足尖轻点瓦垄凌空而起，居高四顾，瓦缝里竟嵌着一块遗落的温润残玉。","events.e_lost.opts.1.t":"提气登瓦，纵跃绝顶","events.e_lost.opts.2.d":"临危不乱，沿旧路潜行退避","events.e_lost.opts.2.fx.1":"沉稳按刀退回巷口，恰好避开一场设伏暗杀。","events.e_lost.opts.2.t":"按剑戒备，循路后撤","events.e_lost.text":"深巷交错狭窄，两侧高墙耸峙。迎面竟是一堵封死残壁，阴风穿墙隐透杀气。","events.e_lotus.opts.1.d":"驻足烟波涤尽尘俗","events.e_lotus.opts.1.t":"漫步池畔，舒缓心意","events.e_lotus.opts.2.d":"施展身法采摘稀世灵药","events.e_lotus.opts.2.fail.1":"脚下湿叶微滑，险些失衡，亏得提气稳住身形。","events.e_lotus.opts.2.ok.1":"点叶凌波探手折得灵药，清气沁脾，顿觉周身生机盎然。","events.e_lotus.opts.2.t":"踏荷轻踩，掠水折莲","events.e_lotus.text":"万顷水塘碧叶田田，荷花出水微颤。微风拂面清香袭来，深处现出一株极罕见的并蒂并头莲。","events.e_lute.opts.1.d":"体会弦音暗藏的招式转承","events.e_lute.opts.1.fx.1":"琴音流转跌宕，气海随之起伏，心中豁然明悟音律与剑式通融之处。","events.e_lute.opts.1.t":"凭栏静听，揣摩乐理","events.e_lute.opts.2.d":"辨识曲调当中的招式变化","events.e_lute.opts.2.ok.1":"曲律几度变易，暗合一路精微擒拿口诀，默记在胸，得益匪浅。","events.e_lute.opts.2.t":"默记指法，暗合武经","events.e_lute.text":"画舫轻纱间流淌出凄绝琵琶声，游人听得入迷，忽转急促，杀伐金石之意喷薄而出。","events.e_lute2.opts.1.d":"静听胡笳之意融入心境","events.e_lute2.opts.1.t":"驻马静听，体味关塞","events.e_lute2.opts.2.d":"请教古调源头出处","events.e_lute2.opts.2.fx.1":"乐工凄声自语：「这是『阳关引』。当年听客，几人得归玉门？」","events.e_lute2.opts.2.t":"探询曲目，相问往昔","events.e_lute2.text":"边关老杨树下，盲眼乐工抚动胡琴。琴弓拉出沙鸣，调子苍凉高亢，尽诉塞北风沙白骨。","events.e_market.opts.1.d":"大碗烈酒，涤荡风尘","events.e_market.opts.1.t":"登楼豪饮，痛快开怀","events.e_market.opts.2.d":"在嘈杂市声中辨各派消息","events.e_market.opts.2.t":"侧耳察言，捕捉风闻","events.e_market.text":"夜色方浓，秦淮两岸灯彩倒映水中。酒楼画舫丝弦连绵，游侠市井杂沓其间。","events.e_mirage.opts.1.d":"展全速奔赴蜃景所现方位","events.e_mirage.opts.1.fail.1":"追赶半日唯余茫茫黄沙，方知造化幻景不可强求。","events.e_mirage.opts.1.ok.1":"幻影虽散，却在沙坑中寻得一具风蚀铜箱，起获一把上好名兵。","events.e_mirage.opts.1.t":"提纵狂奔，追赶异象","events.e_mirage.opts.2.d":"倚石静坐看天地幻相生灭","events.e_mirage.opts.2.fx.1":"幻由心生，破相即真。观此盛景，胸中功力更进一层。","events.e_mirage.opts.2.t":"跌坐对观，悟化虚实","events.e_mirage.opts.3.d":"以天日光影核对舆图方位","events.e_mirage.opts.3.fx.1":"核对天象校正了残图偏差，西域古窟方位已然明晰。","events.e_mirage.opts.3.t":"参照星野，校订残舆","events.e_mirage.text":"流沙天际处，云霞映出高阁飞檐之蜃影，仙阁连云，隐见佩剑身影凌虚踏阶。","events.e_monk.opts.1.d":"以晚辈礼见前辈大德","events.e_monk.opts.1.fx.1":"老僧敛手微礼，帚尖画圆引残叶微转，禅意无声点润心头。","events.e_monk.opts.1.t":"止步合十，躬身请安","events.e_monk.opts.2.d":"请教内气通脉周转要旨","events.e_monk.opts.2.t":"诚意叩询，求教调息","events.e_monk.opts.3.d":"相询早年藏经阁失火案","events.e_monk.opts.3.fx.1":"老僧低叹：「执着过往，终成挂碍。」竹帚轻掠，残叶归根。","events.e_monk.opts.3.t":"垂询往事，查证遗闻","events.e_monk.text":"古寺角门处，老僧执竹帚静默扫地。看似老态尽显，足音呼吸却与风声木落不分彼此。","events.e_moon.opts.1.d":"引清凉气机巡行周天","events.e_moon.opts.1.t":"坐对夜月，吐纳清辉","events.e_moon.opts.2.d":"人剑交融，乘月试刃","events.e_moon.opts.2.ok.1":"寒芒破月腾起，步走八卦圆融无滞，竟在月下悟通一路身法真意。","events.e_moon.opts.2.t":"拔剑起舞，试演招式","events.e_moon.text":"浮云尽散，圆月悬照古木。银辉洒满江淮，四野静极，正是运气练剑之刻。","events.e_peddler.opts.1.d":"探看箩筐底层所藏兵刃护甲","events.e_peddler.opts.1.t":"翻检底货，求取良刃","events.e_peddler.opts.2.d":"搜寻旧籍残卷与运气口诀","events.e_peddler.opts.2.t":"探访残篇，买阅秘卷","events.e_peddler.opts.3.d":"行路不问底细，拱手而过","events.e_peddler.opts.3.fx.1":"货郎深深打量你一眼，担子轻摇，清脆铜铃声渐渐隐入水雾。","events.e_peddler.opts.3.t":"侧身让路，各自行路","events.e_peddler.text":"游方货郎摇铃挑担而过，青布轻掀一角，隐见精芒微闪，非是寻常脂粉杂货。","events.e_poem.opts.1.d":"参悟残断字势中的剑气","events.e_poem.opts.1.ok.1":"凝视多时，终于堪破削去的那路变招！原来满壁墨迹尽是狂草剑法化出。","events.e_poem.opts.1.t":"拂试残痕，补缀全篇","events.e_poem.opts.2.d":"将残断字句摹刻入脑","events.e_poem.opts.2.t":"沉静默诵，记刻心头","events.e_poem.text":"残壁留有昔年醉客墨痕，铁划银钩。末尾三句却似被掌力齐齐削平，字意中绝。","events.e_purse.opts.1.d":"立于道旁，重信守诺","events.e_purse.opts.1.fail.1":"直至暮色西沉亦无来人，囊中散碎银两便收以充作行囊用度。","events.e_purse.opts.1.ok.1":"锦衣失主气喘寻来，见囊完好喜不自胜，执意奉上厚谢。","events.e_purse.opts.1.t":"守候原处，静候失主","events.e_purse.opts.2.d":"不贪外物，独守自心","events.e_purse.opts.2.fx.1":"身后传出行人拾银的喧闹，你胸怀泰然，剑心愈发明澈。","events.e_purse.opts.2.t":"视若无睹，拂袖而去","events.e_purse.text":"青石路旁落下一只织金软囊，扎口微松，缝隙内透出一抹微光。","events.e_purse2.opts.1.d":"运沉雄内力破断锈锁","events.e_purse2.opts.1.t":"催劲崩锁，开匣辨视","events.e_purse2.opts.2.d":"覆土如旧，留付后来人","events.e_purse2.opts.2.t":"重新埋入，不惊前物","events.e_purse2.text":"塌陷烽燧的沙泥下挖出一只铜铁方匣，锈斑累累，封签篆字尚隐有灵动痕迹。","events.e_rain.opts.1.d":"听雨洗剑，磨砺心中杀气","events.e_rain.opts.1.fx.1":"目睹雷火劈裂虚空，胸间剑意顿生，气海运转更增三分浑厚。","events.e_rain.opts.1.t":"殿内避雨，观雷参剑","events.e_rain.opts.2.d":"踏泥逆风急行，磨砺周身血气","events.e_rain.opts.2.fail.1":"冰雨浇透衣衫，寒意袭骨，全凭丹田内力死死驱化寒气。","events.e_rain.opts.2.t":"顶雨夜行，借势炼骨","events.e_rain.text":"黑云低压，雷声滚过天际。夜雨如注倾泻，古刹飞檐垂下雨幕，天地唯余风雨雷威。","events.e_sand.opts.1.d":"收气定心，以龟息抗风","events.e_sand.opts.1.fx.1":"任由狂沙呼啸掠过，心平如水。待风沙止歇，掸衣而起。","events.e_sand.opts.1.t":"伏身石侧，屏气闭穴","events.e_sand.opts.2.d":"运护体真气在狂沙中破道","events.e_sand.opts.2.ok.1":"以内力生生闯过暴风，于乱沙凹处救下几名遇险胡商。","events.e_sand.opts.2.t":"提罡直上，硬撼风暴","events.e_sand.opts.3.d":"坐看荒漠风流消长","events.e_sand.opts.3.t":"静待风止，冷看沧桑","events.e_sand.text":"沙浪漫天，狂风推卷如黄色巨墙扑来。天昏地暗，砂砾打在脸上生疼如铁弹。","events.e_shop.opts.1.d":"在杂乱陈货中翻看护身铁器","events.e_shop.opts.1.fx.1":"厚厚尘垢之下，翻出一具精钢打制、暗蓄机巧的护臂。","events.e_shop.opts.1.t":"搜检旧箱，翻寻底货","events.e_shop.opts.2.d":"于残破旧纸堆里淘寻口诀","events.e_shop.opts.2.fx.1":"掌柜自抽屉底抽出一册断本，其上录有数招早已佚失的剑法。","events.e_shop.opts.2.t":"求买残经，查探遗卷","events.e_shop.opts.3.d":"踱步离去，轻风扑面","events.e_shop.opts.3.t":"作揖告辞，莫惹因果","events.e_shop.text":"僻巷旧铺半敞板门，尘封古铜残卷杂陈。掌柜半闭双目，不置一词。","events.e_smuggler.opts.1.d":"潜行尾随探寻所押何物","events.e_smuggler.opts.1.t":"隐身随行，暗窥虚实","events.e_smuggler.opts.2.d":"主动互亮绿林切口","events.e_smuggler.opts.2.t":"抱拳朗喝，互通名号","events.e_smuggler.opts.3.d":"押镖不易，莫招闲怨","events.e_smuggler.opts.3.t":"让道驻足，避身路旁","events.e_smuggler.text":"数辆覆毡重车连夜疾驰，车辙深陷入泥。镖客手按暗兵，神情严冷紧盯四野。","events.e_snowfield.opts.1.d":"顺避风断崖疾进","events.e_snowfield.opts.1.ok.1":"在崖缝背风处采得数株盛放的冰山雪莲，药气清洌提神。","events.e_snowfield.opts.1.t":"贴崖觅路，逆风前行","events.e_snowfield.opts.2.d":"避于雪穴运功御冷","events.e_snowfield.opts.2.t":"凿雪为窟，调息御寒","events.e_snowfield.text":"雪厚没胫，天地四顾茫茫。风雪转瞬间抹平来路脚印，呼气即化白霜。","events.e_stele.opts.1.d":"指尖摩挲石上残存刻痕","events.e_stele.opts.1.ok.1":"摩至末行依稀辨出豪壮誓词，侠气拂面，胸怀为之大振。","events.e_stele.opts.1.t":"指抚剥痕，摹画风骨","events.e_stele.opts.2.d":"向为国捐躯义士致礼","events.e_stele.opts.2.t":"理草正冠，肃立作拜","events.e_stele.text":"无字断碑仆在乱草之中，风剥雨蚀，乃百年前御侮喋血的无名英杰旧冢。","events.e_stone.opts.1.d":"以肉掌贴入石壁凹痕溯源","events.e_stone.opts.1.t":"按掌相对，体味掌意","events.e_stone.opts.2.d":"退后数步审度宏大掌力","events.e_stone.opts.2.t":"退步纵览，细观走势","events.e_stone.opts.3.d":"敲击崖石查看内力透骨深浅","events.e_stone.opts.3.fx.1":"石硬逾铁，昔日留下此痕者内功浑厚，委实骇人听闻。","events.e_stone.opts.3.t":"屈指叩石，勘察质地","events.e_stone.text":"削立石壁之上印有一道尺宽掌痕，碎纹如裂，深陷石质三寸有余。","events.e_sutra.opts.1.d":"逐字研读梵刻呼吸心诀","events.e_sutra.opts.1.ok.1":"倒读字序内藏玄奥，赫然是一篇龟息调元真诀，气海霍然通畅。","events.e_sutra.opts.1.t":"凝眸默读，勘透关窍","events.e_sutra.opts.2.d":"通览贝叶记载之要义","events.e_sutra.opts.2.t":"翻看大致，略知脉络","events.e_sutra.opts.3.d":"不取一页，合十告退","events.e_sutra.opts.3.t":"敬放佛案，稽首作礼","events.e_sutra.text":"供案供奉一轴梵字贝叶古卷，泥金黯淡，边角焦黄，字里行间凝着禅定至理。","events.e_sword.opts.1.d":"以己剑法印证壁间寒意","events.e_sword.opts.1.ok.1":"寒意透指如冰，眼前宛若浮现昔年名宿削岩那一式，剑路豁然顿通。","events.e_sword.opts.1.t":"并指凝锋，逆推前意","events.e_sword.opts.2.d":"细看剑劲破石尺寸","events.e_sword.opts.2.t":"手抚剑口，丈量透度","events.e_sword.text":"断岩之上横着一道三尺剑痕，切口如磨，石屑散落，犹隐隐逼出一股彻骨寒意。","events.e_tea.opts.1.d":"歇足温养气海","events.e_tea.opts.1.ok.1":"热茶下肚化作暖流，耳畔听得邻座汉子正低声密议黑道重宝现世。","events.e_tea.opts.1.t":"静坐品茗，旁听动静","events.e_tea.opts.2.d":"替角落被刁难的老行商结付茶资","events.e_tea.opts.2.fx.1":"老客商深躬道谢，袖底悄悄递过一株泥土未干的金创灵草。","events.e_tea.opts.2.t":"掷银解困，结纳善缘","events.e_tea.opts.3.d":"向掌柜相询近来江湖事","events.e_tea.opts.3.fx.1":"掌柜低头擦桌，压低声气道：「近来黑风寨正到处堵杀携刀叛逃的死士。」","events.e_tea.opts.3.t":"抱拳探路，打听风声","events.e_tea.text":"古道茶寮布帘半卷。青衣掌柜悬壶注水，细线穿针，四下三两豪客低语，隐闻黑道黑话。","events.e_tomb.opts.1.d":"以火光扫视前殿石案","events.e_tomb.opts.1.fx.1":"积灰石案之上，竟放着一函未曾朽坏的陪葬谱录。","events.e_tomb.opts.1.t":"打亮火折，探身暗查","events.e_tomb.opts.2.d":"辨识墓壁刻留的生平墓志","events.e_tomb.opts.2.fail.1":"风化过甚，字迹尽已难辨。","events.e_tomb.opts.2.ok.1":"辨明这是昔年剑术名宿之冢，壁角隐刻其生平最后一招剑式。","events.e_tomb.opts.2.t":"借光读文，细辨碑铭","events.e_tomb.opts.3.d":"向墓室作礼，退出阴道","events.e_tomb.opts.3.fx.1":"退出石穴，青山依旧，世间英雄终归尘土。","events.e_tomb.opts.3.t":"肃立拱手，悄步后撤","events.e_tomb.text":"前朝荒冢塌半，石门横斜，幽黑甬道直通地腹，隐透森冷腐霉之气。","events.e_well.opts.1.d":"饮清泉洗练肺腑","events.e_well.opts.1.fx.1":"凉泉入腹如寒冰涤腑，气海杂念顿消，精神爽利。","events.e_well.opts.1.t":"汲取寒泉，仰颈畅饮","events.e_well.opts.2.d":"借百钧深水磨砺膀臂力气","events.e_well.opts.2.ok.1":"发力沉稳单手提桶而起，旁观老僧颔首含笑，赠以盘缠。","events.e_well.opts.2.t":"提拉巨桶，借水炼臂","events.e_well.opts.3.d":"细察井砖内壁刀削剑痕","events.e_well.opts.3.fx.1":"井壁数丈深处砖面上，隐刻着数招前人闭关手录的残缺剑式。","events.e_well.opts.3.t":"俯首观壁，端详刻痕","events.e_well.text":"寺中古井深幽不测，石栏留有百道绳槽磨痕。井水清冽刺骨，隐闻水气回荡回甘。","events.e_willow.opts.1.d":"取绿柳一枝挽在剑首","events.e_willow.opts.1.fx.1":"翠柳佩寒锋，客路风尘亦平添三分从容侠意。","events.e_willow.opts.1.t":"折柳寄怀，信步当歌","events.e_willow.opts.2.d":"向织柳叟打探阴草生处","events.e_willow.opts.2.fail.1":"老叟默默编篓，未予理会。","events.e_willow.opts.2.ok.1":"老叟抬手遥指河堤水湾背阴处。","events.e_willow.opts.2.t":"探访老农，相询药草","events.e_willow.opts.3.d":"漫行至柳堤尽处石桥","events.e_willow.opts.3.fx.1":"石缝内起获一卷前人登桥时遗留的手抄古卷。","events.e_willow.opts.3.t":"信步慢行，登临残桥","events.e_willow.text":"隋堤烟柳正茂，柔条随风扫水。细雨如织，行客凭依，满目离情别绪。","events.e_wolf.opts.1.d":"剑气与火光同发退兽","events.e_wolf.opts.1.fx.1":"长剑破空横劈断石，寒光凌厉，狼群惊退散入夜色。","events.e_wolf.opts.1.t":"引燃干枝，横剑震慑","events.e_wolf.opts.2.d":"催一身搏杀煞气迎面碾压","events.e_wolf.opts.2.fail.1":"狼群方散，道旁阴处却冷不防杀出一名截道恶客。","events.e_wolf.opts.2.ok.1":"周身杀意翻涌，前锋野狼受震伏地，群狼四散仓皇溃逃。","events.e_wolf.opts.2.t":"凝煞拔刃，硬撼恶兽","events.e_wolf.opts.3.d":"步步后退避入乱石隘口","events.e_wolf.opts.3.fx.1":"卡守隘口不露破绽，群狼窥视多时，终于呜咽退散。","events.e_wolf.opts.3.t":"沉稳退后，扼守险石","events.e_wolf.text":"荒坡之上数双青绿狼目在风尘中阴冷闪动，低沉咆哮如雷，杀意围拢。","goals.g_arts.d":"融会贯通五路神功绝艺","goals.g_arts.log":"诸般功法印证相通，招式随念即出，已有名家风骨。","goals.g_boss.d":"击溃成名已久的绿林寇首","goals.g_boss.log":"破敌伏寇，凶名落定，声威传于黑白两道。","goals.g_chain.d":"循旧图踏破风沙探明石窟","goals.g_chain.log":"勘破残卷墨迹，踏破铁鞋，终于起出古宗密藏。","goals.g_cross.d":"走出淮南，横跨大江天堑","goals.g_cross.log":"舟度大江，千顷涛声过耳，更见九州武道辽阔气象。","goals.g_lv.d":"修为臻至十阶巅峰之境","goals.g_lv.log":"气沉丹田，脉络通畅，往来江湖再无滞涩。","goals.g_road.d":"踏遍淮南三处名胜地界","goals.g_road.log":"三千里烟雨行于脚下，鞋履破尽，剑心愈发澄澈。","goals.g_stele.d":"寻得名山古碑拓录六处","goals.g_stele.log":"往事如烟，尽录碑石诗文，浩然正气充塞心胸。","goals.g_wins.d":"连败强敌，二十战全捷","goals.g_wins.log":"剑履锋芒，手生粗茧，周身煞气令宵小退避三舍。","goals.g_world.d":"踏遍九州六州各大邑名胜","goals.g_world.log":"关河万里，朔雪风沙尽踏脚下，天下已识君手中长锋！","items.a_bu.d":"洗至发白的旧青衫，虽不能卸刀剑，穿在身上却自有一份落拓江湖气。","items.a_jin.d":"柔金细丝混织而成，轻薄无感。穿于贴身处，可消卸暗器利刃穿刺。","items.a_pi.d":"硝熟熟牛皮甲，衬以柔韧细铁线，贴身穿戴，能挡市井钝刀重棒。","items.a_suo.d":"冷锻铁环层层相扣，刀剑难透。裹在内衫之中，分量沉定如披坚石。","items.a_xuan.d":"沉铁打制重甲，漆黑无光，寻常兵刃斩于其上只落白痕，难以透力。","items.dan_nei.d":"古刹秘传灵丹，带淡淡旃檀香。服后化为温热气流透入脏腑，疗愈重创。","items.dan_qi.d":"道家丹炉炼就的白瓷灵药，入口甘苦，能定翻腾气海，平复紊乱内息。","items.herb.d":"崖壁湿隙处所生灵草，捣烂敷于创口，清凉止痛，收口极快。","items.incense.d":"古刹手作素香，点燃后青烟凝成细线，定魂涤虑，最宜打坐安神。","items.jade.d":"温润微凉的断损残玉，断面雕有极淡的云龙暗纹，来历已不可考。","items.map_frag.d":"旧羊皮卷残角，朱砂残线横截断去，隐约点明一处风沙掩埋的秘藏方位。","items.page.d":"焦黄残损的古册断页，边角带水浸墨渍，其上朱砂蝇头小楷录着数行秘诀。","items.t_fo.d":"高僧长年摩挲的铜牌，包浆温润，佩戴防身，可御邪祟乱念。","items.t_ling.d":"斑驳古铜打制的小铃，风过轻晃，清响入耳，微有摄神定意之感。","items.t_long.d":"雕琢蟠龙环抱的古玉璧，刀工古拙，佩于腰间，隐有一派从容威仪。","items.t_xue.d":"深赤如凝血的古珀，握于掌中隐隐生温，能催动气血，激昂战意。","items.t_yu.d":"温润无瑕的羊脂玉，佩在心口温和不凉，能静心火，定气内息。","items.w_dao.d":"刀背厚重开精细血槽，刃线如弦月。关外游侠仗以防身的快利兵刃。","items.w_gu.d":"通体无饰，古朴无华。剑身苍灰如远山，握之只觉剑意深敛，沉雄压兵。","items.w_qing.d":"名匠所淬精钢剑，出匣微带清鸣。锋芒映水带青，轻点宣纸即可截断。","items.w_tie.d":"脊厚刃直，未开明光。握在手中分量沉实，虽非削铁宝刃，足御江湖防身。","items.w_xue.d":"取寒铁炼就之古刃，薄如蝉翼，出匣带霜气，挥动时风响如裂冰。","items.w_zhan.d":"重逾三十斤的沉炼阔刀，刀势沉重凶暴，非力大沉稳者难以挥使如意。","items.wine.d":"拍去泥封，陈年酽香扑鼻。入口温辣如火，能散客途寒意，亦壮胸胆。","lore.inscriptions.cd_bai":"白帝危柱悬刻狂草：『朝辞白帝彩云间，千里江陵一日还。』豪气冲霄，笔势大开。","lore.inscriptions.cd_cheng":"染坊斑驳照壁书有残联：『晓看红湿处，花重锦官城。』烟雨洗剥，笔致犹秀。","lore.inscriptions.cd_qing":"绝壁崖石深刻两行：『窗含西岭千秋雪，门泊东吴万里船。』指力入骨，雄劲超凡。","lore.inscriptions.dh_cheng":"土墙刻有商行旧诗：『无数铃声遥过碛，应驮白练到安西。』荒漠长路，风尘历历。","lore.inscriptions.dh_fo":"石窟外壁题有绝句：『青海长云暗雪山，孤城遥望玉门关。』西望极目，苍茫无涯。","lore.inscriptions.dh_guan":"关墙残夯有人焦炭狂书：『羌笛何须怨杨柳，春风不度玉门关。』慷慨悲怆，余音不绝。","lore.inscriptions.gs_cang":"旧卷之中夹着残纸：『夜半钟声到客船。』无印无名，唯透淡淡墨气与孤意。","lore.inscriptions.gs_han":"钟楼木柱刻着古诗：『月落乌啼霜满天，江枫渔火对愁眠。』霜夜寒光，读来骨冷。","lore.inscriptions.gs_qiao":"桥洞岩壁渗墨留句：『姑苏城外寒山寺，夜半钟声到客船。』水汽浸湿字痕，分外凄清。","lore.inscriptions.ly_cheng":"瓮城内砖嵌着刀痕：『谁家玉笛暗飞声，散入东风满洛城。』刀劲狂疾，力透砖石。","lore.inscriptions.ly_mang":"荒草残石断留半句：『洛阳城里见秋风。』道尽青山白骨英雄末路。","lore.inscriptions.yz_gua":"古渡断碑背刻雄字：『京口瓜洲一水间，钟山只隔数重山。』大江横流，字意沉郁。","lore.inscriptions.yz_hu":"石栏剑痕深及寸许：『二十四桥明月夜，玉人何处教吹箫。』霜锋入石，至今寒意未销。","lore.inscriptions.yz_mo":"沙下残界碑镌有两句：『大漠孤烟直，长河落日圆。』风沙剥蚀，笔锋苍劲如铁。","lore.inscriptions.yz_si":"古塔外壁铁划留字：『故人西辞黄鹤楼，烟花三月下扬州。』不知何代浪客酒后所书。","lore.inscriptions.yz_xue":"绝壁冰岩压着断碑：『五月天山雪，无花只有寒。』字势如霜，见之心底发寒。","lore.inscriptions.yz_yan":"铁关缝隙嵌有刻石：『秦时明月汉时关，万里长征人未还。』字字血泪，边关凄怆。","lore.npcExtra.a_yi":"「少侠的身法比大漠苍隼还轻快！阿依木这碗烈酒，只敬天下一等一的好汉。」","lore.npcExtra.jueyuan":"「施主下盘扎实、内息深敛。老衲在此扫除落叶，欣见少侠道力愈发沉稳。」","lore.npcExtra.liu":"「这盏清茶算老夫奉上的。少侠脚步稳重，已非当日那个冒失少年了。」","lore.npcExtra.mo":"「刀既拔出便莫犹疑。看你眼下挥斩之势，老夫这套断门法门没白托付。」","lore.npcExtra.shen":"「昏暗何妨，少侠目力自能辨物。坐下罢，这卷古碑残帖正堪借你参详。」","lore.npcExtra.su":"「少侠又来抓药？柜头早为你备下了定元散，妥善收存防身。」","lore.npcExtra.tang_gu":"「茶冷了，杀气也尽了。少侠神色清明，想必已知手中利器当斩向何人。」","lore.txt.arrive.1":"古道西风，长剑抖落寒霜，你已按辔行至{p}地界。","lore.txt.arrive.2":"细雨垂柳，{p}的旧酒旗在风中翻卷，隐隐飘来陈醅酽香。","lore.txt.arrive.3":"残阳斜照{p}破垣残壁，江湖风雨催人老，此地又埋过多少侠客骨。","lore.txt.arrive.4":"一叶扁舟荡过急峡，回看来路，{p}的危楼险隘已近在眉睫。","lore.txt.arrive.5":"烟尘散尽，{p}街市喧嚷扑面而来，多少恩怨是非正伏在深巷酒垆。","lore.txt.arrive.6":"塞雁排空，你按剑登临{p}，极目望去，千载关河尽在眼底。","lore.txt.arrive.7":"夜阑更尽，{p}客店旧窗透出一豆孤灯，映出按剑孤客的长影。","lore.txt.arrive.8":"狂沙卷地，大漠苍莽，你按笠直立，{p}的暗影在残照里如巨兽横卧。","lore.txt.idle.1":"独坐{p}客栈雕栏之下独酌，窗外冷月如钩，静听风雨刀兵过客之声。","lore.txt.idle.2":"按剑跌坐于{p}松荫之下，内劲运行大周天，生生不息，百脉通调。","lore.txt.idle.3":"水寒影瘦，驻足{p}岸旁，唯见浩荡东流水，带去几多平生恩怨。","lore.txt.idle.4":"长锋横在膝前，调息敛神。{p}风声渐定，草木起伏暗合呼吸。","lore.txt.idle.5":"看{p}街巷行客往来匆匆，不知哪一位是退隐狂徒，哪一位袖底藏着快刃。","lore.txt.idle.6":"倚在{p}残石下闭目调息，引导真元，将淤滞杂气缓缓化开。","lore.txt.idle.7":"凭栏听着{p}晨钟悠悠，杀心收束，心台明澈如洗。","lore.txt.idle.8":"按剑坐于{p}溪畔，观落叶飘坠逆流翻卷，若有所得，招式收放渐入化境。","lore.txt.idle.9":"于{p}飞檐下暂避骤雨，利剑入鞘，念及的不过是远方一碗热汤。","lore.txt.loot.1":"杂草乱石间踢着硬物，拭去陈泥，赫然是一具暗芒隐隐的旧器！","lore.txt.loot.2":"绝壁危松枯蔓丛中卡着一只锈铁小匣，封口处隐现前朝秘宝印痕。","lore.txt.loot.3":"悍敌散逃，道旁遗下一只沉甸甸的皮囊，入手沉实，内藏好物。","lore.txt.loot.4":"潮退水落处露出沉舟残骸，折断铜环内竟封存着不世宝物。","lore.txt.loot.5":"破寺泥塑裂腹之中，起获一卷以油布严密裹扎的武经真迹！","lore.txt.loss.1":"真力逆乱，胸口血气如沸，呕出一口红沫，踉跄扶树按剑喘定。","lore.txt.loss.2":"衣破皮裂，刃痕深及筋骨。残阳如火，此战虽败，剑意反倒淬炼得更纯。","lore.txt.loss.3":"眼前金芒乱晃，依仗三尺铁锋强撑立住，剧喘之下方知天下高手如林。","lore.txt.loss.4":"身带重创隐入幽林竹丛，冷汗浸透长衫，急取灵丹镇压乱逆气血。","lore.txt.loss.5":"喉头腥热翻涌，倚墙喘息良久，暗下决意待平复创口再雪此恨。","lore.txt.offline.1":"长夜漫漫，松涛入牖。你潜心于古刹深处闭门吐纳，不问江湖风雨。","lore.txt.offline.2":"红泥小炉火温，沉香未冷。合眸内视周天无碍，功力在光阴中暗长。","lore.txt.offline.3":"山静不知岁，石冷未觉寒。潜心推演残谱，不觉门前落叶已覆青石。","lore.txt.offline.4":"云水卷舒，月落日升。于孤室调理诸招变化，褪尽浮华躁气。","lore.txt.offline.5":"寒星悬夜，四籁俱寂。引四方清气归于气海，潜龙在渊，待机而起。","lore.txt.offline.6":"柴门深掩，避过万丈嚣尘。寒灯映刃，一身锋锐尽化从容定力。","lore.txt.offline.7":"雨打古柏，滴答打瓦。静定中巡行周身诸穴，残损尽补，真气沛然。","lore.txt.offline.8":"江湖夜雨，孤灯如豆。醒来见石阶满覆严霜，握剑之手愈发沉实。","lore.txt.walk.1":"解缆推舟，拂衣作别{p}，踏歌破入茫茫烟水波涛。","lore.txt.walk.2":"更漏渐残，晨光穿晓，你整好包裹行囊，迈出{p}关门迎向前路。","lore.txt.walk.3":"一人一骑别离{p}，前方关塞千万重，行侠一世本无畏险阻。","lore.txt.walk.4":"秋风翻卷衣袖，剑意生寒，你跨步离开{p}，身影隐入重重山道。","lore.txt.walk.5":"马蹄踏裂冻霜，你纵马别过{p}，身后尘土落处，唯余一声呼哨。","lore.txt.walk.6":"按剑步出{p}隘口，守关宿卒见你步履带威，不由侧身避开通路。","nodes.cd_bai.d":"夔门孤悬三峡口，绝壁千仞直切江流。孤城控扼川陕喉襟，城头白旗猎猎，城主倚剑临风俯瞰。","nodes.cd_cheng.d":"锦江绕郭慢流，沿街竹椅茶香四溢。丝竹声软，深巷竹影微移处，却有唐门暗桩按动机簧。","nodes.cd_du.d":"长堤分江劈浪，珉江狂涛触峡嘶吼。飞悬竹索横掠怒涛，立于堤上，雷霆万钧扑面而来。","nodes.cd_e.d":"四面佛背倚万顷云海，日出万丈金霞破雾。山风扑面如裂帛，金顶绝巅唯见断刃寒芒独悬。","nodes.cd_qing.d":"翠峰环抱如深屏，三十六峰浮于雾海。古观藏于寒林，道人挥剑拂松，招招契合玄门机理。","nodes.cd_tang.d":"幽篁封径，石门内暗锁沉雾。廊柱机关密布，千机匣弦扣紧绷，百载之间令武林胆寒不敢近。","nodes.cd_yan.d":"细雨湿润青石，飞檐垂珠滴打铜铃。瓦屋低回，市井叫卖深处，隐着退隐老剑客的酒帘。","nodes.cd_zhan.d":"悬空木栈扣入绝壁，下临无底万丈绝壑。冷雾缠足，猿鸟难渡，一夫扼守万夫莫行。","nodes.dh_cheng.d":"胡汉商道交汇要冲。梵钟沉浑，驼铃不绝，波斯香料与美酒堆满客栈，暗市里流传着灵药秘闻。","nodes.dh_fo.d":"千窟凿于红崖之上，飞天金彩历经风尘犹艳。万佛垂目，石刻壁画间暗藏古传呼吸法印。","nodes.dh_guan.d":"断夯巨垒独立风沙，出关一步即是茫茫旱海。行客至此回望中原，长叹一声折柳别离。","nodes.dh_huo.d":"山脊焦赤若炭，热浪滚腾扭曲视野。地脉暗火隐动，绝壁之上乃异人借地火淬炼功法之所。","nodes.dh_mi.d":"陷落流沙下露出前朝残阶，地穴深闭冷风回旋。石壁刻满无名法诀，昔年宗坛旧物尽埋于此。","nodes.dh_quan.d":"黄沙瀚海环抱中一弯寒碧。风沙卷天而不落水面，芦荻轻曳，乃枯绝旱海中一脉生机。","nodes.dh_sha.d":"沙岭如刀背横斜，足履其上轰鸣若击雷鼓。狂风掀起沙浪，常有古铜经匣露出一角。","nodes.gs_cang.d":"重楼绝尘，架上万卷枯黄。守楼叟手提素灯不点明火，天下招式渊源，大半皆在此中掩埋。","nodes.gs_cheng.d":"人家尽枕清流，粉墙映着黛瓦。机杼隔帘轻响，吴侬细语未落，石桥阴处已掠过几道皂衣暗影。","nodes.gs_chi.d":"池水墨黑无底，寒气贴水如芒。相传古王殉葬千剑于渊下，风过水面，隐带碎金剑啸。","nodes.gs_han.d":"黄叶覆满山径，钟楼古索磨蚀如缕。古殿青灯微焰，隐约闻得木鱼声下翻阅旧卷之响。","nodes.gs_hu.d":"千顷烟波苍茫无际，芦荻深处宿雁惊飞。看似渔舟归晚，苇荡暗影里却隐着水寨巡江的铁叶快艇。","nodes.gs_qiao.d":"古枫斜横水岸，客船系缆宿于霜夜。几点渔火浮沉，半夜幽钟荡破水面清寒。","nodes.gs_yan.d":"危峰如削，寒竹插天。崖风过处林涛翻涌如潮，偶有负剑之客立于危石，静听破空风声。","nodes.gs_zhai.d":"黑木栅依岛立，排桩鹿角插江。太湖悍寇伏于阴棚，寒芒分水刺挽出雪浪，过往官船莫敢逼近。","nodes.ly_bai.d":"两匹石马披霜卧伏门前。殿阁梵音低回，古柏苍劲参天，千年积香洗透周遭纷扰杀伐。","nodes.ly_cheng.d":"九重城阙横枕长街，蹄声车马沸若翻潮。禁军重甲踏街而过，街角茶坊里各路草莽按刀相视。","nodes.ly_du.d":"浊浪劈排河岸，大河奔涌如怒龙下山。风陵渡头寒风穿骨，古来多少游侠渡水，一去不回。","nodes.ly_long.d":"绝壁开凿千窟，大佛垂眸俯瞰浊世芸芸。石龛深浅参差，岩隙风动，宛若无声掌印印刻千古。","nodes.ly_lv.d":"黑龙大旗扑朔作响，乱石垒就重寨。豪客聚坐大碗割肉痛饮，腰间朴刀泛着冷白油光。","nodes.ly_mang.d":"北邙荒丘蔓草侵道，森森古柏压倒残碑。日暮鸦翻，常有摸金之辈与怪修幽影伏于封土暗处。","nodes.ly_song.d":"千佛殿砖地深陷足印寸许，老柏撑起漫山禅意。七十二门绝学沉压寺中，中原武脉聚于一山。","nodes.ly_zhan.d":"白骨半没黄沙，断戟斜插荒草。四野阴风掠地如马蹄卷过，昔年厮杀煞气至今凝冷不散。","nodes.yz_cao.d":"朔风扫过冰原，枯草尽折覆于薄雪之下。天地同白，狼迹隐没，枯土下封着前朝折断铁戈。","nodes.yz_cheng.d":"十里烟柳带风，画舫穿桥而过。茶坊酒肆市声正沸，几名佩刀行客低头避让，暗流紧贴墙根消长。","nodes.yz_du.d":"千顷迷蒙，水汽扑面。老艄公长篙探水，篙尖过处水草翻涌，不见水下隐伏的几道黑影。","nodes.yz_feng.d":"苍黑方燧孤立荒原，枯草裹着风沙扑打残石。极目望去三千荒里，唯余落日与断鸿。","nodes.yz_gang.d":"青苔浸透断磴，石级直没入云。绝壁深隙偶生灵芝，山风阴啸，偶有亡命之徒聚啸断崖。","nodes.yz_gu.d":"残柱覆于厚沙之下，石井早已干涸。残垣风穿成咽，幽邃暗道内隐有沉重机括滚动之声。","nodes.yz_gua.d":"江流东去，浪击危矶。对岸紫金岚翠隐入重云，渡口风紧，自古便是行客折戟喋血处。","nodes.yz_hu.d":"细柳垂波，残月斜悬二十四桥。白石桥栏处有深浅剑痕数道，风过水皱，冷浸寒波。","nodes.yz_lang.d":"北荒巨石累台，苍狼战旗猎猎撕风。夜半长嗥四起，边关塞外十万胡骑精锐聚此按刀。","nodes.yz_mo.d":"沙丘层叠如覆波浪，长河落日横贯苍穹。狂风起处沙尘吞天，孤烟升起处，有石穴孤客独坐。","nodes.yz_si.d":"塔影斜切松阴，暮钟催起晚鸦。老僧长阶扫叶，青石漫漫，落下一地苍苔与空寂。","nodes.yz_tang.d":"古木虬枝遮蔽半壁残瓦，石案上半局烂柯浸满落叶。过往名士狂生，尽付浩荡逝水。","nodes.yz_xue.d":"雪线之上尽是万年坚冰，罡风掠面如刀。绝壁危岩间雪莲孤立，凡骨莫能涉足此间。","nodes.yz_yan.d":"铁门倚山而立，城砖上箭痕刀斑密布。关山风烈，朔风卷地，长空唯余孤雁一声哀鸣。","nodes.yz_yun.d":"夯土老塞横截黄沙，毡帘厚垂遮挡朔风。酒肆胡姬踏节而旋，烈酒入喉，难掩边境杀机。","npcs.a_yi.chat.1":"「少侠饮了这碗烈酒。出了玉门关，可就莫再回望江南的细柳了。」","npcs.a_yi.chat.2":"「中原人重在扎马下盘，可在大漠瀚海之上，如风飘荡方能活命。」","npcs.a_yi.chat.3":"「穿过千佛洞与玉门旧城，荒沙尽头埋着旧王城留下的万箱奇珍。」","npcs.a_yi.info":"走步如踏飞沙，借势而旋。顺风借力，敌手蛮劲自会落入空处。","npcs.a_yi.intro":"金铃轻响，红裙如火。胡女立于客商柜旁，眸如寒星，转侧间轻捷如大漠旋风。","npcs.jueyuan.chat.1":"「扫尽落叶亦是拭去心尘。少侠眼底杀伐未平，当知刚强极处最易折断。」","npcs.jueyuan.chat.2":"「招式不过是皮相外物，气沉丹田、胸怀正道，方具伏魔之相。」","npcs.jueyuan.chat.3":"「千佛殿前那些深坑，皆是前修步步踏出来的，武道途上从无侥幸。」","npcs.jueyuan.info":"吐纳当如游丝出入，引气下沉归穴，时日既久，筋骨自如枯木盘石。","npcs.jueyuan.intro":"青砖塔下，老僧手持枯竹帚缓缓扫地，足履轻缓，落步处却沉稳如山岳。","npcs.liu.chat.1":"「少侠且用粗茶。这江湖赶路的急客太多，肯坐下暖口茶汤的太少。」","npcs.liu.chat.2":"「剑递得太急容易走偏，茶滚得太透失了回甘。凡事皆同此理。」","npcs.liu.chat.3":"「蒋三在城东设了套子。昨夜后街悄悄拉走两车，都是折了筋骨的好手。」","npcs.liu.info":"恶仆一身硬气功外皮坚厚，刀剑难伤，需引内力透骨震其气海方能破招。","npcs.liu.intro":"巷口茶肆炉火正红，水沸烟生。青袍掌柜倾壶悬注，细流如线直入茶盏，指端暗蓄内劲。","npcs.mo.chat.1":"「唯快不破，唯准不虚。老夫这口钝刀，只教识货之人，只杀该死之辈。」","npcs.mo.chat.2":"「关七刀法霸道无匹，然全力劈砍之际，足跟必偏半分，那便是生路。」","npcs.mo.chat.3":"「古泥里掘出来的断刃煞气浸骨，心境未稳之人擅握，反被刀意摄去心智。」","npcs.mo.info":"刀走厚重，切莫虚晃。稳居中盘抢半步，远胜盲打三招散乱快式。","npcs.mo.intro":"竹笠压低，怀抱一柄无鞘黑铁刀倚立残墙。身侧尺许寒气森然，落叶沾身即断。","npcs.shen.chat.1":"「文能存道，武能卫道。多少成名剑客纵横一世，老来也不过化作简册寥寥数笔。」","npcs.shen.chat.2":"「这半卷无名剑谱唯缺收手一式，百年来多位行客翻阅，皆未能勘破关窍。」","npcs.shen.chat.3":"「老朽早年曾拓得剑池残铭，墨迹刺目透纸，寻常浮躁心性断难看懂。」","npcs.shen.info":"古卷秘本常以药汁暗书背面，需迎着月色斜照，方见其下所藏口诀。","npcs.shen.intro":"书架重重，尘香扑鼻。素衣老人借微光翻检旧卷，神色淡然，深邃如渊。","npcs.su.chat.1":"「经脉有亏最忌硬扛，寻常药粉难愈内伤，需以温和真气慢慢蕴养。」","npcs.su.chat.2":"「世间最毒的从非蛇蝎药草，而是翻云覆雨、转眼翻脸的世道人心。」","npcs.su.chat.3":"「蜀冈断崖虽生百年紫芝，但崖底积骸早已不知叠了几重。」","npcs.su.info":"金创草最喜背阴苔痕，古寺水渠与断碑向阴的石缝里，年份往往极好。","npcs.su.intro":"百子药柜散发清苦微香。白衣女子轻捻细长银针，神色如深冬落雪，静穆出尘。","npcs.tang_gu.chat.1":"「旧宅遍布陷阱与机弩，若不通奇门辨位，迈过门槛便是黄泉路。」","npcs.tang_gu.chat.2":"「发暗器者贵在心平，无声无息无意，手中机簧才能夺命于无形。」","npcs.tang_gu.chat.3":"「锦官城繁华无边，风吹红绡，但天下怨憎仇杀，又有哪处不是致命蛛网？」","npcs.tang_gu.info":"暗器机锋全在出其不意。隐于袖内，五步之内突发，神鬼不及招架。","npcs.tang_gu.intro":"修竹掩映小窗，妇人素手执盏品茗。看似寻常温婉，宽袖之下却隐伏着百变机簧。","terms.origins.gu.d":"一剑一酒，浪迹天涯。无人知你来处，亦不知归宿，冥冥中独得一份天眷福缘。","terms.origins.shang.d":"腰缠十万，富甲一方。惯看银钱聚散如流水，出门远行，囊中盘缠自然丰裕。","terms.origins.shu.d":"青衫负箧，诗礼传家。于旧纸堆里翻过残招，独辨断崖古篆。悟性、根骨扎实。","terms.origins.wu.d":"铁胆沉钧，掌缘带茧。老旧镖旗虽已褪色，骨子里仍是草莽快意。臂力、身法略胜一筹。","ui.rotate.desc":"请转为竖屏浏览，方展关河全貌","ui.setup.tip":"入得江湖无归途，落子无悔","ui.verse.1":"秋风卷野，瘦马横枪，残阳落血。","ui.verse.2":"小店温酒未凉，腰悬三尺铁锋犹带晚霜。","ui.verse.3":"身入江湖，是非难料。踏入此关，生死自负。"});if(window.console&&console.log)console.log('[文案] 外部补丁：生效 '+r.ok+' 条，失败 '+r.bad+' 条');}}catch(e){}})();
</script>
