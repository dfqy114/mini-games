.setup-label{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:16px 2px 7px;
  font-family:var(--f-title);font-size:12.5px;letter-spacing:3px;color:var(--gold2)}
.setup-label em{font-family:var(--f-read);font-style:normal;font-size:9px;letter-spacing:1px;color:var(--tx3);opacity:.9}
.name-wrap{position:relative}
.name-in{width:100%;height:46px;padding:0 46px 0 14px;border:1px solid rgba(217,184,106,.22);border-radius:2px;
  background:linear-gradient(180deg,rgba(0,0,0,.38),rgba(14,22,19,.55));color:var(--gold2);
  font-family:var(--f-title);font-size:17px;letter-spacing:3px;outline:none;
  -webkit-user-select:text;user-select:text;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.name-in:focus{border-color:rgba(211,172,87,.68);box-shadow:0 0 18px rgba(211,172,87,.12),inset 0 1px 0 rgba(255,255,255,.04)}
.name-in::placeholder{color:rgba(124,119,104,.7);letter-spacing:3px}
.name-mark{position:absolute;right:13px;top:50%;transform:translateY(-50%);padding-left:11px;
  border-left:1px solid rgba(217,184,106,.18);font-family:var(--f-title);font-style:normal;font-size:19px;
  line-height:1;color:rgba(211,172,87,.4);pointer-events:none}

/* — 出身选择卡 — */
.origin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.origin{position:relative;display:block;width:100%;padding:9px 10px;text-align:left;overflow:hidden;
  border:1px solid rgba(217,184,106,.15);border-radius:2px;
  background:
    radial-gradient(120% 84% at 8% 0%,rgba(101,167,142,.10),rgba(101,167,142,0) 58%),
    linear-gradient(165deg,rgba(27,42,35,.90),rgba(9,14,12,.95));
  box-shadow:inset 0 1px 0 rgba(240,223,180,.05),0 4px 12px rgba(0,0,0,.3);
  transition:border-color .18s var(--cw-ease),box-shadow .18s var(--cw-ease),transform .18s var(--cw-ease),background .18s var(--cw-ease)}
.origin::before{content:"";position:absolute;left:4px;top:4px;width:8px;height:8px;pointer-events:none;opacity:.65;
  border-left:1px solid rgba(211,172,87,.4);border-top:1px solid rgba(211,172,87,.4)}
.origin::after{content:"";position:absolute;right:4px;bottom:4px;width:8px;height:8px;pointer-events:none;opacity:.65;
  border-right:1px solid rgba(211,172,87,.4);border-bottom:1px solid rgba(211,172,87,.4)}
.origin.on{border-color:rgba(242,221,163,.72);
  background:
    radial-gradient(120% 84% at 8% 0%,rgba(101,167,142,.15),rgba(101,167,142,0) 58%),
    linear-gradient(165deg,rgba(43,60,50,.92),rgba(11,17,14,.96));
  box-shadow:0 0 0 1px rgba(211,172,87,.16),0 0 24px rgba(211,172,87,.13),inset 0 0 24px rgba(211,172,87,.05)}
.origin.on::before,.origin.on::after{border-color:rgba(242,221,163,.75);opacity:1}
.origin:active{transform:scale(.985)}
.oc-char{position:absolute;right:-6px;bottom:-16px;font-family:var(--f-title);font-style:normal;font-size:62px;
  line-height:1;color:rgba(211,172,87,.055);pointer-events:none;user-select:none}
.origin.on .oc-char{color:rgba(242,221,163,.10)}
.oc-top{position:relative;z-index:1;display:flex;align-items:center;gap:7px}
.oc-ico{flex:0 0 24px;width:24px;height:24px;display:grid;place-items:center;color:rgba(211,172,87,.62)}
.oc-ico svg{width:18px;height:18px}
.origin.on .oc-ico{color:var(--gold2);filter:drop-shadow(0 0 6px rgba(242,221,163,.25))}
.oc-name{font-family:var(--f-title);font-size:15px;letter-spacing:1.5px;color:var(--paper);white-space:nowrap}
.origin.on .oc-name{color:#f7ecd3}
.oc-line{position:relative;z-index:1;display:block;min-height:31px;margin-top:5px;
  font-size:10px;line-height:1.55;letter-spacing:.3px;color:#9d9482}
.origin.on .oc-line{color:#c3b89f}
.oc-tags{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.oc-tag{padding:3px 5px 2px;border:1px solid rgba(101,167,142,.3);border-radius:1px;
  background:rgba(101,167,142,.05);font-size:9px;line-height:1;letter-spacing:.5px;color:var(--jade2)}
.oc-tag.gold{border-color:rgba(211,172,87,.32);background:rgba(211,172,87,.05);color:var(--gold2)}

/* — 卷尾 — */
.setup-orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 2px;
  font-family:var(--f-read);font-size:9px;letter-spacing:3px;color:rgba(169,159,138,.55)}
.setup-orn i{display:block;width:36px;height:1px;background:linear-gradient(90deg,rgba(211,172,87,0),rgba(211,172,87,.3))}
.setup-orn i:last-child{background:linear-gradient(90deg,rgba(211,172,87,.3),rgba(211,172,87,0))}

/* — 踏入江湖 — */
.setup-foot{flex:0 0 auto;margin-bottom:auto;padding-top:12px}
#setup #btnStart{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;
  min-height:56px;height:56px;padding:0;border:1px solid rgba(211,172,87,.5);border-radius:2px;
  background:linear-gradient(180deg,rgba(40,58,49,.95) 0%,rgba(16,25,21,.98) 55%,rgba(9,14,12,1) 100%);
  color:var(--gold2);box-shadow:0 12px 26px rgba(0,0,0,.55),inset 0 1px 0 rgba(240,223,180,.08),inset 0 0 26px rgba(211,172,87,.05);
  transition:transform .16s var(--cw-ease),box-shadow .16s var(--cw-ease)}
#setup #btnStart::before{content:"";position:absolute;inset:4px;border:1px solid rgba(240,223,180,.13);pointer-events:none}
#setup #btnStart:active{transform:translateY(1px) scale(.996);box-shadow:0 6px 16px rgba(0,0,0,.5)}
#setup #btnStart .se-tx{font-family:var(--f-title);font-size:19px;letter-spacing:9px;text-indent:9px;
  color:var(--gold2);text-shadow:0 0 22px rgba(211,172,87,.28)}
#setup #btnStart .se-stamp{display:block;width:24px;padding:3px 0 2px;border:1px solid rgba(195,75,60,.65);
  border-radius:1px;font-family:var(--f-title);font-style:normal;font-size:8px;line-height:1.1;letter-spacing:1px;
  text-align:center;color:rgba(227,119,97,.9);transform:rotate(-6deg);opacity:.9}
.setup-tip{margin-top:9px;text-align:center;font-family:var(--f-read);font-size:9.5px;letter-spacing:2px;color:var(--tx3)}
.setup-tip::before,.setup-tip::after{content:"·";margin:0 8px;color:rgba(211,172,87,.4)}

@media (min-width:900px){
  #setup{padding:calc(26px + var(--safe-t)) 24px calc(20px + var(--safe-b))}
  #setup .setup-h,#setup .setup-body,#setup .setup-foot{max-width:620px}
  .setup-h h1{font-size:62px;letter-spacing:16px;margin-left:16px}
  .setup-stamp{right:calc(50% - 196px);top:16px}
  .setup-h .verse{font-size:13.5px}
  .origin{padding:12px 13px}
  .oc-line{min-height:34px;font-size:10.5px}
  #setup #btnStart{min-height:60px;height:60px}
  #setup #btnStart .se-tx{font-size:21px;letter-spacing:11px;text-indent:11px}
  .setup-scroll::before,.setup-scroll::after{position:absolute;top:47%;transform:translateY(-50%);
    writing-mode:vertical-rl;font-family:var(--f-read);font-size:11px;letter-spacing:6px;
    color:rgba(211,172,87,.15);pointer-events:none}
  .setup-scroll::before{content:"山高水长";left:11%}
  .setup-scroll::after{content:"风雨江湖";right:11%}
}
@media (max-height:700px){
  .setup-h h1{font-size:42px;letter-spacing:8px;margin-left:8px}
  .setup-h .verse{font-size:11.5px;line-height:1.8;margin-top:7px}
  .setup-rule{margin-top:7px}
  .setup-label{margin:11px 2px 6px}
  .oc-line{min-height:0}
  .setup-orn{display:none}
  #setup #btnStart{min-height:52px;height:52px}
}

/* ---------------- 宽屏 ---------------- */
@media (min-width:900px){
  #app{max-width:1280px}
  .veil{background:linear-gradient(90deg,rgba(6,10,9,.66),rgba(6,10,9,.10) 45%,rgba(6,10,9,.60))}
  .hud{padding:10px 24px}
  .stage-wrap{flex-direction:row;gap:0}
  .stage{flex:1;height:auto;min-height:0;border-right:1px solid var(--line)}
  .view{width:400px;flex:0 0 400px;background:linear-gradient(180deg,rgba(9,14,13,.55),rgba(9,14,13,.88))}
  .view-scroll{padding:14px 16px 22px;-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 26px),rgba(0,0,0,0));mask-image:linear-gradient(180deg,#000 calc(100% - 26px),rgba(0,0,0,0))}
  .action-bar{position:absolute;left:0;right:400px;bottom:76px;background:transparent;border:0;pointer-events:none;justify-content:center;padding:0 14px}
  .action-bar>*{pointer-events:auto}
  .action-bar .act-btn,.action-bar .skill{background:rgba(9,14,13,.8);backdrop-filter:blur(6px)}
  /* 宽屏别把五个行动键拉成一整排长条 */
  .action-bar:not(.fighting) .act-btn{flex:0 0 96px;max-width:96px}
  .action-bar.fighting .skill{flex:0 0 132px;width:132px;max-width:132px}
  .map-card{max-width:620px;margin-left:auto;margin-right:auto;width:calc(100% - 20px)}
  /* 创角页在宽屏上收成一栏，别让来处卡片铺满整屏 */
  .setup-h,.setup-body,.setup-foot{width:100%;max-width:520px;margin-left:auto;margin-right:auto}
  .tabs{padding:6px 0}
  .tabs .tab{max-width:150px;margin:0 auto}
  #mapView{right:400px;bottom:73px}
  /* 宽屏：舆图收成一条挂轴居中，两侧留暗底 —— 铺满整宽会把图幅拉扁、节点摊稀 */
  .map-canvas{width:100%;max-width:730px;margin-left:auto;margin-right:auto;
    box-shadow:0 0 0 1px rgba(211,172,87,.20), 0 22px 46px rgba(0,0,0,.55), 0 2px 0 rgba(211,172,87,.10) inset}
  .place-name{font-size:32px}
  .stage-caption{font-size:14px;bottom:140px}
}
@media (max-height:620px){
  .stage{flex-basis:28%;min-height:130px}
  .hud-r2{margin-top:5px}
  .tab{min-height:42px}
}

/* ---------------- 天时 · 破绽 · 江湖志 ---------------- */
#view.map-hidden{visibility:hidden}
.tian-shi{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border:1px solid rgba(211,172,87,.34);border-radius:2px;color:var(--gold2);font-size:10px;letter-spacing:.5px;background:rgba(9,14,13,.62)}
.combat-box.tell .combat-unit:last-child{border-color:rgba(227,119,97,.8);animation:tellPulse .7s ease-in-out infinite}
@keyframes tellPulse{0%,100%{box-shadow:0 0 10px rgba(227,119,97,.2)}50%{box-shadow:0 0 26px rgba(227,119,97,.62)}}
.float.break{color:#ffe6a0;font-size:23px;letter-spacing:2px}
.goal.done{border-color:rgba(101,167,142,.55);background:rgba(101,167,142,.08)}
.goal .gt{font-family:var(--f-title);font-size:13px;color:var(--gold2);letter-spacing:1px}
.goal .gd{font-size:10px;color:var(--tx3);line-height:1.6;margin-top:3px}
.goal .gr{font-size:10px;color:var(--jade2);margin-top:4px;line-height:1.5}
.goal-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--tx3);margin-right:6px}
.goal.done .goal-dot{background:var(--jade2);box-shadow:0 0 8px var(--jade2)}
.inscription{font-family:var(--f-read);font-size:13px;line-height:1.9;color:var(--paper2);letter-spacing:1px}

/* ============================================================
   见闻：签 + 录（收藏册）
   ============================================================ */
.lore-signs{display:flex;gap:6px;overflow-x:auto;margin:0 -12px 12px;padding:2px 12px 5px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.lore-signs::-webkit-scrollbar{display:none}
.lore-sign{position:relative;flex:1 1 0;min-width:0;height:96px;display:flex;flex-direction:column;align-items:center;
  padding:13px 0 9px;border:1px solid rgba(217,184,106,.13);border-radius:1px;
  background:linear-gradient(180deg,rgba(24,36,31,.5),rgba(9,14,12,.4));transition:transform .22s var(--cw-ease),border-color .22s var(--cw-ease),background .22s var(--cw-ease)}
.lore-sign::before{content:"";position:absolute;top:6px;left:50%;width:3px;height:3px;margin-left:-1.5px;transform:rotate(45deg);
  border:1px solid rgba(217,184,106,.28);transition:.22s var(--cw-ease)}
.lore-sign i{writing-mode:vertical-rl;font-style:normal;font-family:var(--f-title);font-size:14px;letter-spacing:3px;line-height:1;
  color:rgba(216,207,186,.84);flex:1;margin-top:7px}
.lore-sign .cnt{display:flex;align-items:baseline;justify-content:center;gap:1px}
.lore-sign b{font-family:var(--f-read);font-weight:400;font-size:13px;line-height:1;color:rgba(211,172,87,.86);font-variant-numeric:tabular-nums}
.lore-sign em{font-style:normal;font-size:8px;line-height:1;letter-spacing:.2px;color:rgba(169,159,138,.46)}
.lore-sign.on{border-color:rgba(217,184,106,.42);background:linear-gradient(180deg,rgba(217,184,106,.13),rgba(11,17,14,.52))}
.lore-sign.on::before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px rgba(217,184,106,.55)}
.lore-sign.on i{color:#f5e8c8}
.lore-sign.on b{color:var(--gold2)}
.lore-sign:active{transform:translateY(-1px)}
@media (hover:hover){.lore-sign:hover{border-color:rgba(217,184,106,.3);transform:translateY(-1.5px)}}

.lcard{position:relative;display:flex;gap:10px;padding:9px 10px;margin-bottom:6px;border:1px solid rgba(217,184,106,.1);border-radius:1px;
  background:linear-gradient(118deg,rgba(22,34,29,.58),rgba(10,16,13,.5));transition:transform .22s var(--cw-ease),border-color .22s var(--cw-ease)}
.lcard:last-child{margin-bottom:0}
.lcard .lc-seal{flex:0 0 32px;width:32px;height:32px;margin-top:1px;display:grid;place-items:center;align-self:flex-start;
  border:1px solid var(--qa,rgba(217,184,106,.2));color:var(--q,#e9d9b2);font-family:var(--f-title);font-size:15px;line-height:1;
  background:radial-gradient(circle at 32% 24%,var(--qb,rgba(217,184,106,.08)),rgba(0,0,0,0) 66%),rgba(0,0,0,.22)}
.lcard .lc-bd{flex:1;min-width:0}
.lcard .lc-nm{font-family:var(--f-title);font-size:13px;letter-spacing:1.2px;color:var(--cw-paper);line-height:1.4;display:flex;align-items:baseline;gap:6px}
.lcard .lc-nm>span{flex:0 0 auto}
.lcard .lc-tag{font-family:var(--f-body);font-size:8.5px;letter-spacing:.8px;line-height:1.5;padding:0 3px;
  color:rgba(169,159,138,.6);border:1px solid rgba(217,184,106,.14)}
.lcard .lc-d{font-size:10.5px;line-height:1.62;color:rgba(169,159,138,.72);margin-top:3px;letter-spacing:.2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lcard .lc-x{font-size:10px;line-height:1.55;color:rgba(143,203,184,.78);margin-top:4px;letter-spacing:.3px}
.lcard.unseen{padding:7px 9px;align-items:center;border-style:dashed;border-color:rgba(217,184,106,.12);background:none}
.lcard.unseen .lc-seal{flex:0 0 26px;width:26px;height:26px;margin-top:0;border-style:dashed;border-color:rgba(217,184,106,.16);color:rgba(169,159,138,.5);background:none;font-size:12px}
.lcard.unseen .lc-nm{color:rgba(169,159,138,.62);font-size:12.5px}
.lcard.unseen .lc-tag{color:rgba(169,159,138,.42);border-color:rgba(217,184,106,.1)}
.lcard.unseen .lc-d{color:rgba(169,159,138,.38);-webkit-line-clamp:1}
.lcard.goal.done{border-color:rgba(101,167,142,.32);background:linear-gradient(118deg,rgba(101,167,142,.09),rgba(10,16,13,.52))}
.lcard.goal.done .lc-seal{border-color:rgba(143,203,184,.46);color:#a9e0cd;background:rgba(101,167,142,.08)}
.lcard.goal.done .lc-tag{color:rgba(143,203,184,.8);border-color:rgba(101,167,142,.3)}
.lore-more{text-align:center;font-size:9.5px;letter-spacing:1.4px;color:rgba(169,159,138,.4);padding:10px 0 2px}
@media (hover:hover){
  .lcard:hover{border-color:rgba(217,184,106,.24);transform:translateY(-1px)}
  .lcard.unseen:hover{transform:none;border-color:rgba(217,184,106,.2)}
}

/* 待访：两列名录，像册页里的空白格 */
.lore-miss{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.lore-miss .lcard{margin:0;padding:7px 8px;gap:7px;min-height:34px}
.lore-miss .lc-seal{flex:0 0 22px;width:22px;height:22px;font-size:11px}
.lore-miss .lc-nm{font-size:11.5px;letter-spacing:.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.lore-miss .lc-tag{display:none}

/* ============================================================
   批次一 · 空间与信息架构
   ============================================================ */
/* 戏台收为横幅：默认 122px，点右下「展」看全景，交手时自动让出高度 */
@media (max-width:899px){
  .stage{flex:0 0 122px;min-height:122px}
  .stage.big{flex-basis:208px;min-height:208px}
  .stage.fighting{flex-basis:176px;min-height:176px}
  .stage.big.fighting{flex-basis:208px;min-height:208px}
  .stage .place-tag{top:9px}
  .stage .place-name{font-size:20px;letter-spacing:4px}
  .stage.big .place-name{font-size:25px;letter-spacing:5px}
  .stage .place-meta{font-size:10px;gap:6px}
  .stage .stage-caption{left:12px;right:100px;bottom:7px;padding:0;text-align:left;font-size:11px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stage.big .stage-caption{left:12px;right:36%;bottom:10px;padding:0;text-align:left;font-size:12px;line-height:1.7;white-space:normal;overflow:visible;text-overflow:clip}
}
/* 展开键只留角标：44px 热区不动，但不再用实心方块压住人物与剑 */
.stage-toggle{position:absolute;right:0;bottom:0;z-index:7;width:44px;height:44px;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 7px 5px 0;border:0;border-radius:0;background:none;color:rgba(211,172,87,.62);font-family:var(--f-title);font-size:12px;letter-spacing:1px;text-shadow:0 1px 6px #000,0 0 10px rgba(0,0,0,.8);transition:.15s}
.stage-toggle:active{color:var(--gold2);background:rgba(211,172,87,.10);border-radius:3px}
.stage.fighting .stage-toggle{opacity:0;pointer-events:none}
/* 内容区上移到戏台下方后，压暗提前，别让天空透成噪点 */
.veil{background:linear-gradient(180deg,rgba(6,10,9,.70) 0%,rgba(6,10,9,.14) 14%,rgba(6,10,9,.40) 26%,rgba(6,10,9,.70) 44%,rgba(6,10,9,.86) 70%,rgba(6,10,9,.94) 100%)}
/* 分段键略高，热区更稳 */
.seg.wrap{gap:6px}
.seg button{min-height:36px;padding:0 11px}
/* 人物 · 可换列表折叠条 */
.listmore{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 10px;border:1px dashed var(--line);border-radius:3px;color:var(--tx2);font-size:12px;letter-spacing:1px}
.listmore .lm{color:var(--gold2);font-family:var(--f-title);font-size:12px}
.listmore:active{background:rgba(211,172,87,.10);border-color:var(--line2)}
/* 招式页：三式置入键 */
.slotpick{display:flex;gap:4px}
.slotbtn{position:relative;width:40px;height:40px;border:1px solid var(--line);border-radius:3px;color:var(--tx3);font-family:var(--f-title);font-size:12px;background:rgba(10,16,14,.55)}
.slotbtn::after{content:"";position:absolute;inset:-2px}
.slotbtn.on{border-color:var(--gold);color:var(--gold2);background:rgba(211,172,87,.16)}
.slotbtn:active{transform:scale(.94)}
/* 见闻 · 分类网格 */
.lore-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.lore-cell{position:relative;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid var(--line);border-radius:3px;background:rgba(10,16,14,.55)}
.lore-cell b{font-family:var(--f-title);font-size:13px;font-weight:400;letter-spacing:2px;color:var(--tx2)}
.lore-cell span{font-size:10px;color:var(--tx3);font-variant-numeric:tabular-nums;letter-spacing:.5px}
.lore-cell.on{border-color:var(--gold);background:rgba(211,172,87,.13)}
.lore-cell.on b,.lore-cell.on span{color:var(--gold2)}
.lore-cell:active{transform:scale(.97)}
/* 行囊 · 分组标题 */
.bag-grp{display:flex;align-items:baseline;gap:8px;margin:11px 0 7px;font-family:var(--f-title);font-size:12px;letter-spacing:2px;color:var(--gold2)}
.bag-grp:first-child{margin-top:0}
.bag-grp small{font-family:var(--f-body);font-size:10px;letter-spacing:0;color:var(--tx3)}
.bag-grp::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
@media (min-width:900px){
  .stage,.stage.big,.stage.fighting{flex:1 1 auto;min-height:0}
  .stage-toggle{display:none}
  #view.map-hidden{visibility:visible}
}
/* 横屏手机：竖屏提示 */
.rotate-hint{display:none;position:fixed;inset:0;z-index:120;background:radial-gradient(120% 80% at 50% 20%,#16211e,#070b0a 70%);flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.rotate-hint .rh-phone{width:30px;height:50px;border:2px solid var(--gold);border-radius:5px;position:relative;margin-bottom:8px;opacity:.9}
.rotate-hint .rh-phone i{position:absolute;left:50%;bottom:4px;width:8px;height:1.5px;margin-left:-4px;background:var(--gold);opacity:.7}
.rotate-hint .rh-t{font-family:var(--f-title);font-size:20px;letter-spacing:6px;color:var(--gold2)}
.rotate-hint .rh-s{font-size:12px;letter-spacing:1px;color:var(--tx3)}
@media (orientation:landscape) and (max-height:520px){
  .rotate-hint{display:flex}
}

/* ============================================================
   批次二 · 舆图外围（地图主体见 05-map.css）
   ============================================================ */
.toast-wrap.at-map{top:calc(var(--safe-t) + 96px);bottom:auto}
.reward-pop.at-map{align-items:flex-start;padding-top:64vh}
@media (max-width:359px){.hud-sub .realm{display:none}.hud-res{gap:8px}.hud-res b{font-size:12px}}

/* 落点扫描：换地方时舞台扫一道光，避免生硬闪切 */
.stage.arrive::before{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;background:linear-gradient(100deg,transparent 20%,rgba(242,221,163,.16) 46%,rgba(242,221,163,.30) 50%,rgba(242,221,163,.16) 54%,transparent 80%);transform:translateX(-120%);animation:arriveSweep .62s cubic-bezier(.3,.7,.2,1) both}
@keyframes arriveSweep{to{transform:translateX(120%)}}
.stage .place-name{transition:color .2s}
.stage.arrive .place-name{animation:nameIn .55s cubic-bezier(.2,.8,.3,1) both}
@keyframes nameIn{from{opacity:0;transform:translateY(-8px);letter-spacing:10px;filter:blur(3px)}to{opacity:1;transform:none;filter:none}}

/* 窄屏：州签瘦身 */
@media (max-width:340px){
  .map-regions .rg b{font-size:12px;letter-spacing:1px}
  .map-regions .rg i{display:none}
  .map-node .nm{font-size:11px}
}

@media (max-height:620px) and (max-width:899px){
  .stage{flex-basis:104px;min-height:104px}
  .stage.big{flex-basis:168px;min-height:168px}
  .stage.fighting{flex-basis:156px;min-height:156px}
}

/* ============================================================
   批次三 · 触控与层级
   ============================================================ */
/* 操作条五键：320 宽也放得下，热区 46 */
.action-bar:not(.fighting) .act-btn{min-width:0;padding:0 2px}
.act-btn{position:relative}
.act-num{position:absolute;top:3px;right:2px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:rgba(20,29,26,.85);border:1px solid rgba(211,172,87,.34);color:rgba(211,172,87,.82);font-family:var(--f-body);font-size:10px;line-height:13px;text-align:center;font-style:normal;transition:background .2s,color .2s,border-color .2s}
/* 有未看过的药才点红；看过之后退回素色，不再是消不掉的角标 */
.act-num.hot{background:rgba(195,75,60,.92);border-color:rgba(227,119,97,.7);color:#f8e6dc;box-shadow:0 0 10px rgba(195,75,60,.55)}
/* 热区：视觉不动，伪元素补到 44 */
.btn{min-height:44px;overflow:visible}
.btn.sm{min-height:38px;font-size:11.5px}
.btn.sm::after{content:"";position:absolute;inset:-3px -2px}
.btn.tap44::after{content:"";position:absolute;inset:-5px -4px}
.map-regions button::after{display:none}
.seg button{position:relative;min-height:38px}
.seg button::after{content:"";position:absolute;inset:-3px 0}
.avatar{width:44px;height:44px;flex:0 0 44px}
/* 禁用态更明确 */
.btn[disabled],.skill[disabled]{opacity:.34;filter:grayscale(.55)}
/* 弹层关闭键 */
.modal-x{position:absolute;right:4px;top:4px;z-index:3;width:44px;height:44px;display:grid;place-items:center;color:var(--tx3);font-family:var(--f-body);font-size:22px;line-height:1}
.modal-x:active{color:var(--gold2)}
.seal.inline{position:static;margin:14px 2px 0 auto;animation:none}
/* 结果行不再按正文缩进 */
.modal .story.res{text-indent:0;font-size:13.5px;line-height:1.9;margin-bottom:7px;color:var(--paper)}
.modal-toast{margin:10px 0 0;padding:8px 10px;border:1px solid var(--line2);border-radius:3px;background:rgba(12,18,16,.92);color:var(--gold2);font-family:var(--f-read);font-size:12px;line-height:1.6;text-align:center;letter-spacing:.5px;animation:fadeIn .2s ease both}
.modal-toast.red{color:var(--red2);border-color:rgba(195,75,60,.5)}
.modal-toast.jade{color:var(--jade2);border-color:rgba(101,167,142,.5)}
/* 药囊 / 换招 */
.qs-row{margin-bottom:14px}
.qs-h{font-family:var(--f-title);font-size:12px;letter-spacing:2px;color:var(--tx3);margin-bottom:7px}
.qs-chips{display:flex;flex-wrap:wrap;gap:6px}
/* 换招弹层内的招式卡：说明折两行，避免单行截断 / 撑破弹层 */
.qs-chips .card{width:100%;max-width:100%;box-sizing:border-box}
.qs-chips .card .ds{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
.qs-chips .card .nm{white-space:normal}
.qs-chips .card .rt .btn{white-space:nowrap}
.chipbtn{position:relative;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:3px;font-family:var(--f-title);font-size:13px;letter-spacing:1px;color:var(--tx2);background:rgba(10,16,14,.6)}
.chipbtn::after{content:"";position:absolute;inset:-2px}
.chipbtn.on{border-color:var(--gold);color:var(--gold2);background:rgba(211,172,87,.14)}
.chipbtn:active{transform:scale(.96)}
/* 滚动不外溢 */
.view-scroll,.modal-b{overscroll-behavior:contain}
/* 战斗中底部页签让位，防误触 */
#tabs.fighting .tab{pointer-events:none;opacity:.4}
/* 字号下限 */
.tag{font-size:10px}
.bar-l{font-size:10px}
.card .ds{font-size:11px}
.log-line .t{font-size:10px}
.hud-sub{font-size:10.5px}
.seg button.dim{opacity:.45}
.act-btn{font-size:11px}
.chip{font-size:10px}
.bar-v{font-size:10px;min-width:56px}
.map-node .lv{font-size:10px}
.skill .sc{font-size:10px}
.skill.lack{border-color:rgba(195,75,60,.42)}
.skill.lack .sc{color:var(--red2)}



/* 宽屏收尾：地图卡在基础样式之后覆盖，避免被后面的 margin 规则顶掉 */
@media (min-width:900px){
  .map-card,.map-regions{width:calc(100% - 20px);max-width:620px;margin-left:auto;margin-right:auto}
}

/* --- 矢量武侠图标与增强展示样式 --- */
.svg-ico{width:100%;height:100%;display:block;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.act-btn .ai{display:flex;align-items:center;justify-content:center;width:22px;height:22px;color:var(--gold2);margin-bottom:1px}
.tab .ti{display:flex;align-items:center;justify-content:center;width:24px;height:24px;color:var(--tx3);transition:color .24s cubic-bezier(.2,.7,.2,1),transform .24s cubic-bezier(.2,.7,.2,1)}
.tab.on .ti{color:var(--gold2);transform:translateY(-1px)}
.card .ic{width:42px;height:42px;flex:0 0 42px;border-radius:5px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 25%,rgba(211,172,87,.18),rgba(0,0,0,.45));border:1px solid var(--line);color:var(--gold2);position:relative}
.card .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}
.skill-head{display:flex;align-items:center;gap:4px;justify-content:center;width:100%}
.skill-head svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6;flex:0 0 13px}
.card .ds{font-size:11px;color:var(--tx3);margin-top:3px;line-height:1.55}
.card .ds .tag{margin-right:3px}
.avatar{position:relative;overflow:hidden}
.avatar-crest{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* --- 四页图标：光学校正与克制的悬停微动（最后加载，统一覆盖） --- */
.plate-seal .svg-ico,
.sigil .sg .svg-ico,
.art-mk .svg-ico,
.lc-seal .svg-ico{transition:transform .25s cubic-bezier(.2,.7,.2,1)}

/* 小尺寸下等宽描边略收，避免糊成一团 */
.sigils.row .sigil .sg .svg-ico,
.signals .svg-ico{stroke-width:1.7}

@media(hover:hover){
  .plate:hover .plate-seal .svg-ico{transform:scale(1.05)}
  .sigil:not(.empty):hover .sg .svg-ico{transform:scale(1.06)}
  .art:hover .art-mk .svg-ico{transform:scale(1.07)}
  .tab:hover .ti{color:var(--gold2);opacity:.85}
}
@media(prefers-reduced-motion:reduce){
  .plate-seal .svg-ico,.sigil .sg .svg-ico,.art-mk .svg-ico,.tab .ti{transition:none}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
  <div class="veil"></div><div class="grain"></div><div class="vignette"></div>

  <header class="hud">
    <div class="hud-r1">
      <button class="avatar" id="btnChar">江</button>
      <div class="hud-id">
        <div class="hud-name" id="hudName">无名</div>
        <div class="hud-sub"><span class="realm" id="hudRealm">初入江湖</span><span id="hudLv">一阶</span></div>
      </div>
      <div class="hud-res">
        <span class="res"><i>银</i><b class="num" id="hudSilver">0</b></span>
        <span class="res"><i>力</i><b class="num" id="hudStamina">0</b></span>
        <span class="res"><b id="hudTime">辰时</b></span>
      </div>
    </div>
    <div class="hud-r2">

var G = {};   // noSave：抹档/导入后跳转期间禁止回写旧档
var $ = function(id){ return document.getElementById(id); };
var clamp = function(v,a,b){ return v<a?a:(v>b?b:v); };
var rnd = function(a,b){ return a + Math.random()*(b-a); };
var ri = function(a,b){ return Math.floor(a + Math.random()*(b-a+1)); };
var pick = function(a){ return a[Math.floor(Math.random()*a.length)]; };
var chance = function(p){ return Math.random() < p; };
var ts = function(){ return Date.now(); };
var deep = function(o){ return JSON.parse(JSON.stringify(o)); };
function fmt(n){
  n = Math.floor(Number(n)||0);
  if(n < 10000) return String(n);
  if(n < 1e8) return (n/10000).toFixed(n<1e5?2:1).replace(/\.0+$/,'') + '万';
  return (n/1e8).toFixed(2).replace(/\.0+$/,'') + '亿';
}
function hm(ms){
  var s = Math.max(0, Math.floor(ms/1000));
  var h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  if(h > 0) return h + ' 时' + (m > 0 ? ' ' + m + ' 分' : '');
  if(m > 0) return m + ' 分';
  return s + ' 息';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* 缺名兜底：用「印」代替剑，避免出现一把莫名其妙的剑 */
function svgIcon(name, extra){
  var s = SVGS[name] || SVGS.seal;
  var cls = 'svg-ico' + (extra ? ' ' + extra : '');
  return s.replace('<svg', '<svg class="' + cls + '"');
}

function itemSvg(it) {
  if (!it) return svgIcon('empty');
  var d = ITEM_MAP[it.id] || it;
  if (!d) return svgIcon('seal');
  var type = d.type || '';
  var id = d.id || '';
  if (type === 'weapon') {
    if (id.indexOf('dao') >= 0 || id.indexOf('zhan') >= 0) return svgIcon('blade');
    return svgIcon('sword');
  }
  if (type === 'armor') return svgIcon('armor');
  if (type === 'trinket') {
    if (id.indexOf('yu') >= 0 || id.indexOf('long') >= 0) return svgIcon('jade');
    return svgIcon('trinket');
  }
  if (type === 'herb') {
    if (id.indexOf('dan') >= 0) return svgIcon('pill');
    if (id.indexOf('wine') >= 0) return svgIcon('wine');
    return svgIcon('herb');
  }
  if (type === 'page') return svgIcon('scroll');
  if (id.indexOf('jade') >= 0) return svgIcon('jade');
  if (id.indexOf('map') >= 0) return svgIcon('map');
  if (id.indexOf('incense') >= 0) return svgIcon('lantern');
  return svgIcon('bag');
}

function artSvg(a) {
  if (!a) return svgIcon('sword');
  var t = a.type || '';
  var ch = a.ch || '';
  var id = a.id || '';
  if (t === 'nei') return svgIcon('idle');    // 内功：太极
  if (t === 'qing') return svgIcon('auto');   // 轻功：风流
  if (ch === '刀') return svgIcon('blade');
  if (ch === '剑') return svgIcon('sword');
  if (ch === '暗') return svgIcon('dart');
  if (ch === '掌' || ch === '拳' || ch === '锤') return svgIcon('fist');
  if (id.indexOf('dao') >= 0) return svgIcon('blade');
  if (id.indexOf('jian') >= 0) return svgIcon('sword');
  if (id.indexOf('tang') >= 0) return svgIcon('dart');
  if (id.indexOf('quan') >= 0 || id.indexOf('zhang') >= 0 || id.indexOf('chui') >= 0) return svgIcon('fist');
  return svgIcon('sword');
}

/* 底部页签的图标写在 body.html 里，与图标库不同源；
   此处统一替换一次，使描边粗细、圆角、笔意与全站一致。 */
(function unifyTabIcons(){
  var map = { map:'map', road:'road', hero:'hero', bag:'chest', lore:'lore' };
  var tabs = document.querySelectorAll ? document.querySelectorAll('.tab[data-tab]') : [];
  for (var i = 0; i < tabs.length; i++) {
    var k = tabs[i].getAttribute('data-tab');
    var box = tabs[i].querySelector('.ti');
    if (box && map[k] && SVGS[map[k]]) box.innerHTML = svgIcon(map[k]);
  }
})();

function getItemStatSummary(it) {
  var d = ITEM_MAP[it.id];
  if (!d) return '';
  var stats = [];
  if (d.type === 'weapon' || d.type === 'armor' || d.type === 'trinket') {
    var mul = 1 + (it.plus || 0) * 0.16 + (it.q || 0) * 0.10;
    if (d.atk) stats.push('攻 +' + Math.round(d.atk * mul));
    if (d.def) stats.push('防 +' + Math.round(d.def * mul));
    if (d.hp) stats.push('气血 +' + Math.round(d.hp * mul));
    if (d.agi) stats.push('身法 +' + Math.round(d.agi * mul));
    if (d.arm) stats.push('臂力 +' + Math.round(d.arm * mul));
    if (d.con) stats.push('根骨 +' + Math.round(d.con * mul));
    if (d.wit) stats.push('悟性 +' + Math.round(d.wit * mul));
    if (d.luck) stats.push('福缘 +' + Math.round(d.luck * mul));
    if (d.crit) stats.push('会心 +' + (d.crit * mul * 100).toFixed(1) + '%');
    (it.affix || []).forEach(function(af) { stats.push(af.n); });
  } else if (d.use) {
    if (d.use.hp && d.use.mp) {
      if (d.use.hp === 1 && d.use.mp === 1) stats.push('回补全部气血与内息');
      else stats.push('回气血 ' + Math.round(d.use.hp * 100) + '% · 内息 ' + Math.round(d.use.mp * 100) + '%');
    } else if (d.use.hp) {
      stats.push('回复气血 ' + Math.round(d.use.hp * 100) + '%');
    } else if (d.use.mp) {
      stats.push('调理内息 ' + Math.round(d.use.mp * 100) + '%');
    }
  } else if (d.type === 'page') {
    stats.push('研读可精进上乘武学功法');
  }
  return stats.join(' · ');
}

function getArtStatSummary(a, lv) {
  if (!a) return '';
  lv = lv || 1;
  var stats = [];
  if (a.type === 'wai') {
    stats.push('威力 ' + (a.pow * (1 + (lv - 1) * 0.16)).toFixed(2) + 'x');
    stats.push('耗息 ' + Math.floor(a.cost * (1 + (lv - 1) * 0.08)));
    stats.push('收招 ' + a.cd + 's');
  }
  Object.keys(a.attr || {}).forEach(function(k) {
    var label = ATTRS[k] || ({ hp: '气血', mp: '内息', atk: '攻', def: '防', crit: '会心' }[k] || k);
    var val = a.attr[k];
    var scaled = Math.round(val * (1 + (lv - 1) * 0.22));
    stats.push(label + ' +' + (k === 'crit' ? (scaled * 100).toFixed(0) + '%' : scaled));
  });
  return stats.join(' · ');
}

/* ============================================================

(function(){
  'use strict';

  var PREVIEW_KEY = 'ynjh_copy_patch';
  var MISS = [];
  var seenMiss = {};
  var storedPatch = {};
  var WIN = (typeof window !== 'undefined') ? window : null;

  function warn(msg){
    try { if (typeof console !== 'undefined' && console.warn) console.warn('[文案] ' + msg); } catch(e){}
  }
  function miss(path, why){
    var key = String(path) + '@' + String(why);
    if (seenMiss[key]) return false;
    seenMiss[key] = 1;
    MISS.push(String(path) + ' —— ' + String(why));
    warn('未生效：' + path + ' —— ' + why);
    return false;
  }
  function isStr(v){ return typeof v === 'string'; }

  function isObj(v){ return !!v && typeof v === 'object' && !isArr(v); }
  function has(o, k){ return !!o && Object.prototype.hasOwnProperty.call(o, k); }
  function keys(o){ return Object.keys(o || {}); }
  function rawKeys(o){ return Object.keys(o || {}); }
  function data(){ return (WIN && WIN.G && WIN.G.D) ? WIN.G.D : null; }
  function findBy(list, field, value){
    var i;
    if (!isArr(list)) return null;

    return null;
  }

    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ---------- 基础写入：只认文字，写不进去就记一笔 ---------- */
  function putStr(obj, field, v, path){
    if (!obj || typeof obj !== 'object') return miss(path, '数据里找不到这一条');
    if (!has(obj, field)) return miss(path, '键名不对（原文里没有 ' + field + ' 这一项）');
    if (!isStr(v)) return miss(path, '值必须是用引号括起来的文字');
    obj[field] = v;
    return true;
  }
  function putIdx(arr, n1, v, path){
    if (!isArr(arr)) return miss(path, '这里应该是数组');
    var i = parseInt(n1, 10) - 1;
    if (!(i >= 0 && i < arr.length)) return miss(path, '序号超出范围（这一类共 ' + arr.length + ' 条）');
    if (!isStr(v)) return miss(path, '值必须是用引号括起来的文字');
    arr[i] = v;
    return true;
  }
  function putStrArr(arr, list, path, exact){
    var i;
    if (!isArr(list)) return miss(path, '应为数组 [...]');
    if (!isArr(arr)) return miss(path, '数据里找不到这一组');
    if (exact && list.length !== arr.length) return miss(path, '条数应为 ' + arr.length + ' 条（现在 ' + list.length + ' 条）');
    if (!list.length) return miss(path, '不能清空，至少要留 1 条');
    for (i = 0; i < list.length; i++) if (!isStr(list[i])) return miss(path + ' 第 ' + (i + 1) + ' 条', '必须是引号里的文字');
    arr.length = 0;
    for (i = 0; i < list.length; i++) arr[i] = list[i];
    return true;
  }
  function textSlots(list){
    var out = [], i;
    if (!isArr(list)) return out;
    for (i = 0; i < list.length; i++) if (list[i] && list[i].k === 'text' && isStr(list[i].s)) out.push(i);
    return out;
  }
  function putTextEffects(list, copyArr, path){
    var i, slots;
    if (!isArr(copyArr)) return miss(path, '应为数组 [...]');
    slots = textSlots(list);
    if (copyArr.length !== slots.length) return miss(path, '结果文案应为 ' + slots.length + ' 条（现在 ' + copyArr.length + ' 条）');
    for (i = 0; i < copyArr.length; i++) if (!isStr(copyArr[i])) return miss(path + ' 第 ' + (i + 1) + ' 条', '必须是引号里的文字');
    for (i = 0; i < copyArr.length; i++) list[slots[i]].s = copyArr[i];
    return true;
  }

  /* ---------- 一、术语表 ---------- */
  function applyTerms(){
    var C = COPY.terms, d = data(), i, k, ks, o, oc, aff, base;
    if (!isObj(C)) return miss('terms', '缺少 terms 这一段');
    var ARR = [['qn', 'QN'], ['realms', 'REALMS'], ['hours', 'HOURS'], ['weather', 'WEATHER']];
    for (i = 0; i < ARR.length; i++) {

      putStrArr(d[ARR[i][1]], C[ARR[i][0]], 'terms.' + ARR[i][0], true);
    }

    for (i = 0; i < MAPS.length; i++) {
      if (!isObj(C[MAPS[i][0]])) { miss('terms.' + MAPS[i][0], '缺少这一项'); continue; }
      ks = keys(C[MAPS[i][0]]);
      for (k = 0; k < ks.length; k++) putStr(MAPS[i][1], ks[k], C[MAPS[i][0]][ks[k]], 'terms.' + MAPS[i][0] + '.' + ks[k]);

        aff = findBy(d.AFFIX, 'k', ks[k]);
        if (!aff) { miss(base, '没有这个词缀'); continue; }
        putStr(aff, 'n', C.affix[ks[k]], base);

    } else miss('terms.affix', '缺少这一项');
    if (isObj(C.origins)) {
      ks = keys(C.origins);

        putStr(o, 'n', oc.n, base + '.n');
        if (isStr(oc.ch) && oc.ch.length === 1) o.ch = oc.ch;
        else miss(base + '.ch', '出身印章只能改成一个字');
        putStr(o, 'd', oc.d, base + '.d');
      }
    } else miss('terms.origins', '缺少这一项');
  }

  /* ---------- 二、六州 ---------- */
  function applyRegions(){
    var C = COPY.regions, d = data(), k, ks, base, r;
    if (!isObj(C)) return miss('regions', '缺少 regions 这一段');
    ks = keys(C);
    for (k = 0; k < ks.length; k++) {
      base = 'regions.' + ks[k];
      r = d.REGION_MAP[ks[k]];
      if (!r) { miss(base, '没有这个州'); continue; }
      if (!isObj(C[ks[k]])) { miss(base, '缺少这一项'); continue; }
      putStr(r, 'n', C[ks[k]].n, base + '.n');
      putStr(r, 'sub', C[ks[k]].sub, base + '.sub');
    }
  }

  /* ---------- 三、地名 ---------- */
  function applyNodes(){
    var C = COPY.nodes, d = data(), k, ks, base, n, c;
    if (!isObj(C)) return miss('nodes', '缺少 nodes 这一段');
    ks = keys(C);
    for (k = 0; k < ks.length; k++) {
      base = 'nodes.' + ks[k];
      n = d.NODE_MAP[ks[k]];
      if (!n) { miss(base, '没有这个地名'); continue; }
      c = C[ks[k]];
      if (!isObj(c)) { miss(base, '缺少这一项'); continue; }
      if (isStr(c.n) && c.n.length > 6) warn(base + '.n：地名超过 6 个字，地图上可能和旁边的字叠住');
      putStr(n, 'n', c.n, base + '.n');
      putStr(n, 'd', c.d, base + '.d');

  }

  /* ---------- 四、武功 / 五、器物 / 六、敌手 ---------- */
  function applySimpleTable(copyName, table, pathName, fieldList){
    var C = COPY[copyName], d = data(), k, ks, base, rec, c, f;
    if (!isObj(C)) return miss(pathName, '缺少 ' + copyName + ' 这一段');
    ks = keys(C);
    for (k = 0; k < ks.length; k++) {
      base = pathName + '.' + ks[k];
      rec = table[ks[k]];
      if (!rec) { miss(base, '没有这一条'); continue; }
      c = C[ks[k]];
      if (!isObj(c)) { miss(base, '缺少这一项'); continue; }
      for (f = 0; f < fieldList.length; f++) putStr(rec, fieldList[f], c[fieldList[f]], base + '.' + fieldList[f]);

  }

  /* ---------- 七、人物 ---------- */
  function applyNpcs(){

      putStr(np, 't', c.t, base + '.t');

  /* ---------- 八、事件 ---------- */
  function applyEvents(){
    var C = COPY.events, d = data(), k, ks, base, ev, c, i;

      if (c.t !== undefined) putStr(ev, 't', c.t, base + '.t');

  /* ---------- 启动：把 COPY 写进游戏 ---------- */
  function run(name, fn){

  }

    run('武功', function(){ applySimpleTable('arts', d.ART_MAP, 'arts', ['n', 'd']); });
    run('器物', function(){ applySimpleTable('items', d.ITEM_MAP, 'items', ['n', 'd']); });
    run('敌手', function(){ applySimpleTable('enemies', d.ENEMY_MAP, 'enemies', ['n', 'd']); });

  /* ---------- 运行时单条注入：给 __copyPatch / localStorage 用 ---------- */
  function applyEntry(path, v){
    var seg = String(path == null ? '' : path).split('.');
    var d = data();
    if (!d) return miss(path, '数据表还没准备好');
    if (!isStr(v)) return miss(path, '值必须是用引号括起来的文字');
    if (seg.length < 2) return miss(path, '格式不对（例：nodes.yz_cheng.n）');
    if (seg[0] === 'node') seg[0] = 'nodes';
    if (seg[0] === 'region') seg[0] = 'regions';
    if (seg[0] === 'art') seg[0] = 'arts';
    if (seg[0] === 'item') seg[0] = 'items';
    if (seg[0] === 'enemy') seg[0] = 'enemies';
    if (seg[0] === 'npc') seg[0] = 'npcs';
    if (seg[0] === 'event') seg[0] = 'events';
    if (seg[0] === 'goal') seg[0] = 'goals';
    try {
      switch (seg[0]) {
        case 'terms': return entryTerms(seg, v, path);
        case 'origins': return entryOrigin(seg, v, path);
        case 'regions': return entryRegion(seg, v, path);
        case 'nodes': return entryNode(seg, v, path);
        case 'arts': return entrySimple(d.ART_MAP, seg, v, path, ['n', 'd'], 'art');
        case 'items': return entrySimple(d.ITEM_MAP, seg, v, path, ['n', 'd'], 'item');
        case 'enemies': return entrySimple(d.ENEMY_MAP, seg, v, path, ['n', 'd'], 'enemy');
        case 'npcs': return entryNpc(seg, v, path);
        case 'events': return entryEvent(seg, v, path);
        case 'lore': return entryLore(seg, v, path);
        case 'goals': return entryGoal(seg, v, path);
        case 'ui': return entryUi(seg, v, path);
        default: return miss(path, '不认识的开头（可用 terms/origins/regions/nodes/arts/items/enemies/npcs/events/lore/goals/ui）');
      }
    } catch(e) { return miss(path, '写入出错：' + (e && e.message)); }
  }
  function entryTerms(seg, v, path){
    var d = data(), o, oc, aff, i, k, field;
    if (seg[1] === 'origins') return entryOrigin(['origins', seg[2], seg[3]], v, path);
    var ARR = { qn: d.QN, realms: d.REALMS, hours: d.HOURS, weather: d.WEATHER };
    if (has(ARR, seg[1])) {
      if (seg.length !== 3) return miss(path, '格式应为 terms.' + seg[1] + '.序号');
      return putIdx(ARR[seg[1]], seg[2], v, path);
    }
    if (seg[1] === 'attrs') return putStr(d.ATTRS, seg[2], v, path);
    if (seg[1] === 'equipSlot') return putStr(d.EQUIP_SLOT, seg[2], v, path);
    if (seg[1] === 'affix') {
      aff = findBy(d.AFFIX, 'k', seg[2]);
      if (!aff) return miss(path, '没有这个词缀');
      return putStr(aff, 'n', v, path);
    }
    return miss(path, 'terms 下只能改 qn/realms/hours/weather/attrs/equipSlot/affix/origins');
  }
  function entryOrigin(seg, v, path){
    var d = data(), o = findBy(d.ORIGINS, 'id', seg[1]), f;
    if (!o) return miss(path, '没有这个出身');
    f = seg[2];
    if (f !== 'n' && f !== 'ch' && f !== 'd') return miss(path, '出身只能改 n / ch / d');
    if (f === 'ch' && isStr(v) && v.length !== 1) return miss(path, '出身印章只能是一个字');
    return putStr(o, f, v, path);
  }
  function entryRegion(seg, v, path){
    var d = data(), r = d.REGION_MAP[seg[1]], f = seg[2];
    if (!r) return miss(path, '没有这个州');
    if (f !== 'n' && f !== 'sub') return miss(path, '州名只能改 n / sub');
    return putStr(r, f, v, path);
  }
  function entryNode(seg, v, path){
    var d = data(), n = d.NODE_MAP[seg[1]], f = seg[2];
    if (!n) return miss(path, '没有这个地名：' + seg[1]);
    if (f !== 'n' && f !== 'd') return miss(path, '地名只能改 n / d');
    if (f === 'n' && isStr(v) && v.length > 6) warn(path + '：地名超过 6 个字，地图上可能叠字');
    return putStr(n, f, v, path);
  }
  function entrySimple(table, seg, v, path, fields, label){
    var rec = table[seg[1]], f = seg[2], i;
    if (!rec) return miss(path, '没有这' + label + '：' + seg[1]);
    for (i = 0; i < fields.length; i++) if (fields[i] === f) return putStr(rec, f, v, path);
    return miss(path, '只能改 ' + fields.join(' / '));
  }
  function entryNpc(seg, v, path){
    var d = data(), np = d.NPC_MAP[seg[1]], f = seg[2];
    if (!np) return miss(path, '没有这个人物：' + seg[1]);
    if (f === 'chat') return putIdx(np.chat, seg[3], v, path);
    if (f !== 'n' && f !== 't' && f !== 'intro' && f !== 'info') return miss(path, '人物只能改 n / t / intro / info / chat.序号');
    return putStr(np, f, v, path);
  }
  function entryEvent(seg, v, path){
    var d = data(), ev = findBy(d.EVENTS, 'id', seg[1]), opt, oi, bucket, slots, mi;
    if (!ev) return miss(path, '没有这个事件：' + seg[1]);
    if (seg.length === 3) {
      if (seg[2] !== 't' && seg[2] !== 'text') return miss(path, '事件只能改 t / text / opts.序号.字段');
      return putStr(ev, seg[2], v, path);
    }
    if (seg[2] !== 'opts') return miss(path, '事件里只能改 t / text / opts.序号.字段');
    oi = parseInt(seg[3], 10);
    if (!(oi >= 1 && oi <= (ev.opts || []).length)) return miss(path, '这个事件只有 ' + (ev.opts || []).length + ' 个选项');
    opt = ev.opts[oi - 1];
    if (seg.length === 5) {
      if (seg[4] !== 't' && seg[4] !== 'd') return miss(path, '选项只能改 t / d / fx.条数 / ok.条数 / fail.条数');
      return putStr(opt, seg[4], v, path);
    }
    if (seg.length === 6) {
      bucket = seg[4];
      if (bucket !== 'fx' && bucket !== 'ok' && bucket !== 'fail') return miss(path, '结果文案分 fx / ok / fail 三类');
      slots = textSlots(opt[bucket]);
      mi = parseInt(seg[5], 10);
      if (!(mi >= 1 && mi <= slots.length)) return miss(path, '这一类只有 ' + slots.length + ' 条结果文案');
      opt[bucket][slots[mi - 1]].s = v;
      return true;
    }
    return miss(path, '格式不对');
  }
  function entryLore(seg, v, path){
    var d = data(), pool, line;
    if (seg[1] === 'inscriptions') {
      if (!has(d.INSCRIPTIONS, seg[2])) return miss(path, '没有这块碑：' + seg[2]);
      d.INSCRIPTIONS[seg[2]] = v;
      return true;
    }
    if (seg[1] === 'npcExtra') {
      if (!has(d.NPC_EXTRA, seg[2])) return miss(path, '没有这个人物的闲话：' + seg[2]);
      d.NPC_EXTRA[seg[2]] = v;
      return true;
    }
    if (seg[1] === 'txt') {
      pool = seg[2];
      if (!isArr(d.TXT[pool])) return miss(path, '没有这类日志语料：' + pool);
      return putIdx(d.TXT[pool], seg[3], v, path);
    }
    return miss(path, '见闻下只能改 inscriptions / npcExtra / txt');
  }
  function entryGoal(seg, v, path){
    var d = data(), g = findBy(d.GOALS, 'id', seg[1]), f = seg[2], i, OK = ['n', 'd', 'log', 'reward'];
    if (!g) return miss(path, '没有这条江湖志：' + seg[1]);
    for (i = 0; i < OK.length; i++) if (OK[i] === f) return putStr(g, f, v, path);
    return miss(path, '江湖志只能改 n / d / log / reward');
  }
  function entryUi(seg, v, path){
    try {
      setDeep(COPY.ui, seg.slice(1), v);
      applyUi();
      return true;
    } catch(e) { return miss(path, '界面上没有这个位置'); }
  }
  function setDeep(obj, parts, v){
    var cur = obj, i, last, idx;
    for (i = 0; i < parts.length - 1; i++) {
      if (!cur || typeof cur !== 'object' || !has(cur, parts[i])) throw new Error('no ' + parts[i]);
      cur = cur[parts[i]];
    }
    last = parts[parts.length - 1];
    if (isArr(cur)) {
      idx = parseInt(last, 10) - 1;
      if (!(idx >= 0 && idx < cur.length)) throw new Error('index');
      cur[idx] = v;
      return;
    }
    if (!has(cur, last)) throw new Error('no ' + last);
    cur[last] = v;
  }

  /* ---------- 预览补丁：localStorage / __copyPatch ---------- */
  function refresh(){
    var fns = ['renderHud', 'renderStage', 'renderMap', 'renderView'], i, fn;
    if (!WIN) return;
    for (i = 0; i < fns.length; i++) {
      fn = WIN[fns[i]];
      if (typeof fn === 'function') { try { fn(); } catch(e){} }
    }
    try { if (WIN.UI && typeof mark === 'function') mark(); } catch(e){}
  }
  function applyPatch(obj){
    var ok = 0, bad = 0, ks, i, k;
    if (!isObj(obj)) { warn('补丁必须是一个对象，例如 {"nodes.yz_cheng.n":"扬州"}'); return { ok: 0, bad: 1 }; }
    ks = rawKeys(obj);
    for (i = 0; i < ks.length; i++) {
      k = ks[i];
      try { if (applyEntry(k, obj[k])) ok++; else bad++; }
      catch(e) { bad++; warn('补丁 ' + k + ' 应用失败：' + (e && e.message)); }
    }
    return { ok: ok, bad: bad };
  }
  function savePatch(obj){
    var ks = rawKeys(obj), i;
    for (i = 0; i < ks.length; i++) storedPatch[ks[i]] = obj[ks[i]];
    try {
      if (WIN && WIN.localStorage) {
        WIN.localStorage.setItem(PREVIEW_KEY, JSON.stringify(storedPatch));
        if (WIN.console && console.log) console.log('[文案] 预览补丁已写入 localStorage（刷新后仍生效），清除请执行 __copyReset()');
      }
    } catch(e) { warn('预览补丁写入 localStorage 失败：' + (e && e.message)); }
  }
  function copyPatch(obj){
    var res = applyPatch(obj);
    if (res.ok) { refresh(); savePatch(obj); }
    if (WIN && WIN.console && console.log) {
      console.log('[文案] 预览补丁：生效 ' + res.ok + ' 条，失败 ' + res.bad + ' 条' + (res.bad ? '（原因见上方告警）' : ''));
    }
    return res;
  }
  /* 内置补丁（build 时由 copy/patch.json 注入）：只应用、不写 localStorage */
  function copyApply(obj){
    var res = applyPatch(obj);
    if (res.ok) refresh();
    return res;
  }
  function copyReset(){
    storedPatch = {};
    try { if (WIN && WIN.localStorage) WIN.localStorage.removeItem(PREVIEW_KEY); } catch(e){}
    try { applyCopy(); } catch(e) {}
    refresh();
    if (WIN && WIN.console && console.log) console.log('[文案] 已清除本地预览补丁，文字已回到 32-text.js 的版本');
    return true;
  }
  function loadStoredPatch(){
    var raw = null, obj = null, res;
    try { if (WIN && WIN.localStorage) raw = WIN.localStorage.getItem(PREVIEW_KEY); } catch(e) { raw = null; }
    if (!raw) return;
    try { obj = JSON.parse(raw); } catch(e) { warn('本地预览补丁不是合法 JSON，已忽略'); return; }
    if (!isObj(obj)) return;
    storedPatch = obj;
    res = applyPatch(obj);
    if (res.bad) warn('本地预览补丁有 ' + res.bad + ' 条没生效（原因见上），可用 __copyReset() 清掉');
  }

  /* ---------- 对外 ---------- */
  if (WIN) {
    WIN.G = WIN.G || {};
    WIN.G.__copyMiss = MISS;
    WIN.G.applyCopy = applyCopy;
    WIN.__copyApply = copyApply;
    WIN.__copyPatch = copyPatch;
    WIN.__copyReset = copyReset;
  }
  try {
    applyCopy();
    loadStoredPatch();
  } catch(e) {
    warn('文案注入整体失败（游戏照常运行）：' + (e && e.message));
  }
})();

function weatherOf(st, now){
  var r = REGION_MAP[st.p.region] || REGIONS[0];
  var d = new Date(now);
  var seed = d.getFullYear()*7 + d.getMonth()*31 + d.getDate()*13 + Math.floor(d.getHours()/3);
  return r.wx[Math.abs(seed) % r.wx.length];
}

/* 天时：时辰与天气一起改动驻留、掉落与遭遇的分寸 */
function timeMod(st, now){
  var h = new Date(now).getHours(), wx = st.weather || '晴';
  var m = { exp:1, silver:1, herb:1, page:1, loot:1, enc:1, event:1, label:'' };
  var hl = '';
  if(h >= 23 || h < 5){ m.exp*=1.18; m.enc*=1.22; m.event*=1.10; hl='夜深'; }
  else if(h < 9){ m.herb*=1.35; m.page*=1.15; hl='晨露未干'; }
  else if(h < 15){ m.silver*=1.22; m.loot*=1.10; hl='日头正盛'; }
  else if(h < 19){ m.event*=1.20; m.enc*=1.10; hl='日影偏西'; }
  else { m.exp*=1.08; m.event*=1.12; hl='掌灯时分'; }
  if(wx==='微雨'||wx==='骤雨'){ m.herb*=1.30; m.silver*=0.92; hl+=' · 雨气润了草木'; }
  else if(wx==='薄雾'){ m.event*=1.22; m.enc*=0.90; hl+=' · 雾里看不真切'; }
  else if(wx==='风沙'){ m.silver*=0.90; m.enc*=1.25; hl+=' · 风沙迷眼'; }
  else if(wx==='落雪'){ m.exp*=1.12; m.herb*=0.85; hl+=' · 雪压枝头'; }
  else if(wx==='月色'){ m.event*=1.25; m.page*=1.12; hl+=' · 月色照得见字'; }
  else if(wx==='霜晨'){ m.herb*=1.18; m.enc*=1.08; hl+=' · 霜重路滑'; }
  else if(wx==='晴'){ m.silver*=1.08; hl+=' · 天色晴好'; }
  else hl+=' · '+wx;
  m.hour = hourName(now); m.wx = wx; m.label = hl;
  return m;
}
function newState(origin, name){

  var st = {
    v:3, created:ts(), lastSeen:ts(),

      bag:[], uid:1,
      seen:{ nodes:{ yz_cheng:1 }, events:{}, enemies:{}, npcs:{}, arts:{ changquan:1, tuna:1, qinggong:1 }, items:{} },
      lore:[], flags:{}, kills:0, wins:0, explores:0, bossKills:{}, npcGift:{}, npcTalk:{}, goals:{}
    },

  };
  // 开局随身物
  addItem(st,'w_tie',1,0); addEquip(st,'a_bu',0); addItem(st,'herb',3,0);
  var max = stats(st.p);
