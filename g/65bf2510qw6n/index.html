  /* ---------- 布局：一切按 stage 的比例算 ---------- */
  function compact(){ return stage.h <= 164; }
  // 大画幅时操作条会压住戏台底部，地平线整体上抬这么多，脚底才不贴边
  function floorIn(){ return GEO.floorIn || 0; }
  function bankTop(x){
    var w = stage.w, h = stage.h;
    // 桌面驻留：岸在左下、水在右上。岸线自左缘斜落到近前，人物才站得住
    if(GEO.xflip){
      var ft = clamp(x/(w*0.640), 0, 1.20);
      var fy = h*0.640 + ft*ft*h*0.270 - floorIn();
      return fy + Math.sin(x*0.055)*1.2;
    }
    var u = clamp((x - w*0.60)/(w*0.40), 0, 1.25);
    var e = Math.min(1, u*2.15);                    // 左侧渐入水里
    var y = h*0.905 - u*u*h*0.055 - floorIn();
    return (h+PAD) + (y-(h+PAD))*e + Math.sin(x*0.062)*1.3*e;
  }
  function layout(now){
    var w = stage.w, h = stage.h, cp = compact();
    if(w < 4 || h < 4) return;
    GEO.w = w; GEO.h = h;
    // 桌面驻留换成「左岸、右上月」的构图：景别按可见宽高分配，右侧才不被岸坡吃空
    GEO.xflip = (!cp && h > 300 && !inCombat);
    GEO.hz = Math.round(h*(cp ? 0.660 : 0.632));
    // 月盘按短边定尺寸再封顶：若只按高度算，880x627 的戏台会得到直径 83px 的「蛋」
    GEO.cr = clamp(Math.min(w, h)*(cp ? 0.094 : 0.076), 6, cp ? 13 : 30);
    // 大画幅底部被操作条压住一截，地平线上抬，人物脚底才落得住
    GEO.floorIn = (!cp && h > 320) ? Math.min(h*0.055, 44) : 0;
    GEO.bankX = w*0.60;
    GEO.heroH = clamp(h*(cp ? 0.34 : 0.37), 24, cp ? 176 : 216);
    GEO.heroX = w*(cp ? 0.800 : (GEO.xflip ? 0.420 : 0.775));
    GEO.gy = inCombat ? h*0.935 - GEO.floorIn : bankTop(GEO.heroX)+1;
    GEO.heroY = GEO.gy;
    var u = celestialU(now || ts());
    if(GEO.xflip){
      // 桌面驻留：月挂在右上（78%~85% 宽、13%~17% 高），倒影落进右侧江面
      GEO.cx = w*(0.780 + 0.070*u);
      GEO.cy = h*(0.135 + 0.030*Math.sin(u*3.1416));
    } else {
      // 宽画幅时岸坡占去右侧四成，月要挪到坡左，倒影才落得进水里
      GEO.cx = w*(cp ? (0.600 + 0.095*u) : (0.455 + 0.075*u));
      GEO.cy = h*(cp ? 0.225 : 0.185) + h*0.028*Math.sin(u*3.1416);
    }
    // 窄屏战斗态：交手掌板正好压住天顶，月会在两牌夹缝里露一条亮边，落到山头之间才成立
    if(inCombat && h < 300){
      GEO.cx = w*0.500; GEO.cy = h*0.360;          // 落在两牌下的空处，不再被掌板按在天顶
      GEO.cr = Math.min(GEO.cr, h*0.058);          // 小画幅月盘收小，才不会顶到掌板、也不会被山头切成缺口
    }
  }

  /* ---------- 山势 ---------- */
  function makeRidge(seed, baseY, amp, n, sharp){
    var R = seedRnd(seed), peaks = [], pts = [], i, x;
    var span = GEO.w + PAD*2;
    for(i=0;i<n;i++){
      peaks.push({
        x: -PAD + span*(i + 0.18 + R()*0.64)/n,
        h: amp*(0.40 + R()*0.60),
        w: span*(0.070 + R()*0.090),
        s: sharp*(0.84 + R()*0.34),   // 每座山软硬不同，避免一排馒头
        q: R()*6.28,
        k: 0.86 + R()*0.28            // 左右坡不对称
      });
    }
    for(x=-PAD; x<=GEO.w+PAD+2; x+=3){
      var y = 0;
      for(i=0;i<peaks.length;i++){
        var p = peaks[i];
        var d = (x-p.x)/p.w;
        var ad = d < 0 ? -d*p.k : d;
        if(ad < 1){
          // 圆肩的山体 + 一个更小的峰顶：远看是山，不是一排三角
          var f1 = Math.pow(Math.max(0,1 - ad*ad), 1.25);
          var f2 = Math.pow(Math.max(0,1 - ad*ad*2.9), 2.0);
          var v = p.h*(0.74*f1 + 0.40*f2)*(1 + 0.05*Math.sin(ad*5.2 + p.q));
          if(v > y) y = v;
        }
      }
      y += Math.sin(x*0.115+seed)*1.15 + Math.sin(x*0.37+seed*2.1)*0.50 + Math.sin(x*0.81+seed)*0.26;
      pts.push({ x:x, y:baseY-y });
    }
    // 只轻磨一遍，保住峰的棱
    for(i=1;i<pts.length-1;i++) pts[i].y = pts[i].y*0.84 + (pts[i-1].y+pts[i+1].y)*0.08;
    return pts;
  }
  // 近处的山嘴：只占左岸一段，中间水面留白，构图才不闷
  function makeHeadland(seed, baseY, amp, x0, x1){
    var R = seedRnd(seed), pts = [], peaks = [], i, x;
    var n = 4, span = x1-x0;
    for(i=0;i<n;i++){
      peaks.push({
        x: x0 + span*(i + 0.12 + R()*0.72)/n,
        h: amp*(0.40 + R()*0.60),
        w: span*(0.13 + R()*0.16)
      });
    }
    for(x=-PAD; x<=GEO.w+PAD+2; x+=3){
      var y = 0, env = 1;
      if(x < x0) env = clamp((x+PAD)/(x0+PAD+0.001),0,1);
      if(x > x1) env = clamp((x1+PAD*0.5-x)/(PAD*0.5+0.001),0,1);
      for(i=0;i<peaks.length;i++){
        var p = peaks[i], d = Math.abs((x-p.x)/p.w);
        if(d < 1) y = Math.max(y, p.h*Math.pow(1-d,1.06));
      }
      y = y*env*env + (Math.sin(x*0.21+seed)*0.5 + Math.sin(x*0.63+seed)*0.3)*env;
      pts.push({ x:x, y:baseY-y });
    }
    for(i=1;i<pts.length-1;i++) pts[i].y = pts[i].y*0.86 + (pts[i-1].y+pts[i+1].y)*0.07;
    return pts;
  }
  function ridgeYAt(pts,x){
    for(var i=0;i<pts.length;i++){ if(pts[i].x >= x) return pts[i].y; }
    return pts[pts.length-1].y;
  }
  function paintRidge(c, pts, baseY, P, aTop, aBody, edgeA, fuzz){
    var i, minY = baseY;
    for(i=0;i<pts.length;i++){ if(pts[i].y < minY) minY = pts[i].y; }
    var g = c.createLinearGradient(0, minY-2, 0, baseY+3);
    g.addColorStop(0,    rgba(P.ink, aTop));
    g.addColorStop(0.26, rgba(P.ink, aBody));
    g.addColorStop(0.78, rgba(P.ink, aBody*0.40));
    g.addColorStop(1,    rgba(P.ink, 0));
    c.beginPath();
    c.moveTo(pts[0].x, baseY+3);
    for(i=0;i<pts.length;i++) c.lineTo(pts[i].x, pts[i].y);
    c.lineTo(pts[pts.length-1].x, baseY+3);
    c.closePath();
    c.fillStyle = g; c.fill();
    if(edgeA > 0){
      c.beginPath();
      for(i=0;i<pts.length;i++){
        if(i === 0) c.moveTo(pts[i].x, pts[i].y); else c.lineTo(pts[i].x, pts[i].y);
      }
      c.strokeStyle = rgba(P.ink, edgeA);
      c.lineWidth = 1.25;
      c.stroke();
    }
    // 脊上一排小竖笔，远看是林梢
    if(fuzz){
      var R = seedRnd(fuzz), ky, j;
      c.beginPath();
      for(i=0;i<pts.length;i+=j){
        j = 1 + (R() < 0.55 ? 1 : 0);
        if(R() > 0.30) continue;
        ky = 0.8 + R()*2.2;
        c.moveTo(pts[i].x, pts[i].y+0.7);
        c.lineTo(pts[i].x + (R()-0.5)*0.9, pts[i].y - ky);
      }
      c.strokeStyle = rgba(P.ink, 0.38);
      c.lineWidth = 0.9;
      c.stroke();
    }
  }
  function stamp(c, img, x, y, rx, ry, a){
    if(a <= 0 || rx <= 0 || ry <= 0) return;
    c.globalAlpha = a;
    c.drawImage(img, x-rx, y-ry, rx*2, ry*2);
    c.globalAlpha = 1;
  }

  /* ---------- 静态层：天 ---------- */
  function paintSky(c,P){
    var w = GEO.w, h = GEO.h, hz = GEO.hz;
    var g = c.createLinearGradient(0,-PAD,0,hz);
    g.addColorStop(0,    rgba(P.top,1));
    g.addColorStop(0.34, rgba(P.hi,1));
    g.addColorStop(0.62, rgba(P.mid,1));
    g.addColorStop(0.86, rgba(mix(P.low, P.mid, 0.30),1));
    g.addColorStop(1,    rgba(mix(P.hor, P.mid, 0.42),1));
    c.fillStyle = g;
    c.fillRect(-PAD,-PAD,w+PAD*2,hz+PAD+2);

    // 地平线一层暖光，把远山托起来
    var hg = c.createLinearGradient(0,hz-h*0.42,0,hz+1);
    hg.addColorStop(0,   rgba(P.glow,0));
    hg.addColorStop(0.42,rgba(P.glow,0.04));
    hg.addColorStop(0.78,rgba(P.glow,0.10));
    hg.addColorStop(1,   rgba(P.glow,0.22));
    c.fillStyle = hg;
    c.fillRect(-PAD,hz-h*0.42,w+PAD*2,h*0.42+1);

    // 区域色调，一层很淡的罩染
    var rr = (G.D && G.D.REGION_MAP && G.D.REGION_MAP[region]) || null;
    if(rr && rr.tint){
      c.globalAlpha = 0.055;
      c.fillStyle = rr.tint;
      c.fillRect(-PAD,-PAD,w+PAD*2,hz+PAD+2);
      c.globalAlpha = 1;
    }
  }
  function paintCelestial(c,P){
    var cx = GEO.cx, cy = GEO.cy, r = GEO.cr;
    var night = phase === 'night';
    // 晕：三层
    // 大幅时晕圈收一点，否则整片天都糊成一只灯
    var hr = r * (GEO.h > 240 ? 5.4 : 9);
    // 大画幅再铺一层很宽很淡的外晕：月才有「层」，天也不透
    if(GEO.h > 260){
      var og = c.createRadialGradient(cx,cy,hr*0.72,cx,cy,hr*2.2);
      og.addColorStop(0,   rgba(P.glow, 0.034));
      og.addColorStop(0.50,rgba(P.glow, 0.017));
      og.addColorStop(1,   rgba(P.glow, 0));
      c.fillStyle = og;
      c.beginPath(); c.arc(cx,cy,hr*2.2,0,6.2832); c.fill();
    }
    var g = c.createRadialGradient(cx,cy,r*0.55,cx,cy,hr);
    g.addColorStop(0,   rgba(P.glow, night ? 0.18 : 0.20));
    g.addColorStop(0.10,rgba(P.glow, night ? 0.10 : 0.115));
    g.addColorStop(0.30,rgba(P.glow, 0.048));
    g.addColorStop(0.62,rgba(P.glow, 0.016));
    g.addColorStop(1,   rgba(P.glow, 0));
    c.fillStyle = g;
    c.beginPath(); c.arc(cx,cy,hr,0,6.2832); c.fill();

    // 月有边，日无棱：夜里与黄昏给一个薄薄的实边，白天留一团散光
    var dr = r*1.06;
    var d = c.createRadialGradient(cx,cy,0,cx,cy,dr);
    if(phase === 'day'){
      d.addColorStop(0,   rgba(P.disc,0.64));
      d.addColorStop(0.54,rgba(P.disc,0.56));
      d.addColorStop(0.90,rgba(P.disc,0.34));
      d.addColorStop(1,   rgba(P.disc, 0));
    } else {
      d.addColorStop(0,   rgba(P.disc, night ? 0.90 : 0.74));
      d.addColorStop(0.86,rgba(P.disc, night ? 0.88 : 0.70));
      d.addColorStop(0.97,rgba(P.disc, night ? 0.60 : 0.44));
      d.addColorStop(1,   rgba(P.disc, 0));
    }
    c.fillStyle = d;
    c.beginPath(); c.arc(cx,cy,dr,0,6.2832); c.fill();

    if(night){
      c.save();
      c.beginPath(); c.arc(cx,cy,r*0.92,0,6.2832); c.clip();
      c.fillStyle = rgba(P.ink,1);
      c.globalAlpha = 0.05;
      c.beginPath(); c.arc(cx-r*0.26,cy-r*0.20,r*0.44,0,6.2832); c.fill();
      c.beginPath(); c.arc(cx+r*0.30,cy+r*0.26,r*0.34,0,6.2832); c.fill();
      c.restore();
      c.globalAlpha = 1;
    }
    // 云遮月：两道极淡的云气斜过月面，省得月亮像贴上去的白圆
    if(night || phase === 'dusk'){
      stamp(c, spr.mist, cx - r*0.55, cy + r*0.52, r*3.8, r*0.95, night ? 0.10 : 0.09);
      stamp(c, spr.mist, cx + r*0.95, cy - r*0.30, r*2.8, r*0.60, 0.06);
    }

  }
  function paintStars(c,P){
    stars = [];
    if(phase !== 'night') return;
    var R = seedRnd(311), n = GEO.w < 500 ? 26 : 54, i;
    for(i=0;i<n;i++){
      var x = -PAD + R()*(GEO.w+PAD*2);
      var y = R()*GEO.hz*0.86;
      var r = R() < 0.13 ? 1.25 : 0.65;
      var a = 0.10 + R()*0.42;
      c.fillStyle = 'rgba(228,240,230,' + (Math.round(a*100)/100) + ')';
      c.beginPath(); c.arc(x,y,r,0,6.2832); c.fill();
      if(stars.length < 7 && R() < 0.28) stars.push({ x:x, y:y, r:r, p:R()*6.28 });
    }
  }

  /* ---------- 静态层：水 ---------- */
  function paintWater(c,P){
    var w = GEO.w, h = GEO.h, hz = GEO.hz, wh = h - hz, i;
    if(wh < 3) return;
    // 地平线压过一道，水面才不会在画中段烧出一条白带
    var horD = mix(P.hor, P.mid, 0.42);
    var sky = mix(horD, P.water, 0.16);
    var shal = mix(horD, P.water, 0.44);
    var mid = mix(P.water, [6,11,11], 0.16);
    var g = c.createLinearGradient(0,hz,0,h);
    g.addColorStop(0,    rgba(sky,1));
    g.addColorStop(0.09, rgba(shal,1));
    g.addColorStop(0.34, rgba(mid,1));
    g.addColorStop(0.72, rgba(mix(mid,[5,9,9],0.55),1));
    g.addColorStop(1,    rgba([4,7,7],1));
    c.fillStyle = g;
    c.fillRect(-PAD,hz,w+PAD*2,wh+PAD+2);

  }

  // 水面的光：月落水柱、碎光、细波、水天一线。
  // 必须在山影倒影之后画：倒影的墨会把水光整片盖死，宽屏时水面就黑成一块。
  function paintWaterLight(c,P){
    var w = GEO.w, h = GEO.h, hz = GEO.hz, wh = h - hz, i;
    if(wh < 3) return;
    var rx = GEO.cx, rr = GEO.cr, night = phase === 'night';
    // 月／日落水：一柱被水揉散的光
    c.save();
    c.translate(rx, hz + wh*0.16);
    c.scale(1, 0.52);
    var rg = c.createRadialGradient(0,0,0, 0,0, rr*3.6);
    var a0 = night ? 0.42 : 0.26;
    rg.addColorStop(0,    rgba(P.disc, a0));
    rg.addColorStop(0.30, rgba(P.disc, a0*0.46));
    rg.addColorStop(1,    rgba(P.disc, 0));
    c.fillStyle = rg;
    c.beginPath(); c.arc(0,0,rr*3.6,0,6.2832); c.fill();
    c.restore();
    // 月光在水上踩出的一条碎路：夜戏里最抓眼的一笔，右侧江面才不空
    if(wh > 50){
      var mR = seedRnd(913), mal = night ? 1 : 0.62;
      for(i=0;i<6;i++){
        stamp(c, spr.mist, rx + Math.sin(i*1.7)*rr*0.22, hz + wh*(0.045 + i*0.078),
              rr*(1.60 - i*0.15), wh*(0.042 + i*0.012), (0.19 - i*0.021)*mal);
      }
      for(i=0;i<16;i++){
        var mty = hz + wh*(0.02 + mR()*0.54), mtw = rr*(0.20 + mR()*0.62);
        c.fillStyle = rgba(mix(P.disc,[255,255,250],0.32), (0.26 + mR()*0.34)*mal);
        c.fillRect(rx + (mR()-0.5)*rr*1.5 - mtw*0.5, mty, mtw, 0.55 + mR()*0.5);
      }
    }
    // 从水天线垂下来的光带：几枚柔光叠出来，硬边矩形一上画就穿帮
    if(wh > 40){
      for(i=0;i<4;i++){
        stamp(c, spr.mist, rx + Math.sin(i*2.1)*rr*0.5, hz + wh*(0.07 + i*0.135),
              rr*(2.0 - i*0.24), wh*(0.13 + i*0.030), (night ? 0.170 : 0.110) - i*0.024);
      }
    }
    // 光里再点碎光，水面才不是一块玻璃
    var R = seedRnd(4242), len, a, yy, jx, t, u, ry, lw, bx;
    for(i=0;i<16;i++){
      t = Math.pow(R(), 1.5);
      yy = hz + 1.4 + wh*t*0.62;
      len = rr*(0.20 + R()*0.95)*(1 - t*0.5);
      jx = (R()-0.5)*rr*2.4*(0.5 + t*0.8);
      a = (1-t)*(1-t)*(night ? 0.50 : 0.34)*(0.5 + R()*0.8);
      c.fillStyle = rgba(P.disc, a);
      c.fillRect(rx + jx - len*0.5, yy, len, 0.55);
    }
    // 细碎波纹：短横笔，散开（随画幅放大，宽屏才不会稀）
    var kx = clamp(w/390, 1, 2.4), nw = Math.round(34*kx);
    for(i=0;i<nw;i++){
      u = Math.pow(R(), 1.5);
      ry = hz + 2.0 + wh*u*0.92;
      lw = (1.6 + R()*R()*9)*kx;
      bx = R()*w;
      c.fillStyle = rgba(mix(P.mist,[250,250,245],0.34), 0.16);
      c.globalAlpha = (0.030 + 0.080*(1-u))*(0.5 + R());
      c.fillRect(bx, ry, lw, 0.55);
    }
    c.globalAlpha = 1;
    // 大幅时：几道很淡的横向水光，别让下半张纸空着
    if(wh > 90){
      for(i=0;i<4;i++){
        stamp(c, spr.mist, w*(0.30+0.14*i), hz + wh*(0.34 + i*0.15),
              w*0.52, wh*0.052, 0.062 - i*0.009);
      }
    }
    // 水天一线：两端淡出，别成一条铁轨
    var wg = c.createLinearGradient(0,0,w,0);
    wg.addColorStop(0,    rgba(P.mist,0));
    wg.addColorStop(0.16, rgba(P.mist,0.13));
    wg.addColorStop(0.84, rgba(P.mist,0.13));
    wg.addColorStop(1,    rgba(P.mist,0));
    c.fillStyle = wg;
    c.fillRect(0,hz-0.5,w,0.7);
  }

  // 山影倒在水里：有这一层，水才是水
  function paintReflection(c, pts, hz, P, a){
    var i;
    c.beginPath();
    c.moveTo(pts[0].x, hz);
    for(i=0;i<pts.length;i++) c.lineTo(pts[i].x, hz + (hz-pts[i].y)*0.80);
    c.lineTo(pts[pts.length-1].x, hz);
    c.closePath();
    var g = c.createLinearGradient(0,hz,0,hz+(GEO.h-hz)*0.88);
    g.addColorStop(0,    rgba(P.ink, a));
    g.addColorStop(0.50, rgba(P.ink, a*0.34));
    g.addColorStop(1,    rgba(P.ink, 0));
    c.fillStyle = g; c.fill();
  }

  /* ---------- 静态层：岸、塔、船 ---------- */
  function paintShore(c,P){
    var w = GEO.w, h = GEO.h, i, x;
    if(inCombat){
      var gy = h*0.935 - floorIn();
      c.beginPath();
      c.moveTo(-PAD,h+PAD);
      c.lineTo(-PAD,gy+2);
      for(x=-PAD;x<=w+PAD;x+=6) c.lineTo(x, gy + Math.sin(x*0.031)*1.4 + Math.sin(x*0.107)*0.7);
      c.lineTo(w+PAD,h+PAD);
      c.closePath();
      var pg = c.createLinearGradient(0,gy-8,0,h);
      pg.addColorStop(0, rgba([24,34,29],0.95));
      pg.addColorStop(0.18,rgba([15,22,20],0.97));
      pg.addColorStop(0.55,rgba([8,13,12],0.99));
      pg.addColorStop(1, rgba([3,6,6],1));
      c.fillStyle = pg; c.fill();
      c.strokeStyle = rgba(P.mist, GEO.h > 300 ? 0.34 : 0.18);
      c.lineWidth = GEO.h > 300 ? 1.5 : 1;
      c.beginPath();
      for(x=-PAD;x<=w+PAD;x+=6){
        var yy = gy + Math.sin(x*0.031)*1.4 + Math.sin(x*0.107)*0.7;
        if(x === -PAD) c.moveTo(x,yy); else c.lineTo(x,yy);
      }
      c.stroke();
      return;
    }
    if(GEO.xflip){
      // 桌面驻留：左下石滩。岸线从左侧压下来，水让到右边
      var ex = w*0.640;
      c.beginPath();
      c.moveTo(-PAD,h+PAD);
      c.lineTo(-PAD, bankTop(-PAD));
      for(x=-PAD;x<=ex;x+=3) c.lineTo(x, bankTop(x));
      c.lineTo(ex, h+PAD);
      c.closePath();
      var fg = c.createLinearGradient(0, h*0.60, 0, h);
      fg.addColorStop(0,   rgba([27,39,33],0.94));
      fg.addColorStop(0.42,rgba([17,25,21],0.97));
      fg.addColorStop(0.80,rgba([9,14,12],0.99));
      fg.addColorStop(1,   rgba([5,9,8],1));
      c.fillStyle = fg; c.fill();
      // 岸线受光 ＋ 沿线一层薄雾：滩与雾接住，边不硬
      c.beginPath();
      for(x=-PAD;x<=ex;x+=3){
        var fy2 = bankTop(x);
        if(x === -PAD) c.moveTo(x,fy2); else c.lineTo(x,fy2);
      }
      c.strokeStyle = rgba(P.mist, 0.34);
      c.lineWidth = 1.8;
      c.stroke();
      for(x=0; x<=ex; x+=w*0.072){
        stamp(c, spr.mist, x, bankTop(x)-GEO.h*0.004, w*0.082, GEO.h*0.013, 0.15);
      }
      // 滩面受月：一块淡光把黑坡拉出层次，再补几笔披麻皴
      stamp(c, spr.mist, w*0.26, h*0.762, w*0.56, h*0.115, 0.13);
      stamp(c, spr.mist, w*0.48, h*0.848, w*0.42, h*0.080, 0.085);
      c.save();
      c.lineCap = 'round';
      for(x=0;x<6;x++){
        var ky = h*(0.700 + 0.040*x), kx0 = -w*0.03 + (x%3)*w*0.055;
        c.strokeStyle = rgba(P.mist, 0.090 - x*0.010);
        c.lineWidth = Math.max(1.6, h*0.0060 - x*0.45);
        c.beginPath();
        c.moveTo(kx0, ky);
        c.quadraticCurveTo(kx0 + w*0.14, ky - h*0.016, kx0 + w*0.30, ky + h*0.005);
        c.stroke();
      }
      c.restore();
      return;
    }
    var x0 = w*0.60;
    c.beginPath();
    c.moveTo(x0-6,h+PAD);
    for(x=x0;x<=w+PAD;x+=3) c.lineTo(x, bankTop(x));
    c.lineTo(w+PAD,h+PAD);
    c.closePath();
    var big = GEO.h > 300;
    var gtop = Math.min(h*0.80, bankTop(w*0.64) - 8);
    var g = c.createLinearGradient(0,gtop,0,h);
    g.addColorStop(0,   rgba(big ? [16,23,20] : [11,17,15], big ? 0.90 : 0.88));
    g.addColorStop(0.32,rgba(big ? [10,16,14] : [7,12,11], 0.97));
    g.addColorStop(1,   rgba([3,6,6],1));
    c.fillStyle = g; c.fill();
    // 岸边受光：一道实线 ＋ 一道贴地的雾，坡才不是一块黑
    c.beginPath();
    for(x=x0;x<=w+PAD;x+=3){
      var y2 = bankTop(x);
      if(x === x0) c.moveTo(x,y2); else c.lineTo(x,y2);
    }
    c.strokeStyle = rgba(P.mist, big ? 0.26 : 0.15);
    c.lineWidth = big ? 1.4 : 1;
    c.stroke();
    if(big){
      for(x=x0; x<=w+PAD; x+=w*0.055){
        stamp(c, spr.mist, x, bankTop(x)-GEO.h*0.005, w*0.048, GEO.h*0.010, 0.08);
      }
    }
    // 滩上一块石
    var bx = w*0.665, by = bankTop(bx);
    c.beginPath();
    c.moveTo(bx-9,by+4); c.lineTo(bx-6,by-4); c.lineTo(bx-1.5,by-8);
    c.lineTo(bx+1.5,by-7); c.lineTo(bx+8,by-2); c.lineTo(bx+9,by+4);
    c.closePath();
    c.fillStyle = rgba([8,13,12],0.95); c.fill();
  }
  // 山脚一带云雾：把山和水隔开，画面才有纵深
  function paintMistBand(c,P){
    var w = GEO.w, h = GEO.h, hz = GEO.hz, i;
    for(i=0;i<4;i++){
      stamp(c, spr.mist, w*(0.10+0.26*i), hz - h*0.012 - i*1.6,
            w*(0.30+0.06*i), h*(0.030+i*0.004), 0.20 - i*0.03);
    }
    stamp(c, spr.mist, w*0.88, hz-h*0.05, w*0.26, h*0.040, 0.16);
  }

  // 地平线一带的低雾：桌面大画幅全靠这层把「地」从黑里分出来
  function paintGroundFog(c,P){
    var w = GEO.w, h = GEO.h, i, x, y, big = h > 300;
    if(h < 240) return;
    // 水天交界：让山脚、远岸、水面之间留一道空气
    for(i=0;i<5;i++){
      stamp(c, spr.mist, w*(0.08+0.21*i), GEO.hz - h*0.004 + Math.sin(i*1.7)*h*0.005,
            w*(0.28+0.05*i), h*(0.022+0.003*i), (big?0.16:0.13) - i*0.020);
    }
    // 岸脚 / 交手地面：一条贴地的雾带，人物才不是浮在墨上
    if(inCombat){
      for(i=0;i<6;i++){
        stamp(c, spr.mist, w*(0.05+0.18*i), GEO.gy - h*0.012 + Math.sin(i*2.1)*h*0.006,
              w*0.22, h*0.017, (big?0.15:0.10) - i*0.012);
      }
    } else if(GEO.xflip){
      // 岸线贴地雾：从左滩一直淡到水面，中景才不会是一块纯黑
      for(i=0;i<7;i++){
        x = w*(0.045+0.082*i);
        y = bankTop(x) - h*0.006 + Math.sin(i*1.9)*h*0.006;
        stamp(c, spr.mist, x, y, w*0.20, h*0.013, (big?0.14:0.08) - i*0.012);
      }
      // 远岸一线：塔影与树梢要「远」，得压在雾里
      for(i=0;i<3;i++){
        stamp(c, spr.mist, w*(0.70+0.10*i), GEO.hz + h*0.006, w*0.24, h*0.015, 0.11 - i*0.025);
      }
    } else {
      for(i=0;i<7;i++){
        x = w*(0.575+0.065*i);
        y = bankTop(x) - h*0.005 + Math.sin(i*1.9)*h*0.006;
        stamp(c, spr.mist, x, y, w*0.17, h*0.014, (big?0.10:0.07) - i*0.008);
      }
    }
  }

  // 桌面驻留（岸在左下）的前景：滩石 / 枯枝 / 矮苇 / 远岸浅山、林梢与塔影
  function paintForeFlip(c,P){
    var w = GEO.w, h = GEO.h, i, x, y, ry, lit = rgba(P.mist, 0.30);
    // 1) 滩上乱石：压住左下角，把滩分成前后两层
    var rocks = [{ x:0.058, y:0.706, r:0.026 }, { x:0.212, y:0.762, r:0.017 }, { x:0.432, y:0.836, r:0.013 }];
    for(i=0;i<rocks.length;i++){
      var R = rocks[i];
      x = w*R.x; y = h*R.y; ry = h*R.r;
      c.beginPath();
      c.moveTo(x-ry*1.55, y+ry*0.10);
      c.lineTo(x-ry*0.92, y-ry*0.92);
      c.lineTo(x-ry*0.08, y-ry*1.20);
      c.lineTo(x+ry*0.82, y-ry*0.84);
      c.lineTo(x+ry*1.55, y-ry*0.06);
      c.closePath();
      c.fillStyle = 'rgba(2,6,5,0.98)'; c.fill();
      c.strokeStyle = lit; c.lineWidth = 1.2;
      c.beginPath();
      c.moveTo(x-ry*0.92, y-ry*0.94);
      c.lineTo(x-ry*0.08, y-ry*1.22);
      c.lineTo(x+ry*0.82, y-ry*0.86);
      c.stroke();
    }
    // 2) 滩面淡墨：顺坡势横扫，越近越淡，滩与水才接得住
    c.save();
    c.lineCap = 'round';
    var sy0 = bankTop(w*0.52);
    for(i=0;i<8;i++){
      var sy = sy0 + h*(0.012 + 0.023*i), sxa = -w*0.02 + (i%3)*w*0.032;
      c.strokeStyle = rgba(P.mist, 0.135 - i*0.012);
      c.lineWidth = Math.max(1.2, h*0.0028);
      c.beginPath();
      c.moveTo(sxa, sy);
      c.quadraticCurveTo(sxa + w*0.20, sy - h*0.008, sxa + w*0.40 + (i%2)*w*0.05, sy + h*0.004);
      c.stroke();
    }
    c.restore();
    // 3) 枯枝：从岸边斜挑出去，在人物右侧破掉水天之间的平
    x = w*0.552; y = bankTop(x) + 3;
    c.save();
    c.strokeStyle = 'rgba(3,7,6,0.97)';
    c.lineCap = 'round';
    c.lineWidth = Math.max(1.8, h*0.0042);
    c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x+w*0.010, y-h*0.072, x+w*0.026, y-h*0.118); c.stroke();
    c.lineWidth = Math.max(1.1, h*0.0024);
    c.beginPath(); c.moveTo(x+w*0.011, y-h*0.058); c.quadraticCurveTo(x-w*0.010, y-h*0.074, x-w*0.024, y-h*0.066); c.stroke();
    c.beginPath(); c.moveTo(x+w*0.018, y-h*0.084); c.quadraticCurveTo(x+w*0.034, y-h*0.096, x+w*0.044, y-h*0.090); c.stroke();
    c.beginPath(); c.moveTo(x+w*0.024, y-h*0.110); c.quadraticCurveTo(x+w*0.027, y-h*0.130, x+w*0.022, y-h*0.144); c.stroke();
    c.strokeStyle = rgba(P.mist, 0.17);
    c.lineWidth = 1;
    c.beginPath(); c.moveTo(x+1.4, y-2); c.quadraticCurveTo(x+w*0.010+1.4, y-h*0.072-1.4, x+w*0.026+1.4, y-h*0.118-1.4); c.stroke();
    c.restore();
    // 4) 人物脚边的矮苇（在主角右侧，不挡人）
    x = w*0.455; y = bankTop(x) + 2;
    c.save();
    c.strokeStyle = 'rgba(5,11,10,0.94)';
    c.lineWidth = Math.max(1, h*0.0022);
    for(i=0;i<7;i++){
      var bx2 = x + (i-3)*w*0.0075;
      var bh2 = h*(0.048 + (i%3)*0.014);
      c.beginPath();
      c.moveTo(bx2, y);
      c.quadraticCurveTo(bx2 + (i-3)*w*0.004, y-bh2*0.62, bx2 + (i-3)*w*0.010, y-bh2);
      c.stroke();
    }
    c.restore();
    // 5) 远岸：一抹浅山 ＋ 一排林梢 ＋ 一座塔影，把中右那片空填住（都压得很淡）
    c.save();
    c.beginPath();
    c.moveTo(w*0.655, GEO.hz + 2);
    c.quadraticCurveTo(w*0.790, GEO.hz - h*0.052, w*0.930, GEO.hz + 1);
    c.lineTo(w+PAD, GEO.hz + 2);
    c.lineTo(w+PAD, GEO.hz + h*0.030);
    c.closePath();
    c.fillStyle = 'rgba(13,21,20,0.62)'; c.fill();
    c.beginPath();
    c.moveTo(w*0.600, GEO.hz + h*0.016);
    for(i=0;i<12;i++){
      var px = w*(0.632 + i*0.031), th = h*(0.010 + (i%3)*0.005 + ((i*7)%5)*0.0016);
      c.lineTo(px - w*0.011, GEO.hz + h*0.003);
      c.lineTo(px - w*0.004, GEO.hz - th);
      c.lineTo(px + w*0.002, GEO.hz - th*0.52);
      c.lineTo(px + w*0.008, GEO.hz - th*0.90);
      c.lineTo(px + w*0.014, GEO.hz + h*0.003);
    }
    c.lineTo(w+PAD, GEO.hz + h*0.016);
    c.closePath();
    c.fillStyle = 'rgba(7,13,12,0.86)'; c.fill();
    c.restore();
    paintPagoda(c, P, GEO.hz - h*0.002, w*0.885);
  }
  // 前景剪影：江心乱石 / 岸上枯枝 / 矮苇。桌面大画幅最缺的就是这层「近」
  function paintFore(c,P){
    var w = GEO.w, h = GEO.h;
    if(w < 560 || h < 240) return;
    if(GEO.xflip){ paintForeFlip(c,P); return; }
    var i, x, y, ry, lit = rgba(P.mist, 0.22);
    // 1) 乱石：水墨里的「重」，也把地面压出层次
    var rocks = inCombat
      ? [{ x:0.060, y:0.800, r:0.030 }, { x:0.140, y:0.860, r:0.020 }, { x:0.215, y:0.830, r:0.014 }]
      : [{ x:0.115, y:0.720, r:0.030 }, { x:0.235, y:0.840, r:0.018 }, { x:0.395, y:0.620, r:0.013 }];
    for(i=0;i<rocks.length;i++){
      var R = rocks[i];
      x = w*R.x; y = h*R.y; ry = h*R.r;
      c.beginPath();
      c.moveTo(x-ry*1.55, y+ry*0.10);
      c.lineTo(x-ry*0.92, y-ry*0.92);
      c.lineTo(x-ry*0.08, y-ry*1.20);
      c.lineTo(x+ry*0.82, y-ry*0.84);
      c.lineTo(x+ry*1.55, y-ry*0.06);
      c.closePath();
      c.fillStyle = 'rgba(4,9,8,0.96)'; c.fill();
      c.strokeStyle = lit; c.lineWidth = 1;
      c.beginPath();
      c.moveTo(x-ry*0.92, y-ry*0.94);
      c.lineTo(x-ry*0.08, y-ry*1.22);
      c.lineTo(x+ry*0.82, y-ry*0.86);
      c.stroke();
      if(!inCombat){
        c.save();
        c.globalAlpha = 0.40;
        c.fillStyle = 'rgba(4,8,7,0.80)';
        c.beginPath(); c.ellipse(x, y + ry*1.05, ry*1.30, ry*0.30, 0, 0, 6.2832); c.fill();
        c.restore();
      }
    }
    if(inCombat) return;
    // 2) 坡面：几笔横扫的淡墨 + 三块岸石，右侧那片平黑才有「墨的层次」
    if(GEO.h > 300){
      var by = bankTop(w*0.80), sx, sy;
      c.save();
      // 坡脊先铺一层月色：整块坡面比水亮一档，近处才有「墨」而不是「洞」
      for(i=0;i<5;i++){
        stamp(c, spr.mist, w*(0.635 + 0.090*i), by + h*(0.004 + 0.017*i),
              w*(0.19 + 0.015*i), h*(0.032 + 0.010*i), 0.105 - i*0.014);
      }
      c.lineCap = 'round';
      for(i=0;i<7;i++){
        sx = w*(0.605 + 0.050*i) + (i%2)*w*0.018;
        sy = by + h*(0.013 + 0.0115*i) + Math.sin(i*1.7)*h*0.004;
        c.strokeStyle = rgba(P.mist, 0.115 - i*0.010);
        c.lineWidth = Math.max(1, h*0.0022);
        c.beginPath();
        c.moveTo(sx, sy);
        c.quadraticCurveTo(sx + w*0.042, sy - h*0.005, sx + w*0.092, sy + h*0.003);
        c.stroke();
      }
      var bst = [{x:0.665, y:0.036, s:0.020}, {x:0.728, y:0.062, s:0.013}, {x:0.928, y:0.040, s:0.026}];
      for(i=0;i<bst.length;i++){
        var B = bst[i], br = h*B.s, bx = w*B.x, byy = bankTop(bx) + h*B.y;
        c.beginPath();
        c.moveTo(bx-br*1.45, byy+br*0.16);
        c.lineTo(bx-br*0.80, byy-br*0.86);
        c.lineTo(bx+br*0.10, byy-br*1.10);
        c.lineTo(bx+br*0.92, byy-br*0.72);
        c.lineTo(bx+br*1.40, byy+br*0.10);
        c.closePath();
        c.fillStyle = 'rgba(9,15,13,0.98)'; c.fill();
        c.strokeStyle = rgba(P.mist, 0.30); c.lineWidth = 1;
        c.beginPath();
        c.moveTo(bx-br*0.80, byy-br*0.88);
        c.lineTo(bx+br*0.10, byy-br*1.12);
        c.lineTo(bx+br*0.92, byy-br*0.74);
        c.stroke();
      }
      c.restore();
    }
    // 3) 岸边一株枯枝：从坡上斜挑出来，破掉右下角那片平
    x = w*0.612; y = bankTop(x) + 3;
    c.save();
    c.strokeStyle = 'rgba(3,7,6,0.97)';
    c.lineCap = 'round';
    c.lineWidth = Math.max(1.8, h*0.0042);
    c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x-w*0.008, y-h*0.070, x-w*0.021, y-h*0.116); c.stroke();
    c.lineWidth = Math.max(1.1, h*0.0024);
    c.beginPath(); c.moveTo(x-w*0.009, y-h*0.058); c.quadraticCurveTo(x+w*0.012, y-h*0.072, x+w*0.026, y-h*0.064); c.stroke();
    c.beginPath(); c.moveTo(x-w*0.015, y-h*0.082); c.quadraticCurveTo(x-w*0.032, y-h*0.094, x-w*0.040, y-h*0.088); c.stroke();
    c.beginPath(); c.moveTo(x-w*0.020, y-h*0.108); c.quadraticCurveTo(x-w*0.023, y-h*0.128, x-w*0.018, y-h*0.142); c.stroke();
    // 受光的一侧补一道很淡的边，否则整株枯枝在黑坡上等于没画
    c.strokeStyle = rgba(P.mist, 0.17);
    c.lineWidth = 1;
    c.beginPath(); c.moveTo(x-1.4, y-2); c.quadraticCurveTo(x-w*0.008-1.4, y-h*0.070-1.4, x-w*0.021-1.4, y-h*0.116-1.4); c.stroke();
    c.restore();
    // 3) 人物脚边一丛矮苇（在主角左侧，不挡人）
    x = w*0.706; y = bankTop(x) + 2;
    c.save();
    c.strokeStyle = 'rgba(5,11,10,0.94)';
    c.lineWidth = Math.max(1, h*0.0022);
    for(i=0;i<7;i++){
      var bx = x + (i-3)*w*0.0075;
      var bh = h*(0.048 + (i%3)*0.014);
      c.beginPath();
      c.moveTo(bx, y);
      c.quadraticCurveTo(bx + (i-3)*w*0.004, y-bh*0.62, bx + (i-3)*w*0.010, y-bh);
      c.stroke();
    }
    c.restore();
  }
  function paintPagoda(c,P,baseY,atX){
    if(GEO.h < 170) return;
    var s = clamp(GEO.h*0.0042, 0.85, 2.2);
    var x = (atX == null ? GEO.w*0.245 : atX), y = baseY+2;
    c.save();
    c.translate(x,y); c.scale(s,s);
    c.fillStyle = rgba(P.ink, 0.62);
    for(var i=0;i<3;i++){
      var ww = 7.4 - i*1.55, yy = -i*6.2;
      c.fillRect(-ww*0.52, yy-4.2, ww*1.04, 4.2);
      c.beginPath();
      c.moveTo(-ww, yy-4.2);
      c.quadraticCurveTo(-ww*0.18, yy-6.6, 0, yy-6.6);
      c.quadraticCurveTo(ww*0.18, yy-6.6, ww, yy-4.2);
      c.quadraticCurveTo(0, yy-2.6, -ww, yy-4.2);
      c.closePath(); c.fill();
    }
    c.fillRect(-0.7,-21.5,1.4,4.6);
    c.restore();
  }
  function paintBoat(c,P,atX){
    if(GEO.h < 170) return;
    var s = clamp(GEO.h*0.0046, 0.9, 2.4);
    var x = (atX == null ? GEO.w*0.305 : atX), y = GEO.hz + 3.4;
    c.save();
    c.translate(x,y); c.scale(s,s);
    c.fillStyle = rgba(P.ink,0.78);
    c.beginPath();
    c.moveTo(-13,0); c.quadraticCurveTo(0,5.4,13,0);
    c.quadraticCurveTo(0,1.6,-13,0);
    c.closePath(); c.fill();
    // 篷
    c.beginPath();
    c.moveTo(-3.4,-0.4); c.quadraticCurveTo(-2.4,-4.4,0,-4.6);
    c.quadraticCurveTo(2.6,-4.4,3.4,-0.4); c.closePath(); c.fill();
    // 撑篙的人
    c.fillRect(6.6,-4.0,1.5,4.0);
    c.beginPath(); c.arc(7.35,-4.8,1.05,0,6.2832); c.fill();
    c.strokeStyle = rgba(P.ink,0.78); c.lineWidth = 0.75;
    c.beginPath(); c.moveTo(7.8,-4.2); c.lineTo(12.6,1.4); c.stroke();
    c.restore();
  }

  /* ---------- 静态层总装 ---------- */
  function buildStatic(){
    var w = stage.w, h = stage.h;
    if(w < 4 || h < 4) return;
    buildSprites();
    layout(ts());
    var iw = Math.max(1, Math.round((w+PAD*2)*dpr));
    var ih = Math.max(1, Math.round((h+PAD*2)*dpr));
    if(!staticCv){
      staticCv = document.createElement('canvas');
      staticCtx = staticCv.getContext('2d');
    }
    if(staticCv.width !== iw || staticCv.height !== ih){
      staticCv.width = iw; staticCv.height = ih;
      grainPat = null;
    }
    var c = staticCtx;
    c.setTransform(dpr,0,0,dpr,0,0);
    c.translate(PAD,PAD);
    c.clearRect(-PAD,-PAD,w+PAD*2,h+PAD*2);
    c.globalAlpha = 1;
    c.globalCompositeOperation = 'source-over';

    var P = palette();
    var hz = GEO.hz;

    paintSky(c,P);
    paintCelestial(c,P);
    paintStars(c,P);

    // 高画幅（宽屏）时，天上也要有几道云气，否则上半张纸是空的
    if(h > 260){
      stamp(c, spr.mist, w*0.22, h*0.215, w*0.66, h*0.045, 0.055);
      stamp(c, spr.mist, w*0.72, h*0.125, w*0.52, h*0.036, 0.045);
      stamp(c, spr.mist, w*0.46, h*0.330, w*0.74, h*0.050, 0.042);
      stamp(c, spr.mist, w*0.10, h*0.420, w*0.46, h*0.040, 0.034);
    }

    var far  = makeRidge(17, hz, hz*0.520, 7, 1.02);
    paintRidge(c, far, hz, P, 0.26, 0.36, 0.11, 0);
    stamp(c, spr.mist, w*0.26, hz-5, w*0.34, h*0.055, 0.11);
    stamp(c, spr.mist, w*0.74, hz-8, w*0.30, h*0.048, 0.08);

    var mid  = makeRidge(43, hz, hz*0.400, 6, 1.00);
    paintRidge(c, mid, hz, P, 0.44, 0.60, 0.13, 0);
    stamp(c, spr.mist, w*0.52, hz-3, w*0.42, h*0.042, 0.09);
    stamp(c, spr.mist, w*0.90, hz-4, w*0.28, h*0.038, 0.06);
    if(!GEO.xflip) paintPagoda(c, P, ridgeYAt(mid, w*0.245));
    // 山谷里横着一条云带：远中近之间才有空气
    stamp(c, spr.mist, w*0.34, hz-h*0.088, w*0.46, h*0.024, 0.08);
    stamp(c, spr.mist, w*0.80, hz-h*0.062, w*0.34, h*0.020, 0.06);

    var near = makeHeadland(71, hz, hz*0.245, -PAD, w*0.475);
    paintRidge(c, near, hz, P, 0.60, 0.80, 0.18, 5);
    stamp(c, spr.mist, w*0.14, hz-2, w*0.32, h*0.036, 0.08);
    // 右岸一小截，给人物一个落脚的山根
    var rbank = makeHeadland(97, hz, hz*0.088, w*0.80, w+PAD);
    paintRidge(c, rbank, hz, P, 0.34, 0.46, 0.10, 0);
    stamp(c, spr.mist, w*0.62, hz-1, w*0.36, h*0.032, 0.06);

    paintWater(c,P);
    paintReflection(c, mid, hz, P, 0.13);
    paintReflection(c, near, hz, P, 0.30);
    paintWaterLight(c,P);
    stamp(c, spr.mist, w*0.52, hz+1, w*0.60, h*0.030, 0.20);
    paintBoat(c,P, GEO.xflip ? w*0.734 : null);
    paintShore(c,P);
    paintMistBand(c,P);
    paintGroundFog(c,P);
    paintWash(c,P);
    paintFore(c,P);      // 前景压在罩染之后：近处的墨不该被压淡

    if(spr.grain){
      if(!grainPat) grainPat = c.createPattern(spr.grain,'repeat');
      if(grainPat){
        c.globalAlpha = 0.55;
        c.fillStyle = grainPat;
        c.fillRect(-PAD,-PAD,w+PAD*2,h+PAD*2);
        c.globalAlpha = 1;
      }
    }

    staticDirty = false;
    buildProps();
  }
  function paintWash(c,P){
    var w = GEO.w, h = GEO.h;
    // 左三分之一压暗：地名与状态字要压得住
    var g1 = c.createRadialGradient(w*0.01,h*0.30,2,w*0.01,h*0.30,w*0.52);
    g1.addColorStop(0,   'rgba(3,7,6,0.36)');
    g1.addColorStop(0.42,'rgba(3,7,6,0.17)');
    g1.addColorStop(1,   'rgba(3,7,6,0)');
    c.fillStyle = g1;
    c.fillRect(-PAD,-PAD,w+PAD*2,h+PAD*2);
    // 顶部收进顶栏
    var g2 = c.createLinearGradient(0,-PAD,0,h*0.15);
    g2.addColorStop(0,'rgba(4,8,7,0.26)'); g2.addColorStop(1,'rgba(4,8,7,0)');
    c.fillStyle = g2; c.fillRect(-PAD,-PAD,w+PAD*2,h*0.15+PAD);
    // 底部收边
    var g3 = c.createLinearGradient(0,h*0.80,0,h+PAD);
    g3.addColorStop(0,'rgba(3,6,6,0)'); g3.addColorStop(1,'rgba(3,6,6,0.40)');
    c.fillStyle = g3; c.fillRect(-PAD,h*0.80,w+PAD*2,h*0.20+PAD);
  }

  /* ---------- 前景道具（位置固定，只算一次） ---------- */
  function buildProps(){
    var w = GEO.w, h = GEO.h, i, R = seedRnd(97);
    var fx = !!GEO.xflip;    // 桌面驻留：岸在左下，道具按镜像位置摆
    GEO.reeds = [];
    var n = w < 520 ? 9 : 16;
    for(i=0;i<n;i++){
      var x = fx ? w*(0.352 + i*(0.235/n)) + (R()-0.5)*w*0.012
                 : w*(0.665 + i*(0.36/n)) + (R()-0.5)*w*0.02;
      GEO.reeds.push({
        x: x,
        y: (inCombat ? h*0.935 : bankTop(x)) + 1.5,
        h: h*((fx ? 0.062 : 0.105) + R()*(fx ? 0.080 : 0.145)),
        ph: R()*6.28,
        lw: R() < 0.45 ? 1.5 : 1.0,
        head: false
      });
    }
    // 右缘高芦苇：压住右下角，也给人物一层前景
    GEO.tallReeds = [];
    var tn = w < 520 ? 4 : 7;
    for(i=0;i<tn;i++){
      GEO.tallReeds.push({
        x: (fx ? w*(-0.012 + i*0.019) + (R()-0.5)*w*0.008
            : w*(0.935 + i*0.021) + (R()-0.5)*w*0.010),
        y: h + 5,
        h: h*((fx ? 0.26 : 0.30) + R()*(fx ? 0.22 : 0.20)),
        ph: R()*6.28,
        lw: R() < 0.35 ? 2.0 : 1.55,
        head: false
      });
    }
    // 人物身边浮着的微光
    GEO.motes = [];
    for(i=0;i<7;i++){
      GEO.motes.push({ x:(R()-0.5)*GEO.heroH*1.5, y:-GEO.heroH*(0.05+R()*1.15), r:0.7+R()*0.9,
                       ph:R()*6.28, sp:0.10+R()*0.16 });
    }
    // 岸边灯火：一盏挂在岸坡上的风灯，远处两粒江上渔火（都带水面倒影）
    GEO.lamps = [];
    var plx = fx ? w*0.588 : w*(compact() ? 0.640 : 0.658);
    var pbase = inCombat ? h*0.935 : bankTop(plx);
    GEO.lamps.push({
      x: plx, y: pbase - h*(compact() ? 0.205 : (fx ? 0.108 : 0.148)), base: pbase,
      r: clamp(h*(compact() ? 0.105 : 0.052), 8, 24),
      ph: 0.6, sp: 0.82, a: 0.88, post: true, refl: false
    });
    if(fx){
      // 中景两盏滩上人家：人物脚下到地平线那一段要有暖光，才不是一块黑
      GEO.lamps.push({ x: w*0.152, y: bankTop(w*0.152) - h*0.030, r: clamp(h*0.019, 4.2, 9),
                       ph: 1.7, sp: 0.90, a: 0.66, post: false, refl: false });
      GEO.lamps.push({ x: w*0.316, y: bankTop(w*0.316) - h*0.020, r: clamp(h*0.014, 3.4, 7),
                       ph: 3.6, sp: 1.20, a: 0.52, post: false, refl: false });
    }
    GEO.lamps.push({ x: fx ? w*0.700 : w*0.245, y: GEO.hz + h*0.048, r: clamp(h*0.032, 3.6, 10),
                     ph: 2.5, sp: 1.5, a: 0.62, post: false, refl: true });
    GEO.lamps.push({ x: fx ? w*0.815 : w*0.430, y: GEO.hz + h*0.092, r: clamp(h*0.024, 3.0, 8),
                     ph: 4.3, sp: 1.15, a: 0.50, post: false, refl: true });
    // 宽画幅（桌面）时，对岸再点几粒人家灯火，把江面撑开、给远处一个「人还在」的暗示
    if(w > 560){
      for(i=0;i<4;i++){
        GEO.lamps.push({ x: w*((fx ? 0.648 : 0.070) + i*0.055), y: GEO.hz + h*(0.008 + (i % 2)*0.014),
                         r: clamp(h*0.011, 3.0, 6.2), ph: 1.1 + i*0.9, sp: 0.62 + i*0.14,
                         a: 0.24 + (i === 2 ? 0.07 : 0), post: false, refl: true });
      }
    }
    clouds = [];
    for(i=0;i<3;i++){
      clouds.push({
        x: -w*0.5 + R()*w*1.6,
        y: h*(0.055 + i*0.072) + (R()-0.5)*h*0.02,
        w: w*(0.52 + R()*0.30),
        h: h*(0.13 + R()*0.06),
        v: 2.4 + R()*3.4,
        a: (phase==='night' ? 0.075 : 0.092) + R()*0.045
      });
    }
    birds = [];
    for(i=0;i<(w<520?3:5);i++){
      birds.push({ x:R()*w, y0:h*(0.10+R()*0.18), y:h*(0.10+R()*0.18),
                   s:0.45+R()*0.55, v:6+R()*9, ph:R()*6.28, a:0.30+R()*0.22 });
    }
  }

  /* ---------- 动态：云、鸟、星、波光 ---------- */
  function drawClouds(now, dt){
    var w = GEO.w, hz = GEO.hz;
    ctx.save();
    ctx.beginPath(); ctx.rect(-2,-2,GEO.w+4,hz+2); ctx.clip();
    for(var i=0;i<clouds.length;i++){
      var c = clouds[i];
      c.x += c.v*dt;
      if(c.x > GEO.w + 4) c.x = -c.w - 20;
      ctx.globalAlpha = c.a;
      ctx.drawImage(spr.cloud, c.x, c.y, c.w, c.h);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  function drawBirds(now, dt){
    if(phase === 'night') return;
    for(var i=0;i<birds.length;i++){
      var b = birds[i];
      b.x += b.v*dt;
      if(b.x > GEO.w + 26){ b.x = -26; b.y0 = GEO.h*(0.10+Math.random()*0.18); }
      b.y = b.y0 + Math.sin(now*0.0008 + b.ph)*1.5;
      var f = Math.sin(now*0.0055 + b.ph)*0.5 + 0.5;      // 0..1 扇翅
      var span = b.s*3.1, up = b.s*(1.1 + 1.5*f);
      ctx.strokeStyle = 'rgba(8,14,13,' + (Math.round(b.a*100)/100) + ')';
      ctx.lineWidth = b.s > 0.72 ? 1.05 : 0.8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(b.x-span, b.y-up);
      ctx.quadraticCurveTo(b.x-span*0.42, b.y+up*0.26, b.x, b.y+up*0.06);
      ctx.quadraticCurveTo(b.x+span*0.42, b.y+up*0.26, b.x+span, b.y-up);
      ctx.stroke();
    }
  }
  function drawStarTwinkle(now){
    if(phase !== 'night') return;
    for(var i=0;i<stars.length;i++){
      var s = stars[i];
      var a = 0.30 + 0.42*Math.sin(now*0.0013 + s.p);
      if(a <= 0.02) continue;
      ctx.fillStyle = 'rgba(232,242,232,' + (Math.round(a*100)/100) + ')';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r*1.15,0,6.2832); ctx.fill();
    }
  }
  function drawShimmer(now){
    var hz = GEO.hz, wh = GEO.h - hz;
    if(wh < 6) return;
    var i, t, y, len, cx, a;
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(232,238,214,1)';
    for(i=0;i<7;i++){
      t = (i+0.5)/7;
      y = hz + wh*Math.pow(t,1.4) + Math.sin(now*0.0009 + i*1.7)*0.6;
      len = GEO.cr*(1.3 + t*2.6)*(0.68 + 0.32*Math.sin(now*0.0012 + i*2.1));
      cx = GEO.cx + Math.sin(now*0.0007 + i*2.7)*GEO.cr*0.9;
      a = (1-t)*0.50*(0.55 + 0.45*Math.sin(now*0.0016 + i));
      if(a <= 0.01) continue;
      ctx.globalAlpha = a;
      ctx.beginPath(); ctx.moveTo(cx-len*0.5,y); ctx.lineTo(cx+len*0.5,y); ctx.stroke();
    }
    // 零散波光
    ctx.strokeStyle = 'rgba(214,224,200,1)';
    for(i=0;i<4;i++){
      t = (i+0.7)/4.4;
      y = hz + wh*(0.30 + t*0.62) + Math.sin(now*0.0007 + i)*0.7;
      cx = ((now*0.010*(1+i*0.35) + i*137) % (GEO.w+120)) - 60;
      a = 0.10 + 0.10*Math.sin(now*0.0011 + i*2.0);
      ctx.globalAlpha = a;
      ctx.beginPath(); ctx.moveTo(cx,y); ctx.lineTo(cx + 14 + i*7, y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- 动态：灯火 ----------
     夜雨江上的一点暖：岸坡上一盏风灯，水里两粒渔火。
     只画光与灯芯（灯杆两笔），呼吸用两条不同频率的正弦叠出来，
     不重算离屏层，也不引外部图片。 */
  function drawLamps(now){
    var lamps = GEO.lamps || [], i, L, hz = GEO.hz, br, a;
    for(i=0;i<lamps.length;i++){
      L = lamps[i];
      br = 0.74 + 0.26*Math.sin(now*0.0011*L.sp + L.ph) + 0.05*Math.sin(now*0.0043 + L.ph*1.7);
      a = L.a*br;
      if(L.refl && L.y > hz){
        // 倒影：一条被水揉长的暖光，越往下越淡
        ctx.save();
        ctx.translate(L.x, hz + 1.0);
        ctx.globalAlpha = a*0.60;
        ctx.drawImage(spr.lamp, -L.r*0.62, 0, L.r*1.24, L.r*3.2);
        ctx.globalAlpha = a*0.24;
        ctx.drawImage(spr.lamp, -L.r*1.35, L.r*0.6, L.r*2.7, L.r*3.4);
        ctx.restore();
      }
      if(L.post){
        ctx.globalAlpha = 0.46 + 0.16*br;
        ctx.strokeStyle = 'rgba(3,6,6,0.96)';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(L.x, L.base + 1);
        ctx.lineTo(L.x, L.y - L.r*0.10);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(L.x, L.y - L.r*0.22);
        ctx.lineTo(L.x - L.r*0.44, L.y - L.r*0.06);
        ctx.stroke();
      }
      ctx.globalAlpha = a;
      ctx.drawImage(spr.lamp, L.x - L.r*2.1, L.y - L.r*2.1, L.r*4.2, L.r*4.2);
      // 灯芯：一粒更硬的暖白，光晕再大也要有一个「点」
      ctx.globalAlpha = Math.min(1, a*1.35 + 0.12);
      ctx.fillStyle = 'rgba(255,238,198,1)';
      ctx.beginPath();
      ctx.arc(L.x, L.y, Math.max(0.7, L.r*0.26), 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- 动态：芦苇 ---------- */
  // 一根苇叶：由粗到细的封闭曲线，比一根等宽的线有生气
  function blade(g, sway){
    var tx = g.x + sway, ty = g.y - g.h;
    var mx = g.x + sway*0.30, my = g.y - g.h*0.56;
    var w0 = g.lw*0.55, w1 = Math.max(0.14, g.lw*0.09);
    ctx.beginPath();
    ctx.moveTo(g.x - w0, g.y);
    ctx.quadraticCurveTo(mx - w0*1.15, my, tx - w1, ty);
    ctx.lineTo(tx + w1*0.6, ty + 0.5);
    ctx.quadraticCurveTo(mx + w0*1.15, my, g.x + w0, g.y);
    ctx.closePath();
    ctx.fill();
  }
  function drawFlora(now){
    var t = now*0.001, i, g, sw2;
    // 右缘的高苇：先画，压在人物之后
    var tr = GEO.tallReeds || [];
    ctx.fillStyle = 'rgba(4,9,8,0.94)';
    for(i=0;i<tr.length;i++){
      g = tr[i];
      sw2 = Math.sin(t*0.72 + g.ph)*g.h*0.075 + Math.sin(t*1.9 + g.ph*1.6)*g.h*0.016;
      blade(g, sw2);
    }
    // 岸边的矮苇
    for(i=0;i<GEO.reeds.length;i++){
      g = GEO.reeds[i];
      sw2 = Math.sin(t*0.85 + g.ph)*g.h*0.115 + Math.sin(t*2.2 + g.ph*1.7)*g.h*0.022;
      ctx.fillStyle = 'rgba(5,11,10,0.90)';
      blade(g, sw2);
    }
  }

  /* ---------- 人物：持剑而立的水墨剪影（100 单位高） ---------- */
  function hero(x, y, hgt, t, opt){
    opt = opt || {};
    var s = hgt/100, flip = opt.flip ? -1 : 1;
    var breath = Math.sin(t*1.55)*1.15;
    var wind = Math.sin(t*0.82)*15 + Math.sin(t*2.1)*4;
    var sw = opt.swing || 0;
    var body = opt.foe ? '#160f0d' : '#0a1211';
    var robe = opt.foe ? '#241512' : '#101d1a';
    var cape = opt.foe ? '#1b100e' : '#0c1715';
    var rim  = opt.foe ? 'rgba(214,110,88,0.62)' : 'rgba(242,224,178,0.60)';
    var rim2 = opt.foe ? 'rgba(214,110,88,0.18)' : 'rgba(242,224,178,0.20)';
    // 桌面大画幅整幅偏暗：近黑剪影会连人带岸一起沉进墨里，抬两档明度 + 加重受光边
    var wide = GEO.h > 300;
    if(wide){
      body = opt.foe ? '#2a1712' : '#16241f';
      robe = opt.foe ? '#37201a' : '#1e2f27';
      cape = opt.foe ? '#2c1a15' : '#182620';
      rim  = opt.foe ? 'rgba(222,124,98,0.80)' : 'rgba(246,231,190,0.82)';
      rim2 = opt.foe ? 'rgba(222,124,98,0.26)' : 'rgba(246,231,190,0.30)';
    }

    ctx.save();
    ctx.translate(x, y);
    // 脚下：影 + 一圈暖光

  /* ---------- 天气粒子 ---------- */
  function pType(){
    if(weather === '落雪') return 'snow';
    if(weather === '骤雨' || weather === '微雨') return 'rain';
    if(weather === '风沙') return 'sand';
    if(weather === '薄雾' || weather === '霜晨') return 'mist';

  function newParticle(p, first){

    p.type = type;
    p.x = Math.random()*w;
    if(type === 'mist') p.y = first ? rnd(hz*0.55, h) : rnd(hz*0.55, h);
    else p.y = first ? Math.random()*h : -10 - Math.random()*(type==='rain'?40:10);
    if(type === 'rain'){ p.s = rnd(7,16); p.vx = rnd(-26,-10); p.vy = rnd(330,520); p.a = rnd(0.16,0.40); }
    else if(type === 'snow'){ p.s = rnd(0.7,2.0); p.vx = rnd(-12,4); p.vy = rnd(14,42); p.a = rnd(0.42,0.90); }
    else if(type === 'sand'){ p.s = rnd(1.6,3.6); p.vx = rnd(-120,-56); p.vy = rnd(-6,10); p.a = rnd(0.10,0.28); }
    else if(type === 'firefly'){ p.s = rnd(0.8,1.9); p.vx = rnd(-9,9); p.vy = rnd(-7,4); p.a = rnd(0.30,0.85); }
    else if(type === 'mist'){ p.s = rnd(14,40); p.vx = rnd(-7,7); p.vy = rnd(-2.2,1.6); p.a = rnd(0.030,0.075); }
    else if(type === 'petal'){ p.s = rnd(1.6,3.4); p.vx = rnd(-16,4); p.vy = rnd(12,30); p.a = rnd(0.20,0.48); }
    else { p.s = rnd(0.5,1.2); p.vx = rnd(-6,6); p.vy = rnd(-3,2); p.a = rnd(0.06,0.18);
           if(first) p.y = rnd(hz*0.55, h); }

  function seedParticles(){

    else if(type === 'snow') n = Math.round(n*2.2);
    else if(type === 'mist') n = Math.round(n*0.65);

  }
  function drawParticles(dt, now){

    for(i=0;i<particles.length;i++){
      p = particles[i];
      if(p.type !== type) newParticle(p,true);
      p.x += p.vx*dt;
      p.y += p.vy*dt;
      p.rot += p.vr*dt;
      p.wob += dt*1.9;
      if(p.type === 'petal' || p.type === 'snow' || p.type === 'sand') p.x += Math.sin(p.wob)*7*dt;
      if(p.type === 'firefly'){ p.x += Math.cos(p.wob*0.7)*5*dt; p.y += Math.sin(p.wob*0.9)*4*dt; }
      if(p.y > h+16 || p.x < -40 || p.x > w+40) newParticle(p,false);

      if(p.type === 'rain'){
        ctx.globalAlpha = p.a;
        ctx.strokeStyle = 'rgba(198,220,222,1)';

        ctx.fillStyle = 'rgba(240,246,238,1)';

    var r = (DBG && DBG.region) ? DBG.region : ((st.p && st.p.region) || region);
    var rr = (G.D && G.D.REGION_MAP && G.D.REGION_MAP[r]) || null;
    var tr = (rr && rr.terrain) || 'plain';
    var mm = !!($('mapView') && $('mapView').classList.contains('on'));
    var cb = (DBG && DBG.combat !== undefined) ? !!DBG.combat : !!st.combat;
    if(p !== phase || w !== weather || r !== region || tr !== terrain){
      phase = p; weather = w; region = r; terrain = tr;

      seedParticles();

    if(cb !== inCombat){ inCombat = cb; staticDirty = true; }

    var nx = sr.left - r.left, ny = sr.top - r.top, nw = sr.width, nh = sr.height;
    if(nw < 2 || nh < 2) return false;
    var changed = false;
    if(Math.abs(nx-stage.x) > 0.5 || Math.abs(ny-stage.y) > 0.5 ||

    var nd = Math.min(2, (typeof devicePixelRatio !== 'undefined' ? devicePixelRatio : 1) || 1);
    var pw = Math.floor(w*nd), ph = Math.floor(h*nd);

      cv.width = pw; cv.height = ph;
      cv.style.width = w + 'px'; cv.style.height = h + 'px';
      W = w; H = h; dpr = nd;
      ctx.setTransform(dpr,0,0,dpr,0,0);

      ctx.fillRect(0,0,W,H);

    if(soft) lastFit = ts();
  }
  function checkFit(){
    var app = $('app');

    var r = app.getBoundingClientRect();

  /* ---------- 主循环 ---------- */
  function frame(now, st){
    if(!ctx) return;
    st = st || {};

    lastFrame = now;

    setState(st, now);
    if(now - lastFit > 220){ lastFit = now; checkFit(); }
    if(staticDirty) buildStatic();
    if(!staticCv || staticDirty) return;

    var w = stage.w, h = stage.h;
    if(w < 4 || h < 4) return;

    var sx = 0, sy = 0, i;
    for(i=shakes.length-1;i>=0;i--){
      var s = shakes[i], k = (now - s.t)/300;
      if(k >= 1){ shakes.splice(i,1); continue; }
      sx += Math.sin(now*0.082 + i*1.7) * s.p * (1-k);
      sy += Math.cos(now*0.113 + i*1.3) * s.p * 0.40 * (1-k);
    }

    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.save();
    ctx.translate(stage.x, stage.y);
    ctx.beginPath(); ctx.rect(0,0,w,h); ctx.clip();
    ctx.translate(sx, sy);

    ctx.drawImage(staticCv, -PAD, -PAD, w+PAD*2, h+PAD*2);

    drawClouds(now, dt);
    drawBirds(now, dt);
    drawStarTwinkle(now);
    drawShimmer(now);
    drawLamps(now);
    if(!mapMode) drawFlora(now);
    drawParticles(dt, now);
    drawRipples(now);
    drawActors(now, st);
    drawHits(now);
    drawFlash(now);

    ctx.restore();
    ctx.setTransform(1,0,0,1,0,0);
  }

  function init(canvas){
    cv = canvas;
    ctx = cv.getContext('2d', { alpha:false });

  }

  /* ---------- 调试：截图时锁天时 / 天气 / 地形 ---------- */
  function debug(o){

    if(o.weather) DBG.weather = o.weather;
    if(o.region) DBG.region = o.region;
    if(o.combat !== undefined) DBG.combat = !!o.combat;
    staticDirty = true;
    return DBG;
  }

  return {
    init: init,
    resize: resize,
    frame: frame,
    impact: impact,
    burst: burst,
    shake: shake,
    flash: flash,
    debug: debug,
    get stage(){ return stage; }
  };
})();

   ============================================================ */
var SFX = (function(){

    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||.5, ac.currentTime+.012);

    g.gain.setValueAtTime(vol||.4, ac.currentTime);

  }

    if(!ac) return;

    if(key === ambKey) return;

    if(!on || !noiseBuf) return;
    try{
      ambSrc = ac.createBufferSource(); ambSrc.buffer = noiseBuf; ambSrc.loop = true;
      ambGain = ac.createGain(); var f = ac.createBiquadFilter();

      else if(wx==='落雪') cfg = { t:'lowpass', f:260, v:.030 };

  }

      case 'click': tone(520,.055,'triangle',.22,380); break;
      case 'hit': noise(.075,.26,900); tone(180,.09,'sine',.18,90); break;
      case 'crit': noise(.11,.34,1600); tone(880,.20,'triangle',.3,1320); break;
      case 'skill': tone(280,.28,'sawtooth',.18,860); noise(.09,.2,1200); break;
      case 'hurt': noise(.12,.3,300); tone(140,.16,'sine',.22,70); break;
      case 'loot': tone(880,.10,'sine',.28,1320); setTimeout(function(){ tone(1320,.14,'sine',.22,1760); },90); break;
      case 'event': tone(196,.9,'sine',.24,150); tone(294,.7,'sine',.10,220); break;
      case 'win': [523,659,784].forEach(function(f,i){ setTimeout(function(){ tone(f,.22,'triangle',.22,f*1.02); },i*90); }); break;
      case 'level': [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){ tone(f,.3,'sine',.24,f*1.01); },i*110); }); break;
      case 'lose': tone(300,.5,'sine',.22,110); break;
      case 'step': tone(220,.05,'triangle',.10,180); break;
      case 'tell': tone(150,.5,'sine',.20,110); break;

  var body = '';

  } else if(st.combat){

    var sm = stats(st.p);
    body = '<div class="now-hd"><span class="now-nm">'+esc(e.n)+'</span>'+
      '<span class="now-tag">第 '+c.turn+' 回合</span></div>'+
      '<div class="now-bar red"><i style="width:'+pct.toFixed(1)+'%"></i></div>'+
      '<div class="now-rows">'+
        '<div class="nr"><span>对方气血</span><b>'+fmt(e.hp)+' <i>/ '+fmt(e.hpMax)+'</i></b></div>'+
        '<div class="nr"><span>我方气血</span><b>'+fmt(st.p.hp)+' <i>/ '+fmt(sm.hpMax)+'</i></b></div>'+
        '<div class="nr"><span>战机</span><b'+(c.tell?' class="cj"':'')+'>'+(c.tell?'破绽已现，可发一招':'静候其变')+'</b></div>'+
      '</div>';
  } else if(st.event){
    var ev = G.D.evById(st.event.id);
    body = '<div class="now-hd"><span class="now-nm">'+esc(ev.t)+'</span><span class="now-tag">眼前之事</span></div>'+
      '<div class="now-rows"><div class="nr"><span>所在</span><b>'+esc(n.n)+'</b></div></div>';
  } else {
    body = '<div class="now-hd"><span class="now-nm">'+esc(n.n)+'</span>'+
      '<span class="now-tag">'+esc(reg.n||'')+(reg.sub?' · '+esc(reg.sub):'')+(n.kind?' · '+esc(n.kind):'')+'</span></div>'+
      '<div class="now-nums">'+
        '<div class="now-num"><b>'+fmt(Math.round(y.exp*(1+n.lv*.04)*10)/10)+'</b><i>修为 · 每四息</i></div>'+
        '<div class="now-num"><b>'+fmt(Math.round(y.silver*(1+n.lv*.04)*10)/10)+'</b><i>银钱 · 每四息</i></div>'+
      '</div>'+
      '<div class="now-rows">'+
        '<div class="nr"><span>巡游</span><b>'+(st.auto?'自行往邻近处走动':'只在原地')+'</b></div>'+

          '<i class="tian-shi">'+esc(tm.label)+'</i></b></div>'+
      '</div>';
  }
  if(st.combat){
    body += '<div class="now-acts"><button class="na" data-act="settings">设置</button></div>';
  }else{
    body += '<div class="now-acts">'+
      '<button class="na" data-act="idle">'+(st.idleOn?'歇一歇':'继续历练')+'</button>'+
      '<button class="na" data-act="auto">'+(st.auto?'停下巡游':'自行巡游')+'</button>'+
      '<button class="na" data-act="settings">设置</button></div>';

  h += panel('眼下', body, st.idleOn?'历练中':'歇息中');

  var logs = st.log.slice(-60).reverse();

  h += panel('年 表', list, '近 '+logs.length+' 条');
  return h;
}

/* ---------- 视图：人物 ---------- */
/* 属性刻度上限：给最高项留两成余量，随成长自然抬升 */
function heroScale(v){
  var m = 0;
  Object.keys(ATTRS).forEach(function(k){ if(v[k] > m) m = v[k]; });
  return Math.max(48, Math.round(m * 1.28));
}
function heroOrigin(p){
  var o = ORIGINS.filter(function(x){ return x.id === p.origin; })[0];
  return o ? o.n : '来历不明';
}

function renderHero(){
  var st = UI.st, p = st.p, s = Core.stats(p);

  /* ——— 根基 ——— */
  if(tab === 'base'){
    var need = Core.expNeed(p.lv), ep = clamp(p.exp/need*100,0,100);

      '<div class="trio">'+

        '<div><b>'+Object.keys(p.seen.nodes).length+'</b><span>到过</span></div>'+

    h += panel('手 上',
      '<div class="bb"><div class="bb-t"><span>气血</span><b>'+fmt(p.hp)+'</b><i>/ '+fmt(s.hpMax)+'</i></div>'+
        '<div class="ruler hp"><i style="width:'+hp.toFixed(1)+'%"></i></div></div>'+
      '<div class="bb"><div class="bb-t"><span>内息</span><b>'+fmt(p.mp)+'</b><i>/ '+fmt(s.mpMax)+'</i></div>'+
        '<div class="ruler mp"><i style="width:'+mp.toFixed(1)+'%"></i></div></div>'+
      '<div class="stats">'+
        '<div><b>'+fmt(s.atk)+'</b><span>攻</span></div>'+
        '<div><b>'+fmt(s.def)+'</b><span>防</span></div>'+
        '<div><b>'+fmt(s.agi)+'</b><span>身法</span></div>'+
        '<div><b>'+(s.crit*100).toFixed(1)+'<em>%</em></b><span>会心</span></div>'+
        '<div><b>'+Math.floor(s.luck)+'</b><span>福缘</span></div>'+
        '<div><b>'+p.stamina+'</b><span>气力</span></div>'+
      '</div>', '');
    var tm = Core.timeMod(st, ts());
    h += panel('天 时',
      '<div class="nr"><span>时辰</span><b>'+esc(tm.hour)+'</b></div>'+
      '<div class="nr"><span>天气</span><b>'+esc(tm.wx)+'</b></div>'+

  /* ——— 装备：三印 ——— */
  if(tab === 'gear'){
    var sig = '', worn = 0;
    Object.keys(EQUIP_SLOT).forEach(function(slot){
      var it = p.equip[slot], d = it && ITEM_MAP[it.id];
      var qc = d ? G.D.QC[it.q] : '';
      if(d) worn++;
      sig += '<div class="sigil '+(d?'':'empty')+' '+qc+'"'+(d?' data-act="unequip" data-v="'+slot+'"':'')+'>'+
        '<div class="sg">'+(d?itemSvg(it):svgIcon('empty'))+'</div>'+
        '<div class="sk">'+EQUIP_SLOT[slot]+'</div>'+
        (d?'<div class="sn">'+esc(d.n)+'</div><div class="sq">'+G.D.QN[it.q]+(it.plus?' ＋'+it.plus:'')+'</div>':'')+
        '</div>';
    });
    h += panel('身 上', '<div class="sigils">'+sig+'</div>'+
      '<div class="sigil-tip">'+(worn?'点选已佩戴之物即可卸下':'三处皆空，赤手亦可走江湖。')+'</div>', '三印');
    var wearable = p.bag.filter(function(it){
      var d = ITEM_MAP[it.id];
      return it.uid && d && (d.type==='weapon' || d.type==='armor' || d.type==='trinket');
    });
    /* 90-ui-root 里 UI.gearOpen 初值为 false，仅作“未操作”；

    var wear = '';
    if(open){

          '<div class="plate-seal">'+itemSvg(it)+'</div>'+

          '<div class="plate-st">'+esc(summary)+'</div></div>'+

      }).join('') : '<div class="muted" style="padding:10px 0;text-align:center">行囊里暂无可用装备。</div>';
    }
    h += panel('备 选', head + wear, '');
  }

  /* ——— 武学：按内外轻分组 ——— */
  if(tab === 'arts'){
    var mains = '<div class="trio">';
    [['wai','外功'],['nei','内功'],['qing','轻功']].forEach(function(x){
      var a = ART_MAP[p.slots[x[0]]];
      mains += '<div><b class="'+(a?'gold':'')+'">'+(a?esc(a.n):'—')+'</b><span>'+x[1]+(a?' · '+p.arts[a.id]+' 层':'')+'</span></div>';
    });
    mains += '</div>';
    h += panel('主 修', mains, '残页 '+Core.itemCount(st,'page')+' 张');

    [['wai','外功','拳脚兵刃'],['nei','内功','心法内息'],['qing','轻功','身法纵跃']].forEach(function(t){
      var learned = ARTS.filter(function(a){ return a.type===t[0] && p.arts[a.id]; });
      var rest = ARTS.filter(function(a){ return a.type===t[0] && !p.arts[a.id]; }).length;
      var gh = '<div class="grp-h">'+t[1]+'<small>'+t[2]+'</small>'+(learned.length?'<i>'+learned.length+' 路</i>':'')+'</div>';
      var list = '';
      if(learned.length){
        list = learned.map(function(a){
          var lv = p.arts[a.id], main = p.slots[a.type]===a.id;
          return '<div class="art '+(main?'main ':'')+G.D.QC[a.q]+'">'+
            '<div class="art-mk">'+artSvg(a)+'</div>'+
            '<div class="art-bd">'+
              '<div class="art-nm">'+esc(a.n)+'<em>'+lv+' 层</em>'+(main?'<i>主修</i>':'')+'</div>'+
              '<div class="art-st">'+esc(getArtStatSummary(a, lv))+'</div>'+
            '</div>'+
            '<button class="art-btn" data-act="'+(main?'up-art':'main-art')+'" data-id="'+a.id+'" data-v="'+a.type+'">'+
              (main?'精进':'主修')+'</button>'+
            '</div>';

      } else {
        list = '<div class="muted" style="padding:2px 0 4px">这一路尚未入门。</div>';
      }
      if(rest) list += '<div class="art-rest">另有 '+rest+' 路武学未习得</div>';
      h += panel(t[1], gh + list, '');

  }

  /* ——— 招式：三式 ——— */
  if(tab === 'skills'){
    var slotTitles = ['起手式','变幻式','绝杀式'];
    var skh = '<div class="sigils">';
    for(var i=0;i<3;i++){
      var sid = p.skills[i], sa = ART_MAP[sid];
      var pow = sa ? (sa.pow*(1+(p.arts[sa.id]-1)*0.16)).toFixed(1)+'x' : '—';
      skh += '<div class="sigil '+(sa?'':'empty')+' '+(sa?G.D.QC[sa.q]:'')+'" data-act="skill-slot" data-i="'+i+'">'+
        '<div class="sg">'+(sa?artSvg(sa):svgIcon('empty'))+'</div>'+
        '<div class="sk">'+slotTitles[i]+'</div>'+
        '<div class="sn">'+(sa?esc(sa.n):'未置')+'</div>'+
        '<div class="sq">'+pow+'</div></div>';
    }
    skh += '</div>';
    h += panel('交手三式', skh + '<div class="sigil-tip">点选一式可更替</div>', '');
    var pool = ARTS.filter(function(a){ return a.type==='wai' && p.arts[a.id]; });
    var plist = pool.length ? pool.map(function(a){
      var used = p.skills.indexOf(a.id);
      return '<div class="art"><div class="art-mk">'+artSvg(a)+'</div>'+
        '<div class="art-bd"><div class="art-nm">'+esc(a.n)+(used>=0?'<i>'+['一','二','三'][used]+'式</i>':'')+'</div>'+
        '<div class="art-st">'+esc(getArtStatSummary(a, p.arts[a.id]))+'</div></div>'+
        '<div class="slotpick">'+[0,1,2].map(function(k){
          return '<button class="slotbtn'+(p.skills[k]===a.id?' on':'')+'" data-act="put-skill" data-i="'+k+'" data-id="'+a.id+'">'+['壹','贰','叁'][k]+'</button>';
        }).join('')+'</div></div>';
    }).join('') : '<div class="muted" style="padding:16px 0;text-align:center">还没有可用的外功招式。可在游历或切磋中习得。</div>';
    h += panel('所学外功', plist, pool.length?pool.length+' 路':'');
  }

  return h;
}

/* ---------- 视图：行囊 ---------- */
function itemInstName(it){
  var d = ITEM_MAP[it.id]; if(!d) return '?';
  return (it.plus?'＋'+it.plus+' ':'') + (it.uid?G.D.QN[it.q]+'·':'') + d.n;
}
function itemDesc(it){
  var d = ITEM_MAP[it.id]; if(!d) return '';
  var parts = [d.d];
  var stat = [];
  var eqMul = 1 + (it.plus||0)*.16 + (it.q||0)*.10;
  ['atk','def','hp','agi','wit','arm','con','luck','crit'].forEach(function(k){
    if(!d[k]) return;
    var v = d[k]*eqMul;
    stat.push(({atk:'攻',def:'防',hp:'气血',agi:'身法',wit:'悟性',arm:'臂力',con:'根骨',luck:'福缘',crit:'会心'})[k]+' +'+(k==='crit' ? (Math.round(v*1000)/10)+'%' : (Math.round(v*10)/10)));
  });
  if(stat.length) parts.push(stat.join(' · '));
  (it.affix||[]).forEach(function(a){ parts.push('〔'+a.n+'〕'); });
  return parts.join('　');
}
function bagKind(it){
  var d = ITEM_MAP[it.id];
  if(!d) return 'misc';
  if(d.type==='weapon' || d.type==='armor' || d.type==='trinket') return 'gear';
  if(it.id === 'page') return 'page';
  if(d.type === 'herb') return 'herb';
  return 'misc';
}
/* 一枚器物铭牌 */
function itemPlate(it){
  var d = ITEM_MAP[it.id]; if(!d) return '';
  var q = it.q != null ? it.q : (d.q || 0);
  var key = it.uid || it.id;
  var summary = getItemStatSummary(it);
  var cnt = (!it.uid && it.n > 1) ? '<i class="p-cnt">×'+it.n+'</i>' : '';
  var plus = it.plus ? '<span class="p-plus">＋'+it.plus+'</span>' : '';
  return '<div class="plate '+G.D.QC[q]+'" data-act="item" data-id="'+key+'">'+
    '<div class="plate-seal">'+itemSvg(it)+cnt+'</div>'+
    '<div class="plate-bd">'+
      '<div class="plate-nm"><em>'+esc(d.n)+'</em>'+plus+'</div>'+
      (summary?'<div class="plate-st">'+esc(summary)+'</div>':'')+
      '<div class="plate-ds">'+esc(d.d)+'</div>'+
    '</div>'+
    '<div class="plate-side"><i>'+G.D.QN[q]+'</i></div>'+
  '</div>';
}
/* 身上三印：兵器 · 衣甲 · 饰物 */
function bagSigils(){
  var p = UI.st.p, out = '';
  Object.keys(EQUIP_SLOT).forEach(function(slot){
    var it = p.equip[slot], d = it && ITEM_MAP[it.id];
    var q = d ? it.q : 0;
    out += '<div class="sigil '+(d?'':'empty')+' '+(d?G.D.QC[q]:'')+'"'+(d?' data-act="unequip" data-v="'+slot+'"':'')+'>'+
      '<div class="sg">'+(d?itemSvg(it):svgIcon('empty'))+'</div>'+
      '<div class="sk">'+EQUIP_SLOT[slot]+'</div>'+
      (d?'<div class="sn">'+esc(d.n)+'</div><div class="sq">'+G.D.QN[q]+(it.plus?' ＋'+it.plus:'')+'</div>':'')+
    '</div>';
  });
  return '<div class="sigils row">'+out+'</div>'+((UI.st.p.equip.weapon||UI.st.p.equip.armor||UI.st.p.equip.trinket)?'<div class="sigil-tip">点选身上之物可卸下</div>':'');
}

function renderBag(){
  var st = UI.st, p = st.p;
  var h = '<div class="sec-head"><span class="zh">行囊</span><span class="ln"></span><span class="en">'+fmt(p.silver)+' 银</span></div>';
  var filters = [['all','全部'],['gear','装备'],['herb','药石'],['page','残页'],['misc','杂物']];
  h += '<div class="seg flat">' + filters.map(function(f){
    return '<button data-act="bag-filter" data-v="'+f[0]+'" class="'+(UI.bagFilter===f[0]?'on':'')+'">'+f[1]+'</button>';
  }).join('') + '</div>';

  if(UI.bagFilter==='all' || UI.bagFilter==='gear') h += panel('身 上', bagSigils(), '三印');

  var list = p.bag.filter(function(it){
    return UI.bagFilter==='all' || bagKind(it)===UI.bagFilter;
  });
  if(!list.length){
    h += panel('物 件',
      '<div class="plate empty-plate"><div class="plate-seal">'+svgIcon('empty')+'</div>'+
      '<div class="plate-bd"><div class="plate-nm">此格空空</div>'+
      '<div class="plate-ds">行过之处，自会添些物什。</div></div></div>', '0 格');
  } else {
    var groups = [['gear','装 备'],['herb','药 石'],['page','残 页'],['misc','杂 物']], body = '';
    groups.forEach(function(g){
      var sub = list.filter(function(it){ return bagKind(it)===g[0]; });
      if(!sub.length) return;
      body += '<div class="grp-h">'+g[1]+'<small>'+sub.length+' 格</small></div>';
      sub.forEach(function(it){ body += itemPlate(it); });
    });
    h += panel('物 件', body, list.length+' 格');
  }
  h += '<div class="btn-row"><button class="btn sm ghost" data-act="sell-low">售去粗劣</button>'+
       '<button class="btn sm ghost" data-act="settings">设置</button></div>';
  return h;
}

/* ---------- 视图：见闻 ---------- */
function loreFind(id){
  var a = UI.st.p.lore || [];
  for(var i=0;i<a.length;i++) if(a[i].id === id) return a[i];
  return null;
}
/* 一页见闻：已录在前，未录压后 */
function loreCard(o){
  if(!o.seen){
    return '<div class="lcard unseen"><div class="lc-seal">？</div>'+
      '<div class="lc-bd"><div class="lc-nm">'+esc(o.n)+'<span class="lc-tag">未录</span></div></div>'+
    '</div>';
  }
  var qc = o.q != null ? G.D.QC[o.q] : '';
  var tag = o.tag || '';
  return '<div class="lcard '+qc+'">'+
    '<div class="lc-seal">'+esc(o.ch || '闻')+'</div>'+
    '<div class="lc-bd">'+
      '<div class="lc-nm">'+esc(o.n)+(tag?'<span class="lc-tag">'+tag+'</span>':'')+'</div>'+
      '<div class="lc-d">'+esc(o.d || '')+'</div>'+
    '</div>'+
  '</div>';
}
function loreCat(k){
  var p = UI.st.p, out = [], seen = p.seen || {};
  if(k === 'stele'){
    Object.keys(INSCRIPTIONS).forEach(function(nid){
      var nm = G.D.NODE_MAP[nid] ? G.D.NODE_MAP[nid].n : '无名古碑';
      var rec = loreFind('stele_' + nid);
      out.push({ n:nm, ch:'碑', d:rec ? rec.d : INSCRIPTIONS[nid], seen:!!rec });
    });
  } else if(k === 'npcs'){
    NPCS.forEach(function(x){
      var rec = loreFind('npc_' + x.id);
      out.push({ n:x.n, ch:x.ch || '人', d:rec ? rec.d : x.intro, seen:!!seen.npcs[x.id] });
    });
  } else if(k === 'enemies'){
    ENEMIES.concat(BOSSES).forEach(function(x){
      var rec = loreFind('enemy_' + x.id) || loreFind('boss_' + x.id);
      out.push({ n:x.n, ch:(x.n || '敌').charAt(0), d:rec ? rec.d : (x.d || ''), seen:!!seen.enemies[x.id] || !!rec, tag:'交过手' });
    });
  } else if(k === 'arts'){
    ARTS.forEach(function(x){
      var rec = loreFind('art_' + x.id);
      out.push({ n:x.n, ch:x.ch, q:x.q, d:rec ? rec.d : x.d, seen:!!seen.arts[x.id] });
    });
  } else if(k === 'events'){
    EVENTS.forEach(function(x){
      var rec = loreFind('event_' + x.id);
      out.push({ n:x.t, ch:'遇', d:rec ? rec.d : x.text, seen:!!seen.events[x.id] });
    });
  } else if(k === 'items'){
    ITEMS.forEach(function(x){
      var rec = loreFind('item_' + x.id);
      out.push({ n:x.n, ch:x.ch, q:x.q, d:rec ? rec.d : x.d, seen:!!seen.items[x.id] });
    });
  }
  return out;
}
function loreList(k){
  var all = loreCat(k);
  var got = all.filter(function(x){ return x.seen; });
  var miss = all.filter(function(x){ return !x.seen; });
  var body = '';
  if(got.length){
    body += '<div class="grp-h">已 录<small>'+got.length+' 则</small></div>';
    body += got.map(loreCard).join('');
  }
  if(miss.length){
    body += '<div class="grp-h">待 访<small>'+miss.length+' 则</small></div>';
    body += '<div class="lore-miss">' + miss.slice(0, miss.length > 12 ? 12 : miss.length).map(loreCard).join('') + '</div>';
    if(miss.length > 12) body += '<div class="lore-more">余 '+(miss.length-12)+' 则，且行且看。</div>';
  }
  return body || '<div class="lore-more">这一页还空着。</div>';
}
function loreGoals(p){
  return GOALS.map(function(g){
    var ok = !!p.goals[g.id];
    return '<div class="lcard goal '+(ok?'done':'')+'">'+
      '<div class="lc-seal">'+(ok ? '成' : '志')+'</div>'+
      '<div class="lc-bd"><div class="lc-nm">'+esc(g.n)+'<span class="lc-tag">'+(ok?'已达成':'未达成')+'</span></div>'+
      '<div class="lc-d">'+esc(g.d)+'</div>'+
      '<div class="lc-x">'+esc(ok ? g.log : ('赏格 · ' + g.reward))+'</div></div></div>';
  }).join('');
}
function loreNodes(st, p){
  var rr = UI.loreRegion || p.region;
  var reg = G.D.REGION_MAP[rr] || REGIONS[0];
  var h = '<div class="seg flat" style="margin-bottom:12px">' + REGIONS.map(function(x){
    var un = Core.regionUnlocked(st, x);
    return '<button data-act="lore-region" data-v="'+x.id+'" class="'+(rr===x.id?'on':'')+(un?'':' dim')+'">'+x.n+'</button>';
  }).join('') + '</div>';
  h += reg.nodes.map(function(n){
    var seen = p.seen.nodes[n.id];
    return '<div class="lcard node '+(seen?'':'unseen')+'">'+
      '<div class="lc-seal">'+(seen ? (n.ch || '地') : '？')+'</div>'+
      '<div class="lc-bd"><div class="lc-nm">'+esc(seen ? n.n : '未至之地')+'<span class="lc-tag">'+n.lv+' 阶</span></div>'+
      '<div class="lc-d">'+esc(seen ? n.d : '云深不知处，尚待寻访。')+'</div></div></div>';
  }).join('');
  return h;
}
function renderLore(){
  var st = UI.st, p = st.p;
  var groups = [
    { k:'goals',   n:'志',   all:GOALS.length, got:Object.keys(p.goals||{}).length },
    { k:'stele',   n:'碑刻', all:Object.keys(INSCRIPTIONS).length, got:(p.lore||[]).filter(function(x){ return x.id.indexOf('stele_')===0; }).length },
    { k:'nodes',   n:'地方', all:Object.keys(G.D.NODE_MAP).length, got:Object.keys(p.seen.nodes||{}).length },
    { k:'npcs',    n:'人物', all:G.D.NPCS.length, got:Object.keys(p.seen.npcs||{}).length },
    { k:'enemies', n:'敌手', all:G.D.ENEMIES.length+G.D.BOSSES.length, got:Object.keys(p.seen.enemies||{}).length },
    { k:'arts',    n:'武学', all:G.D.ARTS.length, got:Object.keys(p.seen.arts||{}).length },
    { k:'events',  n:'遭际', all:G.D.EVENTS.length, got:Object.keys(p.seen.events||{}).length },
    { k:'items',   n:'器物', all:G.D.ITEMS.length, got:Object.keys(p.seen.items||{}).length }
  ];
  var sumGot = 0, sumAll = 0;
  groups.forEach(function(g){ sumGot += g.got; sumAll += g.all; });
  var h = '<div class="sec-head"><span class="zh">见闻</span><span class="ln"></span><span class="en">'+sumGot+' / '+sumAll+' 则</span></div>';
  h += '<div class="lore-signs">' + groups.map(function(g){
    return '<button class="lore-sign '+(UI.loreTab===g.k?'on':'')+'" data-act="lore-tab" data-v="'+g.k+'">'+
      '<i>'+g.n+'</i><span class="cnt"><b>'+g.got+'</b><em>/'+g.all+'</em></span></button>';
  }).join('') + '</div>';
  var k = UI.loreTab || 'goals';
  var gm = groups.filter(function(g){ return g.k === k; })[0] || groups[0];
  var body = k === 'goals' ? loreGoals(p) : (k === 'nodes' ? loreNodes(st, p) : loreList(k));
  h += panel(gm.n, body, gm.got + ' / ' + gm.all);
  var bosses = G.D.BOSSES.filter(function(b){ return p.bossKills[b.id]; });
  if(bosses.length) h += panel('手下败将', bosses.map(function(b){
    var bl = loreFind('boss_' + b.id);
    return '<div class="lcard"><div class="lc-seal">'+esc(b.n.charAt(0))+'</div><div class="lc-bd">'+
      '<div class="lc-nm">'+esc(b.n)+'<span class="lc-tag">已诛</span></div>'+
      '<div class="lc-d">'+esc(bl ? bl.d : (b.d||''))+'</div></div></div>';
  }).join(''), bosses.length + ' 人');
  h += '<button class="btn ghost full" data-act="settings">设置</button>';
  return h;
}

/* ---------- 地图 ---------- */
function mapRect(){ return $('mapCanvas').getBoundingClientRect(); }
function mapClamp(pan, scale){
  var r = mapRect();
  // 地图页隐藏时画布是 0×0，此时钳制会把 pan 归零（捏合中途切页签会跳位）
  if(r.width <= 1 || r.height <= 1) return { x:pan.x, y:pan.y };
  var w = r.width*scale, h = r.height*scale;
  return {
    x: w <= r.width  ? (r.width-w)/2  : clamp(pan.x, r.width-w, 0),
    y: h <= r.height ? (r.height-h)/2 : clamp(pan.y, r.height-h, 0)
  };
}
function mapApply(animate){
  var inner = $('mapInner');
  if(animate){
    inner.classList.add('anim');
    clearTimeout(UI._animT);
    UI._animT = setTimeout(function(){ inner.classList.remove('anim'); }, 260);
  }
  inner.style.transform = 'translate('+UI.pan.x.toFixed(1)+'px,'+UI.pan.y.toFixed(1)+'px) scale('+UI.scale.toFixed(3)+')';
  var nodes = $('mapNodes');
  if(nodes) nodes.classList.toggle('zoomed', UI.scale >= 1.25);
}
function mapFit(animate){
  UI.scale = 1; UI.pan.x = 0; UI.pan.y = 0;
  mapApply(animate);
}
/* 以某点为中心缩放：点按缩放与捏合都走这里 */
function mapZoomAt(factor, cx, cy){
  var r = mapRect();
  var px = cx == null ? r.width/2 : cx, py = cy == null ? r.height/2 : cy;
  var s0 = UI.scale, s1 = clamp(s0*factor, 0.7, 1.9);
  if(s1 === s0) return;
  UI.pan.x = px - (px - UI.pan.x) * (s1/s0);
  UI.pan.y = py - (py - UI.pan.y) * (s1/s0);
  UI.scale = s1;
  var c = mapClamp(UI.pan, UI.scale);
  UI.pan.x = c.x; UI.pan.y = c.y;
  mapApply(true);
  clearTimeout(UI._mapRT);
  UI._mapRT = setTimeout(function(){ if(UI.tab==='map') renderMap(); }, 260);
}
function mapToCurrent(){
  var st = UI.st, id = st.p.node, n = G.D.NODE_MAP[id];
  if(!n) return;
  if(n.region !== UI.mapRegion){ UI.mapRegion = n.region; renderMap(); }
  var pos = UI._pos && UI._pos[id];
  if(!pos) return;
  UI.scale = 1; UI.pan.x = 0; UI.pan.y = 0;
  UI.sel = id;
  mapApply(true);
  document.querySelectorAll('.map-node').forEach(function(b){ b.classList.toggle('sel', b.dataset.id===id); });
  renderNodeCard();
}

/* ============================================================
   舆图 · 山川形胜
   图幅坐标：x ∈ [0,100]，y ∈ [0,100k]（k = 画布高/宽）
   1 图幅单位恒等于 画布宽/100 像素，线宽/笔触在任何屏幕都等比。
   ============================================================ */
function mapHash(s){
  var h = 2166136261;
  for(var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mapRng(seed){
  var a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function mapLighten(hex, f){
  var n = parseInt(String(hex).replace('#',''), 16);
  var r = Math.min(255, Math.round(((n>>16)&255)*f));
  var g = Math.min(255, Math.round(((n>>8)&255)*f));
  var b = Math.min(255, Math.round((n&255)*f));
  return '#' + ((1<<24) + (r<<16) + (g<<8) + b).toString(16).slice(1);
}
function mapN(v, d){ return (+v).toFixed(d == null ? 2 : d); }
function mapK(){
  var r = mapRect();
  return (r.width > 1 && r.height > 1) ? clamp(r.height/r.width, 0.30, 1.6) : 0.62;
}
/* 平滑一维噪声，用来长山脊与河岸 */
function mapNoise(x, seed){
  return Math.sin(x*0.83+seed)*0.5 + Math.sin(x*1.91+seed*1.7)*0.29 + Math.sin(x*4.3+seed*2.9)*0.17;
}
/* 落位：节点只占图幅上部，下部留给江海 */
function mapCoords(r, k){
  var xs = r.nodes.map(function(n){ return n.x; }), ys = r.nodes.map(function(n){ return n.y; });
  var x0 = Math.min.apply(null,xs), x1 = Math.max.apply(null,xs);
  var y0 = Math.min.apply(null,ys), y1 = Math.max.apply(null,ys);
  var w = Math.max(1, x1-x0), h = Math.max(1, y1-y0);
  var H = 100*k;
  /* 左右留白按「像素」算：宽屏上一单位像素大，工具球列占的单位就少，
     若仍按固定 12 单位留白，右侧一列节点会被挤到 80% 处、右边空一大片 */
  var rc = mapRect();
  var u = (rc.width > 1) ? rc.width/100 : 3.9;
  var padY = 9;
  var xMin = 6.6, xMax = 100 - (62 + 20)/u;
  if(xMax < xMin + 34) xMax = Math.min(92, xMin + 34);
  var availW = xMax - xMin;
  var availH = Math.max(16, H*0.755 - padY*2);
  var sx = availW/w, sy = availH/h;
  var s = Math.min(sx, sy);
  // 长边最多再放这么多：竖屏图幅窄，纯等比会空出一大片；两倍以内看不出走形
  sx = Math.min(sx, s*2.25);
  sy = Math.min(sy, s*1.85);
  var offX = xMin + (availW - w*sx)/2;
  var offY = padY + (availH - h*sy)/2;
  var out = {};
  r.nodes.forEach(function(n){
    out[n.id] = {
      x: Math.max(xMin, Math.min(xMax, offX + (n.x-x0)*sx)),
      y: Math.max(6.5, Math.min(H - 8.5, offY + (n.y-y0)*sy))
    };
  });
  return out;
}
function mapSmooth(pts, closed){
  var n = pts.length;
  if(n < 3) return '';
  var d = 'M ' + mapN(pts[0].x) + ' ' + mapN(pts[0].y);
  var lim = closed ? n : n-1;
  for(var i=0;i<lim;i++){
    var p0 = closed ? pts[(i-1+n)%n] : pts[Math.max(0,i-1)];
    var p1 = pts[i%n];
    var p2 = closed ? pts[(i+1)%n] : pts[i+1];
    var p3 = closed ? pts[(i+2)%n] : pts[Math.min(n-1,i+2)];
    var c1x = p1.x + (p2.x-p0.x)/6, c1y = p1.y + (p2.y-p0.y)/6;
    var c2x = p2.x - (p3.x-p1.x)/6, c2y = p2.y - (p3.y-p1.y)/6;
    d += ' C ' + mapN(c1x)+' '+mapN(c1y)+', '+mapN(c2x)+' '+mapN(c2y)+', '+mapN(p2.x)+' '+mapN(p2.y);
  }
  return closed ? d + ' Z' : d;
}
/* 一条路的形状：中点沿法线偏一点，像绕着地势走 */
function mapCurveD(a, b, key, bend){
  var dx = b.x-a.x, dy = b.y-a.y, len = Math.hypot(dx,dy)||1;
  var nx = -dy/len, ny = dx/len;
  var rng = mapRng(mapHash(key));
  var sg = (rng() < .5 ? -1 : 1) * (bend == null ? 1 : bend);
  var m1 = { x:a.x+dx*.34 + nx*sg*len*.13, y:a.y+dy*.34 + ny*sg*len*.13 };
  var m2 = { x:a.x+dx*.68 + nx*sg*len*.13, y:a.y+dy*.68 + ny*sg*len*.13 };
  return 'M '+mapN(a.x)+' '+mapN(a.y)+' C '+mapN(m1.x)+' '+mapN(m1.y)+', '+mapN(m2.x)+' '+mapN(m2.y)+', '+mapN(b.x)+' '+mapN(b.y);
}

/* ---------- 海岸线：图幅下部留一条江海，随州而变 ---------- */
function mapShore(k, seed, style){
  var H = 100*k;
  var frac = style === 'water' ? .775 : style === 'desert' ? .845 : style === 'grass' ? .815 : .800;
  var base = H*frac;
  var amp = Math.min(H*0.052, 4.2);
  var s1 = seed % 13, s2 = seed % 7;
  return function(x){
    return base
      + Math.sin(x*0.042 + s1)*amp
      + Math.sin(x*0.108 + s2*2.3)*amp*0.44
      + Math.sin(x*0.0115 + 1.7)*amp*0.55;
  };
}
function mapLandPath(shore, H){
  var d = 'M -8 -10 L 108 -10 L 108 ' + mapN(shore(108));
  for(var x = 108; x >= -8; x -= 1.6) d += ' L ' + mapN(x) + ' ' + mapN(shore(x));
  return d + ' L -8 -10 Z';
}
/* 浪纹：横向短弧，压在江面上 */
function mapWaves(H, shore, rng, n){
  var out = '';
  for(var i=0;i<n;i++){
    var x = rng()*104 - 2;
    var y = shore(x) + 2.4 + rng()*(H - shore(x) - 3.4);
    if(y > H + 2) continue;
    var w = 1.6 + rng()*3.4;
    out += '<path d="M '+mapN(x-w)+' '+mapN(y)+' q '+mapN(w*0.55)+' '+mapN(-w*0.16)+' '+mapN(w*1.06)+' 0" fill="none" stroke="rgba(163,203,197,.15)" stroke-width=".22" stroke-linecap="round"/>';
  }
  return out;
}
/* 云海：内陆州的图幅下沿用卷云收边，比海浪更像舆图 */
function mapCloudSea(H, shore, rng, warm){
  var out = '';
  var cStroke = warm ? 'rgba(210,202,174,' : 'rgba(176,208,196,';
  var cFill = warm ? 'rgba(180,172,142,.05)' : 'rgba(146,182,174,.05)';
  for(var row=0; row<3; row++){
    var n = (warm ? 4 : 7) - row, yBase = warm ? shore(0) + 10 + row*11 : shore(0) + 6 + row*7.5;
    for(var i=0;i<n;i++){
      var x = -6 + rng()*104 + i*(108/n), y = yBase + (rng()-.5)*3.5;
      if(y > H + 2) continue;
      var w = (warm ? 13 + rng()*13 : 7 + rng()*9), h = (warm ? 2.2 + rng()*2.2 : 1.8 + rng()*1.9);
      var op = (warm ? (0.12 - row*0.03) : (0.17 - row*0.035)).toFixed(3);
      var d = 'M ' + mapN(x) + ' ' + mapN(y);
      d += ' q ' + mapN(w*0.25) + ' ' + mapN(-h) + ' ' + mapN(w*0.5) + ' 0';
      d += ' q ' + mapN(w*0.25) + ' ' + mapN(-h) + ' ' + mapN(w*0.5) + ' 0';
      d += ' q ' + mapN(w*0.3) + ' ' + mapN(-h*0.7) + ' ' + mapN(w*0.62) + ' ' + mapN(h*0.15);
      out += '<path d="' + d + '" fill="none" stroke="' + cStroke + op + ')" stroke-width=".2" stroke-linecap="round"/>';
    }
  }
  /* 云气：几团模糊淡墨，把留白压实 */
  for(var c=0;c<4;c++){
    out += '<ellipse cx="' + mapN(-4 + rng()*108,1) + '" cy="' + mapN(shore(0) + 5 + rng()*(H - shore(0)),1) + '" rx="' + mapN(12+rng()*18,1) + '" ry="' + mapN(3.2+rng()*3.4,1) + '" fill="' + cFill + '" filter="url(#' + MAP_FILTER + ')"/>';
  }
  return out;
}
/* 江上的小舟：一叶而已 */
function mapBoats(shore, H, rng, n){
  var out = '';
  for(var i=0;i<n;i++){
    var x = 4 + rng()*92, y = shore(x) + 3.4 + rng()*Math.max(2, (H - shore(x))*0.6);
    var s = 0.8 + rng()*0.5;
    out += '<g opacity="'+(0.30+rng()*0.18).toFixed(2)+'" transform="translate('+mapN(x)+' '+mapN(y)+') scale('+mapN(s)+')">'+
      '<path d="M-2.6 .8 q2.6 2 5.2 0 z" fill="rgba(8,14,13,.8)" stroke="rgba(196,220,208,.35)" stroke-width=".22"/>'+
      '<path d="M0 .8 V-2.6 l2.4 1.4 -2.4 1.4 z" fill="rgba(226,214,180,.28)"/></g>';
  }
  return out;
}
/* ============================================================
   山形水法：一笔一皴，讲究留白
   ============================================================ */
/* Catmull-Rom 过点平滑：把山脊折点串成自然起伏 */
function mapSpline(pts){
  if(pts.length < 2) return '';
  var d = 'M ' + mapN(pts[0][0],1) + ' ' + mapN(pts[0][1],1), i;
  for(i=0;i<pts.length-1;i++){
    var p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
    var c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;
    var c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
    d += ' C ' + mapN(c1x,1) + ' ' + mapN(c1y,1) + ' ' + mapN(c2x,1) + ' ' + mapN(c2y,1) +
         ' ' + mapN(p2[0],1) + ' ' + mapN(p2[1],1);
  }
  return d;
}
/* 一峰：峰尖立骨、两坡用弧、山脚散开。峰尖必是折角（Q/L 收尖），不能过度平滑，
   否则三峰相叠就成了「灰面团」。皴笔沿右坡斜落，是水墨立体的关键。 */
var MAP_FILTER = '', MAP_GRAD = '';   /* mapTerrain 生成时置为柔边滤镜 / 山体渐变 id */
function mapPeak(cx, by, w, h, rng, op, ghost){
  var hw = w*0.5;
  var ax = cx + hw*(rng()-0.5)*0.50;              /* 峰尖偏心 */
  var ay = by - h*(0.90 + rng()*0.14);
  var l1x = cx-hw*(0.70+rng()*0.10), l1y = by-h*(0.13+rng()*0.09);

    ' Q ' + mapN(cx-hw*0.90,1) + ' ' + mapN(by-h*0.06,1) + ' ' + mapN(l1x,1) + ' ' + mapN(l1y,1) +
    ' Q ' + mapN(l1x-hw*0.10,1) + ' ' + mapN((l1y+l2y)/2,1) + ' ' + mapN(l2x,1) + ' ' + mapN(l2y,1) +
    ' Q ' + mapN((l2x+ax)/2-hw*0.04,1) + ' ' + mapN((l2y+ay)/2,1) + ' ' + mapN(ax,1) + ' ' + mapN(ay,1) +
    ' Q ' + mapN((ax+r1x)/2+hw*0.03,1) + ' ' + mapN((ay+r1y)/2,1) + ' ' + mapN(r1x,1) + ' ' + mapN(r1y,1) +
    ' Q ' + mapN(r2x-hw*0.06,1) + ' ' + mapN((r1y+r2y)/2,1) + ' ' + mapN(r2x,1) + ' ' + mapN(r2y,1) +
    ' Q ' + mapN(cx+hw*0.88,1) + ' ' + mapN(by-h*0.04,1) + ' ' + mapN(cx+hw,1) + ' ' + mapN(by,1);
  var d = ridge + ' L ' + mapN(cx+hw,1) + ' ' + mapN(by+h*0.16,1) +

  if(ghost){
    /* 远峰：只留淡墨轮廓 + 极薄一层灰调，不落皴、不打受光 —— 否则一片灰影会读成「云」 */
    var sg = '<path d="' + d + '" fill="rgba(140,152,122,.17)"/>';
    sg += '<path d="' + ridge + '" fill="none" stroke="rgba(84,96,78,.40)" stroke-width=".13" stroke-linejoin="round" stroke-linecap="round"/>';
    return '<g opacity="' + op + '">' + sg + '</g>';
  }
  var fill = MAP_GRAD ? 'url(#'+MAP_GRAD+')' : 'rgba(26,36,28,.5)';
  var s = '<path d="' + d + '" fill="' + fill + '"/>';
  /* 山脊落墨：只描脊，山脚留白 */
  s += '<path d="' + ridge + '" fill="none" stroke="rgba(10,18,13,.60)" stroke-width=".22" stroke-linejoin="miter" stroke-linecap="round"/>';
  /* 左坡受光：一道淡粉，从峰尖落到山脚 */
  var lw = 'M ' + mapN(ax,1) + ' ' + mapN(ay+h*0.03,1) +

    ' Q ' + mapN(l1x-hw*0.12,1) + ' ' + mapN(l1y+h*0.03,1) + ' ' + mapN(cx-hw*0.92,1) + ' ' + mapN(by-h*0.02,1);
  s += '<path d="' + lw + '" fill="none" stroke="rgba(240,240,216,.24)" stroke-width="' +
      mapN(Math.max(.55, w*0.05),2) + '" stroke-linecap="round"/>';

    var sy = by - h*((0.80 - t*0.50) + (rng()-.5)*.05);
    s += '<path d="M ' + mapN(sx,1) + ' ' + mapN(sy,1) + ' q ' + mapN(w*0.035,2) + ' ' + mapN(h*0.16,2) +

  }
  return '<g opacity="' + op + '">' + s + '</g>';
}
/* 小丘：只勾墨线、不铺渐变 —— 小尺寸上填色会糊成灰斑 */
