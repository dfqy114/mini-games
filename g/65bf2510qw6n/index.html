  pushLog(st,'古道西风，黄叶纷落，长剑出鞘三寸，隐泛秋霜之色。','gold');
  pushLog(st,'入得此江湖，生死荣辱，皆在一念之间。','dim');
  return st;
}

function stats(p){
  var a = { arm:p.attrs.arm, agi:p.attrs.agi, wit:p.attrs.wit, con:p.attrs.con, luck:p.attrs.luck };
  var bonus = { hp:0, mp:0, atk:0, def:0, crit:0 };
  // 已习武学：主修全额，其余按三成计入
  Object.keys(p.arts).forEach(function(id){
    var art = ART_MAP[id]; if(!art) return;
    var lv = p.arts[id] || 1;
    var mul = (p.slots[art.type] === id) ? 1 : 0.3;
    var scale = (1 + (lv-1)*0.22) * mul;
    Object.keys(art.attr||{}).forEach(function(k){
      if(k in a) a[k] += art.attr[k]*scale;
      else bonus[k] = (bonus[k]||0) + art.attr[k]*scale;
    });
  });
  // 装备与词缀
  Object.keys(p.equip).forEach(function(slot){
    var it = p.equip[slot]; if(!it) return;
    var d = ITEM_MAP[it.id]; if(!d) return;
    var mul = 1 + (it.plus||0)*0.16 + (it.q||0)*0.10;
    ['atk','def','hp','agi','wit','arm','con','luck','crit'].forEach(function(k){
      if(!d[k]) return;
      var v = d[k]*mul;
      if(k === 'hp' || k === 'crit') bonus[k] = (bonus[k]||0) + v;
      else if(k === 'atk' || k === 'def') bonus[k] = (bonus[k]||0) + v;
      else a[k] += v;
    });
    (it.affix||[]).forEach(function(af){
      var fx = AFFIX.find(function(x){ return x.n === af.n; }); if(!fx) return;
      if(fx.k === 'crit') bonus.crit += fx.v;
      else if(fx.k === 'hp') bonus.hp += 30*(it.q+1);
      else if(fx.k === 'atk' || fx.k === 'def') bonus[fx.k] += 8*(it.q+1);
      else a[fx.k] += fx.v;
    });
  });
  var hpMax = Math.floor(110 + p.lv*20 + a.con*9 + bonus.hp);
  var mpMax = Math.floor(52 + p.lv*9 + a.wit*4 + bonus.mp);
  var atk   = Math.floor(12 + p.lv*3.2 + a.arm*1.75 + bonus.atk);
  var def   = Math.floor(4 + p.lv*1.8 + a.con*0.9 + bonus.def);
  var agi   = Math.floor(a.agi);
  var crit  = clamp(0.04 + agi*0.0022 + bonus.crit, 0.04, 0.65);
  return { hpMax:hpMax, mpMax:mpMax, atk:atk, def:def, agi:agi, crit:crit,
           arm:a.arm, wit:a.wit, con:a.con, luck:a.luck, attrs:a };
}
function healCap(st){
  var s = stats(st.p);
  st.p.hp = clamp(st.p.hp, 0, s.hpMax);
  st.p.mp = clamp(st.p.mp, 0, s.mpMax);
  return s;
}

function save(st){
  if(!st || G.noSave) return false;
  try { store().setItem(SAVE_KEY, JSON.stringify(st)); return true; }
  catch(e){ return false; }
}
function load(){
  var raw = null;
  try { raw = store().getItem(SAVE_KEY); } catch(e){}
  if(!raw) return null;
  try {
    var st = JSON.parse(raw);
    if(!st || st.v !== 3 || !st.p) return null;
    st.fx = []; st.reports = []; st.offReport = null;
    st.counters = st.counters || { idle:0, combat:0, stamina:0, auto:0, save:0 };
    st.settings = st.settings || { sound:true, offlineCap:12, autoLoot:true };
    st.p.skills = Array.isArray(st.p.skills) ? st.p.skills : ['changquan'];
    st.p.slots = st.p.slots || { wai:'changquan', nei:'tuna', qing:'qinggong' };
    st.p.lore = st.p.lore || [];
    st.p.bossKills = st.p.bossKills || {};
    st.p.npcGift = st.p.npcGift || {};
    st.p.npcTalk = st.p.npcTalk || {};
    st.p.goals = st.p.goals || {};
    st.p.seen = st.p.seen || { nodes:{}, events:{}, enemies:{}, npcs:{}, arts:{}, items:{} };
    // 旧档/手改档的缺项补齐：缺一项就让整页起不来，宁可给默认值
    st.p.seen.nodes = st.p.seen.nodes || {};
    st.p.seen.events = st.p.seen.events || {};
    st.p.seen.enemies = st.p.seen.enemies || {};
    st.p.seen.npcs = st.p.seen.npcs || {};
    st.p.seen.arts = st.p.seen.arts || {};
    st.p.seen.items = st.p.seen.items || {};
    st.log = Array.isArray(st.log) ? st.log : [];
    st.reports = Array.isArray(st.reports) ? st.reports : [];
    st.travel = st.travel || null; st.event = st.event || null; st.combat = st.combat || null;
    // 手改档里的半截行路/战斗会让渲染直接取空节点，宁可丢掉
    if(st.travel && (typeof st.travel.left !== 'number' || !(st.travel.total > 0) || !NODE_MAP[st.travel.to])) st.travel = null;
    if(st.combat && (!st.combat.e || typeof st.combat.e.hp !== 'number' || !(st.combat.e.hpMax > 0))) st.combat = null;
    if(st.event && !NODE_MAP[st.event.node]) st.event = null;
    st.p.bag = Array.isArray(st.p.bag) ? st.p.bag : [];
    st.p.bag.forEach(function(it){
      if(!it || !it.id) return;
      if(it.uid){ it.q = clamp(it.q||0,0,5); it.plus = it.plus||0; it.affix = Array.isArray(it.affix)?it.affix:[]; }
      else { it.n = Math.max(1, it.n||1); it.q = it.q||0; }
    });
    ['weapon','armor','trinket'].forEach(function(sl){
      var eq = st.p.equip && st.p.equip[sl];
      if(eq){ eq.q = clamp(eq.q||0,0,5); eq.plus = eq.plus||0; eq.affix = Array.isArray(eq.affix)?eq.affix:[]; }
    });
    st.p.uid = st.p.uid || (st.p.bag.reduce(function(m,x){ return Math.max(m, x.uid||0); },0) + 1);
    st.p.name = String(st.p.name || '无名').slice(0,16);
    st.p.arts = st.p.arts || {};
    st.p.equip = st.p.equip || { weapon:null, armor:null, trinket:null };
    st.p.flags = st.p.flags || {};
    st.p.attrs = st.p.attrs || { arm:12, agi:12, wit:12, con:12, luck:10 };
    Object.keys(ATTRS).forEach(function(k){
      if(typeof st.p.attrs[k] !== 'number' || !isFinite(st.p.attrs[k])) st.p.attrs[k] = 12;
    });
    [['lv',1],['exp',0],['free',0],['silver',0],['hp',1],['mp',0],['stamina',0],['kills',0],['wins',0],['explores',0]].forEach(function(x){
      if(typeof st.p[x[0]] !== 'number' || !isFinite(st.p[x[0]])) st.p[x[0]] = x[1];
    });
    if(!NODE_MAP[st.p.node]) st.p.node = 'yz_cheng';
    st.p.region = NODE_MAP[st.p.node].region;
    return st;
  } catch(e){ return null; }
}
function wipe(){ try { store().removeItem(SAVE_KEY); } catch(e){} }

/* ============================================================
   7. 日志 / 特效 / 见闻
   ============================================================ */
function pushLog(st, text, kind){
  st.log.push({ t:hourName(ts()), s:text, k:kind||'' });
  if(st.log.length > 140) st.log.splice(0, st.log.length-140);
}
function pushFx(st, k, text, extra){
  var f = { k:k, text:text||'' };
  if(extra) Object.keys(extra).forEach(function(x){ f[x] = extra[x]; });
  st.fx.push(f);
  if(st.fx.length > 60) st.fx.shift();
}
function drainFx(st){ var a = st.fx.slice(); st.fx.length = 0; return a; }
function addLore(st, id, n, d){
  if(st.p.lore.some(function(x){ return x.id === id; })) return false;
  st.p.lore.push({ id:id, n:n, d:d, t:ts() });
  pushFx(st,'lore',n);
  return true;
}
function markSeen(st, kind, id, obj){
  if(!st.p.seen[kind]) st.p.seen[kind] = {};
  if(st.p.seen[kind][id]) return false;
  st.p.seen[kind][id] = 1;
  if(obj) addLore(st, kind+'_'+id, obj.n || id, obj.d || '');
  return true;
}

/* ============================================================
   8. 物品 / 装备 / 武学
   ============================================================ */
function makeEquip(id, q, plus){
  var d = ITEM_MAP[id]; if(!d) return null;
  q = clamp(q == null ? d.q : q, 0, 5);
  var inst = { uid:0, id:id, q:q, plus:plus||0, affix:[] };
  if(q >= 2 && chance(0.5 + q*0.08)){
    var af = pick(AFFIX); inst.affix.push({ n:af.n, k:af.k, v:af.v });
    if(q >= 4 && chance(0.4)){ var af2 = pick(AFFIX); if(af2.n !== af.n) inst.affix.push({ n:af2.n, k:af2.k, v:af2.v }); }
  }
  return inst;
}
function addEquip(st, id, q, plus){
  var it = makeEquip(id, q, plus); if(!it) return null;
  it.uid = st.p.uid++;
  st.p.bag.push(it);
  markSeen(st,'items',id,ITEM_MAP[id]);
  return it;
}
function rollEquip(st, node){
  var lv = node ? node.lv : 1;
  var q = clamp(Math.floor(lv/11) + (chance(0.22)?1:0), 0, 4);
  var pool = ITEMS.filter(function(x){ return x.type === 'weapon' || x.type === 'armor' || x.type === 'trinket'; });
  var near = pool.filter(function(x){ return Math.abs(x.q - q) <= 1; });
  var d = pick(near.length ? near : pool);
  return addEquip(st, d.id, q, chance(0.25) ? 1 : 0);
}
function addItem(st, id, n, q){
  n = n || 1;
  var d = ITEM_MAP[id]; if(!d) return null;
  var isEq = d.type === 'weapon' || d.type === 'armor' || d.type === 'trinket';
  if(isEq){ var last = null; for(var i=0;i<n;i++) last = addEquip(st,id,q == null ? d.q : q,0); return last; }
  var slot = st.p.bag.find(function(x){ return x.id === id && x.q === (q||0) && !x.uid; });
  if(slot) slot.n = (slot.n||0)+n;
  else st.p.bag.push({ id:id, q:q||0, n:n });
  markSeen(st,'items',id,d);
  return st.p.bag[st.p.bag.length-1];
}
function itemCount(st, id){
  return st.p.bag.reduce(function(s,x){ return s + (x.id === id ? (x.n||1) : 0); },0);
}
function takeItem(st, id, n){
  n = n || 1;
  for(var i=0;i<st.p.bag.length;i++){
    var x = st.p.bag[i];
    if(x.id !== id || x.uid) continue;
    var take = Math.min(n, x.n||1);
    x.n -= take; n -= take;
    if(x.n <= 0) st.p.bag.splice(i--,1);
    if(n <= 0) return true;
  }
  return n <= 0;
}
function equipByUid(st, uid){
  var k = Number(uid);
  var idx = st.p.bag.findIndex(function(x){ return Number(x.uid||0) === k; });
  if(idx < 0) return false;
  var it = st.p.bag[idx], d = ITEM_MAP[it.id];
  var slot = d.type;
  st.p.bag.splice(idx,1);
  var old = st.p.equip[slot];
  st.p.equip[slot] = it;
  if(old) st.p.bag.push(old);
  healCap(st);
  pushLog(st,'换上了'+d.n+'。','jade');
  pushFx(st,'gain','换上 '+d.n);
  return true;
}
function unequip(st, slot){
  var it = st.p.equip[slot]; if(!it) return false;
  st.p.equip[slot] = null; st.p.bag.push(it);
  healCap(st);
  return true;
}
function useItem(st, uid){
  var k = Number(uid);
  var idx = st.p.bag.findIndex(function(x){ return (x.uid ? Number(x.uid) === k : (x.id === String(uid) && !x.uid)); });
  if(idx < 0) return false;
  var it = st.p.bag[idx], d = ITEM_MAP[it.id];
  if(!d || !d.use) return false;
  var s = stats(st.p);
  var hpGain = d.use.hp ? Math.min(s.hpMax, st.p.hp + s.hpMax*d.use.hp) - st.p.hp : 0;
  var mpGain = d.use.mp ? Math.min(s.mpMax, st.p.mp + s.mpMax*d.use.mp) - st.p.mp : 0;
  // 满着的时候不吞药：既没回补，就别白扣一份
  if(hpGain <= 0 && mpGain <= 0) return false;
  st.p.hp += hpGain; st.p.mp += mpGain;
  if(it.uid) st.p.bag.splice(idx,1);
  else { it.n--; if(it.n <= 0) st.p.bag.splice(idx,1); }
  var gainTxt = [];
  if(hpGain > 0) gainTxt.push('+'+Math.round(hpGain)+' 气血');
  if(mpGain > 0) gainTxt.push('+'+Math.round(mpGain)+' 内息');
  pushFx(st,'heal',gainTxt.join(' · '),{heal:true});
  pushLog(st,'用了'+d.n+'，身上松快了些。','jade');
  return true;
}
function useHint(st, key){
  var it = st.p.bag.find(function(x){ return String(x.uid||x.id) === String(key); });
  var d = it && ITEM_MAP[it.id];
  if(!d || !d.use) return '这一份用不上';
  var s = stats(st.p);
  var hpFull = !d.use.hp || st.p.hp >= s.hpMax;
  var mpFull = !d.use.mp || st.p.mp >= s.mpMax;
  return (hpFull && mpFull) ? '气血内息都满着' : '这一份用不上';
}
function sellItem(st, uid){
  var k = Number(uid);
  var idx = st.p.bag.findIndex(function(x){ return x.uid ? Number(x.uid) === k : (x.id === String(uid) && !x.uid); });
  if(idx < 0) return false;
  var it = st.p.bag[idx], d = ITEM_MAP[it.id];
  var val = Math.floor((d.price||10) * (1 + it.q*0.55 + (it.plus||0)*0.3));
  st.p.silver += val;
  if(it.uid) st.p.bag.splice(idx,1);
  else { it.n = (it.n||1)-1; if(it.n <= 0) st.p.bag.splice(idx,1); }
  pushFx(st,'gain','+'+fmt(val)+' 银');
  return true;
}
function learnArt(st, id){
  var a = ART_MAP[id]; if(!a) return false;
  if(st.p.arts[id]) { pushFx(st,'gain','已习得'); return false; }
  st.p.arts[id] = 1;
  markSeen(st,'arts',id,a);
  if(!st.p.slots[a.type]) st.p.slots[a.type] = id;
  var sk = st.p.skills;
  if(a.type === 'wai' && sk.length < 3) sk.push(id);
  healCap(st);
  pushFx(st,'art',a.n);
  pushLog(st,'照着'+a.n+'的路数走了一遍，记住了。','gold');
  return true;
}
function upArt(st, id){
  var a = ART_MAP[id]; if(!a || !st.p.arts[id]) return false;
  var lv = st.p.arts[id];
  var cost = lv*2, silver = lv*80;
  if(itemCount(st,'page') < cost) { pushFx(st,'toast','武学残页不足，需 '+cost+' 张'); return false; }
  if(st.p.silver < silver) { pushFx(st,'toast','银两不够，需 '+silver); return false; }
  takeItem(st,'page',cost);
  st.p.silver -= silver;
  st.p.arts[id] = lv+1;
  healCap(st);
  pushLog(st,a.n+'第 '+(lv+1)+' 层，招式比先前顺了。','jade');
  pushFx(st,'gain',a.n+' 精进');
  return true;
}
function setSlot(st, type, id){
  if(!st.p.arts[id]) return false;
  var a = ART_MAP[id]; if(!a || a.type !== type) return false;
  st.p.slots[type] = id;
  healCap(st);
  return true;
}
function setSkill(st, idx, id){
  if(!st.p.arts[id] || ART_MAP[id].type !== 'wai') return false;
  if(st.p.skills.indexOf(id) >= 0 && st.p.skills[idx] !== id) return false;
  st.p.skills[idx] = id;
  return true;
}
function addAttr(st, k){
  if(!(k in st.p.attrs) || st.p.free <= 0) return false;
  st.p.free--; st.p.attrs[k]++;
  healCap(st);
  return true;
}
function addExp(st, n){
  st.p.exp += Math.max(0, Math.floor(n));
  var ups = 0;
  while(st.p.exp >= expNeed(st.p.lv) && st.p.lv < 120){
    st.p.exp -= expNeed(st.p.lv);
    st.p.lv++; st.p.free += 3; ups++;
    Object.keys(st.p.attrs).forEach(function(k){ st.p.attrs[k] += 1; });
  }
  if(ups){
    var s = healCap(st);
    st.p.hp = s.hpMax; st.p.mp = s.mpMax;
    pushLog(st,'气息一沉，丹田里像多开了一线。','gold');
    pushFx(st,'level',realm(st.p.lv));
    pushFx(st,'toast','修为精进 · '+st.p.lv+' 阶');
  }
  return ups;
}
function grantRes(st, o){
  var s = stats(st.p);
  if(o.exp) addExp(st, o.exp);
  if(o.silver){ st.p.silver = Math.max(0, st.p.silver + Math.floor(o.silver)); pushFx(st,'gain','+'+fmt(o.silver)+' 银'); }
  if(o.hp){ var v = Math.round(s.hpMax*o.hp); st.p.hp = clamp(st.p.hp+v,0,s.hpMax); pushFx(st, v>=0?'heal':'dmg', (v>=0?'+':'')+v+' 气血'); }
  if(o.mp){ var m = Math.round(s.mpMax*o.mp); st.p.mp = clamp(st.p.mp+m,0,s.mpMax); }
  if(o.stamina) st.p.stamina = clamp(st.p.stamina+o.stamina,0,CFG.STAMINA_MAX);
  Object.keys(ATTRS).forEach(function(k){
    if(o[k]) { st.p.attrs[k] += o[k]; pushFx(st,'gain',ATTRS[k]+' +'+o[k]); }
  });
  healCap(st);
}

/* ============================================================
   9. 地图可达 / 行路 / 探看
   ============================================================ */
function regionUnlocked(st, r){
  if(st.p.lv >= r.lv) return true;
  return r.nodes.some(function(n){ return st.p.seen.nodes[n.id]; });
}
function canReach(st, nodeId){
  var n = NODE_MAP[nodeId]; if(!n) return { ok:false, why:'没有这个地方' };
  if(st.travel || st.combat || st.event) return { ok:false, why:'正走不开' };
  var seen = !!st.p.seen.nodes[nodeId];
  if(seen) return { ok:true, seen:true };
  var r = REGION_MAP[n.region];
  if(!regionUnlocked(st, r)) return { ok:false, why:'路还没走到那边' };
  if(st.p.lv < n.lv - 6) return { ok:false, why:'那边风紧，再练练' };
  if(n.region !== st.p.region){
    if(r.nodes[0].id !== nodeId) return { ok:false, why:'先到 '+r.nodes[0].n+' 落脚' };
    return { ok:true };
  }
  var cur = NODE_MAP[st.p.node];
  if(!cur || cur.links.indexOf(nodeId) < 0) return { ok:false, why:'得从相邻的路过去' };
  return { ok:true };
}
function startExplore(st, nodeId, silent){
  var chk = canReach(st, nodeId);
  if(!chk.ok){
    // 上一个地方正在「探看」的那一两息，不该把玩家锁在原地：允许直接换个去处
    if(st.travel && st.travel.phase === 'search' && !st.combat && !st.event) chk = { ok:true };
    else { if(!silent) pushFx(st,'toast',chk.why); return false; }
  }
  var n = NODE_MAP[nodeId];
  if(st.p.stamina < 1){ if(!silent) pushFx(st,'toast','气力不济，歇一歇'); return false; }
  st.p.stamina--;
  st.idleOn = true;
  var fromId = st.p.node;
  var moving = nodeId !== fromId;
  if(moving){
    // 先落地，再走完路上那点时辰：画面立刻换过去，不再干等行路进度
    pushLog(st, pick(TXT.walk).replace('{p}',NODE_MAP[fromId].n), 'dim');
    arriveNode(st, nodeId);
    st.travel = { to:nodeId, from:fromId, phase:'search', left:CFG.SEARCH_SEC, total:CFG.SEARCH_SEC };
    pushFx(st,'move',n.n);
  } else {
    st.travel = { to:nodeId, from:fromId, phase:'search', left:CFG.SEARCH_SEC, total:CFG.SEARCH_SEC };
    pushLog(st,'在'+n.n+'细看一圈，没别的响动。','dim');
    pushFx(st,'move',n.n);
  }
  return true;
}
function arriveNode(st, nodeId){
  var n = NODE_MAP[nodeId]; if(!n) return;
  st.p.node = nodeId; st.p.region = n.region;
  st.weather = weatherOf(st, ts());
  var fresh = markSeen(st,'nodes',nodeId,n);
  pushLog(st,pick(TXT.arrive).replace('{p}',n.n),'');
  if(fresh){
    pushFx(st,'place',n.n);
    pushFx(st,'toast','记下了一处地方 · '+n.n);
    if(INSCRIPTIONS[nodeId]){
      pushLog(st, INSCRIPTIONS[nodeId], 'jade');
      addLore(st, 'stele_'+nodeId, n.n+' · 碑', INSCRIPTIONS[nodeId]);
      pushFx(st,'stele',n.n);
    }
  }
  if(n.npcs && n.npcs.length) n.npcs.forEach(function(id){
    var p = NPC_MAP[id]; if(p && markSeen(st,'npcs',id,{n:p.n,d:p.intro})) pushLog(st,p.intro,'jade');
  });
}
/* 半张舆图：三段只走一次，按脚下的地界慢慢接上 */
function chainEventFor(st, n, tm){
  var f = st.p.flags || {};
  if(!f.chain_map && n.dg <= 3 && chance(0.05 * tm.event)) return CHAIN[0];
  if(f.chain_map && !f.chain_trace && n.region !== 'huainan' && chance(0.10 * tm.event)) return CHAIN[1];
  if(f.chain_trace && !f.chain_end && (n.region==='xiyu'||n.region==='saibei') && n.kind==='秘境' && chance(0.16 * tm.event)) return CHAIN[2];
  return null;
}
function resolveExplore(st){
  var n = NODE_MAP[st.travel ? st.travel.to : st.p.node] || NODE_MAP[st.p.node];
  st.travel = null;
  st.p.explores++;
  var r = Math.random();
  var dg = n.dg||0;
  var tm = timeMod(st, ts());
  var cid = chainEventFor(st, n, tm);
  if(cid){
    var cev = evById(cid);
    markSeen(st,'events',cev.id,{ n:cev.t, d:cev.text.slice(0,40) });
    st.event = { id:cev.id, node:n.id, wait:0, chain:true };
    pushFx(st,'event',cev.t);
    pushLog(st,'在'+n.n+'遇上『'+cev.t+'』。','gold');
    return;
  }
  if(n.boss && !st.p.bossKills[n.boss] && r < 0.10 + dg*0.008){
    startCombat(st, n.boss, { boss:true, node:n });
    return;
  }
  if(r < 0.30 + dg*0.014){
    var tgt = Math.max(n.lv, Math.min(st.p.lv, 120));
    var pool = ENEMIES.filter(function(e){ return Math.abs(e.lv - tgt) <= 6; });
    if(!pool.length) pool = ENEMIES.slice(-4);
    var e = pick(pool);
    startCombat(st, e.id, { node:n });
    return;
  }
  if(r < 0.82){
    var poolEv = (n.pool||[]).filter(function(id){ return !!EVENTS.find(function(x){ return x.id === id; }); });
    var ev = poolEv.length ? evById(pick(poolEv)) : pick(EVENTS);
    markSeen(st,'events',ev.id,{ n:ev.t, d:ev.text.slice(0,40) });
    st.event = { id:ev.id, node:n.id, wait:0 };
    pushFx(st,'event',ev.t);
    pushLog(st,'在'+n.n+'遇上『'+ev.t+'』。','gold');
    return;
  }
  // 纯粹的所见
  pushLog(st,pick(TXT.loot),'');
  var gainExp = 12 + n.lv*4;
  addExp(st,gainExp);
  if(chance(0.55)) addItem(st, chance(0.5)?'herb':'page', 1, 0);
  if(chance(0.10 + dg*0.012)){ var eq = rollEquip(st,n); if(eq) pushLog(st,'石缝里捡着一件'+ITEM_MAP[eq.id].n+'。','gold'); }
  if(chance(0.35)) grantRes(st,{ silver: 8 + n.lv*3 });
  pushFx(st,'gain','+'+fmt(gainExp)+' 修为');
}

/* ============================================================
   10. 事件效果解释 / 抉择
   ============================================================ */
function applyEffects(st, fx, ctx){
  var lines = [];
  (fx||[]).forEach(function(f){
    switch(f.k){
      case 'res': {
        var b = { exp:st.p.exp, lv:st.p.lv, silver:st.p.silver, hp:st.p.hp, mp:st.p.mp, stamina:st.p.stamina, attrs:deep(st.p.attrs) };
        grantRes(st,f);
        var parts = [];
        if(st.p.lv > b.lv) parts.push('修为精进至 '+st.p.lv+' 阶');
        else if(st.p.exp !== b.exp) parts.push('修为 '+(st.p.exp>b.exp?'+':'')+(st.p.exp-b.exp));
        var ds = st.p.silver - b.silver; if(ds) parts.push('银两 '+(ds>0?'+':'')+ds);
        var dh = Math.round(st.p.hp - b.hp); if(dh) parts.push('气血 '+(dh>0?'+':'')+dh);
        var dm = Math.round(st.p.mp - b.mp); if(dm) parts.push('内息 '+(dm>0?'+':'')+dm);
        var dst = st.p.stamina - b.stamina; if(dst) parts.push('气力 '+(dst>0?'+':'')+dst);
        Object.keys(ATTRS).forEach(function(k){
          var d = st.p.attrs[k] - b.attrs[k];
          if(d) parts.push(ATTRS[k]+' '+(d>0?'+':'')+d);
        });
        if(parts.length) lines.push(parts.join(' · '));
        break; }
      case 'item': addItem(st,f.id,f.n||1,f.q||0); lines.push('得到 '+ITEM_MAP[f.id].n+' ×'+(f.n||1)); pushFx(st,'gain','+ '+ITEM_MAP[f.id].n); break;
      case 'equip': { var eq = rollEquip(st, ctx && ctx.node);
        if(eq){ var q = Math.max(0,(f.q||1)-1); eq.q = clamp(q + (chance(.3)?1:0),0,5);
          lines.push('得到 '+QN[eq.q]+'的'+ITEM_MAP[eq.id].n); pushFx(st,'gain',ITEM_MAP[eq.id].n); } break; }
      case 'art': {
        if(learnArt(st,f.id)) lines.push('习得 '+ART_MAP[f.id].n);
        else lines.push('「'+ART_MAP[f.id].n+'」的路数，早已记在心里。');
        break; }
      case 'combat': {
        var id = f.id;
        if(!id){ var pool = ENEMIES.filter(function(e){ return Math.abs(e.lv - st.p.lv) <= 6; }); if(!pool.length) pool = ENEMIES.slice(-4); id = pick(pool).id; }
        if(startCombat(st,id,{ node: ctx && ctx.node })) lines.push(f.s || '有人拦在面前。'); break; }
      case 'chance': if(chance(f.p||.3)) lines = lines.concat(applyEffects(st,f.fx,ctx));
        else if(f.alt) lines = lines.concat(applyEffects(st,f.alt,ctx)); break;
      case 'check': break; // 由 chooseOption 处理
      case 'text': lines.push(f.s); pushLog(st,f.s,''); break;
      case 'lore': if(addLore(st,f.id,f.n,f.d)) lines.push('见闻 +1 · '+(f.n||'旧闻')); break;
      case 'flag': st.p.flags[f.id] = 1; break;
      case 'npc': {
        var np = NPC_MAP[f.id]; if(!np) break;
        markSeen(st,'npcs',np.id,{n:np.n,d:np.intro});
        pushLog(st,np.intro,'jade');
        lines.push(np.intro);
        if(!st.p.npcGift[np.id]){
          st.p.npcGift[np.id] = 1;
          if(np.teach && !st.p.arts[np.teach]) learnArt(st,np.teach);
          if(np.gift) { addItem(st,np.gift,1,0); lines.push('得到 '+ITEM_MAP[np.gift].n); }
        }
        break; }
    }
  });
  return lines;
}
function checkRate(st, chk){
  var s = stats(st.p);
  var v = s.attrs[chk.a] || 10;
  return clamp(0.22 + (v - chk.dc) / Math.max(10, chk.dc) * 0.9, 0.12, 0.94);
}
function chooseOption(st, idx){
  if(!st.event) return null;
  var ev = evById(st.event.id);
  var opt = ev.opts[idx]; if(!opt) return null;
  var node = NODE_MAP[st.event.node] || NODE_MAP[st.p.node];
  var ctx = { node:node };
  st.event = null;
  var before = { exp:st.p.exp, lv:st.p.lv, silver:st.p.silver, hp:st.p.hp, mp:st.p.mp,
                 bag:st.p.bag.length, arts:Object.keys(st.p.arts).length, lore:st.p.lore.length,
                 flags:Object.keys(st.p.flags||{}).length, combat:!!st.combat };
  // 兼容旧数据：有些选项把检定写进了 fx 数组，这里把它提出来当 opt.check 用
  var inlineCheck = null;
  var fx = (opt.fx||[]).filter(function(f){
    if(f && f.k === 'check'){ inlineCheck = f; return false; }
    return true;
  });
  var lines = applyEffects(st, fx, ctx);
  var outcome = '';
  var ck = opt.check || inlineCheck;
  if(ck){
    var rate = checkRate(st, ck);
    if(chance(rate)){ outcome = '成'; lines = lines.concat(applyEffects(st,opt.ok,ctx)); }
    else { outcome = '未成'; lines = lines.concat(applyEffects(st,opt.fail,ctx)); }
  } else if((opt.ok||[]).length){
    // 无检定的选项，ok 就是必然结果（旧数据里大量叙事与奖励写在这一段）
    lines = lines.concat(applyEffects(st,opt.ok,ctx));
  }
  // 兜底：效果已经结算但没有任何文案时，至少把实际变化写出来
  if(!lines.length){
    var d = [];
    if(st.p.lv !== before.lv) d.push('修为精进至 '+st.p.lv+' 阶');
    else if(st.p.exp !== before.exp) d.push('修为 '+(st.p.exp>before.exp?'+':'')+(st.p.exp-before.exp));
    var ds2 = st.p.silver - before.silver; if(ds2) d.push('银两 '+(ds2>0?'+':'')+ds2);
    var dh2 = Math.round(st.p.hp - before.hp); if(dh2) d.push('气血 '+(dh2>0?'+':'')+dh2);
    var dm2 = Math.round(st.p.mp - before.mp); if(dm2) d.push('内息 '+(dm2>0?'+':'')+dm2);
    if(st.p.bag.length > before.bag) d.push('行囊 +'+(st.p.bag.length-before.bag));
    if(Object.keys(st.p.arts).length > before.arts) d.push('武学 +'+(Object.keys(st.p.arts).length-before.arts));
    if(st.p.lore.length > before.lore) d.push('见闻 +'+(st.p.lore.length-before.lore));
    var fl2 = Object.keys(st.p.flags||{}).length;
    if(fl2 > before.flags) d.push('线索 +'+(fl2-before.flags));
    if(st.combat && !before.combat) d.push('有人拦在面前');
    if(d.length) lines.push(d.join(' · '));
  }
  if(!lines.length && outcome === '未成') lines.push('这一下没成。');
  pushLog(st,'〔'+opt.t+'〕'+(outcome?' · '+outcome:''),'dim');
  pushFx(st,'choice',opt.t);
  healCap(st);
  return { title:'〔'+opt.t+'〕', lines:lines.filter(Boolean) };
}
function autoChoose(st){
  if(!st.event) return null;
  var ev = evById(st.event.id);
  var i = st.event.chain ? 0 : Math.floor(Math.random()*ev.opts.length);
  var res = chooseOption(st,i);
  if(res && res.lines && res.lines.length) pushFx(st,'toast',res.lines[0]);
  return res;
}

/* ============================================================
   11. 时间推进 · 在线细粒度
   ============================================================ */
function idleTick(st){
  var n = NODE_MAP[st.p.node] || REGIONS[0].nodes[0];
  var y = n.yield || { exp:2, silver:2 };
  var scale = 1 + n.lv*0.04;
  var tm = timeMod(st, ts());
  var gainExp = y.exp*scale*rnd(0.82,1.18)*tm.exp;
  var gainSilver = y.silver*scale*rnd(0.82,1.18)*tm.silver;
  addExp(st,gainExp);
  st.p.silver += Math.floor(gainSilver);
  var s = healCap(st);
  st.p.hp = Math.min(s.hpMax, st.p.hp + s.hpMax*0.012);
  st.p.mp = Math.min(s.mpMax, st.p.mp + s.mpMax*0.028);
  if(chance((y.herb||0.04)*0.4*tm.herb)) { addItem(st,'herb',1,0); pushFx(st,'gain','+ 止血草'); }
  if(chance((y.page||0.03)*0.4*tm.page)) { addItem(st,'page',1,0); pushFx(st,'gain','+ 武学残页'); }
  if(chance((0.006 + n.dg*0.004)*tm.loot)) { var eq = rollEquip(st,n); if(eq) pushLog(st,'草窠里翻出一件'+ITEM_MAP[eq.id].n+'。','gold'); }
  // 偶发叙事
  st.counters.idle++;
  if(st.counters.idle % 7 === 0) pushLog(st,pick(TXT.idle).replace('{p}',n.n),'dim');
  // 遭遇
  if(!st.combat && chance((0.018 + n.dg*0.010)*tm.enc)){
    var tgt = Math.max(n.lv, Math.min(st.p.lv, 120));
    var pool = ENEMIES.filter(function(e){ return Math.abs(e.lv - tgt) <= 6; });
    if(!pool.length) pool = ENEMIES.slice(-4);
    var e = pick(pool);
    startCombat(st,e.id,{ node:n });
  }
  pushFx(st,'tick','');
}
function autoWander(st){
  if(!st.auto || st.p.stamina < 1 || st.combat || st.event || st.travel) return;
  var n = NODE_MAP[st.p.node];
  var cand = n.links.map(function(id){ return NODE_MAP[id]; }).filter(function(x){
    return x && canReach(st,x.id).ok;
  });
  if(!cand.length){
    var r = REGION_MAP[st.p.region];
    cand = r.nodes.filter(function(x){ return st.p.seen.nodes[x.id] && x.id !== st.p.node; });
  }
  var target = pick(cand.length ? cand : [n]);
  if(!startExplore(st,target.id,true)) return;
  pushLog(st, target.id === st.p.node ? '在原地又转了一圈。' : '顺着路，信步往'+target.n+'去。','dim');
}
function simulateOnline(st, sec){
  var c = st.counters;
  // 体力 / 常驻恢复始终生效
  c.stamina += sec;
  while(c.stamina >= CFG.STAMINA_SEC){
    c.stamina -= CFG.STAMINA_SEC;
    if(st.p.stamina < CFG.STAMINA_MAX) st.p.stamina++;
  }
  if(st.combat){
    c.combat += sec;
    var guard = 0;
    while(c.combat >= CFG.COMBAT_TICK && st.combat && guard++ < 60){
      c.combat -= CFG.COMBAT_TICK;
      combatStep(st);
    }
    return;
  }
  if(st.event){
    st.event.wait = (st.event.wait||0) + sec;
    if(st.auto && st.event.wait >= CFG.EVENT_WAIT) autoChoose(st);
    return;
  }
  if(st.travel){
    st.travel.left -= sec;
    if(st.travel.left <= 0){
      if(st.travel.phase === 'move'){
        arriveNode(st,st.travel.to);
        st.travel = { to:st.p.node, from:st.p.node, phase:'search', left:CFG.SEARCH_SEC, total:CFG.SEARCH_SEC };
      } else resolveExplore(st);
    }
    return;
  }
  // 驻留历练
  if(st.idleOn){
    c.idle += sec;
    var g = 0;
    while(c.idle >= CFG.IDLE_TICK && g++ < 40){ c.idle -= CFG.IDLE_TICK; idleTick(st); }
  }
  c.auto += sec;
  while(c.auto >= CFG.AUTO_SEC){ c.auto -= CFG.AUTO_SEC; autoWander(st); }
}

/* ============================================================
   12. 离线结算 · 手机后台 / 熄屏 / 关页后回来
   纯时间差换算，不依赖页面常驻进程
   ============================================================ */
function offlineNarrative(st, sec, lines, n){
  var h = sec/3600;
  var open = pick(TXT.offline);
  lines.push(open);
  if(h >= 1) lines.push('天光挪过一截，' + n.n + '的影子换了方向。');
  if(st.auto && h >= 0.3) lines.push('沿路走过几处地方，鞋底带回来的土和去时不是一种颜色。');
  if(chance(.55)) lines.push(pick(TXT.idle).replace('{p}',n.n));
  if(h >= 4) lines.push('不知哪一刻下过一阵雨，石阶缝里还是湿的。');
  if(h >= 9) lines.push('回来时，巷口那盏灯已经换过一回油了。');
}
function settleOffline(st, ms){
  var capH = clamp(st.settings.offlineCap||CFG.OFFLINE_CAP_H, 1, 48);
  var cappedMs = Math.min(ms, capH*3600*1000);
  var sec = cappedMs/1000;
  if(sec < 2) return null;
  var n = NODE_MAP[st.p.node] || REGIONS[0].nodes[0];
  var y = n.yield || { exp:2, silver:2 };
  var scale = 1 + n.lv*0.04;
  var ticks = Math.floor(sec / CFG.IDLE_TICK);
  var factor = st.auto ? 0.62 : 0.72;   // 巡游/遭遇占用时间的折算
  var tm = timeMod(st, ts());
  var exp = Math.floor(y.exp * scale * ticks * factor * tm.exp * rnd(0.92,1.08));
  var silver = Math.floor(y.silver * scale * ticks * factor * tm.silver * rnd(0.92,1.08));
  var before = { lv:st.p.lv, exp:st.p.exp, silver:st.p.silver };
  addExp(st,exp);
  st.p.silver += silver;
  var s = healCap(st);
  st.p.hp = s.hpMax; st.p.mp = s.mpMax;
  st.p.stamina = CFG.STAMINA_MAX;
  // 批量道具
  var items = [];
  var herb = Math.min(30, Math.floor(ticks*(y.herb||.04)*factor*0.3*tm.herb));
  var page = Math.min(20, Math.floor(ticks*(y.page||.03)*factor*0.3*tm.page));
  if(herb > 0){ addItem(st,'herb',herb,0); items.push({ n:'止血草', v:herb }); }
  if(page > 0){ addItem(st,'page',page,0); items.push({ n:'武学残页', v:page }); }
  var eqN = Math.min(3, Math.floor(ticks*(0.006 + n.dg*0.004)*factor*0.35));
  for(var i=0;i<eqN;i++){ var eq = rollEquip(st,n); if(eq) items.push({ n:QN[eq.q]+'·'+ITEM_MAP[eq.id].n, v:1 }); }
  // 战斗折算
  var battles = Math.floor(ticks*(0.009 + n.dg*0.005)*factor*tm.enc);
  if(battles > 0){
    addExp(st, battles*(8 + n.lv*3));
    st.p.silver += battles*(5 + n.lv*2);
    st.p.kills += battles;
    if(chance(clamp(battles*0.12,0,.9))){ addItem(st,'dan_qi',1,0); items.push({ n:'益气丹', v:1 }); }
  }
  // 巡游探索折算
  var explores = 0;
  if(st.auto){
    explores = Math.min(28, Math.floor(sec/CFG.AUTO_SEC));
    if(explores > 0){
      var cand = n.links.map(function(id){ return NODE_MAP[id]; }).filter(Boolean);
      var picked = [];
      for(var j=0;j<Math.min(explores,4);j++){
        var t = pick(cand.length?cand:[n]);
        if(picked.indexOf(t.n) < 0){ picked.push(t.n); markSeen(st,'nodes',t.id,t); }
      }
      addExp(st, explores*(10+n.lv*2));
      if(chance(.7)){ addItem(st,'page',Math.max(1,Math.floor(explores/6)),0); }
    }
  }
  var lines = [];
  offlineNarrative(st,sec,lines,n);
  if(battles > 0) lines.push('道上遇过几回不长眼的人，衣袖上添了两道口子，已经洗净叠好。');
  if(explores > 0) lines.push('几处岔路都走过了，回来时天已经黑透。');
  // 补记一条日志
  pushLog(st,'回到'+n.n+'。','dim');
  var report = {
    ms:ms, capped: ms > capH*3600*1000, capH:capH,
    exp:exp + battles*(8+n.lv*3) + explores*(10+n.lv*2),
    silver:silver + battles*(5+n.lv*2),

}
function advance(st, now){
  now = now || ts();
  var dt = now - st.lastSeen;
  if(dt <= 0) return null;   // 同一时刻与时钟回拨都不推进，也不回拨时间戳
  st.lastSeen = now;
  if(dt > CFG.GAP_MS){
    var rep = settleOffline(st,dt);
    // 批量结算的所得统一由归途纪事呈现，丢弃逐条飘字，避免盖住卷轴
    st.fx.length = 0;
    if(rep && dt >= CFG.REPORT_MIN) st.reports.push(rep);
    return rep;
  }
  simulateOnline(st, dt/1000);
  return null;
}
function flushReports(st){
  if(!st.reports || !st.reports.length) return null;
  var rs = st.reports.slice(); st.reports.length = 0;
  var out = { ms:0, exp:0, silver:0, items:[], lines:[], battles:0, explores:0, lvUp:0, capH:rs[0].capH, capped:false };
  rs.forEach(function(r){
    out.ms += r.ms; out.exp += r.exp; out.silver += r.silver; out.battles += r.battles;
    out.explores += r.explores; out.lvUp += r.lvUp; out.capped = out.capped || r.capped;
    r.items.forEach(function(x){ var f = out.items.find(function(y){ return y.n === x.n; }); if(f) f.v += x.v; else out.items.push({ n:x.n, v:x.v }); });
    r.lines.forEach(function(x){ if(out.lines.indexOf(x) < 0 && out.lines.length < 7) out.lines.push(x); });
  });
  return out;
}

function checkGoals(st){
  var p = st.p, got = [];
  p.goals = p.goals || {};
  GOALS.forEach(function(g){
    if(p.goals[g.id]) return;
    var ok = false;
    try { ok = !!g.test(p); } catch(e){ ok = false; }
    if(!ok) return;
    p.goals[g.id] = 1;
    got.push(g);
    addLore(st, 'goal_'+g.id, g.n, g.log);
    if(g.gift) grantRes(st, g.gift);

  });

}

   13. 战斗 · 自动回合 + 手动发招

var P_ACT = ['剑出惊鸿，白虹贯日','错步回风，指点重穴','大开大阖，掌挟狂飙','反手抽剑，断水穿石','沉肩坠肘，劲发龙吟','欺身直进，剑走偏锋','凌空飞渡，居高临下一剑斩落'];
var E_ACT = ['力劈华山，势不可当','横扫千军，重刃破风','翻云覆雨，急攻周身要害','袖里藏针，暗取下盘死穴','毒龙出洞，长矛直刺咽喉','恶虎扑食，铁爪连环撕抓','沉声怒喝，催动护体罡气撞来'];
var MISS_TXT = ['凌波微折，衣袂翩然避过','横剑斜引，以太极柔劲化去煞力','足尖点水，飘然倒退三尺','侧身移形，险险擦过刀芒锋芒'];

function scaledEnemy(d, node){
  var k = 1 + (node ? node.lv : d.lv)*0.012;
  return {
    id:d.id, n:d.n, lv:d.lv, q:d.q, boss:!!d.boss, art:d.art||null, artChance:d.artChance||0,
    hpMax:Math.floor(d.hp*k), hp:Math.floor(d.hp*k),
    atk:Math.floor(d.atk*k), def:Math.floor(d.def*k), agi:Math.floor(d.agi*(1+(node?node.lv:0)*0.005)),
    crit:0.05 + (d.q||0)*0.015
  };
}
function startCombat(st, id, ctx){
  if(st.combat) return false;
  var d = ENEMY_MAP[id] || ENEMIES[0];
  var node = (ctx && ctx.node) || NODE_MAP[st.p.node];
  var e = scaledEnemy(d,node);
  st.combat = { e:e, turn:0, cd:{}, focus:0, tell:0, breaks:0, boss:!!d.boss, node:node?node.id:null, start:ts() };
  if(e.boss) pushFx(st,'bossStart',d.n);
  st.counters.combat = 0;
  markSeen(st,'enemies',id,{ n:d.n, d:d.d });
  pushLog(st,d.n+'拦在面前。'+d.d,'red');
  pushFx(st,'combatStart',d.n,{ boss:e.boss });
  return true;
}
function damage(atk, def, mul){
  var raw = atk*(mul||1) - def*0.55;
  return Math.max(1, Math.round(raw*rnd(0.88,1.14)));
}
function skillOf(st, idx){
  var id = st.p.skills[idx];
  if(!id || !st.p.arts[id]) return null;
  var a = ART_MAP[id];
  if(!a || a.type !== 'wai') return null;
  var lv = st.p.arts[id] || 1;
  return { id:id, a:a, cost:Math.floor(a.cost*(1+(lv-1)*0.08)), pow:a.pow*(1+(lv-1)*0.16), cd:a.cd };
}
function useSkill(st, idx){
  var c = st.combat;
  if(!c) { pushFx(st,'toast','眼前没有人'); return false; }
  var sk = skillOf(st,idx);
  if(!sk) { pushFx(st,'toast','这一式还没学会'); return false; }
  var now = ts();
  if((c.cd[idx]||0) > now){ pushFx(st,'toast','这一式还没收回'); return false; }
  if(st.p.mp < sk.cost){ pushFx(st,'toast','内息跟不上'); return false; }
  st.p.mp -= sk.cost;
  c.cd[idx] = now + sk.cd*1000;
  var s = stats(st.p);
  var crit = chance(s.crit + 0.05);
  var mul = sk.pow * (1 + (chance(.22)?0.25:0));
  if(c.tell){
    c.tell = 0; c.charge = 0; c.focus = 0;
    c.breaks = (c.breaks||0) + 1;
    mul *= 1.75; crit = true;
    st.p.mp = Math.min(s.mpMax, st.p.mp + Math.ceil(sk.cost*0.6));
    pushFx(st,'break',sk.a.n);
    pushLog(st,'趁他换气未定，一招递了进去。','gold');
  }
  var dmg = damage(s.atk, c.e.def, mul);
  if(crit) dmg = Math.round(dmg*1.65);
  c.e.hp -= dmg;
  pushFx(st,'skill',sk.a.n,{ side:'enemy', crit:crit });
  pushFx(st,'dmg','-'+fmt(dmg),{ side:'enemy', crit:crit });
  pushLog(st,'使出「'+sk.a.n+'」，'+(crit?'正中要害。':'逼得对方退了半步。'),'gold');
  if(c.e.hp <= 0) endCombat(st,true);
  return true;
}
function combatStep(st){
  var c = st.combat; if(!c) return;
  var e = c.e, p = st.p, s = stats(p);
  c.turn++;
  var critical = chance(s.crit);
  var art = ART_MAP[p.slots.wai] || ART_MAP.changquan;
  var lv = p.arts[art.id] || 1;
  var basePow = art.pow*0.55*(1+(lv-1)*0.14)*rnd(0.9,1.1);
  var d1 = damage(s.atk, e.def, basePow);
  if(critical) d1 = Math.round(d1*1.7);
  e.hp -= d1;
  pushFx(st,'hit',pick(P_ACT),{ side:'enemy', crit:critical });
  pushFx(st,'dmg','-'+fmt(d1),{ side:'enemy', crit:critical });
  if(c.turn % 3 === 1 || critical) pushLog(st,pick(P_ACT)+'，'+(critical?'一记正着。':'逼退半步。'),'dim');
  if(e.hp <= 0){ endCombat(st,true); return; }

  // 敌手蓄势：先露破绽，下一回合才发重击；此刻出招可截势
  c.focus++;
  var charged = false;
  if(c.tell){ c.tell = 0; c.charge = 2; c.focus = 0; charged = true; }
  else if(c.focus >= 4 && (e.boss || chance(.55))){
    c.tell = 1;
    pushFx(st,'tell',e.n);
    pushLog(st,'对方肩头一沉，气提到胸口，脚下没动。','red');
  }
  var emul = rnd(0.85,1.15) * (c.charge === 2 ? 1.7 : 1) * (e.boss?1.08:1);
  if(c.charge === 2) c.charge = 0;
  var dodge = clamp(0.04 + (s.agi - e.agi)*0.0035, 0.02, 0.38);
  if(chance(dodge)){
    pushFx(st,'miss',pick(MISS_TXT),{ side:'self' });
    if(c.turn % 4 === 0) pushLog(st,pick(E_ACT)+'，'+pick(MISS_TXT)+'。','dim');
  } else {
    var ecrit = chance(e.crit);
    var d2 = damage(e.atk, s.def, emul);
    if(ecrit) d2 = Math.round(d2*1.55);
    p.hp -= d2;
    pushFx(st,'hit',charged?'蓄势一击':pick(E_ACT),{ side:'self', crit:ecrit });
    pushFx(st,'dmg','-'+fmt(d2),{ side:'self', crit:ecrit });
    if(c.turn % 4 === 0 || charged || ecrit) pushLog(st,(charged?'对方沉了口气，一击压过来。':pick(E_ACT)+'。')+'衣袖被带起一道风。','red');
  }
  if(charged) pushLog(st,'对方肩头一沉，来势比先前重了。','red');
  st.p.mp = Math.min(s.mpMax, st.p.mp + s.mpMax*0.045);
  if(p.hp <= 0){ endCombat(st,false); return; }
  if(c.turn >= 70) endCombat(st,false);
}
function endCombat(st, win){
  var c = st.combat; if(!c) return;
  var e = c.e, p = st.p, n = NODE_MAP[c.node] || NODE_MAP[p.node];
  st.combat = null; st.counters.combat = 0;
  var s = healCap(st);
  if(win){
    p.wins++; p.kills++;
    var exp = Math.floor((12 + e.lv*4) * (e.boss?3.2:1) * rnd(.9,1.12));
    var silver = Math.floor((6 + e.lv*3) * (e.boss?3:1) * rnd(.9,1.12));
    addExp(st,exp); p.silver += silver;
    pushLog(st,e.n+'退开了。地上落着几枚散银，衣袖上还沾着灰。','gold');
    pushFx(st,'gain','+'+fmt(silver)+' 银');
    pushFx(st,'win',e.n);
    pushFx(st,'gain','+'+fmt(exp)+' 修为');
    if(chance(.32)){ addItem(st,'herb',1,0); }
    if(chance(.18 + (n?n.dg:0)*0.01)){ addItem(st,'page',1,0); }
    if(chance(.10 + (e.boss?.4:0) + (n?n.dg*.012:0))){
      var eq = rollEquip(st,n);
      if(eq){ if(e.boss) eq.q = clamp(eq.q+1,0,5); pushLog(st,'地上落着一件'+QN[eq.q]+'的'+ITEM_MAP[eq.id].n+'。','gold'); }
    }
    if(e.boss){
      p.bossKills[e.id] = 1;
      addLore(st,'boss_'+e.id,e.n,n?n.n+'一役，'+e.n+'退走了。':'曾经交手的人。');
      pushLog(st,'『'+e.n+'』这一页，翻过去了。','gold');
      pushFx(st,'boss',e.n);
      if(e.art && !p.arts[e.art] && chance(e.artChance || .55)){
        learnArt(st,e.art);
        pushLog(st,'收势时忽然想起他起手那一式。','gold');
      }
    }
  } else {
    p.hp = Math.max(1, Math.floor(s.hpMax*0.34));
    p.mp = Math.max(0, Math.floor(s.mpMax*0.3));
    p.silver = Math.max(0, Math.floor(p.silver*0.97));
    pushLog(st,pick(TXT.loss),'red');
    pushLog(st,'缓过来时，'+e.n+'已经不在了。','dim');
    pushFx(st,'lose','不敌');
  }
  healCap(st);
}

      g.beginPath(); g.arc(cx,cy,rx,0,6.2832); g.fill();
      g.restore();
    }
    return c;
  }
  function grainSprite(){
    var s = 72;
    var c = document.createElement('canvas');
    c.width = s; c.height = s;
    var g = c.getContext('2d');
    var d = g.createImageData(s,s);
    for(var i=0;i<s*s;i++){
      var v = Math.random();
      d.data[i*4] = 210 + v*45;
      d.data[i*4+1] = d.data[i*4];
      d.data[i*4+2] = d.data[i*4];
      d.data[i*4+3] = v > 0.74 ? 30 : 0;
    }
    g.putImageData(d,0,0);

  }
  function buildSprites(){
    if(spr.mist) return;
    spr.mist = radialSprite(64, [
      [0,'rgba(255,255,255,.95)'],
      [.42,'rgba(255,255,255,.52)'],
      [.75,'rgba(255,255,255,.14)'],
      [1,'rgba(255,255,255,0)']
    ]);
    spr.cloud = cloudSprite(224, 84);
    spr.glow  = radialSprite(64, [
      [0,'rgba(255,247,226,.95)'],
      [.34,'rgba(255,236,192,.42)'],
      [1,'rgba(255,228,176,0)']
    ]);
    // 灯火：一味暖金，核心实、外圈虚，缩到几像素也不糊
    spr.lamp = radialSprite(64, [
      [0,'rgba(255,236,198,.98)'],
      [.17,'rgba(255,206,142,.60)'],
      [.44,'rgba(233,166,96,.20)'],
      [1,'rgba(226,150,84,0)']
