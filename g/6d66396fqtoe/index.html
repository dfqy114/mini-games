      g.strokeStyle = "rgba(110, 220, 255, 0.25)";
      g.lineWidth = 3;
      g.beginPath();
      g.moveTo(-11, 46);
      g.lineTo(-14, 70);
      g.moveTo(11, 46);
      g.lineTo(14, 70);
      g.stroke();
    }

    const PW = 220, PH = 400, POX = 110, POY = 305;
    const parcelSprite = makeSprite(100, 92, (g, w, h) => { g.translate(w / 2, h / 2); paintParcel(g); });
    const coneSprite = makeSprite(96, 96, (g, w, h) => { g.translate(w / 2, h / 2); paintCone(g); });
    const boostSprite = makeSprite(100, 100, (g, w, h) => { g.translate(w / 2, h / 2); paintBoost(g); });
    const playerSprite = makeSprite(PW, PH, (g) => { g.translate(POX, POY); paintPlayer(g); });

    /* 静态背景只画一次，逐帧只贴图 */
    const bgCanvas = document.createElement("canvas");
    let bg = null;
    function paintStaticBg(g) {
      const sky = g.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, "#0b1220");
      sky.addColorStop(0.5, "#0a101c");
      sky.addColorStop(1, "#060a12");
      g.fillStyle = sky;
      g.fillRect(0, 0, W, H);

      const skyGlow = g.createRadialGradient(W * 0.72, -40, 20, W * 0.72, 80, 420);
      skyGlow.addColorStop(0, "rgba(255, 170, 120, 0.28)");
      skyGlow.addColorStop(1, "rgba(255, 170, 120, 0)");
      g.fillStyle = skyGlow;
      g.fillRect(0, 0, W, 400);

      g.fillStyle = "#0c1422";
      g.fillRect(0, 0, 78, H);
      g.fillStyle = "#0d1524";
      g.fillRect(W - 78, 0, 78, H);

      g.fillStyle = "#101a2b";
      g.fillRect(78, 0, W - 156, H);
      const edge = g.createLinearGradient(78, 0, W - 78, 0);
      edge.addColorStop(0, "rgba(120, 170, 255, 0.12)");
      edge.addColorStop(0.5, "rgba(120, 170, 255, 0.015)");
      edge.addColorStop(1, "rgba(120, 170, 255, 0.12)");
      g.fillStyle = edge;
      g.fillRect(78, 0, W - 156, H);

      g.fillStyle = "rgba(255, 170, 120, 0.16)";
      g.fillRect(78, 0, 3, H);
      g.fillRect(W - 81, 0, 3, H);
    }
    function rebuildBackground() {
      bgCanvas.width = canvas.width;
      bgCanvas.height = canvas.height;
      bg = bgCanvas.getContext("2d");
      bg.setTransform(scale, 0, 0, scale, 0, 0);
      paintStaticBg(bg);
    }
    rebuildBackground();

    for (let i = 0, n = LP ? 22 : Q === "mid" ? 34 : 46; i < n; i++) {
      rain.push({ x: Math.random() * W, y: Math.random() * H, len: 14 + Math.random() * 26, sp: 500 + Math.random() * 500 });
    }

    const keys = { left: false, right: false };

    function onKey(e, down) {
      if (["ArrowLeft", "a", "A"].includes(e.key)) { keys.left = down; e.preventDefault(); }
      if (["ArrowRight", "d", "D"].includes(e.key)) { keys.right = down; e.preventDefault(); }
    }
    const kd = (e) => onKey(e, true);
    const ku = (e) => onKey(e, false);
    addCleanup(() => {
      window.removeEventListener("keydown", kd);
      window.removeEventListener("keyup", ku);
    });
    window.addEventListener("keydown", kd);
    window.addEventListener("keyup", ku);

    function pointerX(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = (e.clientX !== undefined ? e.clientX : 0) - rect.left;
      return (cx / Math.max(1, rect.width)) * W;
    }
    const pointerDown = (e) => {
      dragging = true;
      player.targetX = pointerX(e);
      if (canvas.setPointerCapture && e.pointerId !== undefined) {
        try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      }
    };
    const pointerMove = (e) => {
      if (!dragging) return;
      player.targetX = pointerX(e);
      e.preventDefault();
    };
    const pointerUp = () => { dragging = false; };
    canvas.addEventListener("pointerdown", pointerDown);
    canvas.addEventListener("pointermove", pointerMove, { passive: false });
    window.addEventListener("pointerup", pointerUp);
    window.addEventListener("pointercancel", pointerUp);
    addCleanup(() => {
      canvas.removeEventListener("pointerdown", pointerDown);
      canvas.removeEventListener("pointermove", pointerMove);
      window.removeEventListener("pointerup", pointerUp);
      window.removeEventListener("pointercancel", pointerUp);
    });

    function spawn() {
      const roll = Math.random();
      let kind = "parcel";
      if (roll > 0.78) kind = "cone";
      else if (roll > 0.68) kind = "boost";
      const x = 95 + Math.random() * (W - 190);
      objects.push({
        kind: kind,
        x: x,
        y: -50,
        r: kind === "cone" ? 30 : 24,
        vy: (kind === "cone" ? 250 : 210) + Math.random() * 90 + (28 - time) * 5,
        phase: Math.random() * Math.PI * 2
      });
    }

    ["parcel", "boost", "parcel", "cone", "parcel"].forEach((kind, i) => {
      objects.push({
        kind: kind,
        x: 110 + Math.random() * (W - 220),
        y: 100 + i * 145,
        r: kind === "cone" ? 30 : 24,
        vy: (kind === "cone" ? 260 : 220) + Math.random() * 60,
        phase: Math.random() * Math.PI * 2
      });
    });

    function burst(x, y, color, n) {
      const cap = LP ? 55 : Q === "mid" ? 90 : 130;
      n = Math.min(n, Math.max(0, cap - particles.length));
      for (let i = 0; i < n; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 260,
          vy: (Math.random() - 0.5) * 260 - 40,
          life: 0.6 + Math.random() * 0.4,
          color: color,
          size: 2 + Math.random() * 3
        });
      }
    }

    function floatOnCanvas(text, color, o) {
      const rect = canvas.getBoundingClientRect();
      floatAt(text, color, (o.x / W) * rect.width, (o.y / H) * rect.height);
    }

    function drawSideWindows() {
      ctx.fillStyle = "rgba(255, 205, 140, 0.16)";
      for (let side = 0; side < 2; side++) {
        const baseX = side === 0 ? 0 : W - 78;
        for (let y = -60 + ((roadOffset * 0.4) % 60); y < H; y += 60) {
          const cell = Math.floor(y / 60);
          for (let i = 0; i < 2; i++) {
            if ((cell + i + side) % 3 !== 0) ctx.fillRect(baseX + 12 + i * 30, y, 12, 18);
          }
        }
      }
    }

    function drawLane() {
      ctx.strokeStyle = "rgba(255, 255, 255, 0.035)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let y = (roadOffset * 0.5) % 90; y < H; y += 90) {
        ctx.moveTo(78, y);
        ctx.lineTo(W - 78, y);
      }
      ctx.stroke();

      ctx.strokeStyle = "rgba(255, 205, 140, 0.22)";
      ctx.lineWidth = 2;
      ctx.setLineDash([26, 24]);
      ctx.beginPath();
      const start = (roadOffset % 50) - 50;
      ctx.moveTo(W * 0.36, start);
      ctx.lineTo(W * 0.36, H);
      ctx.moveTo(W * 0.64, start);
      ctx.lineTo(W * 0.64, H);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawRain() {
      ctx.strokeStyle = "rgba(170, 200, 255, 0.16)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = 0; i < rain.length; i++) {
        const r = rain[i];
        ctx.moveTo(r.x, r.y);
        ctx.lineTo(r.x - r.len * 0.18, r.y + r.len);
      }
      ctx.stroke();
    }

    function update(dt, now) {
      if (!running) return;
      time = Math.max(0, (endAt - performance.now()) / 1000);
      roadOffset += 420 * dt;
      if (time <= 0) {
        time = 0;
        endGame();
        return;
      }
      if (now - hudAt >= 100) {
        hudAt = now;
        setTime((time / 28) * 100);
        setClock(Math.ceil(time) + "s");
      }

      if (keys.left) player.targetX -= 520 * dt;
      if (keys.right) player.targetX += 520 * dt;
      player.targetX = Math.max(105, Math.min(W - 105, player.targetX));
      const prevX = player.x;
      player.x += (player.targetX - player.x) * Math.min(1, dt * 12);
      player.tilt = (player.x - prevX) * 0.05;

      spawnTimer += dt;
      spawnGap = Math.max(0.22, 0.42 - (28 - time) * 0.006);
      if (spawnTimer > spawnGap) {
        spawnTimer = 0;
        spawn();
      }

      objects.forEach((o) => {
        o.y += o.vy * dt;
        o.phase += dt * 3;
        if (o.y > H + 60) o.dead = true;
        const dy = o.y - player.y;
        const dx = o.x - player.x;
        if (!o.dead && Math.abs(dy) < 38 && Math.abs(dx) < 40) {
          o.dead = true;
          if (o.kind === "parcel") {
            score += 10;
            setScore(score);
            burst(o.x, o.y, "#ffd479", 12);
            popBadge(document.getElementById("mg-combo"), "+10", "#ffd479");
            floatOnCanvas("+10", "#ffd479", o);
            sfx("coin");
          } else if (o.kind === "boost") {
            score += 15;
            endAt = Math.min(performance.now() + 35000, endAt + 1500);
            time = Math.max(0, (endAt - performance.now()) / 1000);
            setScore(score);
            burst(o.x, o.y, "#8ce9ff", 14);
            popBadge(document.getElementById("mg-combo"), "加速 +15", "#8ce9ff");
            floatOnCanvas("+1.5s", "#8ce9ff", o);
            sfx("success");
            vibrate(10);
          } else {
            score = Math.max(0, score - 5);
            setScore(score);
            shake = 14;
            endAt = Math.max(performance.now() + 400, endAt - 1500);
            time = Math.max(0, (endAt - performance.now()) / 1000);
            burst(o.x, o.y, "#ff8a5c", 16);
            popBadge(document.getElementById("mg-combo"), "撞击 -5", "#ff8a5c");
            floatOnCanvas("-5", "#ff8a5c", o);
            sfx("bad");
            vibrate(22);
          }
        }
      });

      for (let i = objects.length - 1; i >= 0; i--) if (objects[i].dead) objects.splice(i, 1);

      particles.forEach((p) => {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 220 * dt;
        p.life -= dt;
      });
      for (let i = particles.length - 1; i >= 0; i--) if (particles[i].life <= 0) particles.splice(i, 1);

      rain.forEach((r) => {
        r.y += r.sp * dt;
        r.x -= r.sp * 0.18 * dt;
        if (r.y > H + 40) { r.y = -40; r.x = Math.random() * W; }
      });
      if (shake > 0) shake = Math.max(0, shake - dt * 50);
    }

    function render() {
      ctx.save();
      if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      }
      ctx.drawImage(bgCanvas, -8, -8, W + 16, H + 16);
      drawSideWindows();
      drawLane();
      drawRain();

      for (let i = 0; i < objects.length; i++) {
        const o = objects[i];
        const sprite = o.kind === "parcel" ? parcelSprite : o.kind === "cone" ? coneSprite : boostSprite;
        const dw = o.kind === "parcel" ? 100 : o.kind === "cone" ? 96 : 100;
        const dh = o.kind === "parcel" ? 92 : 96;
        if (o.kind === "parcel") {
          ctx.save();
          ctx.translate(o.x, o.y);
          ctx.rotate(Math.sin(o.phase) * 0.08);
          ctx.drawImage(sprite, -dw / 2, -dh / 2, dw, dh);
          ctx.restore();
        } else {
          ctx.drawImage(sprite, o.x - dw / 2, o.y - dh / 2, dw, dh);
        }
      }

      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.tilt * 0.12);
      ctx.drawImage(playerSprite, -POX, -POY, PW, PH);
      ctx.restore();

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    /* 帧率持续偏低时自动降低后备分辨率（最多两档），不影响逻辑与手感 */
    function adaptResolution(now) {
      fpsFrames++;
      const span = now - fpsAt;
      if (span < 1200) return;
      const fps = (fpsFrames * 1000) / span;
      fpsAt = now;
      fpsFrames = 0;
      if (fps >= 42 || downscales >= 2 || scale <= 0.46) return;
      downscales++;
      scale = Math.max(0.45, scale * 0.8);
      canvas.width = Math.round(W * scale);
      canvas.height = Math.round(H * scale);
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.imageSmoothingEnabled = true;
      rebuildBackground();
    }

    function loop(now) {
      if (!running) return;
      const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
      last = now;
      update(dt, now);
      if (!running) return;
      adaptResolution(now);
      render();
      raf = requestAnimationFrame(loop);
    }

    function endGame() {
      if (!running) return;
      running = false;
      if (active !== me) return;
      const result = Game.finishMinigame("rider", score);
      showResult("rider", score, result, me);
    }

    const onVis = () => {
      if (active !== me) return;
      if (document.hidden) {
        hiddenAt = performance.now();
      } else if (hiddenAt) {
        endAt += performance.now() - hiddenAt;
        hiddenAt = 0;
        last = performance.now();
      }
    };
    document.addEventListener("visibilitychange", onVis);
    addCleanup(() => {
      document.removeEventListener("visibilitychange", onVis);
      running = false;
      if (raf) cancelAnimationFrame(raf);
    });

    raf = requestAnimationFrame(loop);
  }

  /* ============================================================
     2. 分拣快手
     ============================================================ */
  function openSorter(sid) {
    const pool = [
      { e: "box", name: "纸箱" },
      { e: "gift", name: "礼盒" },
      { e: "envelope", name: "信件" },
      { e: "luggage", name: "行李" },
      { e: "bag", name: "购物袋" },
      { e: "truck", name: "邮包" }
    ];
    function poolIcon(item) {
      if (window.UI && UI.icon) return UI.icon(item.e);
      return item.e;
    }
    let target = pool[1];
    let score = 0;
    let combo = 0;
    let endAt = performance.now() + 25000;
    let changes = 0;
    let running = true;
    let hiddenAt = 0;
    let hudAt = 0;
    let raf = 0;

    shell({
      icon: "📦",
      title: "分拣快手 · 夜班线",
      hud: hud("sorter", 25),
      body:
        '<div class="mg-play">' +
          '<div class="mg-target">只挑 <b id="mg-target-icon">' + (window.UI && UI.icon ? UI.icon("gift") : "🎁") + '</b><span id="mg-target-name">礼盒</span>' +
            '<span class="mg-target-tip">连击越高，加分越多</span>' +
          "</div>" +
          '<div class="mg-grid" id="mg-grid"></div>' +
          '<div class="mg-combo" id="mg-combo"></div>' +
        "</div>" +
        '<p class="mg-hint">点错会扣时间，连击越高加分越多。每 8 秒会换一次目标。</p>',
      onClose: () => askQuit(() => teardown(true))
    });

    const me = { type: "sorter", finished: false };
    if (sid !== session) return;
    active = me;

    const grid = document.getElementById("mg-grid");
    const N = 16;
    const TARGET_COUNT = 4;
    const cells = [];

    function targetIcon() {
      return pool.findIndex((p) => p.name === target.name);
    }

    function isTargetIcon(idx) {
      return pool[idx].name === target.name;
    }

    function randIcon(excludeTarget) {
      let idx;
      do { idx = Math.floor(Math.random() * pool.length); }
      while (excludeTarget && isTargetIcon(idx));
      return idx;
    }

    function paintCell(i, icon) {
      cells[i].icon = icon;
      const btn = grid.children[i];
      if (!btn) return;
      btn.innerHTML = poolIcon(pool[icon]);
      btn.setAttribute("aria-label", pool[icon].name);
    }

    /* 始终保持 4 个目标，点掉一个就从别处补一个，避免“点几下就全是错的” */
    function ensureTargets(exclude) {
      let have = 0;
      for (let i = 0; i < N; i++) if (isTargetIcon(cells[i].icon)) have++;
      let need = TARGET_COUNT - have;
      let guard = 300;
      while (need > 0 && guard-- > 0) {
        const i = Math.floor(Math.random() * N);
        if (i === exclude || isTargetIcon(cells[i].icon)) continue;
        paintCell(i, targetIcon());
        need--;
      }
    }

    function renderGrid() {
      if (grid.children.length !== N) {
        grid.innerHTML = cells
          .map((c, i) => '<button class="mg-cell" data-i="' + i + '" aria-label="' + pool[c.icon].name + '">' + poolIcon(pool[c.icon]) + "</button>")
          .join("");
        return;
      }
      for (let i = 0; i < N; i++) {
        const btn = grid.children[i];
        btn.innerHTML = poolIcon(pool[cells[i].icon]);
        btn.setAttribute("aria-label", pool[cells[i].icon].name);
      }
    }

    for (let i = 0; i < N; i++) cells.push({ icon: randIcon(false) });
    ensureTargets(-1);
    renderGrid();

    function setTarget() {
      let next;
      do { next = pool[Math.floor(Math.random() * pool.length)]; } while (next.name === target.name);
      target = next;
      const iconEl = document.getElementById("mg-target-icon");
      const nameEl = document.getElementById("mg-target-name");
      if (iconEl && nameEl) {
        iconEl.innerHTML = poolIcon(target);
        nameEl.textContent = target.name;
        if (iconEl.animate && !reducedMotion()) {
          iconEl.getAnimations().forEach((a) => a.cancel());
          iconEl.animate(
            [{ transform: "scale(0.7)", opacity: 0.4 }, { transform: "scale(1.18)" }, { transform: "scale(1)" }],
            { duration: 340, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }
          );
        }
      }
      ensureTargets(-1);
      renderGrid();
      combo = 0;
      const comboEl = document.getElementById("mg-combo");
      if (comboEl) comboEl.style.opacity = "0";
    }

    const clickHandler = (e) => {
      if (!running || active !== me) return;
      const btn = e.target.closest(".mg-cell");
      if (!btn) return;
      const i = Number(btn.dataset.i);
      if (!(i >= 0 && i < N)) return;
      const host = document.querySelector(".mg-play");
      const hrect = host ? host.getBoundingClientRect() : { left: 0, top: 0, width: 0, height: 0 };
      const fx = e.clientX ? e.clientX - hrect.left : hrect.width / 2;
      const fy = e.clientY ? e.clientY - hrect.top : hrect.height / 2;

      if (pool[cells[i].icon].name === target.name) {
        combo += 1;
        const gain = 5 + Math.min(7, Math.floor(combo / 2));
        score += gain;
        setScore(score);
        btn.classList.add("hit");
        setTimeout(() => btn.classList.remove("hit"), 140);
        sfx(combo >= 3 ? "combo" : "coin");
        popBadge(document.getElementById("mg-combo"), combo > 1 ? "连击 ×" + combo + "  +" + gain : "+" + gain, "#ffd479");
        floatAt("+" + gain, "#ffd479", fx, fy);
        paintCell(i, randIcon(true));
        ensureTargets(i);
      } else {
        combo = 0;
        score = Math.max(0, score - 4);
        setScore(score);
        endAt = Math.max(performance.now() + 400, endAt - 1500);
        btn.classList.add("miss");
        setTimeout(() => btn.classList.remove("miss"), 180);
        sfx("bad");
        popBadge(document.getElementById("mg-combo"), "分错了 · 时间 -1.5s", "#ff8a8a");
        floatAt("-1.5s", "#ff8a8a", fx, fy);
        vibrate(20);
      }
    };
    grid.addEventListener("click", clickHandler);

    const interval = setInterval(() => {
      if (!running || active !== me) return;
      changes++;
      if (changes % 8 === 0) setTarget();
    }, 1000);

    function endGame() {
      if (!running) return;
      running = false;
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      if (active !== me) return;
      const result = Game.finishMinigame("sorter", score);
      showResult("sorter", score, result, me);
    }

    function frame(now) {
      if (!running) return;
      const left = Math.max(0, (endAt - performance.now()) / 1000);
      if (now - hudAt >= 100 || left <= 0) {
        hudAt = now;
        setTime((left / 25) * 100);
        setClock(Math.ceil(left) + "s");
      }
      if (left <= 0) {
        endGame();
        return;
      }
      raf = requestAnimationFrame(frame);
    }

    const onVis = () => {
      if (active !== me) return;
      if (document.hidden) {
        hiddenAt = performance.now();
      } else if (hiddenAt) {
        endAt += performance.now() - hiddenAt;
        hiddenAt = 0;
      }
    };
    document.addEventListener("visibilitychange", onVis);

    addCleanup(() => {
      clearInterval(interval);
      grid.removeEventListener("click", clickHandler);
      document.removeEventListener("visibilitychange", onVis);
      running = false;
      if (raf) cancelAnimationFrame(raf);
    });

    raf = requestAnimationFrame(frame);
  }

  /* ============================================================
     3. 早市砍价
     ============================================================ */
  function openBargain(sid) {
    let round = 0;
    let wins = 0;
    const results = [];
    let zoneW = 32;
    let zoneStart = 34;
    let pos = 0;
    let dir = 1;
    let speed = 50;
    let playing = true;
    let waiting = false;
    let running = true;
    let raf = 0;
    let last = performance.now();

    shell({
      icon: "🗣️",
      title: "早市砍价 · 三局两胜",
      hud: hud("bargain", 0),
      body:
        '<div class="bargain-wrap">' +
          '<div style="text-align:center;margin-bottom:14px">' +
            '<div style="font-family:var(--serif);font-size:15px;letter-spacing:0.1em">「老板，再便宜两块嘛。」</div>' +
            '<p style="font-size:10px;color:var(--muted);margin-top:4px">早市七点，人声鼎沸。你要在摊主失去耐心之前，停在一个好数字上。</p>' +
          "</div>" +
          '<div class="bargain-info"><span>摊主的底线，就藏在这段绿色里</span><b id="b-round">第 1 / 3 局</b></div>' +
          '<div class="bargain-scale" id="b-scale">' +
            '<div class="bargain-zone" id="b-zone"></div>' +
            '<div class="bargain-marker" id="b-marker" style="left:0%"></div>' +
          "</div>" +
          '<div class="bargain-info"><span>绿色区域会越来越窄</span><b id="b-status">点击「停」</b></div>' +
          '<div class="bargain-rounds" id="b-rounds">' +
            '<span class="bargain-pip now"></span><span class="bargain-pip"></span><span class="bargain-pip"></span>' +
          "</div>" +
          '<div style="text-align:center;margin-top:18px">' +
            '<button class="btn primary" id="b-stop" style="min-width:150px;padding:10px 20px">停</button>' +
          "</div>" +
        "</div>" +
        '<p class="mg-hint">让指针停在绿色区间内。三局两胜，赢的局数越多，报酬越高。按空格也能停。</p>',
      onClose: () => askQuit(() => teardown(true))
    });

    const me = { type: "bargain", finished: false };
    if (sid !== session) return;
    active = me;

    const zoneEl = document.getElementById("b-zone");
    const markerEl = document.getElementById("b-marker");
    const roundEl = document.getElementById("b-round");
    const statusEl = document.getElementById("b-status");
    const roundsEl = document.getElementById("b-rounds");
    const stopBtn = document.getElementById("b-stop");

    function drawZone() {
      if (zoneEl) {
        zoneEl.style.left = zoneStart + "%";
        zoneEl.style.width = zoneW + "%";
      }
    }

    function updatePips() {
      setTime(((round + (playing ? 1 : 0)) / 3) * 100);
      const progress = document.getElementById("mg-time");
      if (progress) progress.style.background = "linear-gradient(90deg,#ffd479,#ff9d7a)";
      setScore(wins);
      setClock(Math.max(0, 3 - round) + " 局");
      if (!roundsEl) return;
      Array.from(roundsEl.children).forEach((el, i) => {
        const result = results[i];
        el.className =
          "bargain-pip" +
          (result === true ? " win" : result === false ? " lose" : i === round ? " now" : "");
      });
    }

    function nextRound() {
      if (!running || active !== me) return;
      if (round >= 3) {
        finish();
        return;
      }
      zoneW = [32, 25, 19][round] || 19;
      zoneStart = 12 + Math.random() * (76 - zoneW);
      speed = 50 + round * 14;
      pos = 0;
      dir = 1;
      waiting = false;
      playing = true;
      drawZone();
      updatePips();
      if (roundEl) roundEl.textContent = "第 " + (round + 1) + " / 3 局";
      if (statusEl) statusEl.textContent = round === 0 ? "点击「停」" : "又转起来了 · 更快了";
      if (stopBtn) {
        stopBtn.textContent = "停";
        stopBtn.disabled = false;
      }
      if (markerEl) {
        markerEl.style.left = "0%";
        markerEl.style.background = "linear-gradient(180deg,#fff3d8,#ffb46e)";
      }
      last = performance.now();
    }

    /* 单一常驻循环：暂停只冻结指针，不再取消动画帧，避免第二局停摆 */
    function frame(now) {
      if (!running) return;
      const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
      last = now;
      if (playing) {
        pos += dir * speed * dt;
        if (pos >= 100) { pos = 100; dir = -1; }
        else if (pos <= 0) { pos = 0; dir = 1; }
        if (markerEl) markerEl.style.left = pos + "%";
      }
      raf = requestAnimationFrame(frame);
    }

    function stop() {
      if (!running || !playing || waiting || active !== me) return;
      playing = false;
      waiting = true;
      const success = pos >= zoneStart && pos <= zoneStart + zoneW;
      if (success) {
        wins++;
        if (statusEl) statusEl.textContent = "砍下来了！";
        sfx("success");
        vibrate(10);
        if (markerEl) markerEl.style.background = "linear-gradient(180deg,#d9ffe9,#5fd6a4)";
      } else {
        if (statusEl) statusEl.textContent = pos < zoneStart ? "出手早了半拍…" : "再等半拍就好了…";
        sfx("bad");
        vibrate(20);
        if (markerEl) markerEl.style.background = "linear-gradient(180deg,#ffe0db,#ff6b6b)";
      }
      results.push(success);
      if (stopBtn) {
        stopBtn.textContent = "下一局…";
        stopBtn.disabled = true;
      }
      round++;
      updatePips();
      setTimeout(() => {
        if (!running || active !== me) return;
        if (round >= 3) finish();
        else nextRound();
      }, 900);
    }

    function finish() {
      if (!running || active !== me) return;
      running = false;
      playing = false;
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      const result = Game.finishMinigame("bargain", wins);
      showResult("bargain", wins, result, me);
    }

    if (stopBtn) {
      stopBtn.addEventListener("click", () => {
        if (!running || !playing) return;
        stop();
      });
    }

    const onKey = (e) => {
      if (e.key !== " " && e.key !== "Enter") return;
      if (!document.querySelector(".mg-modal") || active !== me) return;
      e.preventDefault();
      if (playing) stop();
    };
    document.addEventListener("keydown", onKey);

    addCleanup(() => {
      document.removeEventListener("keydown", onKey);
      running = false;
      playing = false;
      if (raf) cancelAnimationFrame(raf);
    });

    nextRound();
    raf = requestAnimationFrame(frame);
  }

  /* ============================================================
     4. 仓库盘点（记忆）
     ============================================================ */
  function openMemory(sid) {
    const pool = [
      { e: "box", name: "纸箱" },
      { e: "envelope", name: "信件" },
      { e: "bag", name: "购物袋" },
      { e: "scooter", name: "配件" },
      { e: "cat", name: "宠物件" },
      { e: "cup", name: "易碎品" }
    ];
    let round = 0;
    let score = 0;
    let lives = 2;
    let seq = [];
    let input = [];
    let phase = "idle";
    let endAt = performance.now() + 45000;
    let running = true;
    let raf = 0;
    let last = performance.now();
    let hiddenAt = 0;
    let hudAt = 0;
    const timers = [];

    function later(fn, ms) {
      const id = setTimeout(() => { if (running) fn(); }, ms);
      timers.push(id);
      return id;
    }

    function cellHtml(i) {
      return '<button class="mg-mem-cell" data-mem="' + i + '" aria-label="' + pool[i].name + '">' +
        (window.UI && UI.icon ? UI.icon(pool[i].e) : "") + "</button>";
    }

    shell({
      icon: "📋",
      title: "仓库盘点 · 夜班货位",
      hud: hud("memory", 45),
      body:
        '<div class="mg-play mg-mem">' +
          '<div class="mg-mem-head">' +
            '<span class="mg-mem-round" id="mg-mem-round">第 1 轮</span>' +
            '<span class="mg-mem-lives" id="mg-mem-lives"></span>' +
          "</div>" +
          '<p class="mg-mem-status" id="mg-mem-status">看清楚顺序</p>' +
          '<div class="mg-mem-grid" id="mg-mem-grid">' +
            pool.map((p, i) => cellHtml(i)).join("") +
          "</div>" +
          '<div class="mg-combo" id="mg-combo"></div>' +
        "</div>" +
        '<p class="mg-hint">每轮会亮起一串货位，按同样的顺序点回去。每轮更长，错两次就要收工。</p>',
      onClose: () => askQuit(() => teardown(true))
    });

    const me = { type: "memory", finished: false };
    if (sid !== session) return;
    active = me;

    const grid = document.getElementById("mg-mem-grid");
    const statusEl = document.getElementById("mg-mem-status");
    const roundEl = document.getElementById("mg-mem-round");
    const livesEl = document.getElementById("mg-mem-lives");

    function setStatus(text) {
      if (statusEl) statusEl.textContent = text;
    }

    function setRoundText() {
      if (roundEl) roundEl.textContent = "第 " + (round + 1) + " 轮";
    }

    function renderLives() {
      if (!livesEl) return;
      livesEl.innerHTML = "";
      for (let i = 0; i < 2; i++) {
        const dot = document.createElement("i");
        dot.className = "mg-mem-life" + (i < lives ? " on" : "");
        livesEl.appendChild(dot);
      }
    }

    function flash(idx, dur) {
      const btn = grid && grid.children[idx];
      if (!btn) return;
      btn.classList.add("is-lit");
      later(() => btn.classList.remove("is-lit"), dur);
    }

    function startRound() {
      if (!running || active !== me) return;
      phase = "show";
      seq = [];
      input = [];
      const len = Math.min(7, 2 + round);
      for (let i = 0; i < len; i++) seq.push(Math.floor(Math.random() * pool.length));
      setRoundText();
      setStatus("看清楚这 " + len + " 个货位");
      let i = 0;
      const tick = () => {
        if (!running || active !== me) return;
        if (i >= seq.length) {
          phase = "input";
          setStatus("按顺序点回去");
          return;
        }
        flash(seq[i], 360);
        sfx("click");
        i++;
        later(tick, 540);
      };
      later(tick, 560);
    }

    function onPick(idx) {
      if (!running || phase !== "input" || active !== me) return;
      const btn = grid.children[idx];
      const step = input.length;
      input.push(idx);
      if (seq[step] === idx) {
        if (btn) {
          btn.classList.add("is-ok");
          later(() => btn.classList.remove("is-ok"), 240);
        }
        sfx("coin");
        if (input.length === seq.length) {
          phase = "done";
          const gain = (round + 1) * 20;
          score += gain;
          setScore(score);
          popBadge(document.getElementById("mg-combo"), "盘对一组 +" + gain, "#ffd479");
          sfx("success");
          round += 1;
          setRoundText();
          setStatus("这一组对了");
          later(startRound, 720);
        }
      } else {
        if (btn) {
          btn.classList.add("is-bad");
          later(() => btn.classList.remove("is-bad"), 320);
        }
        sfx("bad");
        vibrate(20);
        lives -= 1;
        phase = "idle";
        renderLives();
        if (lives <= 0) {
          setStatus("盘错了两次，收工");
          later(endGame, 720);
        } else {
          setStatus("记错了，这一轮重来");
          later(startRound, 900);
        }
      }
    }

    const clickHandler = (e) => {
      const btn = e.target.closest("[data-mem]");
      if (!btn) return;
      onPick(Number(btn.dataset.mem));
    };
    if (grid) grid.addEventListener("click", clickHandler);

    function endGame() {
      if (!running) return;
      running = false;
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
      timers.forEach((id) => clearTimeout(id));
      if (active !== me) return;
      const result = Game.finishMinigame("memory", score);
      showResult("memory", score, result, me);
    }

    function frame(now) {
      if (!running) return;
      const left = Math.max(0, (endAt - now) / 1000);
      if (now - hudAt >= 100 || left <= 0) {
        hudAt = now;
        setTime((left / 45) * 100);
        setClock(Math.ceil(left) + "s");
      }
      if (left <= 0) { endGame(); return; }
      raf = requestAnimationFrame(frame);
    }

    const onVis = () => {
      if (active !== me) return;
      if (document.hidden) hiddenAt = performance.now();
      else if (hiddenAt) {
        endAt += performance.now() - hiddenAt;
        hiddenAt = 0;
      }
    };
    document.addEventListener("visibilitychange", onVis);

    addCleanup(() => {
      document.removeEventListener("visibilitychange", onVis);
      if (grid) grid.removeEventListener("click", clickHandler);
      timers.forEach((id) => clearTimeout(id));
      running = false;
      if (raf) cancelAnimationFrame(raf);
    });

    renderLives();
    raf = requestAnimationFrame(frame);
    later(startRound, 700);
  }

  /* ============================================================
     入口
     ============================================================ */
  function open(type) {
    teardown();
    const mg = DATA.minigames.find((m) => m.id === type);
    if (!mg) return false;
    const started = Game.startMinigame(type);
    if (!started.ok) return false;
    const sid = session;
    if (type === "rider") openRider(sid);
    else if (type === "sorter") openSorter(sid);
    else if (type === "bargain") openBargain(sid);
    else if (type === "memory") openMemory(sid);
    return true;
  }

  return { open };
})();

    }
    function resolve() {
      effective = setting === "auto" ? autoBase() : setting;

    }
    function paint() {
      const cls = document.body.classList;

      set,
      degrade,
      get setting() { return setting; },

    let rainGain = null;
    let humGain = null;
    let rainSrc = null;
    let humSrc = null;
    let musicSources = [];
    let transientSources = [];
    let scene = { slot: 0, weather: "clear" };
    let chordIndex = 0;
    const CHORDS = [
      [146.83, 174.61, 220.0, 261.63, 329.63],
      [116.54, 146.83, 174.61, 220.0, 261.63],
      [87.31, 110.0, 130.81, 164.81, 220.0],
      [98.0, 116.54, 146.83, 196.0, 246.94]
    ];
    const ARP = [293.66, 349.23, 392.0, 440.0, 523.25, 587.33, 698.46, 783.99, 880.0];

    function enabled() {
      return !!(window.Game && Game.state && Game.state.settings && Game.state.settings.sound);
    }

    function musicEnabled() {
      return !!(window.Game && Game.state && Game.state.settings && Game.state.settings.music !== false);
    }

    function ensure() {
      if (!ctx) {
        try {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
          buildGraph();
        } catch (e) {
          ctx = null;
        }
      }
      if (ctx && ctx.state === "suspended") {
        const p = ctx.resume();
        if (p && p.catch) p.catch(() => {});
      }
      return ctx;
    }

    function makeNoise(seconds) {
      const len = Math.floor(ctx.sampleRate * seconds);
      const buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const data = buf.getChannelData(ch);
        let last = 0;
        for (let i = 0; i < len; i++) {
          const white = Math.random() * 2 - 1;
          last = last * 0.94 + white * 0.06;
          data[i] = last * 2.4;
        }
      }
      return buf;
    }

    function makeImpulse(seconds) {
      const len = Math.floor(ctx.sampleRate * seconds);
      const buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const data = buf.getChannelData(ch);
        for (let i = 0; i < len; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8);
        }
      }
      return buf;
    }

    function buildGraph() {
      master = ctx.createGain();
      master.gain.value = 0.7;
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -20;
      comp.knee.value = 24;
      comp.ratio.value = 4;
      comp.attack.value = 0.004;
      comp.release.value = 0.24;
      master.connect(comp);
      comp.connect(ctx.destination);

      sfxBus = ctx.createGain();
      sfxBus.gain.value = 1.6;
      sfxBus.connect(master);

      musicBus = ctx.createGain();
      musicBus.gain.value = 0.0001;
      musicBus.connect(master);

      reverb = ctx.createConvolver();
      reverb.buffer = makeImpulse(QUALITY.effective === "low" ? 1.2 : QUALITY.effective === "mid" ? 1.8 : 2.4);
      const wet = ctx.createGain();
      wet.gain.value = 0.2;
      reverb.connect(wet);
      wet.connect(master);

      noiseBuf = makeNoise(2.2);
    }

    function tone(freq, dur, type, gain, when, slideTo, dest, wetAmount) {
      const c = ensure();
      if (!c) return;
      const t = c.currentTime + Math.max(0, when || 0);
      const t0 = Math.max(c.currentTime, t);
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(Math.max(20, freq), t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain || 0.03), t0 + 0.014);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g);
      g.connect(dest || sfxBus);
      if (reverb && wetAmount) {
        const send = c.createGain();
        send.gain.value = wetAmount;
        g.connect(send);
        send.connect(reverb);
      }
      osc.start(t0);
      osc.stop(t0 + dur + 0.04);
    }

    function noiseHit(dur, gain, filterType, freq, when) {
      const c = ensure();
      if (!c || !noiseBuf) return;
      const t = c.currentTime + (when || 0);
      const src = c.createBufferSource();
      src.buffer = noiseBuf;
      const f = c.createBiquadFilter();
      f.type = filterType || "lowpass";
      f.frequency.value = freq || 1200;
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain || 0.01), t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f);
      f.connect(g);
      g.connect(sfxBus);
      if (reverb) {
        const send = c.createGain();
        send.gain.value = 0.16;
        g.connect(send);
        send.connect(reverb);
      }
      src.start(t);
      src.stop(t + dur + 0.04);
    }

    function bell(freq, gain, when) {
      tone(freq, 0.5, "sine", gain, when, null, sfxBus, 0.3);
      tone(freq * 2.01, 0.32, "sine", gain * 0.35, (when || 0) + 0.008, null, sfxBus, 0.3);
      tone(freq * 2.98, 0.22, "triangle", gain * 0.16, (when || 0) + 0.016, null, sfxBus, 0.3);
    }

    function startMusic() {
      if (!musicEnabled()) return false;
      const c = ensure();
      if (!c || musicStarted) return false;
      musicStarted = true;
      const session = ++musicSession;

      padFilter = c.createBiquadFilter();
      padFilter.type = "lowpass";
      padFilter.frequency.value = scene.slot >= 2 ? 360 : 560;
      padFilter.Q.value = 0.65;
      padFilter.connect(musicBus);

      arpBus = c.createGain();
      arpBus.gain.value = 0.58;
      arpBus.connect(musicBus);
      if (reverb) {
        const send = c.createGain();
        send.gain.value = 0.22;
        arpBus.connect(send);
        send.connect(reverb);
      }

      const addDrone = (freq, gain, detune) => {
        const osc = c.createOscillator();
        const g = c.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        osc.detune.value = detune;
        g.gain.value = gain;
        osc.connect(g);
        g.connect(padFilter);
        osc.start();
        musicSources.push(osc);
      };
      addDrone(73.42, 0.018, -3);
      addDrone(110.0, 0.011, 4);
      addDrone(146.83, 0.008, -6);

      humSrc = c.createBufferSource();
      humSrc.buffer = noiseBuf;
      humSrc.loop = true;
      const humFilter = c.createBiquadFilter();
      humFilter.type = "lowpass";
      humFilter.frequency.value = 230;
      humGain = c.createGain();
      humGain.gain.value = 0.022;
      humSrc.connect(humFilter);
      humFilter.connect(humGain);
      humGain.connect(musicBus);
      humSrc.start();
      musicSources.push(humSrc);

      rainSrc = c.createBufferSource();
      rainSrc.buffer = noiseBuf;
      rainSrc.loop = true;
      const rainFilter = c.createBiquadFilter();
      rainFilter.type = "highpass";
      rainFilter.frequency.value = 850;
      rainGain = c.createGain();
      rainGain.gain.value = 0.0001;
      rainSrc.connect(rainFilter);
      rainFilter.connect(rainGain);
      rainGain.connect(musicBus);
      rainSrc.start();
      musicSources.push(rainSrc);
      applyScene(1.4);

      const scheduleChord = () => {
        if (!musicStarted || session !== musicSession) return;
        const t = c.currentTime + 0.08;
        const chord = CHORDS[chordIndex % CHORDS.length];
        chordIndex++;
        chord.forEach((freq, i) => {
          const osc = c.createOscillator();
          const g = c.createGain();
          osc.type = i === 0 ? "sine" : "triangle";
          osc.frequency.value = freq;
          osc.detune.value = (i % 2 ? 5 : -4) + (i === 0 ? -6 : 0);
          const peak = 0.026 / (1 + i * 0.55);
          const t0 = t + i * 0.04;
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.linearRampToValueAtTime(peak, t0 + 2.0);
          g.gain.linearRampToValueAtTime(0.0001, t0 + 7.7);
          osc.connect(g);
          g.connect(padFilter);
          osc.start(t0);
          osc.stop(t0 + 8.0);
          transientSources.push(osc);
          osc.onended = () => {
            const idx = transientSources.indexOf(osc);
            if (idx >= 0) transientSources.splice(idx, 1);
          };
        });
        const bass = c.createOscillator();
        const bg = c.createGain();
        bass.type = "sine";
        bass.frequency.value = chord[0] / 2;
        bg.gain.setValueAtTime(0.0001, t);
        bg.gain.linearRampToValueAtTime(0.028, t + 1.4);
        bg.gain.exponentialRampToValueAtTime(0.0001, t + 6.4);
        bass.connect(bg);
        bg.connect(musicBus);
        bass.start(t);
        bass.stop(t + 6.6);
        transientSources.push(bass);
        bass.onended = () => {
          const idx = transientSources.indexOf(bass);
          if (idx >= 0) transientSources.splice(idx, 1);
        };
        chordTimer = setTimeout(scheduleChord, 7200);
      };
      scheduleChord();

      const arp = () => {
        if (!musicStarted || session !== musicSession) return;
        const note = ARP[Math.floor(Math.random() * ARP.length)];
        tone(note, 0.58, "sine", 0.009, 0.04, null, arpBus, 0.3);
        const slow = QUALITY.effective === "low";
        arpTimer = setTimeout(arp, (slow ? 900 : 520) + Math.random() * (slow ? 900 : 580));
      };
      arpTimer = setTimeout(arp, 900);

      musicBus.gain.cancelScheduledValues(c.currentTime);
      musicBus.gain.setValueAtTime(Math.max(0.0001, musicBus.gain.value), c.currentTime);
      musicBus.gain.linearRampToValueAtTime(0.38, c.currentTime + 2.2);
      return true;
    }

    function stopMusic() {
      clearTimeout(chordTimer);
      clearTimeout(arpTimer);
      chordTimer = 0;
      arpTimer = 0;
      musicStarted = false;
      const stopSession = ++musicSession;
      if (!ctx) return;
      const t = ctx.currentTime;
      musicBus.gain.cancelScheduledValues(t);
      musicBus.gain.setValueAtTime(Math.max(0.0001, musicBus.gain.value), t);
      musicBus.gain.linearRampToValueAtTime(0.0001, t + 0.55);
      const sources = musicSources.concat(transientSources);
      musicSources = [];
      transientSources = [];
      setTimeout(() => {
        sources.forEach((node) => {
          try { node.stop(); } catch (e) {}
        });
        if (!musicStarted && stopSession === musicSession) {
          padFilter = null;
          arpBus = null;
          rainGain = null;
          humGain = null;
          rainSrc = null;
          humSrc = null;
        }
      }, 700);
    }

    function applyScene(ramp) {
      if (!ctx) return;
      const t = ctx.currentTime;
      const dim = scene.slot >= 2;
      if (padFilter) padFilter.frequency.setTargetAtTime(dim ? 360 : 580, t, ramp || 1.1);
      if (humGain) humGain.gain.setTargetAtTime(dim ? 0.013 : 0.022, t, ramp || 1.1);
      const rain = scene.weather === "storm" ? 0.062 : scene.weather === "rain" ? 0.03 : 0.0001;
      if (rainGain) rainGain.gain.setTargetAtTime(rain, t, ramp || 1.1);
    }

    function setScene(next) {
      if (!next) return;
      const changed = next.slot !== undefined && next.slot !== scene.slot ||
        next.weather !== undefined && next.weather !== scene.weather;
      scene = Object.assign({}, scene, next);
      if (changed) applyScene(1.2);
    }

    function play(name) {
      if (!enabled()) return;
      const c = ensure();
      if (!c) return;
      if (name === "click") {
        tone(620, 0.055, "sine", 0.02, 0, 500);
      } else if (name === "open") {
        tone(520, 0.14, "sine", 0.016, 0, 760);
        noiseHit(0.16, 0.012, "lowpass", 1600);
      } else if (name === "coin") {
        bell(1046.5, 0.022);
        bell(1568.0, 0.014, 0.07);
      } else if (name === "purchase") {
        bell(880, 0.02);
        bell(1320, 0.014, 0.09);
        noiseHit(0.1, 0.007, "highpass", 2400);
      } else if (name === "success") {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.32, "sine", 0.02 - i * 0.002, i * 0.075, null, sfxBus, 0.32));
      } else if (name === "bad") {
        tone(220, 0.22, "sawtooth", 0.016, 0, 120);
        noiseHit(0.16, 0.009, "lowpass", 420);
      } else if (name === "day") {
        tone(196, 0.9, "sine", 0.017);
        tone(293.66, 0.8, "sine", 0.011, 0.08);
        noiseHit(0.55, 0.007, "lowpass", 500);
      } else if (name === "work") {
        tone(240, 0.07, "square", 0.009, 0, 180);
        tone(120, 0.09, "sine", 0.012, 0.02);
        noiseHit(0.04, 0.004, "highpass", 2200);
      } else if (name === "heal") {
        tone(392, 0.28, "sine", 0.016);
        tone(523.25, 0.36, "sine", 0.012, 0.09);
      } else if (name === "event") {
        tone(329.63, 0.3, "triangle", 0.011, 0, 300);
        tone(493.88, 0.45, "sine", 0.008, 0.14, null, sfxBus, 0.3);
      } else if (name === "achievement") {
        bell(1046.5, 0.02);
        bell(1318.5, 0.018, 0.12);
        bell(1568.0, 0.012, 0.24);
      } else if (name === "promote") {
        [392, 523.25, 659.25, 783.99].forEach((f, i) => tone(f, 0.42, "triangle", 0.018, i * 0.09, null, sfxBus, 0.35));
      } else if (name === "error") {
        tone(180, 0.09, "square", 0.014, 0, 120);
      } else if (name === "hit") {
        tone(920, 0.045, "square", 0.009, 0, 680);
      } else if (name === "combo") {
        tone(1174, 0.07, "triangle", 0.01, 0, 1568);
      } else if (name === "win") {
        play("success");
      } else if (name === "lose") {
        play("bad");
      }
    }

    function suspend() {
      if (ctx && ctx.state === "running") ctx.suspend();
    }

    function resume() {
      if (!ctx) return;
      const p = ctx.resume();
      if (p && p.catch) p.catch(() => {});
    }

    return {
      play,
      startMusic,
      stopMusic,
      setScene,
      unlock: ensure,
      suspend,
      resume,
      isMusicPlaying: () => musicStarted
    };
  })();

  /* ============================================================
     特效反馈
     ============================================================ */
  const FX = (function () {
    let layer = null;
    let vignette = null;

    function ensureLayer() {
      if (layer) return layer;
      layer = document.createElement("div");
      layer.className = "fx-layer";
      vignette = document.createElement("div");
      vignette.className = "fx-vignette";
      layer.appendChild(vignette);
      document.body.appendChild(layer);
      return layer;
    }

    function flash(kind, duration) {
      const l = ensureLayer();
      const d = document.createElement("div");
      d.className = "fx-flash " + (kind || "");
      l.appendChild(d);
      setTimeout(() => d.remove(), duration || 700);
    }

    function shake(power) {
      const app = document.querySelector(".app");
      if (!app) return;
      app.classList.remove("fx-shake", "fx-shake-hard");
      void app.offsetWidth;
      app.classList.add(power === "hard" ? "fx-shake-hard" : "fx-shake");
      setTimeout(() => app.classList.remove("fx-shake", "fx-shake-hard"), 520);
    }

    function burst(x, y, options) {
      const o = options || {};
      const l = ensureLayer();
      const count = o.count || 10;
      const colors = o.colors || ["#ffd479", "#ff9d7a", "#8ceac0", "#b9cbff"];
      for (let i = 0; i < count; i++) {
        const bit = document.createElement("i");
        const angle = Math.random() * Math.PI * 2;
        const dist = 28 + Math.random() * (o.spread || 90);
        bit.className = "fx-bit" + (o.coin ? " coin" : "");
        bit.textContent = o.coin ? "¥" : "";
        bit.style.left = x + "px";
        bit.style.top = y + "px";
        bit.style.setProperty("--dx", Math.cos(angle) * dist + "px");
        bit.style.setProperty("--dy", Math.sin(angle) * dist - (o.lift || 38) + "px");
        bit.style.setProperty("--r", (Math.random() * 300 - 150) + "deg");
        bit.style.setProperty("--c", colors[i % colors.length]);
        bit.style.setProperty("--size", (o.coin ? 9 : 4 + Math.random() * 4) + "px");
        bit.style.setProperty("--dur", 620 + Math.random() * 520 + "ms");
        l.appendChild(bit);
        setTimeout(() => bit.remove(), 1250);
      }
    }

    function coins(rect) {
      if (!rect) return;
      burst(rect.left + rect.width * 0.7, rect.top + rect.height * 0.45, {
        count: 9,
        coin: true,
        lift: 34,
        spread: 70,
        colors: ["#ffd479", "#ffc06a", "#8ceac0"]
      });
    }

    function achievement() {
      flash("gold", 750);
      burst(window.innerWidth * 0.5, 92, {
        count: 18,
        lift: 20,
        spread: 130,
        colors: ["#ffd479", "#ff9d7a", "#b9cbff", "#8ceac0"]
      });
    }

    function damage() {
      flash("damage", 620);
      shake("soft");
    }

    function critical(on) {
      ensureLayer();
      document.body.classList.toggle("is-critical", !!on);
    }

    function ending() {
      flash("gold", 850);
      burst(window.innerWidth * 0.5, window.innerHeight * 0.24, {
        count: 34,
        lift: 60,
        spread: 220,
        colors: ["#ffd479", "#ff9d7a", "#8ceac0", "#b9cbff", "#ff86b3"]
      });
    }

    return { flash, shake, burst, coins, achievement, damage, critical, ending };
  })();

  /* ============================================================
     背景
     ============================================================ */
  function buildAmbient() {
    /* 背景元素始终按高画质生成，中/低画质用 CSS 隐藏多余元素，切换时不会让城市底图重新洗牌 */
    const stars = el("stars");
    if (stars) {
      /* 星星按组闪烁：5 个分组动画代替 54 个独立动画，观感不变但合成层大幅减少 */
      const starCount = 54;
      const groupCount = 5;
      const perGroup = Math.ceil(starCount / groupCount);
      const band = 100 / groupCount;
      let html = "";
      let n = 0;
      for (let g = 0; g < groupCount; g++) {
        html += '<div class="star-group" style="left:' + (g * band).toFixed(2) + "%;width:" +
          band.toFixed(2) + "%;--gdur:" + (4.5 + Math.random() * 5) +
          "s;--gdelay:" + (-Math.random() * 9) + 's">';
        for (let i = 0; i < perGroup && n < starCount; i++, n++) {
          const size = Math.random() < 0.8 ? 2 : 3;
          html +=
            '<i class="star" style="left:' + Math.random() * 100 + "%;top:" +
            Math.random() * 62 + "%;width:" + size + "px;height:" + size + "px;opacity:" +
            (0.25 + Math.random() * 0.6) + '"></i>';
        }
        html += "</div>";
      }
      stars.innerHTML = html;
    }

    const particles = el("particles");
    if (particles) {
      let html = "";
      const particleCount = 20;
      for (let i = 0; i < particleCount; i++) {
        html +=
          '<i class="particle" style="left:' + Math.random() * 100 + "%;--size:" +
          (1 + Math.random() * 2.6) + "px;--dur:" + (14 + Math.random() * 20) + "s;--delay:" +
          (-Math.random() * 22) + "s;--sway:" + (-60 + Math.random() * 120) + 'px"></i>';
      }
      particles.innerHTML = html;
    }

    const rainEl = el("rain");
    if (rainEl) {
      let html = "";
      const rainCount = 46;
      for (let i = 0; i < rainCount; i++) {
        html +=
          '<i style="left:' + (Math.random() * 108) + "%;--rdur:" + (0.75 + Math.random() * 0.8) +
          "s;--rdelay:" + (-Math.random() * 2.5) + 's;height:' + (30 + Math.random() * 50) + 'px"></i>';
      }
      rainEl.innerHTML = html;
    }

    const frontRain = el("rain-front");
    if (frontRain) {
      let html = "";
      const frontCount = 24;
      for (let i = 0; i < frontCount; i++) {
        html +=
          '<i style="left:' + (Math.random() * 110) + "%;--rdur:" + (0.9 + Math.random() * 0.9) +
          "s;--rdelay:" + (-Math.random() * 2.4) + 's;height:' + (24 + Math.random() * 38) + 'px"></i>';
      }
      frontRain.innerHTML = html;
    }

    const skyEl = el("skyline");
    if (!skyEl) return;
    const W = 1600;
    const H = 400;
    const maxFlicker = 40;
    const maxBeacons = 7;
    const winGroupCount = 6;
    const winGroups = [];
    for (let i = 0; i < winGroupCount; i++) winGroups.push([]);
    let winStatic = "";
    let beaconHtml = "";
    let flickerCount = 0;
    let beaconCount = 0;
    let back = "";
    let front = "";
    let x = -30;
    while (x < W + 40) {
      const bw = 46 + Math.random() * 74;
      const bh = 90 + Math.random() * 210;
      const y = H - bh;
      back += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + bh + '" rx="2"/>';
      if (bh > 220) {
        back += '<rect x="' + (x + bw / 2 - 2) + '" y="' + (y - 24) + '" width="4" height="24"/>';
      }
      if (beaconCount < maxBeacons && Math.random() < 0.5) {
        beaconCount++;
        beaconHtml += '<i class="beacon" style="left:' + (((x + bw / 2) / W) * 100).toFixed(2) +
          "%;top:" + (((y - 26) / H) * 100).toFixed(2) + '%"></i>';
      }
      x += bw + 8 + Math.random() * 18;
    }
    x = -60;
    while (x < W + 60) {
      const bw = 70 + Math.random() * 110;
      const bh = 60 + Math.random() * 150;
      const y = H - bh;
      front += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + bh + '" rx="2"/>';
      const cols = Math.floor(bw / 22);
      const rows = Math.floor(bh / 26);
      for (let c = 0; c < cols; c++) {
        for (let r = 0; r < rows; r++) {
          if (Math.random() < 0.3) {
            const wx = x + 10 + c * 22;
            const wy = y + 12 + r * 26;
            const flicker = flickerCount < maxFlicker && Math.random() < 0.45;
            const rect = '<rect x="' + wx + '" y="' + wy + '" width="8" height="10" rx="1"/>';
            if (flicker) {
              const gi = Math.max(0, Math.min(winGroupCount - 1, Math.floor((wx / W) * winGroupCount)));
              winGroups[gi].push(rect);
              flickerCount++;
            } else {
              winStatic += rect;
            }
          }
        }
      }
      x += bw + 10 + Math.random() * 22;
    }

    /* 亮窗按 6 组统一闪烁：40 个独立动画 -> 6 个分组动画 */
    let winHtml = '<g fill="#ffc87e" opacity="0.62">' + winStatic + "</g>";
    winGroups.forEach((rects) => {
      if (!rects.length) return;
      winHtml += '<g class="win-group" fill="#ffc87e" style="--wdur:' +
        (5 + Math.random() * 7) + "s;--wdelay:" + (-Math.random() * 10) + 's">' +
        rects.join("") + "</g>";
    });

    skyEl.innerHTML =
      '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" aria-hidden="true">' +
        '<g fill="#122138" opacity="0.9">' + back + "</g>" +
        '<g fill="#091324">' + front + "</g>" +
        winHtml +
      "</svg>" + beaconHtml;
  }

  /* ============================================================
     可折叠面板 / 快捷行动
     ============================================================ */
  function readCardPrefs() {
    try {
      const raw = localStorage.getItem(COLLAPSE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function writeCardPrefs(prefs) {
    try {
      localStorage.setItem(COLLAPSE_KEY, JSON.stringify(prefs));
    } catch (e) {}
  }

  function defaultCardPrefs() {
    const compact = window.innerWidth <= 1060;
    return compact
      ? { skills: true, goals: true, finance: true, assets: true, achievements: true }
      : {};
  }

  const cardPrefs = Object.assign(defaultCardPrefs(), readCardPrefs());

  function setupCards() {
    Object.keys(CARD_META).forEach((selector) => {
      const card = document.querySelector(selector);
      if (!card || card.dataset.collapseReady) return;
      const meta = CARD_META[selector];
      const title = card.querySelector(".card-title");
      if (!title) return;
      const key = meta.key;
      card.dataset.collapseReady = "1";
      card.dataset.collapseKey = key;
      title.classList.add("card-title-collapsible");
      title.innerHTML =
        '<span class="ct-main">' + ico(meta.icon, "ct-ico") +
          '<span class="ct-label">' + meta.label + "</span></span>" +
        '<span class="ct-summary" id="ct-summary-' + key + '"></span>' +
        '<button class="ct-toggle" type="button" aria-label="收起或展开" aria-expanded="true">' +
          ico("chevron", "ct-chev") + "</button>";

      const body = document.createElement("div");
      body.className = "card-body";
      body.id = "card-body-" + key;
      while (title.nextSibling) body.appendChild(title.nextSibling);
      card.appendChild(body);

      const toggle = title.querySelector(".ct-toggle");
      const apply = (collapsed, persist) => {
        card.classList.toggle("is-collapsed", collapsed);
        body.setAttribute("aria-hidden", collapsed ? "true" : "false");
        toggle.setAttribute("aria-expanded", collapsed ? "false" : "true");
        toggle.title = collapsed ? "展开" : "收起";
        if (persist) {
          cardPrefs[key] = collapsed;
          writeCardPrefs(cardPrefs);
        }
        updateCollapseSummaries();
      };
      apply(!!cardPrefs[key], false);
      title.addEventListener("click", (e) => {
        e.preventDefault();
        apply(!card.classList.contains("is-collapsed"), true);
      });
    });
    updateCollapseSummaries();
  }

  function updateCollapseSummaries() {
    const s = Game.state;
    if (!s) return;
    const goalDone = D.goals.reduce((n, g) => {
      try { return n + (g.done(s) ? 1 : 0); } catch (e) { return n; }
    }, 0);
    const skillTotal = Object.values(s.skills || {}).reduce((a, b) => a + b, 0);
    const d = Game.dailySummary;
    const values = {
      stats: "精力 " + Math.round(s.stats.energy) + " · 健康 " + Math.round(s.stats.health),
      skills: "总等级 " + skillTotal,
      goals: goalDone + "/" + D.goals.length,
      finance: "日净额 " + (d.net >= 0 ? "+" : "") + fmt(d.net),
      assets: "净值 " + fmt(Game.netWorth),
      achievements: s.achievements.length + "/" + D.achievements.length
    };
    Object.keys(values).forEach((key) => {
      const node = el("ct-summary-" + key);
      if (node && node.textContent !== values[key]) node.textContent = values[key];
    });
  }

  function setupQuickAction() {
    const btn = el("quick-action");
    const dock = el("action-dock");
    if (!btn || !dock) return;
    btn.addEventListener("click", () => {
      if (Game.state.ended || Game.state.pendingEvent || transitioning) return;
      if (Game.state.settings.music !== false && !Sound.isMusicPlaying()) Sound.startMusic();
      Sound.play("open");
      dock.scrollIntoView({ behavior: "smooth", block: "center" });
      dock.classList.remove("focus-pulse");
      void dock.offsetWidth;
      dock.classList.add("focus-pulse");
      setTimeout(() => dock.classList.remove("focus-pulse"), 1200);
    });
    if (window.IntersectionObserver) {
      quickObserver = new IntersectionObserver((entries) => {
        const entry = entries[0];
        /* 至少一半的行动区可见时，才认为玩家随时能操作，不需要快捷按钮 */
        quickDockVisible = !!entry && entry.isIntersecting && entry.intersectionRatio >= 0.5;
        updateQuickAction();
      }, { threshold: [0, 0.25, 0.5, 0.75, 1] });
      quickObserver.observe(dock);
    } else {
      quickDockVisible = false;
    }
    updateQuickAction();
  }

  function updateQuickAction() {
    const btn = el("quick-action");
    if (!btn) return;
    const s = Game.state;
    const hidden =
      titleOpen ||
      s.ended ||
      !!s.pendingEvent ||
      quickDockVisible ||
      window.innerWidth > 1060 ||
      document.body.classList.contains("modal-open");
    const left = Math.max(0, D.slots.length - s.slot);
    const key = (hidden ? "1" : "0") + "|" + left + "|" + activeTab;
    if (key === lastQuickKey) return;
    lastQuickKey = key;
    btn.classList.toggle("is-on", !hidden);
    btn.setAttribute("aria-hidden", hidden ? "true" : "false");
    btn.tabIndex = hidden ? -1 : 0;
    const badge = el("quick-action-badge");
    if (badge) {
      badge.textContent = left;
      badge.classList.toggle("is-low", left <= 1);
    }
    const tab = TABS.find((t) => t.id === activeTab) || TABS[0];
    const icon = el("quick-action-icon");
    if (icon) icon.innerHTML = ico(tab.icon);
  }

      const params = new URLSearchParams(window.location.search || "");
      return params.get("play") === "1" || params.get("skiptitle") === "1";

    moneyDisplay = Game.state.money;
    lastMoney = null;
    renderAll();
    updateSoundButton();

    /* 星星/天际线/雨幕放到首帧之后构建，启动时优先把界面画出来 */
    requestAnimationFrame(() => {

    setTimeout(() => {

          Sound.play("open");

  /* 自动档：跳过弹窗/后台时段，连续两段掉帧才降一档；避免启动瞬间的抖动误降 */
  function watchPerformance() {
    if (perfWatching || REDUCED_MOTION || QUALITY.setting !== "auto" || QUALITY.effective === "low") return;
    perfWatching = true;
    let started = performance.now();
    let frames = 0;
    let windowStart = 0;
    let badWindows = 0;
    let measured = 0;
    const onVis = () => { started = performance.now(); };
    const stop = () => {
      if (!perfWatching) return;
      perfWatching = false;
      document.removeEventListener("visibilitychange", onVis);
    };
    document.addEventListener("visibilitychange", onVis);
    const tick = (now) => {
      if (QUALITY.setting !== "auto" || QUALITY.effective === "low") { stop(); return; }
      if (document.hidden || document.body.classList.contains("modal-open") || titleOpen) {
        frames = 0;
        windowStart = 0;
        badWindows = 0;
        /* 欢迎页/菜单/小游戏停留的时间不算测量窗口，避免看说明太久导致自动档失效 */
        started = now;
        requestAnimationFrame(tick);
        return;
      }
      if (now - started > 16000) { stop(); return; }
      if (!windowStart) {
        windowStart = now;
        frames = 0;
      }
      frames++;
      const span = now - windowStart;
      if (span >= 1600) {
        const fps = (frames * 1000) / span;
        badWindows = fps < 42 ? badWindows + 1 : Math.max(0, badWindows - 1);
        measured += span;
        windowStart = 0;
        frames = 0;
        if (badWindows >= 2 && QUALITY.degrade()) {
          toast(
            "已自动降低画质",
            "连续掉帧，已切换到" + qualityName(QUALITY.effective) + "画质，可在菜单里手动调整。",
            "life",
            "🎛️"
          );
          badWindows = 0;
          if (QUALITY.effective === "low") { stop(); return; }
        }
        if (measured >= 9600) { stop(); return; }
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

    renderProfile();

    renderSkills();

    renderLog(true);
    renderDock();

    renderHeader();
    renderProfile();
    renderStats();

    renderGoals();
