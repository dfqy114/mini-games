  function updateSoundButton() {
    const btn = el("btn-sound");
    if (!btn) return;
    const st = Game.state.settings;
    const on = st.sound;
    const key = (on ? "1" : "0") + (st.music === false ? "0" : "1");
    if (key === lastSoundBtnKey) return;
    lastSoundBtnKey = key;
    btn.innerHTML = ico(on ? "sound" : "sound-off");
    btn.classList.toggle("muted", !on);
    btn.classList.toggle("music-off", st.music === false);
    btn.title = on ? "音效开关" : st.music !== false ? "音效已关闭，背景音乐仍在" : "声音已关闭";
    btn.setAttribute("aria-label", btn.title);
  }

  /* ============================================================
     事件绑定
     ============================================================ */
  function bindEvents() {
    const titleContinue = el("title-continue");
    if (titleContinue) titleContinue.addEventListener("click", () => {
      Sound.unlock();
      Sound.play("click");
      continueFromTitle();
    });
    const titleNew = el("title-new");
    if (titleNew) titleNew.addEventListener("click", () => {
      Sound.unlock();
      Sound.play("click");
      newLifeFromTitle();
    });
    const titleHelp = el("title-help");
    if (titleHelp) titleHelp.addEventListener("click", () => {
      Sound.unlock();
      Sound.play("open");
      openHelp();
    });
    const titleMusic = el("title-music");
    if (titleMusic) titleMusic.addEventListener("click", () => {
      const on = Game.toggleMusic();
      Sound.unlock();
      if (on) Sound.startMusic();
      else Sound.stopMusic();
      updateSoundButton();
      syncTitle();
    });
    const titleSound = el("title-sound");
    if (titleSound) titleSound.addEventListener("click", () => {
      const on = Game.toggleSound();
      if (on) Sound.play("click");
      updateSoundButton();
      syncTitle();
    });

    const skillsEl = el("skills");
    if (skillsEl) {
      const openFromCard = (card) => {
        if (!card) return;
        Sound.play("open");
        openSkill(card.dataset.skill);
      };
      skillsEl.addEventListener("click", (e) => openFromCard(e.target.closest("[data-skill]")));
      skillsEl.addEventListener("keydown", (e) => {
        if (e.key !== "Enter" && e.key !== " ") return;
        const card = e.target.closest("[data-skill]");
        if (!card) return;
        e.preventDefault();
        openFromCard(card);
      });
    }

    const goalsEl = el("goals");
    if (goalsEl) {
      goalsEl.addEventListener("click", (e) => {
        if (!e.target.closest("[data-goals-all]")) return;
        goalsExpanded = !goalsExpanded;
        Sound.play("click");
        renderGoals();
      });
    }

    const achWrap = el("achievements");
    if (achWrap) {
      achWrap.addEventListener("click", (e) => {
        const all = e.target.closest("[data-ach-all]");
        if (all) {
          Sound.play("open");
          openAchievements();
          return;
        }
        const row = e.target.closest("[data-ach]");
        if (!row) return;
        Sound.play("open");
        openAchievements(row.dataset.ach);
      });
    }

    const honor = el("profile-honor");
    if (honor) honor.addEventListener("click", () => {
      if (titleOpen) return;
      Sound.play("open");
      openTitles();
    });
    ["profile-avatar", "profile-name"].forEach((id) => {
      const node = el(id);
      if (node) {
        node.addEventListener("click", () => {
          if (titleOpen) return;
          Sound.play("open");
          openProfile();
        });
        node.style.cursor = "pointer";
      }
    });

    const tabs = el("tabs");
    if (tabs) {
      tabs.addEventListener("click", (e) => {
        if (transitioning) return;
        const btn = e.target.closest("[data-tab]");
        if (!btn) return;
        if (Game.state.settings.music !== false && !Sound.isMusicPlaying()) Sound.startMusic();
        activeTab = btn.dataset.tab;
        Sound.play("click");
        renderDock();
      });
    }

    const actions = el("actions");
    if (actions) {
      actions.addEventListener("click", (e) => {
        if (transitioning) return;
        const btn = e.target.closest(".action-btn");
        if (!btn || btn.disabled) return;
        ripple(btn, e);
        handleAction(btn.dataset.act);
      });
    }

    const eventSlot = el("event-slot");
    if (eventSlot) {
      eventSlot.addEventListener("click", (e) => {
        if (transitioning) return;
        const choice = e.target.closest("[data-choice]");
        if (choice) {
          ripple(choice, e);
          Sound.play("click");
          Game.chooseEvent(parseInt(choice.dataset.choice, 10));
          return;
        }
        if (e.target.closest("[data-event-continue]")) {
          Sound.play("click");
          Game.closeEvent();
          if (!Game.state.ended && window.innerWidth <= 1060) {
            requestAnimationFrame(() => {
              const dock = document.querySelector(".action-dock");
              if (dock && dock.scrollIntoView) dock.scrollIntoView({ behavior: "smooth", block: "nearest" });
            });
          }
        }
      });
    }

    const splash = el("day-splash");
    if (splash) {
      splash.addEventListener("click", () => {
        if (!transitioning) return;
        transitioning = false;
        clearTimeout(transitionTimer);
        splash.classList.remove("show");
        document.body.classList.remove("is-transitioning");
        updateQuickAction();
      });
    }

    const sleepBtn = el("btn-sleep-day");
    if (sleepBtn) sleepBtn.addEventListener("click", () => {
      if (transitioning || actionLock) return;
      Sound.play("click");
      Game.sleepNow();
    });

    const menuBtn = el("btn-menu");
    if (menuBtn) menuBtn.addEventListener("click", () => {
      if (transitioning) return;
      Sound.play("open");
      openMenu();
    });

    const chipJob = el("chip-job");
    if (chipJob) chipJob.addEventListener("click", () => {
      if (transitioning || Game.state.ended) return;
      if (Game.state.pendingEvent) {
        toast("先处理眼前的事", "事件结束后再看工作。", "bad", "⏳");
        return;
      }
      Sound.play("open");
      openJobs();
    });

    const chipHousing = el("chip-housing");
    if (chipHousing) chipHousing.addEventListener("click", () => {
      if (transitioning || Game.state.ended) return;
      if (Game.state.pendingEvent) {
        toast("先处理眼前的事", "事件结束后再看房。", "bad", "⏳");
        return;
      }
      Sound.play("open");
      openHousing();
    });

    document.addEventListener("click", (e) => {
      const btn = e.target.closest(".btn");
      if (btn && !btn.disabled) ripple(btn, e);
    }, true);

    const soundBtn = el("btn-sound");
    if (soundBtn) soundBtn.addEventListener("click", () => {
      const on = Game.toggleSound();
      if (on) {
        Sound.unlock();
        Sound.play("click");
      }
      updateSoundButton();
      toast(on ? "音效已打开" : "音效已关闭", on ? "城市又有了声音。" : "背景音乐还在，世界安静了一点。", "life", on ? "🔊" : "🔇");
    });

    const assets = el("assets");
    if (assets) {
      assets.addEventListener("click", (e) => {
        const toBiz = e.target.closest("[data-open-biz]");
        const toHouse = e.target.closest("[data-open-house]");
        const toAsset = e.target.closest("[data-asset]");
        if (!toBiz && !toHouse && !toAsset) return;
        if (transitioning || Game.state.ended) return;
        if (Game.state.pendingEvent) {
          toast("先处理眼前的事", "事件结束后再打理资产。", "bad", "⏳");
          return;
        }
        if (toAsset) {
          Sound.play("open");
          openAssetDetail(toAsset.dataset.asset);
        } else if (toBiz) {
          openBusiness(toBiz.dataset.openBiz);
        } else openHousing();
      });
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (document.querySelector(".mg-modal")) return;
        if (document.querySelector(".ending-modal")) return;
        const root = el("modal-root");
        if (root && root.classList.contains("is-open")) closeModal();
        return;
      }
      /* 事件支持数字键选择 / 回车继续，键盘玩家不用来回摸鼠标 */
      const tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA" || e.metaKey || e.ctrlKey || e.altKey) return;
      if (document.querySelector(".mg-modal")) return;
      const modalRoot = el("modal-root");
      if (modalRoot && modalRoot.classList.contains("is-open")) return;
      const pending = Game.state && Game.state.pendingEvent;
      if (!pending) return;
      if (pending.outcome === null || pending.outcome === undefined) {
        const n = parseInt(e.key, 10);
        if (!(n >= 1 && n <= 9)) return;
        const evt = Game.getPendingEvent();
        const choice = evt && evt.choices ? evt.choices[n - 1] : null;
        if (!choice || (choice.req && !choice.req(Game.state))) return;
        e.preventDefault();
        Sound.play("click");
        Game.chooseEvent(n - 1);
      } else if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        Sound.play("click");
        Game.closeEvent();
      }
    });

    const aura = el("aura");
    let auraRaf = 0;
    let mx = 0, my = 0;
    let mouseActive = false;
    const finePointer = !(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
    if (finePointer) {
      document.addEventListener("mousemove", (e) => {
        if (QUALITY.effective === "low") return;
        mx = e.clientX;
        my = e.clientY;
        if (!mouseActive) {
          mouseActive = true;
          document.body.classList.add("mouse-active");
        }
        if (auraRaf) return;
        auraRaf = requestAnimationFrame(() => {
          auraRaf = 0;
          if (aura) aura.style.transform = "translate3d(" + mx + "px," + my + "px,0)";
          const skyline = el("skyline");
          if (skyline) {
            const dx = (mx / window.innerWidth - 0.5) * 16;
            skyline.style.transform = "translate3d(" + dx + "px,0,0)";
          }
        });
      }, { passive: true });
    }

    let audioUnlocked = false;
    const unlockAudio = () => {
      if (audioUnlocked) return;
      audioUnlocked = true;
      Sound.unlock();
      if (Game.state.settings.music !== false) Sound.startMusic();
      window.removeEventListener("pointerdown", unlockAudio, true);
      window.removeEventListener("keydown", unlockAudio, true);
      window.removeEventListener("click", unlockAudio, true);
    };
    window.addEventListener("pointerdown", unlockAudio, true);
    window.addEventListener("keydown", unlockAudio, true);
    window.addEventListener("click", unlockAudio, true);
    document.addEventListener("visibilitychange", () => {
      document.body.classList.toggle("is-hidden", document.hidden);
      if (document.hidden) {
        Sound.stopMusic();
      } else if (audioUnlocked && Game.state.settings.music !== false) {
        Sound.startMusic();
      }
    });

    let resizeTimer = 0;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(updateQuickAction, 120);
    });

    /* 顶栏高度会因极窄屏/大额现金换行而变化，提示条跟随真实高度定位 */
    const topbar = document.querySelector(".topbar");
    if (topbar) {
      let topbarRaf = 0;
      let lastTopbarH = 0;
      const syncTopbar = () => {
        if (topbarRaf) return;
        topbarRaf = requestAnimationFrame(() => {
          topbarRaf = 0;
          const h = Math.ceil(topbar.getBoundingClientRect().height);
          if (h && h !== lastTopbarH) {
            lastTopbarH = h;
            document.documentElement.style.setProperty("--topbar-h", h + "px");
          }
        });
      };
      syncTopbar();
      if (window.ResizeObserver) new ResizeObserver(syncTopbar).observe(topbar);
      window.addEventListener("resize", syncTopbar, { passive: true });
    }

    /* 滚动时暂停毛玻璃（中画质），停手 180ms 后恢复；静止时的观感不变 */
    let scrollTimer = 0;
    const markScrolling = () => {
      document.body.classList.add("is-scrolling");
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => document.body.classList.remove("is-scrolling"), 180);
    };
    window.addEventListener("scroll", markScrolling, { passive: true });
    window.addEventListener("wheel", markScrolling, { passive: true });
    window.addEventListener("touchmove", markScrolling, { passive: true });
    document.addEventListener("scroll", markScrolling, { capture: true, passive: true });
  }

  function ripple(btn, e) {
    const rect = btn.getBoundingClientRect();
    const span = document.createElement("span");
    span.className = "ripple";
    const size = Math.max(rect.width, rect.height);
    span.style.width = span.style.height = size + "px";
    span.style.left = (e.clientX ? e.clientX - rect.left - size / 2 : rect.width / 2 - size / 2) + "px";
    span.style.top = (e.clientY ? e.clientY - rect.top - size / 2 : rect.height / 2 - size / 2) + "px";
    btn.appendChild(span);
    setTimeout(() => span.remove(), 650);
  }

  return {
    init,
    refresh,
    renderAll,
    toast,
    closeModal,
    showEnding,
    dayTransition,
    openHelp,
    showTitle,
    hideTitle,
    openCreation,
    openTitles,
    openProfile,
    openSkill,
    openAchievements,
    openJobs,
    openBusiness,
    openHousing,
    openShop,
    openBank,
    openMenu,
    openWelcome,
    openAssetDetail,
    syncTitle,
    sound: Sound,
    updateSoundButton,
    flushToasts,
    icon: ico,
    contentIcon: contentIcon,
    iconKey: iconKey,
    perf: {
      get lowPower() { return QUALITY.effective === "low"; },
      get quality() { return QUALITY.effective; },
      get setting() { return QUALITY.setting; }
    }
  };
})();
