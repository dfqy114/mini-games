  }

  function getJobDef(id) {
    if (id) return D.jobs.find((j) => j.id === id) || null;
    return state.job ? D.jobs.find((j) => j.id === state.job.id) || null : null;
  }

  function getBusinessDef(id) {
    return D.businesses.find((b) => b.id === id) || null;
  }

  function getWeekday() {
    return D.weekdays[(state.day - 1) % 7];
  }

  function getSlotName() {
    return (D.slots[state.slot] || D.slots[0]).key;
  }

  function hasAsset(id) {
    return !!state.assets[id];
  }

  function assetSum(key) {
    let total = 0;
    D.items.forEach((item) => {
      if (item.type === "asset" && state.assets[item.id] && item.passive) {
        const m = item.passive.match(new RegExp(key + ":(-?[\\d.]+)"));
        if (m) total += parseFloat(m[1]);
      }
    });
    return total;
  }

  function activeBuffs() {
    const out = [];
    (state.buffs || []).forEach((b) => {
      if (!b || !(b.left > 0)) return;
      const item = D.items.find((i) => i.id === b.id && i.type === "buff");
      if (item) out.push({ id: b.id, left: b.left, item: item });
    });
    return out;
  }

  function buffLeft(id) {
    const b = (state.buffs || []).find((x) => x.id === id);
    return b ? Math.max(0, Math.round(b.left || 0)) : 0;
  }

  function tickBuffs() {
    if (!state.buffs || !state.buffs.length) return;
    const ended = [];
    state.buffs.forEach((b) => {
      b.left = Math.max(0, Math.round(b.left || 0) - 1);
      if (b.left <= 0) ended.push(b.id);
    });
    state.buffs = state.buffs.filter((b) => b.left > 0);
    if (ended.length) {
      const names = ended.map((id) => {
        const item = D.items.find((i) => i.id === id);
        return item ? item.name : id;
      });
      log("「" + names.join("」「") + "」的效果结束了。", "system");
    }
  }

  function emptyMods() {
    return {
      workPay: 0, nightPay: 0, morningPay: 0, overtimePay: 0, workEnergy: 0,
      sleepBonus: 0, trainXp: 0, minigamePay: 0, dailyCost: 0, socialMood: 0,
      workMoodLoss: 0, moodGain: 0, moodLoss: 0, eventLuck: 0, techTrainDiscount: 0,
      techWorkPay: 0, techTrainCost: 0, techTrainXp: 0, socialWorkPay: 0,
      bizIncome: 0, bizUpgradeDiscount: 0, bizRep: 0, dailyHealth: 0, overtimeHealth: 0,
      satietyCost: 0, shopDiscount: 0, trainCost: 0, jobExp: 0, debtInterest: 0, minigameEnergy: 0,
      skillTrainXp: {}
    };
  }

  function addMods(target, source) {
    if (!source) return;
    Object.keys(source).forEach((key) => {
      if (key === "skillTrainXp") {
        const list = source[key] || {};
        Object.keys(list).forEach((sk) => {
          target.skillTrainXp[sk] = (target.skillTrainXp[sk] || 0) + list[sk];
        });
      } else if (typeof source[key] === "number") {
        target[key] = (target[key] || 0) + source[key];
      }
    });
  }

  /* 出身、特质、称号与技能里程碑的修正统一在这里汇总 */
  function mods() {
    const m = emptyMods();
    addMods(m, originById(state.profile.origin).passive);
    (state.profile.traits || []).forEach((id) => {
      const trait = D.traits.find((t) => t.id === id);
      if (trait) addMods(m, trait.passive);
    });
    addMods(m, titleById(state.profile.title).mods);
    activeBuffs().forEach((entry) => addMods(m, entry.item.buff && entry.item.buff.mods));
    Object.keys(D.skillPerks).forEach((key) => {
      const lv = state.skills[key] || 0;
      D.skillPerks[key].milestones.forEach((ms) => {
        if (lv >= ms.level) addMods(m, ms.mods);
      });
    });
    return m;
  }

  function businessIncomeMult() {
    return (
      1 +
      (state.skills.business || 0) * 0.06 +
      (state.skills.tech || 0) * 0.01 +
      mods().bizIncome
    );
  }

  function log(text, type = "narrative") {
    state.log.push({
      day: state.day,
      slot: state.slot,
      text,
      type,
      ts: Date.now(),
      seq: ++state.logSeq
    });
    if (state.log.length > 1500) state.log.shift();
  }

  function logDayHeader() {
    const w = getWeather();
    state.log.push({
      day: state.day,
      slot: state.slot,
      text: "第 " + state.day + " 天 · " + getWeekday() + " · " + w.name,
      type: "day",
      ts: Date.now(),
      seq: ++state.logSeq
    });
    if (state.log.length > 1500) state.log.shift();
  }

  function addStat(key, n) {
    if (!(key in state.stats)) return;
    if (key === "mood" && n) {
      const m = mods();
      n = n > 0 ? n * (1 + m.moodGain) : n * (1 - m.moodLoss);
    }
    state.stats[key] = clamp(state.stats[key] + n);
  }

  function addMoney(n) {
    if (n >= 0) {
      state.money += n;
      state.totals.earned += n;
    } else {
      const need = -n;
      const paid = Math.min(state.money, need);
      state.money -= paid;
      state.totals.spent += paid;
      if (paid < need) {
        state.debt += need - paid;
        state.flags.hadDebt = true;
      }
    }
  }

  function spend(n) {
    if (state.money < n) return false;
    state.money -= n;
    state.totals.spent += n;
    return true;
  }

  /* 购物折扣（精打细算等特质）也作用在单价上，UI 与实际扣款共用同一个函数 */
  function itemPrice(item) {
    if (!item) return 0;
    const cut = Math.min(0.3, Math.max(0, mods().shopDiscount));
    return Math.max(1, Math.round(item.price * (1 - cut)));
  }

  /* 低饱腹自动吃饭：只买食物，不占时段，按每块钱能填多少肚子来选 */
  function maybeAutoEat(forceTarget) {
    const auto = state.automation || defaultAutomation();
    if (!auto.autoEat || autoEatBusy) return 0;
    if (state.ended || state.pendingEvent || state.stats.health <= 0) return 0;
    const target = clamp(Math.round(forceTarget || auto.eatBelow || 30), 10, 95);
    if (state.stats.satiety >= target) return 0;
    autoEatBusy = true;
    const bought = [];
    let totalCost = 0;
    try {
      for (let i = 0; i < 6; i++) {
        const need = target - state.stats.satiety;
        if (need <= 0) break;
        let best = null;
        let bestScore = 0;
        D.items.forEach((item) => {
          if (item.type !== "food" || !item.effects || !(item.effects.satiety > 0)) return;
          const price = itemPrice(item);
          if (price > state.money) return;
          const effective = Math.min(item.effects.satiety, need);
          let score = effective / Math.max(1, price);
          const moodPenalty = Math.max(0, -(item.effects.mood || 0)) * 0.012;
          const healthPenalty = Math.max(0, -(item.effects.health || 0)) * 0.02;
          score *= Math.max(0.55, 1 - moodPenalty - healthPenalty);
          if (score > bestScore) {
            bestScore = score;
            best = item;
          }
        });
        if (!best) break;
        const cost = itemPrice(best);
        if (!spend(cost)) break;
        Object.keys(best.effects).forEach((k) => addStat(k, best.effects[k]));
        totalCost += cost;
        bought.push(best.name);
      }
    } finally {
      autoEatBusy = false;
    }
    if (bought.length) {
      const counts = {};
      bought.forEach((name) => { counts[name] = (counts[name] || 0) + 1; });
      const text = Object.keys(counts).map((name) => name + " ×" + counts[name]).join("、");
      log("肚子有点空，你自动买了 " + text + "，花掉 " + fmt(totalCost) + "。", "life");
      toast("自动吃饭", text + " · 花费 " + fmt(totalCost), "life", "🍚");
    }
    return bought.length;
  }

  /* 同一天反复做零工会更累，收入也会小幅递减 */
  function oddJobFatigue() {
    return Math.max(0, Math.round((state.daily && state.daily.oddJobs) || 0));
  }

  function addSkill(key, n = 1) {
    if (!(key in state.skills)) return;
    const before = state.skills[key];
    state.skills[key] = clamp(state.skills[key] + n, 0, MAX_SKILL);
    if (state.skills[key] >= MAX_SKILL) state.skillXp[key] = 0;
    if (state.skills[key] > before) {
      log("你的「" + skillName(key) + "」提升到了 Lv." + state.skills[key] + "。", "system");
    }
  }

  function skillNeed(key) {
    if (!(key in state.skills)) return 0;
    const lv = state.skills[key] || 0;
    if (lv >= MAX_SKILL) return 0;
    return 30 + lv * 22 + lv * lv * 9;
  }

  function skillTrainXp(key) {
    if (!(key in state.skills)) return 0;
    const lv = state.skills[key] || 0;
    const m = mods();
    let mult = 1 + m.trainXp + (m.skillTrainXp[key] || 0);
    if (key === "tech") mult += m.techTrainXp;
    let base = 30 + lv * 6;
    if (key === "stamina") base += assetSum("trainBonus") * 12;
    return Math.max(8, Math.round(base * mult));
  }

  function grantSkillXp(key, amount) {
    if (!(key in state.skills)) return 0;
    amount = Math.round(amount);
    if (!amount) return 0;
    if (amount < 0) {
      state.skillXp[key] = Math.max(0, (state.skillXp[key] || 0) + amount);
      return 0;
    }
    if (state.skills[key] >= MAX_SKILL) return 0;
    let gained = 0;
    let xp = (state.skillXp[key] || 0) + amount;
    while (state.skills[key] < MAX_SKILL) {
      const need = skillNeed(key);
      if (xp < need) break;
      xp -= need;
      state.skills[key] += 1;
      gained += 1;
      log("你的「" + skillName(key) + "」提升到了 Lv." + state.skills[key] + "。", "system");
      toast(skillName(key) + "提升", "Lv." + state.skills[key] + " · " + skillCurrentEffect(key), "ach", (D.skills.find((s) => s.key === key) || {}).icon);
      const unlockedAction = (D.skillActions || []).find(
        (a) => a.skill === key && a.level === state.skills[key]
      );
      if (unlockedAction) {
        log("你解锁了新的行动：「" + unlockedAction.name + "」—— " + unlockedAction.desc, "system");
        toast("解锁新行动 · " + unlockedAction.name, unlockedAction.desc, "money", unlockedAction.icon);
      }
    }
    if (state.skills[key] >= MAX_SKILL) xp = 0;
    state.skillXp[key] = xp;
    return gained;
  }

  /* 指定等级的完整收益文案：技能详情里用来对比“现在 → 下一级” */
  function skillEffectAt(key, lv) {
    lv = Math.max(0, Math.min(MAX_SKILL, Math.round(lv || 0)));
    if (key === "stamina") {
      return "工作精力 -" + Math.min(30, lv * 3) + "% · 体力工作收入 +" + lv * 4 + "% · 睡眠恢复 +" + (lv * 1.2).toFixed(1);
    }
    if (key === "social") {
      return "沟通工作收入 +" + lv * 4 + "% · 事件判定 +" + lv * 2 + "% · 社交心情 +" + lv * 2;
    }
    if (key === "tech") {
      return "技术工作收入 +" + lv * 5 + "% · 小游戏收入 +" + lv * 2 + "% · 技术学费 -" + (lv * 2.5).toFixed(1) + "%";
    }
    if (key === "business") {
      return "店铺收入 +" + lv * 6 + "% · 店铺升级费 -" + lv * 3 + "% · 商业工作收入 +" + lv * 4 + "%";
    }
    return "";
  }

  function skillCurrentEffect(key) {
    return skillEffectAt(key, state.skills[key] || 0);
  }

  function nextSkillPerk(key) {
    const info = D.skillPerks[key];
    if (!info) return null;
    const lv = state.skills[key] || 0;
    return info.milestones.find((ms) => ms.level > lv) || null;
  }

  function skillName(key) {
    const s = D.skills.find((x) => x.key === key);
    return s ? s.name : key;
  }

  function toast(title, desc, type, icon) {
    if (window.UI) UI.toast(title, desc, type, icon);
  }

  function refresh() {
    if (window.UI) UI.refresh();
  }

  function guard() {
    if (state.ended) {
      toast("故事已经结束", "可以选择重新开始。", "bad", "🕯️");
      return false;
    }
    if (state.pendingEvent) {
      toast("先处理眼前的事", "事件结束后才能继续行动。", "bad", "⏳");
      return false;
    }
    return true;
  }

  function commit() {
    maybeAutoEat();
    checkAchievements();
    if (!state.ended && state.stats.health <= 0) {
      forcedEnding();
      return;
    }
    save();
    refresh();
  }

  /* ---------------- 账目 ---------------- */

  function getMortgage() {
    const h = getHousing();
    return state.housing.owned ? Math.round(h.buy * 0.0007) : 0;
  }

  /* ---------------- 店铺经营 ---------------- */

  function bizPriceDef(id) {
    const list = D.bizPrices || [];
    return list.find((p) => p.id === id) || list[1] || { id: "normal", name: "标准价", mult: 1, rep: 0 };
  }

  function bizBaseIncome(b) {
    const bd = getBusinessDef(b.id);
    if (!bd) return 0;
    return bd.income * Math.pow(1.55, Math.max(1, b.level) - 1) * businessIncomeMult();
  }

  /* 人手不足会掉流水，多招人能小幅提升 */
  function bizStaffFactor(b) {
    const bd = getBusinessDef(b.id);
    if (!bd) return 1;
    const staff = Math.max(0, b.staff || 0);
    if (!bd.staff) return 1 + Math.min(0.3, staff * 0.12);
    const ratio = staff / bd.staff;
    return 0.55 + 0.45 * Math.min(1.35, ratio);
  }

  function bizRepFactor(b) {
    const rep = Math.max(0, Math.min(100, Number.isFinite(b.rep) ? b.rep : 50));
    return 0.72 + (rep / 100) * 0.56;
  }

  function bizAdFactor(b) {
    return b.ads > 0 ? 1.28 : 1;
  }

  function bizGrossIncome(b) {
    const price = bizPriceDef(b.price);
    return Math.round(bizBaseIncome(b) * bizStaffFactor(b) * bizRepFactor(b) * (price.mult || 1) * bizAdFactor(b));
  }

  function bizPayroll(b) {
    const bd = getBusinessDef(b.id);
    if (!bd) return 0;
    /* 店铺等级越高，员工时薪越高 */
    const lvMult = 1 + 0.15 * (Math.max(1, b.level) - 1);
    return Math.round(Math.max(0, b.staff) * bd.salary * lvMult);
  }

  /* 水电、耗材、平台抽成：按基础营收比例计算，等级越高越贵 */
  function bizUpkeep(b) {
    const rate = 0.1 + 0.02 * (Math.max(1, b.level) - 1);
    return Math.round(bizBaseIncome(b) * rate);
  }

  function bizUpgradeCost(b) {
    const bd = getBusinessDef(b.id);
    if (!bd) return 0;
    const discount = Math.min(0.5, (state.skills.business || 0) * 0.03 + mods().bizUpgradeDiscount);
    return Math.round(bd.cost * 0.62 * Math.pow(1.75, Math.max(1, b.level)) * (1 - discount));
  }

  function getDailySummary() {
    const h = getHousing();
    const owned = !!state.housing.owned;
    const cut = Math.min(0.3, mods().dailyCost);
    const housingCost = owned ? getMortgage() : Math.round(h.rent * (1 - cut));
    const pet = hasAsset("cat") ? Math.round(8 * (1 - cut)) : 0;
    const living = Math.round(h.living * (1 - cut));
    let salary = 0;
    let gross = 0;
    let upkeep = 0;
    state.businesses.forEach((b) => {
      const bd = getBusinessDef(b.id);
      if (!bd) return;
      gross += bizGrossIncome(b);
      salary += bizPayroll(b);
      upkeep += bizUpkeep(b);
    });
    const net = gross - salary - upkeep - housingCost - living - pet;
    return {
      housingCost,
      living,
      pet,
      salary,
      upkeep,
      gross,
      expense: housingCost + living + pet + salary + upkeep,
      net: Math.round(net),
      owned: owned
    };
  }

  function getNetWorth() {
    let v = state.money - state.debt;
    const h = getHousing();
    if (state.housing.owned) v += h.buy * 0.88;
    state.businesses.forEach((b) => {
      const bd = getBusinessDef(b.id);
      if (bd) v += bd.cost * (0.55 + 0.16 * (b.level - 1));
    });
    D.items.forEach((item) => {
      if (item.type === "asset" && state.assets[item.id]) v += item.price * 0.35;
    });
    return Math.round(v);
  }

  /* ---------------- 职业 ---------------- */

  function meetsReq(req) {
    if (!req) return true;
    return Object.keys(req).every((k) => (state.skills[k] || 0) >= req[k]);
  }

  function jobWorkReq(job) {
    return (job && D.jobWorkReq && D.jobWorkReq[job.id]) || 0;
  }

  /* 顶级岗位要求你“从下面一级走上来”，避免只刷技能直接空降 */
  function jobPrevOk(job) {
    if (!job || !job.prev || !job.prev.length) return true;
    const hist = state.flags.jobHistory || [];
    return job.prev.some((id) => (state.job && state.job.id === id) || hist.indexOf(id) >= 0);
  }

  function canApply(job) {
    if (!job) return false;
    return meetsReq(job.req) && (state.totals.worked || 0) >= jobWorkReq(job) && jobPrevOk(job);
  }

  function jobEnergyNeed(job, extra) {
    if (!job) return 0;
    let e = job.energy + assetSum("workEnergy");
    const m = mods();
    e *= 1 - Math.min(0.3, (state.skills.stamina || 0) * 0.03);
    e += m.workEnergy;
    if (getWeather().outdoor > 1 && job.category === "outdoor") {
      e += getWeather().energy;
    }
    if (extra) e = Math.round(e * 1.6);
    return Math.max(6, Math.round(e));
  }

  function jobSkillPayMult(job) {
    if (!job) return 1;
    const lv = state.skills[job.skill] || 0;
    const m = mods();
    if (job.skill === "tech") return 1 + lv * 0.05 + m.techWorkPay;
    if (job.skill === "social") return 1 + lv * 0.04 + m.socialWorkPay;
    if (job.skill === "business") return 1 + lv * 0.04;
    if (job.skill === "stamina") return 1 + lv * 0.04;
    return 1;
  }

  function jobPay(job, extra) {
    if (!job) return 0;
    const m = mods();
    let mult = 1 + (state.job ? state.job.level : 0) * 0.22;
    mult *= jobSkillPayMult(job);
    mult *= 1 + m.workPay + (state.slot === 3 ? m.nightPay : 0) + (state.slot <= 1 ? m.morningPay : 0);
    /* 同一天反复上班会疲劳：第 2 班 -7%，第 3 班 -14%，第 4 班 -21%，最低 79% */
    const workedToday = (state.daily && state.daily.worked) || 0;
    mult *= Math.max(0.79, 1 - workedToday * 0.07);
    if (extra) mult *= 1.72 + m.overtimePay;
    if (state.stats.mood < 25) mult *= 0.86;
    if (job.category === "outdoor") {
      mult *= getWeather().outdoor + assetSum("outdoorPay");
    }
    if (job.category === "whitecollar") mult *= 1 + assetSum("whitecollarPay");
    if (job.category === "tech") mult *= 1 + assetSum("techPay");
    return Math.round(job.pay * mult);
  }

  /* 跳槽预览：不含当前岗位职级加成，只算技能与被动 */
  function jobPreviewPay(job) {
    if (!job) return 0;
    const m = mods();
    let mult = jobSkillPayMult(job) * (1 + m.workPay);
    if (job.category === "outdoor") mult *= getWeather().outdoor + assetSum("outdoorPay");
    if (job.category === "whitecollar") mult *= 1 + assetSum("whitecollarPay");
    if (job.category === "tech") mult *= 1 + assetSum("techPay");
    return Math.round(job.pay * mult);
  }

  function work(extra) {
    if (!guard()) return;
    const job = getJobDef();
    if (!job) {
      toast("还没有工作", "先在「工作」里找一份能吃饭的活。", "bad", "🪪");
      return;
    }
    const need = jobEnergyNeed(job, extra);
    if (state.stats.energy < need) {
      toast("精力不足", "至少需要 " + need + " 点精力，先休息一下吧。", "bad", "🔋");
      return;
    }

    const pay = Math.round(jobPay(job, extra) * rnd(0.94, 1.08));
    const m = mods();
    const satFactor = Math.max(0.4, 1 + m.satietyCost);
    const fatigueBefore = (state.daily && state.daily.worked) || 0;
    addStat("energy", -need);
    addStat("satiety", -Math.round((job.satiety + (extra ? 3 : 0)) * satFactor));
    addStat("mood", -(job.mood + (extra ? 3 : 0) + m.workMoodLoss));
    if (job.health) addStat("health", -job.health - (extra ? Math.max(0, 1 + m.overtimeHealth) : 0));
    addMoney(pay);
    state.totals.worked += 1;
    if (!state.daily) state.daily = {};
    state.daily.worked = fatigueBefore + 1;
    if (state.slot === D.slots.length - 1) state.totals.nightWork += 1;

    const line = pick(job.lines);
    log(
      line + " 你拿到了今天的工钱 " + fmt(pay) + (extra ? "（含加班费）" : "") + "。",
      "work"
    );

    if (Math.random() < job.skillChance) grantSkillXp(job.skill, Math.round(6 + job.pay / 250));

    state.job.exp = (state.job.exp || 0) + 1 * (1 + Math.max(0, mods().jobExp));
    const needExp = 5 + state.job.level * 4;
    if (state.job.level < 5 && state.job.exp >= needExp) {
      const gate = state.job.level + 2;
      const skillLv = state.skills[job.skill] || 0;
      if (skillLv < gate) {
        state.job.exp = needExp;
        if (!state.flags.promoHint || state.flags.promoHint !== state.day) {
          state.flags.promoHint = state.day;
          log(
            "主管提了一句晋升，但看了眼你的考核表又放下了。「" + skillName(job.skill) + "还得再练练，Lv." +
              gate + " 是硬指标。」", "system"
          );
        }
      } else {
        state.job.level += 1;
        state.job.exp = 0;
        addStat("mood", 8);
        log("你被提升了职级：Lv." + state.job.level + "。工资条上的数字多了一点，虽然还是不够看。", "system");
        toast("职级提升", job.name + " Lv." + state.job.level + " · 收入提高", "ach", "🪜");
      }
    }

    const ended = advanceSlot();
    if (!ended) maybeEvent("work", 0.38);
    commit();
  }

  function changeJob(id) {
    if (state.ended) return false;
    const job = getJobDef(id);
    if (!job) return false;
    if (state.job && state.job.id === id) return false;
    if (!meetsReq(job.req)) {
      toast("能力还不够", "先把相关技能练上去。", "bad", "📚");
      return false;
    }
    const requireWork = jobWorkReq(job);
    if ((state.totals.worked || 0) < requireWork) {
      toast("经验还不够", "这家公司想找至少上过 " + requireWork + " 个班次的人。", "bad", "🪪");
      return false;
    }
    if (!jobPrevOk(job)) {
      const names = (job.prev || []).map((pid) => (getJobDef(pid) || {}).name).filter(Boolean).join(" / ");
      toast("履历不够", "这条路上来的人才有资格坐这个位置：" + names, "bad", "🏢");
      return false;
    }
    const had = !!state.job;
    if (had) {
      if (!state.flags.jobHistory) state.flags.jobHistory = [];
      if (state.flags.jobHistory.indexOf(state.job.id) < 0) state.flags.jobHistory.push(state.job.id);
      state.totals.jobs = (state.totals.jobs || 0) + 1;
    }
    state.job = { id: id, level: 0, exp: 0 };
    if (!had) addStat("mood", 10);
    log(
      (had ? "你辞掉了原来的工作，换成了「" : "你找到了第一份工作：「") +
        job.name +
        "」。从现在开始，你的时间有了价钱。",
      "system"
    );
    checkAchievements();
    save();
    refresh();
    return true;
  }

  function advanceSlot() {
    state.slot += 1;
    if (state.slot >= D.slots.length) {
      endDay();
      return true;
    }
    return false;
  }

  /* ---------------- 日常 ---------------- */

  function nap() {
    if (!guard()) return;
    addStat("energy", 20);
    addStat("satiety", -4);
    addStat("mood", 3);
    log("你定了一个四十分钟的闹钟，睡得并不安稳，但醒来时脑子清楚了一点。", "life");
    advanceSlot();
    commit();
  }

  function endDay(early) {
    if (state.ended) return;
    if (state.stats.health <= 0) {
      forcedEnding();
      return;
    }
    /* 睡前先垫一口，别让自动吃饭只作用于白天 */
    const auto = state.automation || defaultAutomation();
    const eatBelow = auto.eatBelow || 30;
    const sleepTarget = state.stats.satiety <= eatBelow ? Math.max(40, eatBelow) : eatBelow;
    maybeAutoEat(sleepTarget);
    const h = getHousing();
    const late = state.slot >= D.slots.length;
    const isEarly = state.slot <= 2;

    /* 收支 */
    const sum = getDailySummary();
    const gross = Math.round(sum.gross * rnd(0.9, 1.12));
    const salaries = sum.salary;
    const expense = sum.housingCost + sum.living + sum.pet + sum.upkeep;
    const net = gross - salaries - expense;
    if (net >= 0) {
      addMoney(net);
      log("今日结算：收入 +" + fmt(gross) + "，支出 -" + fmt(expense + salaries) + "，结余 +" + fmt(net) + "。", "money");
    } else {
      const loss = -net;
      if (state.money >= loss) {
        state.money -= loss;
        state.totals.spent += loss;
        log("今日结算：收入 +" + fmt(gross) + "，支出 -" + fmt(expense + salaries) + "，净支出 " + fmt(loss) + "。", "money");
      } else {
        const short = loss - state.money;
        state.totals.spent += state.money;
        state.money = 0;
        state.debt += short;
        state.flags.hadDebt = true;
        addStat("mood", -10);
        log("钱不够了。你把仅有的一点现金付了房租，剩下的 " + fmt(short) + " 记成了欠款。", "bad");
      }
    }

    /* 睡眠恢复 */
    let rest = h.rest + assetSum("sleepBonus") + mods().sleepBonus + (isEarly ? 6 : 0) + (late ? -8 : 0);
    if (state.stats.satiety < 20) rest -= 8;
    addStat("energy", Math.round(rest));
    if (rest >= 60) addStat("health", 1);
    if (late) addStat("health", -2);

    /* 日常消耗 */
    addStat("satiety", -12);
    addStat("mood", -2);
    addStat("mood", Math.round(h.comfort * 0.35));
    addStat("health", assetSum("dailyHealth") + mods().dailyHealth);
    addStat("energy", assetSum("dailyEnergy"));
    addStat("mood", assetSum("dailyMood"));

    if (state.stats.satiety <= 0) {
      addStat("health", -8);
      addStat("mood", -5);
      log("你在饥饿中醒来，胃像一只被拧紧的袋子。长期这样下去，身体会先撑不住。", "bad");
    } else if (state.stats.satiety < 20) {
      addStat("health", -3);
    } else if (state.stats.satiety > 55 && state.stats.mood > 45) {
      /* 吃得饱、心情不差，身体会自己慢慢修复 */
      addStat("health", h.comfort >= 5 ? 2 : 1);
    }

    if (state.debt > 0) {
      const rate = Math.max(0.008, 0.025 + mods().debtInterest);
      const interest = Math.max(1, Math.round(state.debt * rate));
      state.debt += interest;
      addStat("mood", -2);
      log("欠款 " + fmt(state.debt) + "，今天又多了 " + fmt(interest) + " 利息。数字像一块石头，压在口袋里。", "bad");
      state.flags.hadDebt = true;
    }

    if (state.stats.mood < 20) {
      log("你已经很久没有真正笑过了。心里那根弦绷得太紧，连呼吸都变得小心翼翼。", "bad");
    }

    /* 店铺口碑与推广维护：定价决定口碑走向，推广逐日消耗 */
    if (state.businesses.length) {
      let repLine = [];
      state.businesses.forEach((b) => {
        const bd = getBusinessDef(b.id);
        if (!bd) return;
        const price = bizPriceDef(b.price);
        const before = Math.round(b.rep || 50);
        b.rep = clamp((b.rep || 50) + (price.rep || 0) + mods().bizRep);
        if (b.ads > 0) b.ads -= 1;
        if (state.day % 3 === 0) repLine.push(bd.name + " 口碑 " + before + " → " + Math.round(b.rep));
      });
      if (repLine.length) log(repLine.join(" · "), "system");
    }

    tickBuffs();

    /* 新的一天 */
    state.day += 1;
    state.slot = 0;
    state.flags.eventCount = 0;
    state.daily = { bargainUsed: false, pet: false, visits: {}, games: {}, ads: {}, worked: 0, oddJobs: 0, meds: 0 };

    const nextWeather = pick(D.weather);
    state.weather = nextWeather.id;
    addStat("mood", nextWeather.mood);
    addStat("satiety", nextWeather.satiety);

    logDayHeader();
    log(nextWeather.line, "system");
    maybeAutoAd();
    if (state.debt > 0) {
      log("你欠着钱，但天还是亮了。", "narrative");
    }

    if (state.stats.health <= 0) {
      forcedEnding();
      return;
    }

    maybeEvent("day", 0.72);
    checkAchievements();
    save();
    refresh();
    if (window.UI) UI.dayTransition(state);
  }

  function sleepNow() {
    if (!guard()) return;
    endDay(true);
  }

  /* ---------------- 消费 ---------------- */

  function itemEffectsText(item) {
    if (item.type === "buff" && item.tag) return item.tag;
    const parts = [];
    if (item.effects) {
      D.stats.forEach((s) => {
        const v = item.effects[s.key];
        if (v) parts.push(s.name + (v > 0 ? "+" : "") + v);
      });
    }
    return parts.join(" · ");
  }

  function useItem(id) {
    if (!guard()) return;
    const item = D.items.find((i) => i.id === id);
    if (!item || item.type === "asset") return;
    /* 药不能当饭吃：每天最多两次回复健康的药，避免无限回血 */
    const isMed = !!(item.effects && item.effects.health > 0 && item.type === "boost");
    if (isMed && (state.daily.meds || 0) >= 2) {
      toast("今天已经吃够药了", "身体不是靠药堆出来的，明天再说。", "bad", "💊");
      return;
    }
    const cost = itemPrice(item);
    if (state.money < cost) {
      toast("现金不足", "还差 " + fmt(cost - state.money) + "。", "bad", "💸");
      return;
    }
    spend(cost);
    if (item.type === "buff" && item.buff) {
      const days = Math.max(1, Math.round(item.buff.days || 3));
      const existing = state.buffs.find((b) => b.id === item.id);
      let left = days;
      if (existing) {
        existing.left = Math.min(30, existing.left + days);
        left = existing.left;
      } else {
        state.buffs.push({ id: item.id, left: days });
      }
      addStat("mood", 2);
      log("你启用了「" + item.name + "」。" + (existing ? "效果续期到 " + left + " 天。" : item.tag || ""), "life");
      toast(item.name + " · 生效", (item.tag || itemEffectsText(item)) + " · 剩余 " + left + " 天", "life", item.icon);
      commit();
      return;
    }
    if (item.effects) {
      Object.keys(item.effects).forEach((k) => addStat(k, item.effects[k]));
    }
    if (isMed) state.daily.meds = (state.daily.meds || 0) + 1;
    if (item.type === "fun") {
      const bonus = assetSum("funMood");
      if (bonus) addStat("mood", bonus);
    }
    log("你花 " + fmt(cost) + " 用了「" + item.name + "」。" + (item.type === "food" ? "胃里终于有了点实在的东西。" : "有总比没有好。"), "life");
    toast(item.name, itemEffectsText(item), "life", item.icon);
    commit();
  }

  function buyAsset(id) {
    if (!guard()) return;
    const item = D.items.find((i) => i.id === id);
    if (!item || item.type !== "asset") return;
    if (state.assets[id]) {
      toast("已经拥有了", "它正安静地待在属于它的角落。", "bad", item.icon);
      return;
    }
    const cost = itemPrice(item);
    if (state.money < cost) {
      toast("现金不足", "还差 " + fmt(cost - state.money) + "。", "bad", "💸");
      return;
    }
    spend(cost);
    state.assets[id] = true;
    addStat("mood", 6);
    log("你买下了「" + item.name + "」。" + item.desc, "life");
    toast("购入 " + item.name, item.tag, "money", item.icon);
    checkAchievements();
    save();
    refresh();
  }

  /* ---------------- 成长 ---------------- */

  function trainCost(skill) {
    const lv = state.skills[skill] || 0;
    /* 低等级便宜、高等级变贵：让前几级在第一天够得着，又让满级成为长期目标 */
    let cost = 60 + lv * 60;
    if (skill === "tech") {
      let discount = assetSum("techDiscount") + (state.skills.tech || 0) * 0.02;
      discount += mods().techTrainDiscount;
      const extra = Math.max(-0.4, Math.min(0.5, mods().techTrainCost));
      cost = Math.round(cost * (1 - clamp(discount, 0, 0.5)) * (1 + extra));
    }
    cost = Math.round(cost * (1 - assetSum("learnDiscount")));
    cost = Math.round(cost * (1 + mods().trainCost));
    return Math.max(30, cost);
  }

  function train(skill) {
    if (!guard()) return;
    const meta = D.skills.find((s) => s.key === skill);
    if (!meta) return;
    if ((state.skills[skill] || 0) >= MAX_SKILL) {
      toast("已到瓶颈", "这项能力已经练到这座城市的上限了。", "bad", "🧱");
      return;
    }
    const cost = trainCost(skill);
    if (state.money < cost) {
      toast("学费不够", "还差 " + fmt(cost - state.money) + "。", "bad", "💸");
      return;
    }
    let energy = 12;
    if (skill === "stamina") energy += assetSum("trainEnergy");
    if (state.stats.energy < energy) {
      toast("精力不足", "学习也需要力气。", "bad", "🔋");
      return;
    }
    spend(cost);
    addStat("energy", -energy);
    addStat("satiety", -Math.round(4 * Math.max(0.4, 1 + mods().satietyCost)));
    addStat("mood", 2);
    const xp = skillTrainXp(skill);
    const gained = grantSkillXp(skill, xp);
    const flavor = {
      stamina: "你在操场上跑了五圈，肺里像着了火，但心跳得很实在。",
      social: "你报了一个沟通课。老师让你对陌生人微笑，你练了一整晚。",
      tech: "你跟着教程敲完一个项目，最后一行代码跑通时，窗外的灯已经亮成一片。",
      business: "你读完一章财务报表，第一次看懂了那些数字背后的意思。"
    };
    log(flavor[skill] + " 「" + meta.name + "」经验 +" + xp + (gained ? "，升到了 Lv." + state.skills[skill] + "。" : "。"), "system");
    if (!gained) {
      const need = skillNeed(skill);
      toast("训练完成", meta.name + " 经验 +" + xp + " · " + (state.skillXp[skill] || 0) + "/" + need, "life", meta.icon);
    }
    advanceSlot();
    commit();
  }

  /* 技能等级解锁的特殊行动：让“等级高”能直接变成新的赚钱手段 */
  function skillActionDef(id) {
    return (D.skillActions || []).find((a) => a.id === id) || null;
  }

  function skillActionUnlocked(a) {
    if (!a) return false;
    return (state.skills[a.skill] || 0) >= a.level;
  }

  function doSkillAction(id) {
    if (!guard()) return false;
    const a = skillActionDef(id);
    if (!a) return false;
    if (!skillActionUnlocked(a)) {
      toast("还没解锁", "需要" + skillName(a.skill) + " Lv." + a.level + "。", "bad", "🔒");
      return false;
    }
    if (id === "market" && !state.businesses.length) {
      toast("还没有店", "先去盘一家店，再来做调研。", "bad", "🏪");
      return false;
    }
    if (state.stats.energy < a.energy) {
      toast("精力不足", "这件事至少需要 " + a.energy + " 点精力。", "bad", "🔋");
      return false;
    }
    addStat("energy", -a.energy);
    addStat("satiety", -(a.satiety || 3));

    if (id === "gig") {
      const lv = state.skills.tech || 0;
      const pay = Math.round((240 + lv * 85) * rnd(0.9, 1.15));
      addMoney(pay);
      grantSkillXp("tech", 18 + lv * 5);
      addStat("mood", 3);
      log("你接了一单私活，客户改了三版需求，最后一版回到了第一版。尾款 " + fmt(pay) + "，你把电脑合上，天已经黑了。", "money");
    } else if (id === "pitch") {
      const lv = state.skills.social || 0;
      const biz = state.skills.business || 0;
      const pay = Math.round((360 + lv * 95 + biz * 55) * rnd(0.9, 1.12));
      addMoney(pay);
      grantSkillXp("social", 16 + lv * 4);
      addStat("mood", 2);
      log("你约了一个老客户喝茶，聊了两小时，把下季度的单子谈了下来。定金 " + fmt(pay) + " 到账时，茶杯还没凉。", "money");
    } else if (id === "market") {
      state.businesses.forEach((b) => {
        b.rep = clamp((b.rep || 50) + 8);
      });
      grantSkillXp("business", 22 + (state.skills.business || 0) * 5);
      addStat("mood", 2);
      log("你花了半天跑遍附近的同类店，记了满满两页纸。回到自己店里，你调整了陈列，也记下三条可以马上改的事。", "system");
      toast("市场调研完成", "所有店铺口碑 +8", "life", "🔍");
    } else if (id === "coach") {
      const lv = state.skills.stamina || 0;
      const pay = Math.round((90 + lv * 35) * rnd(0.9, 1.2));
      addMoney(pay);
      grantSkillXp("stamina", 22 + lv * 6);
      addStat("health", 2);
      addStat("mood", 4);
      log("你带着三个人沿江跑了五公里，回来时腿在抖，心是热的。课时费 " + fmt(pay) + "，不多，但你睡得着了。", "money");
    }

    advanceSlot();
    commit();
    return true;
  }

  /* ---------------- 生活 ---------------- */

  function socialize() {
    if (!guard()) return;
    if (state.stats.energy < 6) {
      toast("实在没力气了", "连说话的力气都没有，先休息吧。", "bad", "🔋");
      return;
    }
    if (state.money < 60) {
      toast("现金不足", "社交也是要花钱的。", "bad", "💸");
      return;
    }
    spend(60);
    const m = mods();
    addStat("mood", 13 + (state.skills.social || 0) + m.socialMood);
    addStat("satiety", 8);
    addStat("energy", -6);
    if (Math.random() < 0.55) grantSkillXp("social", 12 + (state.skills.social || 0));
    const lines = [
      "你约了旧同事吃烧烤，聊到半夜。有人升职了，有人回老家了，有人还在找方向。",
      "你在青旅的公共区域认识了一个背包客，听他讲了三个小时别的城市。",
      "你请楼下便利店的店员喝了杯奶茶。她说这条街半夜两点最安静。"
    ];
    state.totals.social = (state.totals.social || 0) + 1;
    log(pick(lines), "life");
    advanceSlot();
    commit();
  }

  function relax() {
    if (!guard()) return;
    if (state.stats.energy < 4) {
      toast("走不动了", "脚下的路忽然变得很长。先回去睡一觉吧。", "bad", "🔋");
      return;
    }
    addStat("mood", 7);
    addStat("energy", -4);
    addStat("satiety", -3);
    addStat("health", 1);
    if (Math.random() < 0.4) grantSkillXp("stamina", 10 + (state.skills.stamina || 0));
    const lines = [
      "你沿着江边走了很久，风把头发吹乱。对岸的灯一盏接一盏亮起来。",
      "你在公园的长椅上坐了一下午，看小孩放风筝，看老人下棋。",
      "你关掉手机，坐在窗边听城市的声音。车流像一条不会断的河。"
    ];
    state.totals.relax = (state.totals.relax || 0) + 1;
    log(pick(lines), "life");
    advanceSlot();
    commit();
  }

  function petCat() {
    if (!guard()) return;
    if (!hasAsset("cat")) {
      toast("你还没有猫", "可以去商店看看，或者在楼下偶遇。", "bad", "🐈");
      return;
    }
    if (state.daily.pet) {
      toast("它已经睡着了", "别吵醒馒头。", "bad", "😴");
      return;
    }
    state.daily.pet = true;
    addStat("mood", 8);
    addStat("energy", -2);
    log("馒头跳上你的膝盖，踩了两下，找了个舒服的位置趴下。你不敢动，怕吵醒它。", "life");
    checkAchievements();
    save();
    refresh();
  }

  /* ---------------- 住房 ---------------- */

  function moveHousing(id, buy) {
    if (!guard()) return { ok: false };
    const h = D.housings.find((x) => x.id === id);
    if (!h) return { ok: false };
    if (state.housing.id === id && !buy) return { ok: false, reason: "已经住在这里了" };
    if (state.housing.id === id && state.housing.owned) return { ok: false, reason: "这套房已经是你的了" };
    if (buy && !h.buy) return { ok: false, reason: "这里没有产权" };

    const current = getHousing();
    const sold = state.housing.owned ? Math.round(current.buy * 0.82) : 0;
    const need = buy ? Math.round(h.buy * 0.3) : h.rent * 2;
    const funds = state.money + sold;
    if (funds < need) {
      return {
        ok: false,
        reason: (buy ? "首付还差 " : "押金还差 ") + fmt(need - funds),
        sold: 0
      };
    }

    /* 资金足够后才真正卖出旧房，避免交易失败却丢了房子 */
    if (sold) {
      state.money += sold;
      log("你把「" + current.name + "」挂到了中介，最后按八二折出手，到账 " + fmt(sold) + "。", "money");
    }

    if (buy) {
      const down = need;
      state.money -= down;
      state.housing = { id: id, owned: true };
      addStat("mood", 14);
      log("你在购房合同上签了名字。首付 " + fmt(down) + "，剩下的分三十年还。走出中介时，太阳有点晃眼。", "money");
      toast("买下了「" + h.name + "」", "首付 " + fmt(down) + " · 每日房贷 " + fmt(h.buy * 0.0007), "ach", h.icon);
      log(h.line, "life");
      checkAchievements();
    } else {
      const deposit = need;
      state.money -= deposit;
      state.housing = { id: id, owned: false };
      addStat("mood", 7);
      log("你搬进了「" + h.name + "」。押金付了 " + fmt(deposit) + "，房东把钥匙递给你时说：别弄坏了。", "life");
      toast("搬进了「" + h.name + "」", "每日房租 " + fmt(h.rent) + " · 睡眠恢复提升", "money", h.icon);
      log(h.line, "life");
      checkAchievements();
    }
    state.totals.spent += need;
    save();
    refresh();
    return { ok: true, sold };
  }

  /* ---------------- 经营 ---------------- */

  function buyBusiness(id) {
    if (!guard()) return false;
    const bd = getBusinessDef(id);
    if (!bd) return false;
    if (state.businesses.some((b) => b.id === id)) return false;
    if (!meetsReq(bd.req)) {
      toast("能力还不足以经营", "先提升商业技能。", "bad", "📈");
      return false;
    }
    if (state.money < bd.cost) {
      toast("资金不足", "还差 " + fmt(bd.cost - state.money) + "。", "bad", "💸");
      return false;
    }
    spend(bd.cost);
    state.businesses.push({ id: id, level: 1, rep: 50, staff: bd.staff, price: "normal", ads: 0, adEver: false });
    addStat("mood", 10);
    addStat("energy", -6);
    log("你签下了「" + bd.name + "」的转让合同。" + bd.desc, "money");
    const projected = Math.round(bd.income * businessIncomeMult());
    toast("开业大吉", bd.name + " · 每日营收约 " + fmt(projected), "ach", bd.icon);
    checkAchievements();
    save();
    refresh();
    return true;
  }

  function upgradeBusiness(id) {
    if (!guard()) return;
    const b = state.businesses.find((x) => x.id === id);
    if (!b) return;
    const bd = getBusinessDef(id);
    if (!bd) return;
    if (b.level >= 5) {
      toast("已经做到头了", "再往上，就不是这家店能承载的事了。", "bad", "🏁");
      return;
    }
    const repNeed = b.level >= 4 ? 70 : b.level >= 3 ? 55 : 0;
    if (repNeed && (b.rep || 0) < repNeed) {
      toast("口碑还撑不起这家店", "升级需要口碑 " + repNeed + "，当前 " + Math.round(b.rep || 0) + "。多巡店、少溢价。", "bad", "⭐");
      return;
    }
    const cost = bizUpgradeCost(b);
    if (state.money < cost) {
      toast("资金不足", "升级需要 " + fmt(cost) + "。", "bad", "💸");
      return;
    }
    spend(cost);
    b.level += 1;
    b.rep = clamp((b.rep || 50) + 4);
    addStat("mood", 6);
    grantSkillXp("business", Math.round(skillNeed("business") * 0.8));
    log("你给「" + bd.name + "」升了级：换了设备、扩了门面。账上的数字暂时变薄，但你知道它会回来。", "money");
    toast("店铺升级", bd.name + " Lv." + b.level + " · 日营收 " + fmt(bizGrossIncome(b)), "ach", "⬆️");
    checkAchievements();
    save();
    refresh();
  }

  /* 定价：直接影响流水与口碑 */
  function setBizPrice(id, priceId) {
    if (!guard()) return false;
    const b = state.businesses.find((x) => x.id === id);
    if (!b) return false;
    const price = bizPriceDef(priceId);
    if (b.price === price.id) return false;
    b.price = price.id;
    log("你把「" + getBusinessDef(id).name + "」的价格调成了「" + price.name + "」。" + price.desc, "money");
    toast("价格调整", price.name + " · 流水 ×" + price.mult, "life", "🏷️");
    save();
    refresh();
    return true;
  }

  /* 投放广告：三天内流水 +28%，口碑小幅上升 */
  function bizAdCost(b) {
    return Math.round(bizBaseIncome(b) * 1.1 + 300);
  }

  function bizAdPlan() {
    const items = state.businesses
      .filter((b) => !(b.ads > 0))
      .map((b) => ({ b: b, cost: bizAdCost(b) }));
    return { items: items, count: items.length, cost: items.reduce((n, x) => n + x.cost, 0) };
  }

  function buyBizAd(id) {
    if (!guard()) return false;
    const b = state.businesses.find((x) => x.id === id);
    const bd = getBusinessDef(id);
    if (!b || !bd) return false;
    const cost = bizAdCost(b);
    if (state.money < cost) {
      toast("预算不足", "这次推广需要 " + fmt(cost) + "。", "bad", "💸");
      return false;
    }
    spend(cost);
    b.ads = 3;
    b.adEver = true;
    b.rep = clamp((b.rep || 50) + 4);
    addStat("mood", 2);
    log("你给「" + bd.name + "」投了三天推广。账单先到，客人后到。", "money");
    toast("推广上线", "未来 3 天流水 +28% · 花费 " + fmt(cost), "money", "📣");
    save();
    refresh();
    return true;
  }

  /* 一键给所有还没在推广的店铺投放三天广告 */
  function buyAllBizAds() {
    if (!guard()) return null;
    if (!state.businesses.length) {
      toast("还没有店铺", "先盘下一家店，再谈推广。", "bad", "🏪");
      return null;
    }
    const plan = bizAdPlan();
    if (!plan.count) {
      toast("都在推广中", "所有店铺的广告都还在跑，等它跑完再说。", "life", "📣");
      return null;
    }
    if (state.money < plan.cost) {
      toast("预算不足", "一键推广需要 " + fmt(plan.cost) + "，还差 " + fmt(plan.cost - state.money) + "。", "bad", "💸");
      return null;
    }
    plan.items.forEach((entry) => {
      spend(entry.cost);
      entry.b.ads = 3;
      entry.b.adEver = true;
      entry.b.rep = clamp((entry.b.rep || 50) + 4);
    });
    addStat("mood", 2);
    log("你给 " + plan.count + " 家店同时投了三天推广，花掉 " + fmt(plan.cost) + "。", "money");
    toast("推广上线", plan.count + " 家店 · 未来 3 天流水 +28% · 花费 " + fmt(plan.cost), "money", "📣");
    save();
    refresh();
    return { count: plan.count, cost: plan.cost };
  }

  /* 自动续投：只续投投过广告、且当前没有推广的店，现金低于 300 时暂停 */
  function maybeAutoAd() {
    const auto = state.automation || defaultAutomation();
    if (!auto.autoAd || state.pendingEvent || !state.businesses.length) return 0;
    const targets = state.businesses.filter((b) => b.adEver && !(b.ads > 0));
    if (!targets.length) return 0;
    const cost = targets.reduce((n, b) => n + bizAdCost(b), 0);
    if (state.money - cost < 300) return 0;
    targets.forEach((b) => {
      spend(bizAdCost(b));
      b.ads = 3;
      b.rep = clamp((b.rep || 50) + 4);
    });
    addStat("mood", 1);
    log("推广到期，你自动续投了 " + targets.length + " 家店，花掉 " + fmt(cost) + "。", "money");
    toast("自动续投推广", targets.length + " 家店 · 未来 3 天流水 +28% · 花费 " + fmt(cost), "money", "📣");
    return targets.length;
  }

  /* 招人：提高接待能力，也提高工资支出 */
  function hireBizStaff(id) {
    if (!guard()) return false;
    const b = state.businesses.find((x) => x.id === id);
    const bd = getBusinessDef(id);
    if (!b || !bd) return false;
    const max = bd.staff + 4;
    if (b.staff >= max) {
      toast("人够了", "再招下去，走廊都站不下了。", "bad", "🧍");
      return false;
    }
    const cost = Math.round(bd.salary * 6 + 200);
    if (state.money < cost) {
      toast("资金不足", "招聘与培训需要 " + fmt(cost) + "。", "bad", "💸");
      return false;
    }
    spend(cost);
    b.staff += 1;
    b.rep = clamp((b.rep || 50) + 2);
    log("「" + bd.name + "」多了一个新同事。你教了他一整天，晚上嗓子有点哑。", "money");
    toast("招到人了", "员工 " + b.staff + " 人 · 招聘支出 " + fmt(cost), "life", "🧑‍🍳");
    save();
    refresh();
    return true;
  }

  function manageBusiness(id) {
    if (!guard()) return;
    const b = state.businesses.find((x) => x.id === id);
    if (!b) return;
    const bd = getBusinessDef(id);
    if (!bd) return;
    if (state.stats.energy < 6) {
      toast("精力不足", "巡店至少需要 6 点精力，先休息一下。", "bad", "🔋");
      return;
    }
    if (state.daily.visits[id]) {
      toast("今天已经去过了", "明天再去看看吧。", "bad", "🚪");
      return;
    }
    const bonus = Math.round(bizGrossIncome(b) * rnd(0.14, 0.22));
    state.daily.visits[id] = true;
    addMoney(bonus);
    addStat("mood", 4);
    addStat("energy", -6);
    b.rep = clamp((b.rep || 50) + 6 + Math.round((state.skills.business || 0) * 0.8 + (state.skills.social || 0) * 0.3));
    if (Math.random() < 0.5) grantSkillXp("business", 14 + (state.skills.business || 0));
    log(
      "你去「" + bd.name + "」转了一圈，盯了一下午的流水，顺手处理了两个小问题。当天多进账 " + fmt(bonus) +
        "，口碑涨到 " + Math.round(b.rep) + "。", "money"
    );
    const ended = advanceSlot();
    if (!ended) maybeEvent("biz", 0.34);
    commit();
  }

  function repayDebt(amount) {
    if (state.debt <= 0) {
      toast("没有欠款", "无债一身轻。", "life", "🕊️");
      return;
    }
    const pay = Math.min(amount, state.debt, state.money);
    if (pay <= 0) {
      toast("现金不足", "先想办法赚点钱。", "bad", "💸");
      return;
    }
    state.money -= pay;
    state.debt -= pay;
    addStat("mood", 5);
    log("你还了 " + fmt(pay) + " 欠款，剩余 " + fmt(state.debt) + "。手机屏幕暗下来，你长出一口气。", "money");
    if (state.debt <= 0) {
      state.debt = 0;
      toast("还清了", "没有债的日子，连风都是轻的。", "ach", "🕊️");
      addStat("mood", 10);
      log("所有欠款清零。你把记账软件里那一行红字删掉，像是删掉了一段日子。", "system");
    }
    checkAchievements();
    save();
    refresh();
  }

  function borrow(amount) {
    if (state.ended) return;
    state.debt += amount;
    state.money += amount;
    state.flags.hadDebt = true;
    addStat("mood", -7);
    log("你从借贷平台借了 " + fmt(amount) + "。到账很快，代价是每天醒来都记着它。", "bad");
    toast("借款到账", fmt(amount) + " · 记得还", "bad", "🏦");
    checkAchievements();
    save();
    refresh();
  }

  /* ---------------- 小游戏 ---------------- */

  const ODD_JOB_DAILY_CAP = (D && D.minigameDailyCap) || 3;

  /* 零工的收益倍率：技术/体能/特质共同决定 */
  function minigamePayMult() {
    const m = mods();
    return 1 + m.minigamePay + (state.skills.tech || 0) * 0.015 + (state.skills.stamina || 0) * 0.008;
  }

  /* 零工面板 / 结算共用的一份状态快照 */
  function minigameInfo(type) {
    const mg = D.minigames.find((m) => m.id === type);
    if (!mg) return null;
    if (!state.daily) state.daily = {};
    if (!state.daily.games) state.daily.games = {};
    const used = state.daily.games[type] || 0;
    const total = Math.max(0, Math.round(state.daily.oddJobs || 0));
    const cap = mg.cap || 2;
    const fatigue = total;
    const energy = Math.max(1, Math.round((mg.energy || 0) - mods().minigameEnergy + fatigue));
    const satiety = Math.max(1, Math.round((mg.satiety || 0) * Math.max(0.4, 1 + mods().satietyCost)));
    const payMult = minigamePayMult() * Math.max(0.8, 1 - fatigue * 0.08);
    const base = type === "rider" ? 25 + 150 * 0.62
      : type === "sorter" ? 20 + 220 * 0.45
      : type === "memory" ? 30 + 80
      : 20 + 2 * 35;
    const pay = Math.round(base * payMult);
    let reason = "";
    if (used >= cap) reason = type === "bargain" ? "今天已经去过早市了" : "今天这单做够了";
    else if (total >= ODD_JOB_DAILY_CAP) reason = "今天的零工已经排满";
    else if (state.stats.energy < energy) reason = "精力不足";
    return {
      id: type,
      def: mg,
      used: used,
      cap: cap,
      total: total,
      dailyCap: ODD_JOB_DAILY_CAP,
      energy: energy,
      satiety: satiety,
      fatigue: fatigue,
      pay: pay,
      payMult: payMult,
      canPlay: !reason && !state.ended && !state.pendingEvent,
      reason: reason
    };
  }

  function startMinigame(type) {
    if (!guard()) return { ok: false, reason: "busy" };
    const info = minigameInfo(type);
    if (!info) return { ok: false };
    const mg = info.def;
    if (!state.daily.games) state.daily.games = {};
    if (info.used >= info.cap) {
      toast(
        type === "bargain" ? "今天已经砍过价了" : "今天做得够多了",
        type === "bargain" ? "早市收摊了，明天再来。" : "这类零工一天最多 " + info.cap + " 单，明天再来。",
        "bad", "🛑"
      );
      return { ok: false, reason: "limit" };
    }
    if (info.total >= ODD_JOB_DAILY_CAP) {
      toast("今天的零工排满了", "一天最多打 " + ODD_JOB_DAILY_CAP + " 份零工，再多身体也扛不住。", "bad", "🛑");
      return { ok: false, reason: "cap" };
    }
    if (state.stats.energy < info.energy) {
      toast(
        "精力不足",
        "这一单至少需要 " + info.energy + " 点精力" +
          (info.fatigue ? "（今天已经零工 " + info.fatigue + " 次，更累了）" : "") + "。",
        "bad", "🔋"
      );
      return { ok: false, reason: "energy" };
    }
    addStat("energy", -info.energy);
    addStat("satiety", -info.satiety);
    state.daily.games[type] = info.used + 1;
    state.daily.oddJobs = info.total + 1;
    if (type === "bargain") state.daily.bargainUsed = true;
    save();
    return { ok: true, energy: info.energy, total: state.daily.oddJobs };
  }

  function finishMinigame(type, score) {
    score = Math.max(0, Math.round(score));
    /* 这一单在 startMinigame 时已经计入今日零工数，结算时要减回去才是「之前做过几单」 */
    const fatigue = Math.max(0, oddJobFatigue() - 1);
    let base = 0;
    let extra = "";
    let mood = 0;
    if (type === "rider") {
      base = 25 + score * 0.62;
      if (Math.random() < 0.4) grantSkillXp("stamina", 10 + (state.skills.stamina || 0));
      extra = "接住 " + score + " 分订单";
      mood = 3;
    } else if (type === "sorter") {
      base = 20 + score * 0.45;
      if (Math.random() < 0.35) grantSkillXp("stamina", 8 + (state.skills.stamina || 0));
      extra = "分拣得分 " + score;
      mood = 2;
    } else if (type === "bargain") {
      base = 20 + score * 35;
      mood = score * 3;
      extra = "三局两胜，你赢了 " + score + " 局";
      if (Math.random() < 0.5) grantSkillXp("social", 10 + (state.skills.social || 0));
    } else if (type === "memory") {
      base = 30 + score;
      mood = 2;
      extra = "盘对了 " + Math.round(score / 20) + " 组货位";
      if (Math.random() < 0.4) grantSkillXp("business", 10 + (state.skills.business || 0));
    }
    /* 疲劳递减：今天第 2 单 -8%，第 3 单 -16% */
    const payMult = minigamePayMult() * Math.max(0.8, 1 - fatigue * 0.08);
    const pay = Math.round(base * payMult);
    addMoney(pay);
    if (mood) addStat("mood", mood);
    state.totals.minigames += 1;
    if (!state.daily.games) state.daily.games = {};
    if (type === "rider") {
      log("你在晚高峰里跑了 " + score + " 分，结算时到账 " + fmt(pay) + "。头盔里全是汗，但晚风是凉的。", "money");
    } else if (type === "sorter") {
      log("分拣线终于慢下来。你活动了一下手腕，今天的工钱是 " + fmt(pay) + "。", "money");
    } else if (type === "memory") {
      log("盘点表终于对上了。你揉了揉发酸的眼睛，仓库管理员在单子上签了字：" + fmt(pay) + "，明天还有一批。", "money");
    } else if (type === "bargain") {
      log("你在早市帮人砍价，赢了 " + score + " 局，摊主笑着塞给你 " + fmt(pay) + " 跑腿费。", "money");
    }
    const perfect =
      (type === "rider" && score >= 180) ||
      (type === "sorter" && score >= 320) ||
      (type === "memory" && score >= 120) ||
      (type === "bargain" && score >= 3);
    if (perfect) {
      state.totals.perfect = (state.totals.perfect || 0) + 1;
      addStat("mood", 6);
      toast("满分表现", "这一趟干得漂亮 · 额外心情 +6", "ach", "✨");
      log("你今天的手感好得不像话。收工时，连路边的风都像在给你鼓掌。", "system");
    }
    /* 零工也要占用一个时段：这是它和正式工作之间真正的取舍 */
    const dayEnded = advanceSlot();
    commit();
    return {
      money: pay,
      extra: extra,
      fatigue: fatigue,
      note:
        "时段 -1 · 零工 " + Math.min(state.daily.oddJobs || 1, ODD_JOB_DAILY_CAP) + "/" + ODD_JOB_DAILY_CAP +
        (fatigue ? " · 疲劳 -" + (100 - Math.round(Math.max(0.8, 1 - fatigue * 0.08) * 100)) + "% 收入" : "") +
        (mood ? " · 心情 +" + mood : "") +
        (dayEnded ? " · 天亮了" : ""),
      timeCost: 1
    };
  }

  /* ---------------- 事件 ---------------- */

  const MAX_EVENTS_PER_DAY = 2;

  function eventPool(pool) {
    if (pool === "work") return (D.workEvents || []).concat(D.workEventsExtra || []);
    if (pool === "biz") return D.bizEvents || [];
    return D.events || [];
  }

  function eventDefById(id) {
    return (
      eventPool("day").find((e) => e.id === id) ||
      eventPool("work").find((e) => e.id === id) ||
      eventPool("biz").find((e) => e.id === id) ||
      null
    );
  }

  function maybeEvent(pool, chance) {
    if (state.ended || state.pendingEvent) return;
    if (pool === "work" && !state.job) return;
    if (pool === "biz" && !(state.businesses && state.businesses.length)) return;
    /* 每天最多两次事件，同一时段不会连续触发 */
    if (state.flags.eventDay === state.day) {
      if ((state.flags.eventCount || 0) >= MAX_EVENTS_PER_DAY) return;
      if (state.flags.eventSlot === state.slot) return;
    }
    if (Math.random() > chance) return;
    const list = eventPool(pool).filter((e) => !e.cond || e.cond(state));
    if (!list.length) return;
    const recent = state.flags.recentEvents || [];
    const fresh = list.filter((e) => !recent.includes(e.id));
    const source = fresh.length ? fresh : list;
    let total = 0;
    source.forEach((e) => (total += e.weight || 5));
    let roll = Math.random() * total;
    let chosen = source[0];
    for (const e of source) {
      roll -= e.weight || 5;
      if (roll <= 0) { chosen = e; break; }
    }
    state.flags.eventDay = state.day;
    state.flags.eventSlot = state.slot;
    state.flags.eventCount = (state.flags.eventCount || 0) + 1;
    state.flags.recentEvents = [chosen.id].concat(recent).slice(0, 10);
    state.pendingEvent = {
      eventId: chosen.id,
      source: pool,
      outcome: null,
      chosenLabel: null
    };
    save();
  }

  function getPendingEvent() {
    if (!state.pendingEvent) return null;
    return eventDefById(state.pendingEvent.eventId);
  }

  function chooseEvent(index) {
    const evt = getPendingEvent();
    if (!evt) return;
    if (state.pendingEvent.outcome) return;
    const choice = evt.choices[index];
    if (!choice) return;
    if (choice.req && !choice.req(state)) return;

    const outcomes = [];
    const A = {
      stat: (k, n) => addStat(k, n),
      money: (n) => addMoney(n),
      debt: (n) => { state.debt += n; state.flags.hadDebt = true; },
      skill: (k, n = 1) => {
        const level = state.skills[k] || 0;
        /* 事件只给一次有分量的心得，不按“当前升级所需”比例给，避免高等级事件一口气跳级 */
        const amount = n > 0 ? (20 + level * 8) * n : -(15 + level * 5);
        const gained = grantSkillXp(k, Math.round(amount));
        if (gained) outcomes.push("你的「" + skillName(k) + "」提升到了 Lv." + state.skills[k] + "。");
        else if (n > 0) outcomes.push("你对「" + skillName(k) + "」有了新的体会。");
        return gained;
      },
      skillLevel: (k) => state.skills[k] || 0,
      asset: (id) => {
        if (state.assets[id]) return false;
        state.assets[id] = true;
        return true;
      },
      job: (id) => {
        const jd = getJobDef(id);
        if (jd) {
          if (state.job && !state.flags.jobHistory.includes(state.job.id)) state.flags.jobHistory.push(state.job.id);
          state.job = { id: id, level: 0, exp: 0 };
          state.flags.hadDebt = state.flags.hadDebt || false;
        }
        return !!jd;
      },
      /* 事件里的店铺操作：口碑、员工、自定义 */
      rep: (n) => {
        (state.businesses || []).forEach((b) => {
          b.rep = clamp((b.rep || 50) + n);
        });
        if (n) outcomes.push("店铺口碑 " + (n > 0 ? "+" : "") + n + "。");
      },
      staff: (n) => {
        (state.businesses || []).forEach((b) => {
          const bd = getBusinessDef(b.id);
          const max = bd ? bd.staff + 4 : 99;
          b.staff = Math.max(0, Math.min(max, (b.staff || 0) + n));
        });
        if (n) outcomes.push("员工人数 " + (n > 0 ? "+" : "") + n + "。");
      },
      shop: (fn) => {
        (state.businesses || []).forEach((b) => {
          try { fn(b, getBusinessDef(b.id)); } catch (e) {}
        });
      },
      flag: (k, v = true) => { state.flags[k] = v; },
      chance: (p) => Math.random() < Math.min(0.95, p + mods().eventLuck),
      say: (t) => outcomes.push(t),
      item: (id) => {
        const item = D.items.find((i) => i.id === id);
        if (!item) return false;
        if (item.effects) Object.keys(item.effects).forEach((k) => addStat(k, item.effects[k]));
        outcomes.push("你得到了「" + item.name + "」。");
        return true;
      }
    };

    choice.effect(A);

    state.totals.events = (state.totals.events || 0) + 1;
    state.pendingEvent.outcome = outcomes;
    state.pendingEvent.chosenLabel = choice.label;

    log("「" + evt.title + "」" + personalize(outcomes.length ? outcomes.join(" ") : choice.label), "event");
    checkAchievements();
    save();
    refresh();
  }

  function closeEvent() {
    if (!state.pendingEvent) return;
    state.pendingEvent = null;
    if (state.stats.health <= 0) {
      forcedEnding();
      return;
    }
    checkAchievements();
    save();
    refresh();
  }

  /* ---------------- 成就 / 结局 ---------------- */

  function achievementProgress(a, s) {
    let cur = 0;
    try {
      cur = typeof a.cur === "function" ? Number(a.cur(s)) : 0;
    } catch (e) {
      cur = 0;
    }
    if (!Number.isFinite(cur)) cur = 0;
    const goal = Number.isFinite(a.goal) ? a.goal : 1;
    return {
      cur: Math.max(0, cur),
      goal: Math.max(1, goal),
      pct: Math.max(0, Math.min(100, Math.round((cur / Math.max(1, goal)) * 100)))
    };
  }

  function achievementUnlocked(a, s) {
    if (typeof a.cond === "function") {
      try { if (a.cond(s)) return true; } catch (e) {}
    }
    const p = achievementProgress(a, s);
    return p.cur >= p.goal;
  }

  function checkAchievements() {
    let unlocked = 0;
    D.achievements.forEach((a) => {
      if (state.achievements.includes(a.id)) return;
      if (!achievementUnlocked(a, state)) return;
      unlocked += 1;
      state.achievements.push(a.id);
      if (!state.achievementLog) state.achievementLog = {};
      state.achievementLog[a.id] = { day: state.day, ts: Date.now() };
      addStat("mood", 2);
      if (a.reward) addMoney(a.reward);
      log(
        "成就解锁：「" + a.name + "」—— " + a.desc + (a.reward ? " 奖励 " + fmt(a.reward) : ""),
        "system"
      );
      toast(
        "成就解锁 · " + a.name,
        a.desc + (a.reward ? " · +" + fmt(a.reward) : ""),
        "ach",
        a.icon
      );
    });
    checkTitles();
    return unlocked;
  }

  function checkTitles() {
    D.titles.forEach((t) => {
      if (state.profile.unlockedTitles.includes(t.id)) return;
      let ok = false;
      try { ok = t.cond(state); } catch (e) { ok = false; }
      if (!ok) return;
      state.profile.unlockedTitles.push(t.id);
      log("称号解锁：「" + t.name + "」—— " + t.bonus, "system");
      toast("称号解锁 · " + t.name, t.bonus, "ach", t.icon);
    });
  }

  function equipTitle(id) {
    if (!state.profile.unlockedTitles.includes(id)) return false;
    state.profile.title = id;
    const title = titleById(id);
    save();
    refresh();
    toast("已装备称号", title.name + " · " + title.bonus, "ach", title.icon);
    return true;
  }

  function setProfileName(name) {
    const next = normalizeProfile(Object.assign({}, state.profile, { name: name }));
    state.profile.name = next.name;
    state.profile.letter = next.letter;
    save();
    refresh();
    return next.name;
  }

  function endingBase() {
    const net = getNetWorth();
    const h = getHousing();
    const biz = state.businesses.length;
    let key = "passerby";
    if (state.stats.health <= 20) key = "burnt";
    else if (state.stats.mood <= 20) key = "hollow";
    else if (h.id === "villa" && state.housing.owned) key = "villa";
    else if (biz >= 3) key = "empire";
    else if (net >= 8000000) key = "legend";
    else if (net >= 3000000) key = "winner";
    else if (net >= 1000000) key = "middle";
    else if (net >= 300000) key = "stable";
    else if (net >= 80000) key = "edge";
    const data = D.endings[key] || D.endings.passerby;
    return Object.assign({ key, net, day: state.day, achievements: state.achievements.length, businesses: biz }, data);
  }

  function finishGame(forced) {
    if (state.ended) return;
    const e = endingBase();
    state.ended = true;
    state.ending = Object.assign({}, e, { forced: !!forced });
    save();
    if (window.UI) {
      UI.refresh();
      UI.showEnding(state.ending, !!forced);
    }
  }

  function forcedEnding() {
    if (state.ended) return;
    const e = D.endings.collapse;
    state.ended = true;
    state.ending = Object.assign({}, e, {
      key: "collapse",
      net: getNetWorth(),
      day: state.day,
      achievements: state.achievements.length,
      businesses: state.businesses.length,
      forced: true
    });
    save();
    if (window.UI) {
      UI.refresh();
      UI.showEnding(state.ending, true);
    }
  }

  function evaluateEnding() {
    return endingBase();
  }

  function setAutomation(patch) {
    state.automation = Object.assign(defaultAutomation(), state.automation || {}, patch || {});
    state.automation.autoEat = !!state.automation.autoEat;
    state.automation.autoAd = !!state.automation.autoAd;
    state.automation.eatBelow = clamp(Math.round(state.automation.eatBelow || 30), 10, 80);
    save();
    refresh();
    return state.automation;
  }

  function toggleSound() {
    state.settings.sound = !state.settings.sound;
    save();
    return state.settings.sound;
  }

  function toggleMusic() {
    state.settings.music = !state.settings.music;
    save();
    return state.settings.music;
  }

  /* ---------------- 对外 ---------------- */

  return {

    skillActionDef,

  };

/* ============================================================

  function qualityLevel() {
    if (window.UI && UI.perf && UI.perf.quality) return UI.perf.quality;

  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }

  function vibrate(ms) {
    if (!navigator.vibrate) return;

  function popBadge(el, text, color) {
    if (!el) return;

    if (!el.animate || reducedMotion()) return;
    el.getAnimations().forEach((a) => a.cancel());
    el.animate(
      [
        { transform: "scale(0.78)", opacity: 0.35 },
        { transform: "scale(1.12)", opacity: 1, offset: 0.6 },

      ],
      { duration: 320, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }

  function floatAt(text, color, x, y) {
    const host = document.querySelector(".mg-play");

  function teardown(refreshAfter) {
    session++;
    cleanupFns.forEach((fn) => {
      try { fn(); } catch (e) {}
    });

  /* 中途离开要付代价：精力已经花掉，报酬为 0，问一句再走 */
  function askQuit(onQuit) {

  function hud(type, total) {

  function setScore(n) {

  function showResult(type, score, result, me) {

    canvas.width = Math.round(W * scale);
    canvas.height = Math.round(H * scale);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.imageSmoothingEnabled = true;

    const LP = Q === "low";
    const player = { x: W / 2, targetX: W / 2, y: H - 110, r: 30, tilt: 0 };
    const objects = [];
    const particles = [];

      g.beginPath();
      g.moveTo(x + r, y);
      g.arcTo(x + w, y, x + w, y + h, r);
      g.arcTo(x + w, y + h, x, y + h, r);
      g.arcTo(x, y + h, x, y, r);
      g.arcTo(x, y, x + w, y, r);
