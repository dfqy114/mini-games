/* ============================================================
   霓虹之下 · 都市生存
   polish.css —— 视觉增强层（叠加样式）
   ------------------------------------------------------------
   定位
     · 在 css/style.css、css/extra.css 之后加载，只做"精致化"叠层：
       层级质感、列表微交互、按钮体系、弹窗、进度条、排版、移动端观感。
     · 不新增语义结构，不改栅格（grid-template-columns），
       不改 display / position 的大形态，不隐藏任何既有元素。

   约束
     · 纯 CSS：不引入外部样式表、字体、图片或任何网络资源。
     · 不使用通配符重置；选择器一律以既有类名为锚点。
     · 复用 style.css 的 :root 变量：
       --bg-0 --bg-1 --panel --panel-solid --panel-2 --line --line-strong
       --text --text-dim --muted --gold --accent --danger
       --energy --satiety --mood --health --r-lg --r-md --r-sm
       --ease --ease-soft --shadow --font --serif
       （项目里没有 --bg / --rose：背景用 --bg-0，玫红用 --mood，
         衬线用 --serif；增强层新增的 --pl-* 只加不改。）

   特异性策略
     · 纯新增声明用 :where() 包裹，权重归零，绝不吃掉既有规则；
     · 需要覆盖既有数值时，用"同权重 + 更晚出现"取胜；
     · .is-disabled / .is-collapsed / .hidden / .locked / :disabled
       等功能态保持原有权重优势，不被 hover 抢走。

   性能与无障碍
     · 不使用大面积 blur/filter，发光全部走 box-shadow；
     · body.q-mid / body.q-low 下主动降级；
     · 全部动效在 prefers-reduced-motion: reduce 下关闭。
   ============================================================ */

/* ============================================================
   01 · 增强层变量（只新增，不改写既有 token）
   ============================================================ */

:root {
  --pl-edge: rgba(146, 176, 255, 0.09);     /* 卡片描边 */
  --pl-warm: rgba(255, 205, 130, 0.55);     /* 金色强调条 */
  --pl-rail: linear-gradient(180deg, rgba(146, 176, 255, 0.24), rgba(146, 176, 255, 0.04));
  --pl-ring: rgba(255, 205, 130, 0.55);
  --pl-t: 0.18s;                            /* 统一微交互时长 */
  --pl-lift: 0 14px 30px rgba(0, 0, 0, 0.28);
}

/* ============================================================
   02 · 滚动条 / 焦点环
   细、暗、悬停才亮；键盘焦点统一为金色细环。
   ============================================================ */

.col::-webkit-scrollbar,
.log-scroll::-webkit-scrollbar,
.modal-body::-webkit-scrollbar,
.ending-modal::-webkit-scrollbar,
.actions::-webkit-scrollbar,
.event-slot::-webkit-scrollbar { width: 6px; height: 6px; }

.col::-webkit-scrollbar-track,
.log-scroll::-webkit-scrollbar-track,
.modal-body::-webkit-scrollbar-track,
.actions::-webkit-scrollbar-track { background: transparent; }

.col::-webkit-scrollbar-thumb,
.log-scroll::-webkit-scrollbar-thumb,
.modal-body::-webkit-scrollbar-thumb,
.ending-modal::-webkit-scrollbar-thumb,
.actions::-webkit-scrollbar-thumb,
.event-slot::-webkit-scrollbar-thumb {
  border-radius: 99px;
  background: linear-gradient(180deg, rgba(146, 176, 255, 0.22), rgba(146, 176, 255, 0.09));
  border: 1px solid rgba(255, 255, 255, 0.03);
}

.col::-webkit-scrollbar-thumb:hover,
.log-scroll::-webkit-scrollbar-thumb:hover,
.modal-body::-webkit-scrollbar-thumb:hover,
.actions::-webkit-scrollbar-thumb:hover,
.event-slot::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, rgba(255, 205, 130, 0.42), rgba(255, 160, 120, 0.2));
}

.modal-body,
.log-scroll,
.event-slot {
  scrollbar-width: thin;
  scrollbar-color: rgba(146, 176, 255, 0.22) transparent;
}

/* 统一键盘焦点：描边不占位，不改变任何尺寸 */
.btn:focus-visible,
.ghost-btn:focus-visible,
.icon-btn:focus-visible,
.action-btn:focus-visible,
.tab:focus-visible,
.shop-tab:focus-visible,
.ach-tab:focus-visible,
.ach-row:focus-visible,
.cc-card:focus-visible,
.title-card:focus-visible,
.choice-btn:focus-visible,
.modal-close:focus-visible,
.price-btn:focus-visible,
.quality-btn:focus-visible {
  outline: 2px solid var(--pl-ring);
  outline-offset: 3px;
}

/* ============================================================
   03 · 顶栏（英雄区）细节
   发丝分隔线 + 品牌字距 + 数字对齐。
   ============================================================ */

.topbar { border-bottom: 1px solid rgba(146, 176, 255, 0.06); }

.brand-mark {
  box-shadow:
    0 6px 24px rgba(255, 154, 120, 0.28),
    inset 0 1px 0 rgba(255, 255, 255, 0.5),
    inset 0 -12px 18px -14px rgba(120, 40, 20, 0.6),
    0 0 0 1px rgba(255, 255, 255, 0.07);
}

.brand-text strong { letter-spacing: 0.17em; text-shadow: 0 1px 18px rgba(255, 190, 140, 0.18); }
.brand-text span { letter-spacing: 0.34em; opacity: 0.9; }

.day-chip {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.012));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.055), 0 10px 24px rgba(0, 0, 0, 0.18);
}

.day-num { font-variant-numeric: tabular-nums; letter-spacing: 0.1em; }
.day-sub { letter-spacing: 0.06em; }

.money-box {
  box-shadow:
    inset 0 1px 0 rgba(255, 225, 175, 0.14),
    inset 0 -16px 24px -20px rgba(255, 180, 110, 0.55),
    0 10px 26px rgba(0, 0, 0, 0.22);
}

.money-value { letter-spacing: 0.015em; text-shadow: 0 0 22px rgba(255, 205, 120, 0.28), 0 1px 0 rgba(0, 0, 0, 0.35); }
.debt-chip { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06); }

.icon-btn {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.02));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
}

.icon-btn:hover { box-shadow: 0 8px 18px rgba(0, 0, 0, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.08); }

.slot-dot.done {
  background: rgba(255, 196, 128, 0.34);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
}

/* ============================================================
   04 · 卡片表面
   细渐变 + 顶部 1px 高光 + 内阴影；只动质感，不动尺寸。
   ============================================================ */

.card {
  border-color: var(--pl-edge);
  box-shadow:
    0 20px 48px rgba(0, 0, 0, 0.36),
    inset 0 1px 0 rgba(255, 255, 255, 0.05),
    inset 0 0 64px rgba(120, 150, 220, 0.04);
}

.card:hover {
  border-color: rgba(146, 176, 255, 0.2);
  box-shadow:
    0 24px 56px rgba(0, 0, 0, 0.42),
    inset 0 1px 0 rgba(255, 255, 255, 0.07),
    inset 0 0 64px rgba(140, 165, 235, 0.05);
}

/* 顶部高光拉满整条卡沿，两端淡出（原先只占中段 64%） */
.card::before {
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 2%,
    rgba(190, 212, 255, 0.24) 18%,
    rgba(255, 214, 160, 0.34) 50%,
    rgba(190, 212, 255, 0.24) 82%,
    transparent 98%);
}

/* 中画质：保留质感，不额外铺层 */
body.q-mid .card {
  box-shadow: 0 18px 42px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.045);
}

/* 左右栏常规卡片：叠一层极轻的顶部柔光渐变（不碰 profile / log 的专属底色） */
body:not(.q-mid):not(.q-low) :where(.stats-card, .skills-card, .goal-card, .finance-card, .assets-card, .achievement-card) {
  background-image:
    linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0) 42%),
    linear-gradient(160deg, rgba(30, 41, 66, 0.72), rgba(9, 14, 26, 0.8));
}

/* ============================================================
   05 · 卡片标题（城市感）
   发丝下划线 + 左端一小段金色刻度 + 字距节奏。
   ============================================================ */

.card-title {
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(146, 176, 255, 0.075);
  letter-spacing: 0.13em;
  background-image: linear-gradient(90deg, rgba(255, 212, 121, 0.75), rgba(255, 134, 179, 0.3));
  background-repeat: no-repeat;
  background-size: 28px 1px;
  background-position: 0 100%;
}

.card-title .ct-label { letter-spacing: 0.14em; text-shadow: 0 1px 14px rgba(160, 190, 255, 0.12); }
.card-title .ct-en { letter-spacing: 0.26em; opacity: 0.9; }
.card-title .ct-summary { font-variant-numeric: tabular-nums; }

/* 折叠态保持原样，只让下划线更淡 */
.card.is-collapsed .card-title {
  border-bottom-color: rgba(146, 176, 255, 0.05);
  background-size: 20px 1px;
}

.assets-group-title { letter-spacing: 0.24em; }
.section-label { letter-spacing: 0.22em; }

/* ============================================================
   06 · 排版节奏与数字对齐
   ============================================================ */

.profile-name { letter-spacing: 0.11em; text-shadow: 0 1px 20px rgba(255, 200, 150, 0.12); }
.profile-title { letter-spacing: 0.05em; line-height: 1.55; }
.modal-title { letter-spacing: 0.09em; }
.event-title { letter-spacing: 0.08em; }
.modal-kicker,
.event-kicker { letter-spacing: 0.28em; }
.log-item p { line-height: 1.82; }
.log-item.type-day p { letter-spacing: 0.14em; }

/* 所有会逐帧刷新的数字：等宽，避免跳动 */
:where(
  .stat-val, .a-val, .item-price, .act-meta, .job-chip, .fin-row,
  .ach-head span, .day-num, .money-value, .skill-top span,
  .ending-stat b, .slot-hint b, .log-meta, .profile-foot span,
  .bank-hero .amount, .biz-meter em, .ach-row-top em
) {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

/* ============================================================
   07 · 列表行统一微交互
   左侧色条（inset 阴影，不占布局）+ 背景渐亮 + 1~2px 位移。
   ============================================================ */

.item-row,
.ach-row,
.job-card,
.ach-detail,
.cc-card,
.title-card,
.housing-card,
.biz-card,
.skill,
.choice-btn,
.asset-row {
  transition:
    transform var(--pl-t) var(--ease),
    background-color var(--pl-t) var(--ease),
    border-color var(--pl-t) var(--ease),
    box-shadow var(--pl-t) var(--ease);
}

/* 横向滑动的"行" */
.item-row:hover,
.ach-row:hover {
  transform: translateX(2px);
  border-color: rgba(255, 205, 130, 0.26);
  background-image: linear-gradient(90deg,
    rgba(255, 205, 130, 0.075),
    rgba(255, 255, 255, 0.028) 46%,
    rgba(255, 255, 255, 0.012));
  box-shadow: inset 2px 0 0 var(--pl-warm), 0 10px 24px rgba(0, 0, 0, 0.2);
}

/* 纵向抬起的"卡" */
.job-card:not(.locked):hover,
.ach-detail:hover,
.cc-card:not(.is-active):hover,
.title-card:not(.locked):hover,
.housing-card:not(.current):hover,
.biz-card:hover,
.skill:hover,
.choice-btn:not(:disabled):hover {
  transform: translateY(-2px);
  border-color: rgba(255, 205, 130, 0.24);
  background-image: linear-gradient(150deg,
    rgba(255, 205, 130, 0.065),
    rgba(255, 255, 255, 0.022) 55%);
  box-shadow: inset 2px 0 0 var(--pl-warm), var(--pl-lift);
}

/* 行内小图标跟着亮一档：只加描边光，不动 background，
   以免盖掉 extra.css 里按商品/岗位类型设置的图标底色 */
.item-row:hover .item-icon,
.job-card:hover .job-icon,
.ach-row:not(.got):hover .ach-row-icon,
.housing-card:hover .housing-icon,
.biz-card:hover .biz-icon {
  border-color: rgba(255, 205, 130, 0.22);
  box-shadow: inset 0 0 0 1px rgba(255, 205, 130, 0.08), 0 0 14px rgba(255, 190, 120, 0.1);
}

.ach-row:not(.got):hover .ach-row-icon { opacity: 0.82; }

/* 资产行不可点击：只做"被照亮"，不位移 */
.asset-row { border-radius: 7px; }

.asset-row:hover {
  background-image: linear-gradient(90deg, rgba(255, 205, 130, 0.05), rgba(255, 255, 255, 0.02));
  box-shadow: inset 2px 0 0 rgba(255, 205, 130, 0.35);
}

.asset-row:hover .a-name { color: var(--text); }

/* 锁定 / 置灰态：不抬升、不发光 */
.job-card.locked:hover,
.title-card.locked:hover { box-shadow: none; }

/* ============================================================
   08 · 选中态（当前职业 / 已拥有 / 已获得 / 已装备）
   ============================================================ */

.job-card.current,
.housing-card.current,
.cc-card.is-active,
.title-card.equipped,
.ach-row.got,
.biz-card.owned,
.ach-detail.got {
  box-shadow:
    inset 2px 0 0 rgba(255, 212, 121, 0.6),
    inset 0 0 0 1px rgba(255, 205, 130, 0.08),
    0 10px 26px rgba(0, 0, 0, 0.18);
}

.job-card.current .job-name,
.housing-card.current .housing-name,
.cc-card.is-active .cc-card-top b,
.title-card.equipped .title-card-top b { color: #ffe6bd; }

/* 成就格子点亮后补一层内发光，避免只有边框变金 */
.ach.got {
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), 0 0 18px rgba(255, 190, 120, 0.14);
}

/* ============================================================
   09 · 按钮体系
   primary / ghost / small 统一时长、按压与禁用态。
   ============================================================ */

.btn,
.action-btn,
.ghost-btn,
.icon-btn,
.tab,
.shop-tab,
.ach-tab,
.price-btn,
.quality-btn,
.title-btn,
.cc-mini { transition-duration: var(--pl-t); }

.btn { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05); }
.btn:hover { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.09), 0 8px 20px rgba(0, 0, 0, 0.26); }
.btn:active { box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.32); }

/* 主按钮：更细的暖色渐变 + 顶部高光 + 底部内阴影 */
.btn.primary {
  background: linear-gradient(135deg, #ffdca6, #ffb277 52%, #ff9a8a);
  border-color: rgba(255, 215, 160, 0.45);
  box-shadow:
    0 8px 22px rgba(255, 165, 120, 0.22),
    inset 0 1px 0 rgba(255, 255, 255, 0.42),
    inset 0 -10px 16px -12px rgba(150, 60, 10, 0.6);
}

.btn.primary:hover {
  background: linear-gradient(135deg, #ffe2b8, #ffb87f 52%, #ffa291);
  box-shadow: 0 12px 30px rgba(255, 165, 120, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.5);
}

.btn.buy {
  box-shadow: 0 6px 18px rgba(255, 165, 120, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.4);
}

.btn.danger { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05); }
.btn.small { letter-spacing: 0.05em; }

/* 幽灵按钮：从"描边块"变成"薄玻璃块" */
.ghost-btn {
  background: linear-gradient(180deg, rgba(146, 176, 255, 0.075), rgba(146, 176, 255, 0.02));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
}

.ghost-btn:hover { box-shadow: 0 8px 20px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.08); }
.ghost-btn:active { transform: scale(0.98); }

/* 禁用态兜底：任何 hover 光泽都不许落到禁用按钮上 */
.btn:disabled,
.btn:disabled:hover {
  transform: none;
  box-shadow: none;
}

/* ============================================================
   10 · 行动区与标签页
   ============================================================ */

.action-dock {
  box-shadow: 0 20px 46px rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 255, 255, 0.05);
}

.action-btn {
  background: linear-gradient(150deg, rgba(255, 255, 255, 0.052), rgba(255, 255, 255, 0.016));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.045);
}

.action-btn:hover {
  background: linear-gradient(150deg, rgba(255, 190, 140, 0.11), rgba(255, 255, 255, 0.022));
  box-shadow:
    0 12px 26px rgba(0, 0, 0, 0.3),
    inset 2px 0 0 rgba(255, 205, 130, 0.5),
    inset 0 1px 0 rgba(255, 255, 255, 0.07);
}

.action-btn:hover .act-icon {
  transform: translateY(-1px) scale(1.04);
  border-color: rgba(255, 205, 130, 0.2);
}

.act-icon {
  background: linear-gradient(150deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.02));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  transition: transform var(--pl-t) var(--ease), border-color var(--pl-t) var(--ease);
}

.act-name { letter-spacing: 0.03em; }
.act-meta .pay { text-shadow: 0 0 14px rgba(255, 205, 130, 0.22); }

/* 标签页：只有未选中的才吃 hover，不干扰 .active */
.tab { letter-spacing: 0.09em; }
.tab:not(.active):hover { background: rgba(255, 255, 255, 0.045); border-color: rgba(146, 176, 255, 0.12); }

.tab.active {
  box-shadow:
    0 6px 18px rgba(255, 160, 120, 0.26),
    inset 0 1px 0 rgba(255, 255, 255, 0.45),
    inset 0 -8px 14px -10px rgba(160, 70, 20, 0.55);
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.2);
}

.tab:active { transform: scale(0.985); }

.dock-foot { border-top-color: rgba(146, 176, 255, 0.07); }
.slot-hint-sub { letter-spacing: 0.03em; }

/* 行动区滚动条更窄一档，避免和卡片描边打架 */
.actions::-webkit-scrollbar { width: 5px; }

/* ============================================================
   11 · 日志：时间轴细线 / 类型色点 / 当日分隔
   ============================================================ */

.log-head {
  border-bottom-color: rgba(146, 176, 255, 0.07);
  box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.015);
}

.log-title { letter-spacing: 0.14em; }
.log-title .eng { letter-spacing: 0.26em; }

/* 竖向时间轴：贴在条目左边框的位置，条目缝隙里连成一条线 */
.log { position: relative; }

.log::before {
  content: "";
  position: absolute;
  left: 0;
  top: 5px;
  bottom: 5px;
  width: 2px;
  border-radius: 99px;
  background: var(--pl-rail);
  opacity: 0.5;
  pointer-events: none;
}

.log-item {
  transition:
    transform var(--pl-t) var(--ease),
    background-color var(--pl-t) var(--ease),
    border-color var(--pl-t) var(--ease);
}

.log-item:hover {
  background-color: rgba(255, 255, 255, 0.038);
  transform: translateX(2px);
  border-radius: 10px;
}

/* 类型色点：加在时间戳前面，与左侧色条同色 */
.log-item .log-meta::before {
  content: "";
  flex: 0 0 auto;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(146, 176, 255, 0.55);
  box-shadow: 0 0 8px rgba(146, 176, 255, 0.4);
}

.log-item.type-work .log-meta::before { background: #ffb454; box-shadow: 0 0 8px rgba(255, 180, 84, 0.55); }
.log-item.type-life .log-meta::before { background: #5fd6a4; box-shadow: 0 0 8px rgba(95, 214, 164, 0.5); }
.log-item.type-event .log-meta::before { background: #ff86b3; box-shadow: 0 0 8px rgba(255, 134, 179, 0.5); }
.log-item.type-system .log-meta::before { background: #5cc9ff; box-shadow: 0 0 8px rgba(92, 201, 255, 0.5); }
.log-item.type-money .log-meta::before { background: #ffd479; box-shadow: 0 0 8px rgba(255, 212, 121, 0.55); }
.log-item.type-bad .log-meta::before { background: #ff6b6b; box-shadow: 0 0 8px rgba(255, 107, 107, 0.55); }

/* 当日标题：上下发丝线夹住，做成一条真正的分隔带 */
.log-item.type-day {
  border-left: none;
  box-shadow: inset 0 1px 0 rgba(255, 205, 150, 0.09), inset 0 -1px 0 rgba(255, 205, 150, 0.05);
}

.log-item.type-day .log-meta::before { display: none; }

.log-item.type-day .tag {
  border-color: rgba(255, 205, 150, 0.28);
  color: #f0d6ae;
  background: rgba(255, 190, 130, 0.08);
}

.log-item .outcome { border-top-color: rgba(146, 176, 255, 0.08); }
.log-whisper { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03); }

/* ============================================================
   12 · 状态条 / 经验条 / 成就进度条
   ============================================================ */

.stat-bar {
  background: linear-gradient(180deg, rgba(0, 0, 0, 0.34), rgba(255, 255, 255, 0.035));
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.45);
}

.stat-bar i {
  background-image:
    linear-gradient(90deg, rgba(255, 255, 255, 0.38), rgba(255, 255, 255, 0) 52%),
    linear-gradient(90deg, var(--c), var(--c));
  /* 先给不支持 color-mix 的浏览器一个普通外发光兜底 */
  box-shadow: 0 0 12px rgba(255, 255, 255, 0.12);
  box-shadow: 0 0 14px color-mix(in srgb, var(--c) 52%, transparent);
}

/* 低值警示：轻微呼吸，不做高对比闪烁 */
.stat-row.warn .stat-bar i { animation: plBarWarn 1.9s ease-in-out infinite; }
.stat-row.warn .stat-val { text-shadow: 0 0 14px rgba(255, 107, 107, 0.45); }

@keyframes plBarWarn {
  0%, 100% { box-shadow: 0 0 10px rgba(255, 107, 107, 0.3); filter: saturate(0.94); }
  50% { box-shadow: 0 0 20px rgba(255, 107, 107, 0.62); filter: saturate(1.08); }
}

/* 细进度条统一：内阴影轨道 + 左侧顶光 */
.mini-bar,
.ach-progress,
.ach-row-bar,
.ach-detail-bar,
.goal-bar,
.skill-xp,
.skill-detail-bar,
.biz-meter i { box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.35); }

/* 只加"顶光 + 外发光"，保留每条进度条各自的配色（city favor 是暖橙粉，
   技能/目标是蓝金，经营是蓝绿），不把它们的色相统一掉 */
.mini-bar i,
.ach-progress i,
.ach-row-bar i,
.ach-detail-bar i,
.goal-bar i,
.skill-xp i,
.skill-detail-bar i,
.biz-meter b {
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 0 10px rgba(255, 190, 130, 0.18);
}

.ach-progress i,
.skill-detail-bar i {
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 0 12px rgba(255, 180, 120, 0.22);
}

.skill-pips i.on { box-shadow: 0 0 8px rgba(159, 180, 255, 0.45); }

/* ============================================================
   13 · 弹窗
   进场更轻更快；头/脚分隔线柔化；内部滚动条统一。
   ============================================================ */

.modal {
  border-color: rgba(146, 176, 255, 0.17);
  box-shadow: 0 44px 110px rgba(0, 0, 0, 0.62), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  animation: plModalIn 0.34s var(--ease) both;
}

@keyframes plModalIn {
  from { opacity: 0; transform: translateY(14px) scale(0.986); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.modal::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 214, 160, 0.34) 50%, transparent);
  pointer-events: none;
}

.modal-head {
  border-bottom-color: rgba(146, 176, 255, 0.07);
  box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.015);
}

.modal-foot {
  border-top-color: rgba(146, 176, 255, 0.07);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.015);
}

.modal-icon {
  background: linear-gradient(150deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 8px 20px rgba(0, 0, 0, 0.22);
}

.modal-close { background: rgba(255, 255, 255, 0.02); }
.modal-close:hover { box-shadow: 0 6px 16px rgba(0, 0, 0, 0.24); }
.modal-lead { line-height: 1.85; }
.modal-body { scrollbar-gutter: stable; }

/* 事件卡（体量很小，只做质感加成） */
.event-inner { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05); }
.choice-btn .num { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08); }

.choice-btn:hover .num {
  background: rgba(255, 205, 130, 0.14);
  border-color: rgba(255, 205, 130, 0.4);
}

/* ============================================================
   14 · 移动端（<=1060 平板 / <=640 手机）
   只调间距、圆角与安全区，不动栅格与流式布局。
   ============================================================ */

@media (max-width: 1060px) {
  .topbar { border-bottom-color: rgba(146, 176, 255, 0.08); }

  .quick-action {
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .quick-action.is-on:active { transform: translateY(1px) scale(0.985); }

  .log-panel {
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  /* 平板竖屏下行动区贴底，留一点底部呼吸 */
  .action-dock { padding-bottom: 10px; }
  .actions { gap: 8px; }
}

@media (max-width: 640px) {
  .card { border-radius: 16px; }

  .card-title {
    padding-bottom: 7px;
    margin-bottom: 12px;
  }

  .profile-card { padding: 15px 14px 12px; }

  /* 弹窗改为贴底抽屉：更像全屏，但保留圆角与可读留白 */
  .modal-root {
    align-items: flex-end;
    padding: 0;
    padding-top: env(safe-area-inset-top);
  }

  .modal {
    width: 100%;
    max-height: 92vh;
    max-height: 92dvh;
    border-radius: 20px 20px 0 0;
    border-bottom: none;
    box-shadow: 0 -24px 60px rgba(0, 0, 0, 0.55);
  }

  .modal-head { padding-top: 14px; }
  .modal-body { padding-bottom: 14px; }
  .modal-foot { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }

  /* 结局页是整块叙事面板，贴底时留出呼吸与完整圆角 */
  .ending-modal {
    margin-bottom: 12px;
    max-height: 90vh;
    border-radius: 20px;
  }

  /* 行动区：收紧内边距，最后一行不会被 quick-action 压住 */
  .action-dock {
    padding: 9px 10px 8px;
    border-radius: 16px;
  }

  .action-btn { min-height: 52px; }
  .act-meta .cost { white-space: nowrap; }

  .dock-foot {
    padding-top: 7px;
    margin-top: 8px;
  }

  .log-scroll { padding: 8px 13px 16px; }

  .quick-action {
    right: calc(12px + env(safe-area-inset-right));
    bottom: calc(12px + env(safe-area-inset-bottom));
  }

  .stat-bar { height: 6px; }
  .stat-val { font-size: 12.5px; }

  /* 触屏不做横向位移，纵向只留 1px，避免点按抖动 */
  .item-row:hover,
  .ach-row:hover,
  .log-item:hover { transform: none; }

  .job-card:not(.locked):hover,
  .cc-card:not(.is-active):hover,
  .title-card:not(.locked):hover,
  .housing-card:not(.current):hover,
  .biz-card:hover,
  .skill:hover,
  .choice-btn:not(:disabled):hover,
  .ach-detail:hover { transform: translateY(-1px); }
}

/* ============================================================
   15 · 画质降级（q-mid / q-low）
   低配下先砍装饰层，保留主线视觉与反馈。
   ============================================================ */

body.q-mid .card::before { opacity: 0.6; }
body.q-mid .log::before { opacity: 0.35; }

body.q-low .card::before,
body.q-low .log::before,
body.q-low .modal::before { display: none; }

body.q-low .card,
body.q-low .action-dock,
body.q-low .log-panel {
  box-shadow: 0 14px 32px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.04);
}

body.q-low .log-item,
body.q-low .log-item:hover {
  transform: none;
  transition: none;
}

body.q-low .act-icon,
body.q-low .action-btn:hover .act-icon { transform: none; }

body.q-low .modal { animation: none; }

/* 弹窗打开 / 滚动期间：再压一档装饰开销 */
body.modal-open .card::before,
body.is-scrolling .card::before { opacity: 0.5; }

/* ============================================================
   16 · 动效偏好（无障碍）
   用户要求减少动态时，本层动画与位移一律关闭。
   ============================================================ */

@media (prefers-reduced-motion: reduce) {
  .stat-row.warn .stat-bar i { animation: none; }
  .modal { animation: none; }

  .card,
  .card::before,
  .log-item,
  .log::before,
  .stat-bar i,
  .mini-bar i,
  .ach-progress i,
  .ach-row-bar i,
  .goal-bar i,
  .skill-xp i,
  .skill-detail-bar i,
  .biz-meter b {
    transition-duration: 0.001ms;
    animation-duration: 0.001ms;
  }

  .item-row:hover,
  .ach-row:hover,
  .log-item:hover,
  .job-card:not(.locked):hover,
  .ach-detail:hover,
  .cc-card:not(.is-active):hover,
  .title-card:not(.locked):hover,
  .housing-card:not(.current):hover,
  .biz-card:hover,
  .skill:hover,
  .choice-btn:hover,
  .action-btn:hover,
  .action-btn:hover .act-icon,
  .tab:active,
  .btn:active,
  .ghost-btn:active,
  .quick-action.is-on:active { transform: none; }
}

/* ---------- 便利与自动化 / 增益 ---------- */
.item-row[data-cat="buff"] .item-icon {
  color: #c3b2ff;
  background: rgba(167, 142, 255, 0.08);
}

.auto-row {
  display: flex;
  align-items: center;
  gap: 14px;
  justify-content: space-between;
  padding: 9px 0;
  border-bottom: 1px dashed rgba(146, 176, 255, 0.08);
}
.auto-row:last-of-type { border-bottom: 0; }
.auto-info { flex: 1; min-width: 0; }
.auto-name { font-size: 12.5px; color: var(--text); }
.auto-desc { font-size: 10px; color: var(--muted); line-height: 1.65; margin-top: 2px; }

.auto-toggle {
  position: relative;
  flex: 0 0 auto;
  width: 44px;
  height: 25px;
  border-radius: 99px;
  border: 1px solid rgba(146, 176, 255, 0.16);
  background: rgba(255, 255, 255, 0.05);
  transition: all 0.25s var(--ease);
}
.auto-toggle i {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 19px;
  height: 19px;
  border-radius: 50%;
  background: #72809c;
  transition: all 0.25s var(--ease);
}
.auto-toggle.on {
  background: linear-gradient(135deg, #ffd79c, #ffb277);
  border-color: transparent;
  box-shadow: 0 4px 14px rgba(255, 165, 120, 0.2);
}
.auto-toggle.on i { left: 21px; background: #201407; }

.auto-threshold {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
  margin: 8px 0 2px;
  font-size: 9.5px;
  color: var(--muted);
}
.auto-threshold > span { margin-right: 2px; }
.auto-pill {
  font: inherit;
  font-size: 9.5px;
  padding: 3px 9px;
  border-radius: 99px;
  border: 1px solid rgba(146, 176, 255, 0.12);
  background: rgba(255, 255, 255, 0.025);
  color: var(--text-dim);
  transition: all 0.2s;
}
.auto-pill:hover { border-color: rgba(146, 176, 255, 0.3); color: var(--text); }
.auto-pill.active {
  color: #1a1308;
  border-color: transparent;
  background: linear-gradient(135deg, #ffd49a, #ffb27e);
  font-weight: 600;
}

.biz-bulk {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  padding: 10px 12px;
  margin-bottom: 10px;
  border: 1px solid rgba(255, 205, 130, 0.16);
  border-radius: 10px;
  background: linear-gradient(120deg, rgba(255, 205, 130, 0.07), rgba(255, 255, 255, 0.02));
}
.biz-bulk > div {
  min-width: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.biz-bulk b { font-size: 12px; color: var(--text); font-weight: 500; }
.biz-bulk span { font-size: 10px; color: var(--muted); line-height: 1.5; }
.biz-bulk .btn { flex: 0 0 auto; }

</style>

  <script>
/* ============================================================

window.Game = (function () {
  const D = window.DATA;
  const SAVE_KEY = "neon_city_save_v2";
  const LOG_KEY = "neon_city_log_v2";
  const WINDOW_SAVE_PREFIX = "NEON_SAVE::";
  const LOG_SAVE_DELAY = 650;
  let state = null;
  let memorySave = null;
  let logSaveTimer = 0;
  let autoEatBusy = false;
  let pendingLogRaw = null;
  let lastLogStamp = "";

  /* 日志单独存一份，主存档只带最近几条；避免每次行动都同步写几百 KB */
  function readStoredLog() {
    try {
      const raw = localStorage.getItem(LOG_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    if (pendingLogRaw) {
      try { return JSON.parse(pendingLogRaw); } catch (e) {}
    }
    return null;
  }

  function logStamp() {
    if (!state || !Array.isArray(state.log)) return "";
    const last = state.log.length ? state.log[state.log.length - 1] : null;
    return state.logSeq + "|" + state.log.length + "|" + (last ? last.seq || 0 : 0);
  }

  function writeLogNow() {
    if (!state || !Array.isArray(state.log)) return;
    const stamp = logStamp();
    if (stamp === lastLogStamp && pendingLogRaw) return;
    try {
      pendingLogRaw = JSON.stringify(state.log);
      localStorage.setItem(LOG_KEY, pendingLogRaw);
      lastLogStamp = stamp;
    } catch (e) {}
  }

  function scheduleLogSave() {
    if (logSaveTimer) return;
    logSaveTimer = setTimeout(() => {
      logSaveTimer = 0;
      /* 弹窗或小游戏进行中先不写大段日志，避免在最需要流畅的时候占用主线程 */
      if (document.body && document.body.classList.contains("modal-open")) {
        scheduleLogSave();
        return;
      }
      writeLogNow();
    }, LOG_SAVE_DELAY);
  }

  function flushLogSave() {
    if (logSaveTimer) {
      clearTimeout(logSaveTimer);
      logSaveTimer = 0;
    }
    writeLogNow();
  }

  try {
    window.addEventListener("pagehide", flushLogSave);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) flushLogSave();
    });
  } catch (e) {}

  function readStoredSave() {
    try {
      const value = localStorage.getItem(SAVE_KEY);
      if (value) return value;
    } catch (e) {}
    if (memorySave) return memorySave;
    try {
      if (window.name && window.name.indexOf(WINDOW_SAVE_PREFIX) === 0) {
        return decodeURIComponent(window.name.slice(WINDOW_SAVE_PREFIX.length));
      }
    } catch (e) {}
    return null;
  }

  function writeStoredSave(raw) {
    memorySave = raw;
    try {
      localStorage.setItem(SAVE_KEY, raw);
      return true;
    } catch (e) {}
    try {
      window.name = WINDOW_SAVE_PREFIX + encodeURIComponent(raw);
    } catch (e) {}
    return false;
  }

  const clamp = (n, a = 0, b = 100) => Math.max(a, Math.min(b, n));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const fmt = (n) => {
    const v = Math.round(n);
    return (v < 0 ? "-¥" : "¥") + Math.abs(v).toLocaleString("zh-CN");
  };

  /* ---------------- 身份 ---------------- */

  function originById(id) {
    return D.origins.find((o) => o.id === id) || D.origins[0];
  }

  function titleById(id) {
    return D.titles.find((t) => t.id === id) || D.titles[0];
  }

  function letterForName(name) {
    const text = Array.from(String(name || "").trim()).slice(0, 8).join("");
    const ch = Array.from(text)[0];
    if (!ch) return D.protagonist.letter;
    return /[a-z]/i.test(ch) ? ch.toUpperCase() : ch;
  }

  function normalizeProfile(raw) {
    const p = Object.assign(blankProfile(), raw || {});
    const name = Array.from(String(p.name || "").trim()).slice(0, 12).join("") || D.protagonist.name;
    p.name = name;
    p.letter = letterForName(name);
    p.origin = originById(p.origin).id;
    p.traits = Array.isArray(p.traits)
      ? Array.from(new Set(p.traits.filter((id) => D.traits.some((t) => t.id === id)))).slice(0, 2)
      : [];

    p.unlockedTitles = Array.isArray(p.unlockedTitles)
      ? Array.from(new Set(p.unlockedTitles.filter((id) => D.titles.some((t) => t.id === id))))
      : [];
    ["newcomer", p.title].forEach((id) => {
      if (!p.unlockedTitles.includes(id)) p.unlockedTitles.push(id);
    });
    return p;
  }

  /* 把特质的「开局加成」汇总出来，创建角色界面和实际开局共用同一套数据 */
  function traitStart(ids) {
    const out = {
      money: 0, energy: 0, satiety: 0, mood: 0, health: 0,
      skills: { stamina: 0, social: 0, tech: 0, business: 0 }
    };
    (ids || []).forEach((id) => {
      const trait = D.traits.find((t) => t.id === id);
      if (!trait || !trait.start) return;
      const st = trait.start;
      ["money", "energy", "satiety", "mood", "health"].forEach((k) => {
        if (Number.isFinite(st[k])) out[k] += st[k];
      });
      Object.keys(st.skills || {}).forEach((k) => {
        if (k in out.skills) out.skills[k] += st.skills[k];
      });
    });
    return out;
  }

  function applyProfile(raw) {
    state.profile = normalizeProfile(raw);
    const origin = originById(state.profile.origin);
    const start = traitStart(state.profile.traits);
    state.money = Math.max(0, origin.money + start.money);
    state.skills = Object.assign({ stamina: 1, social: 1, tech: 0, business: 0 }, origin.skills);
    Object.keys(start.skills).forEach((k) => {
      state.skills[k] = clamp((state.skills[k] || 0) + start.skills[k], 0, MAX_SKILL);
    });
    state.stats = Object.assign({ energy: 100, satiety: 82, mood: 66, health: 88 }, origin.stats);
    ["energy", "satiety", "mood", "health"].forEach((k) => {
      state.stats[k] = clamp((state.stats[k] || 0) + (start[k] || 0), 0, 100);
    });
  }

  function personalize(text) {
    return String(text == null ? "" : text).replace(/\{name\}/g, state && state.profile ? state.profile.name : D.protagonist.name);
  }

  /* ---------------- 状态 ---------------- */

  const MAX_SKILL = 10;

  function blankProfile() {
    return {
      name: D.protagonist.name,
      letter: D.protagonist.letter,
      origin: "newcomer",
      traits: [],
      title: "newcomer",
      unlockedTitles: ["newcomer"]
    };
  }

  function defaultAutomation() {
    return { autoEat: true, eatBelow: 30, autoAd: false };
  }

  function createState() {
    return {
      version: 2,
      day: 1,
      slot: 0,
      weather: "clear",
      money: 1200,
      debt: 0,
      stats: { energy: 100, satiety: 82, mood: 66, health: 88 },
      skills: { stamina: 1, social: 1, tech: 0, business: 0 },
      skillXp: { stamina: 0, social: 0, tech: 0, business: 0 },
      profile: blankProfile(),
      job: null,
      housing: { id: "bed", owned: false },
      businesses: [],
      assets: {},
      buffs: [],
      automation: defaultAutomation(),
      achievements: [],
      achievementLog: {},
      flags: { newGame: true, jobHistory: [], eventCount: 0 },
      log: [],
      logSeq: 0,
      totals: {
        earned: 0, spent: 0, worked: 0, minigames: 0, nightWork: 0,
        social: 0, relax: 0, events: 0, jobs: 0, perfect: 0
      },
      daily: { bargainUsed: false, pet: false, visits: {}, games: {}, ads: {}, worked: 0, oddJobs: 0, meds: 0 },
      pendingEvent: null,
      ended: false,
      ending: null,
      settings: { sound: true, music: true, quality: "auto" }
    };
  }

  /* 老存档补齐新增字段，避免读旧档后某些面板报错 */
  function normalizeBusiness(raw) {
    const bd = getBusinessDef(raw && raw.id);
    if (!bd) return null;
    const b = {
      id: raw.id,
      level: clamp(Math.round(raw.level || 1), 1, 5),
      rep: Number.isFinite(raw.rep) ? clamp(Math.round(raw.rep), 0, 100) : 50,
      staff: Number.isFinite(raw.staff) ? Math.max(0, Math.round(raw.staff)) : bd.staff,
      price: raw.price || "normal",
      ads: Math.max(0, Math.round(raw.ads || 0)),
      adEver: !!raw.adEver || (raw.ads || 0) > 0
    };
    return b;
  }

  function normalizeStateExtra() {
    state.totals = Object.assign(
      { earned: 0, spent: 0, worked: 0, minigames: 0, nightWork: 0, social: 0, relax: 0, events: 0, jobs: 0, perfect: 0 },
      state.totals || {}
    );
    state.assets = state.assets && typeof state.assets === "object" ? state.assets : {};
    state.achievements = Array.isArray(state.achievements) ? state.achievements : [];
    state.achievementLog = state.achievementLog && typeof state.achievementLog === "object" ? state.achievementLog : {};
    state.flags = Object.assign({ jobHistory: [], eventCount: 0 }, state.flags || {});
    state.flags.jobHistory = Array.isArray(state.flags.jobHistory) ? state.flags.jobHistory : [];
    state.flags.eventCount = Math.max(0, Math.round(state.flags.eventCount || 0));
    state.daily = Object.assign({ bargainUsed: false, pet: false, visits: {}, games: {}, ads: {}, worked: 0, oddJobs: 0 }, state.daily || {});
    state.daily.visits = state.daily.visits || {};
    state.daily.games = state.daily.games || {};
    state.daily.worked = Math.max(0, Math.round(state.daily.worked || 0));
    state.daily.oddJobs = Math.max(0, Math.round(state.daily.oddJobs || 0));
    state.daily.meds = Math.max(0, Math.round(state.daily.meds || 0));
    state.buffs = (Array.isArray(state.buffs) ? state.buffs : [])
      .map((b) => {
        if (!b || !b.id) return null;
        const item = D.items.find((i) => i.id === b.id && i.type === "buff");
        const left = clamp(Math.round(b.left || 0), 0, 30);
        return item && left > 0 ? { id: b.id, left: left } : null;
      })
      .filter(Boolean);
    state.automation = Object.assign(defaultAutomation(), state.automation || {});
    state.automation.autoEat = !!state.automation.autoEat;
    state.automation.autoAd = !!state.automation.autoAd;
    state.automation.eatBelow = clamp(Math.round(state.automation.eatBelow || 30), 10, 80);
    state.businesses = (state.businesses || []).map(normalizeBusiness).filter(Boolean);
  }

  function intro() {
    logDayHeader();
    const origin = originById(state.profile.origin);
    origin.intro.forEach((line, i) => log(personalize(line), i === origin.intro.length - 1 ? "narrative" : "system"));
  }

  function newGame(profile) {
    const keepSettings = state && state.settings ? Object.assign({}, state.settings) : {};
    const keepAutomation = state && state.automation ? Object.assign({}, state.automation) : null;
    state = createState();
    state.settings = Object.assign({ sound: true, music: true, quality: "auto" }, keepSettings);
    if (keepAutomation) state.automation = Object.assign(defaultAutomation(), keepAutomation);
    applyProfile(profile);
    intro();
    try { localStorage.removeItem(LOG_KEY); } catch (e) {}
    save();
    flushLogSave();
  }

  function init() {
    let loaded = false;
    try {
      const raw = readStoredSave();
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.version === 2) {
          state = Object.assign(createState(), parsed);
          state.stats = Object.assign({ energy: 100, satiety: 82, mood: 66, health: 88 }, parsed.stats);
          state.skills = Object.assign({ stamina: 1, social: 1, tech: 0, business: 0 }, parsed.skills);
          Object.keys(state.skills).forEach((k) => { state.skills[k] = clamp(Math.round(state.skills[k] || 0), 0, MAX_SKILL); });
          state.skillXp = Object.assign({ stamina: 0, social: 0, tech: 0, business: 0 }, parsed.skillXp);
          Object.keys(state.skillXp).forEach((k) => {
            state.skillXp[k] = Math.max(0, Math.round(state.skillXp[k] || 0));
            if ((state.skills[k] || 0) >= MAX_SKILL) state.skillXp[k] = 0;
          });
          /* 旧存档没有身份信息，按默认来客补齐；称号与特质做容错过滤 */
          state.profile = normalizeProfile(parsed.profile);
          state.totals = Object.assign({ earned: 0, spent: 0, worked: 0, minigames: 0, nightWork: 0 }, parsed.totals);
          state.daily = Object.assign({ bargainUsed: false, pet: false, visits: {}, games: {}, worked: 0, oddJobs: 0 }, parsed.daily);
          state.daily.games = state.daily.games || {};
          state.daily.worked = Math.max(0, Math.round(state.daily.worked || 0));
          state.daily.oddJobs = Math.max(0, Math.round(state.daily.oddJobs || 0));
          state.daily.meds = Math.max(0, Math.round(state.daily.meds || 0));
          state.settings = Object.assign({ sound: true, music: true, quality: "auto" }, parsed.settings);
          if (parsed.settings && parsed.settings.sound === false && parsed.settings.music === undefined) {
            state.settings.music = false;

          /* 兼容旧存档：补齐日志序号，避免日志达到上限后不再刷新 */
          state.log = Array.isArray(state.log) ? state.log : [];
          const storedLog = readStoredLog();
          if (Array.isArray(storedLog) && storedLog.length) {
            const storedMax = storedLog[storedLog.length - 1].seq || 0;
            const mainMax = state.log.length ? state.log[state.log.length - 1].seq || 0 : 0;
            if (storedMax >= mainMax) state.log = storedLog;
          }
          state.logSeq = Number.isFinite(parsed.logSeq) ? parsed.logSeq : 0;
          let logMax = 0;

            if (Number.isFinite(entry.seq)) logMax = Math.max(logMax, entry.seq);

          if (state.pendingEvent) {
            const evt = eventDefById(state.pendingEvent.eventId);
            if (!evt) {
              state.pendingEvent = null;
            } else if (state.pendingEvent.outcome != null && !Array.isArray(state.pendingEvent.outcome)) {
              state.pendingEvent.outcome = null;
            }
          }
          if (state.ended && (!state.ending || typeof state.ending !== "object")) {
            state.ended = false;
            state.ending = null;
          }
          normalizeStateExtra();
          loaded = true;
        }
      }
    } catch (e) {
      state = null;
    }
    if (!state) {
      state = createState();
      intro();
      save();
    }
    /* 读档后补一次判定，保证旧存档也能拿到新版本的成就；有变化立刻存盘避免重复发放 */
    try { if (checkAchievements()) save(); } catch (e) {}
    return loaded;
  }

  function save() {
    try {
      /* 日志另有独立存储，主存档只保留最近几条作为兜底 */
      const snapshot = Object.assign({}, state, { log: state.log.slice(-40) });
      writeStoredSave(JSON.stringify(snapshot));

      /* 忽略隐私模式下的存储限制 */
    }
    scheduleLogSave();

  function hasSave() {
    return !!readStoredSave();

  function clearSave() {

  /* ---------------- 基础工具 ---------------- */

  function getWeather() {

  function getHousing() {
