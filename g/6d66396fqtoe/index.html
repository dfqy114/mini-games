  /* ============================================================
     顶栏 / 角色 / 状态
     ============================================================ */
  function renderHeader() {
    const s = Game.state;
    const dayEl = el("day-num");
    const subEl = el("day-sub");
    const dayText = "第 " + s.day + " 天";
    if (dayEl && dayEl.textContent !== dayText) dayEl.textContent = dayText;
    const wx = Game.weatherDef;
    setHtml(subEl,
      esc(Game.weekday) + " · " + esc(Game.slotName) + ' · <span class="wx-chip">' +
      contentIcon(wx.icon, "wx-ico") + esc(wx.name) + "</span>");
    document.body.dataset.weather = s.weather;
    Sound.setScene({ slot: s.slot, weather: s.weather });
    const watermark = el("log-watermark");
    const markText = String(s.day).padStart(2, "0");
    if (watermark && watermark.textContent !== markText) watermark.textContent = markText;

    const track = el("slot-track");
    if (track) {
      setHtml(track, D.slots
        .map((slot, i) => {
          const cls = i < s.slot ? "done" : i === s.slot ? "now" : "";
          return '<span class="slot-dot ' + cls + '" title="' + slot.key + '"></span>';
        })
        .join(""));
    }

    const moneyEl = el("money");
    if (moneyEl) {
      const target = s.money;
      if (lastMoney === null) {
        moneyDisplay = target;
        moneyEl.textContent = fmt(target);
      } else if (target !== lastMoney) {
        const delta = target - lastMoney;
        animateMoney(target);
        if (Math.abs(delta) >= 1) showMoneyDelta(delta);
        if (moneyEl.animate && !REDUCED_MOTION) {
          moneyEl.getAnimations().forEach((a) => a.cancel());
          moneyEl.animate(
            [
              { transform: "scale(1)" },
              { transform: "scale(1.09)", color: "#fff2cf", offset: 0.38 },
              { transform: "scale(1)" }
            ],
            { duration: 500, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }
          );
        } else {
          moneyEl.classList.remove("bump");
          void moneyEl.offsetWidth;
          moneyEl.classList.add("bump");
        }
      }
      lastMoney = target;
    }

    const debtChip = el("debt-chip");
    if (debtChip) {
      if (s.debt > 0) {
        debtChip.classList.remove("hidden");
        debtChip.textContent = "负债 " + fmt(s.debt);
      } else {
        debtChip.classList.add("hidden");
      }
    }

    const logTag = el("log-day-tag");
    if (logTag) logTag.textContent = "第 " + s.day + " 天";
  }

  function renderProfile() {
    const s = Game.state;
    const job = Game.jobDef;
    const housing = Game.housingDef;
    const profile = s.profile || {};
    const avatarEl = el("profile-avatar");
    if (avatarEl && avatarEl.textContent !== (profile.letter || "满")) avatarEl.textContent = profile.letter || "满";
    const nameEl = el("profile-name");
    if (nameEl && nameEl.textContent !== (profile.name || "林小满")) nameEl.textContent = profile.name || "林小满";
    const honor = el("profile-honor");
    if (honor) {
      const title = Game.titleById ? Game.titleById(profile.title) : null;
      setHtml(honor, contentIcon(title ? title.icon : "seed", "honor-ico") +
        "<span>" + esc(title ? title.name : "城市新人") + "</span>");
      honor.title = title ? "称号：" + title.name + " · " + title.bonus : "查看称号";
    }
    const jobChip = el("chip-job");
    const housingChip = el("chip-housing");
    if (jobChip) {
      setHtml(jobChip, job
        ? ico("briefcase", "chip-ico") + esc(job.name) + (s.job.level ? " Lv." + s.job.level : "")
        : ico("briefcase", "chip-ico") + "无业游民");
    }
    if (housingChip) setHtml(housingChip, ico("home", "chip-ico") + esc(housing.name));

    const net = Math.max(0, Game.netWorth);
    const favor = Math.round(clamp(18 + s.day * 0.9 + s.achievements.length * 2.2 + net / 90000, 0, 100));
    const favorEl = el("city-favor");
    const favorNum = el("city-favor-num");
    if (favorEl && favorEl._lastFavor !== favor) {
      favorEl.style.width = favor + "%";
      favorEl._lastFavor = favor;
    }
    if (favorNum && favorNum.textContent !== String(favor)) favorNum.textContent = favor;
    const title = el("profile-title");
    if (title) {
      const text = s.ended
        ? "故事停在了第 " + s.day + " 天"
        : "漂在这座城市的第 " + s.day + " 天";
      if (title.textContent !== text) title.textContent = text;
    }
  }

  function ensureStatRows() {
    const wrap = el("stats");
    if (!wrap) return;
    wrap.innerHTML = D.stats
      .map(
        (st) =>
          '<div class="stat-row" data-stat="' + st.key + '">' +
            '<div class="stat-top">' +
              '<span class="stat-name"><span class="stat-ico">' + ico(STAT_ICONS[st.key]) + "</span>" + st.name + "</span>" +
              '<span class="stat-val" id="stat-val-' + st.key + '">0</span>' +
            "</div>" +
            '<div class="stat-bar"><i id="stat-bar-' + st.key + '"></i></div>' +
          "</div>"
      )
      .join("");
    statRefs = {};
    D.stats.forEach((st) => {
      statRefs[st.key] = {
        row: wrap.querySelector('.stat-row[data-stat="' + st.key + '"]'),
        val: el("stat-val-" + st.key),
        bar: el("stat-bar-" + st.key)
      };
    });
  }

  function renderStats() {
    const s = Game.state;
    const stats = s.stats;
    const first = !lastStats;
    if (!statRefs) ensureStatRows();

    D.stats.forEach((st) => {
      const ref = statRefs && statRefs[st.key];
      if (!ref || !ref.row || !ref.val || !ref.bar) return;
      const val = Math.round(stats[st.key]);
      const warn = val < (st.key === "health" ? 28 : 22);
      if (first) {
        ref.val.textContent = val;
        ref.bar.style.width = "0%";
        requestAnimationFrame(() => {
          ref.bar.style.width = val + "%";
        });
        ref.row.classList.toggle("warn", warn);
        lastStatView[st.key] = val;
        lastStatWarn[st.key] = warn;
      } else {
        if (lastStatView[st.key] !== val) {
          ref.val.textContent = val;
          ref.bar.style.width = val + "%";
          lastStatView[st.key] = val;
        }
        if (lastStatWarn[st.key] !== warn) {
          ref.row.classList.toggle("warn", warn);
          lastStatWarn[st.key] = warn;
        }
      }

      if (!first && lastStats[st.key] !== undefined) {
        const delta = val - lastStats[st.key];
        if (Math.abs(delta) >= 1) showStatDelta(ref.row, delta);
        if (delta <= -2) {
          ref.row.classList.remove("fx-hurt");
          void ref.row.offsetWidth;
          ref.row.classList.add("fx-hurt");
          setTimeout(() => ref.row.classList.remove("fx-hurt"), 620);
        }
        if (st.key === "health" && delta <= -4) FX.damage();
      }
    });
    FX.critical(stats.health <= 25);

    const tipEl = el("stat-tip");
    if (tipEl) {
      let tip = "精力见底时，什么也做不成。";
      if (s.debt > 0) tip = "每天 " + (Math.max(0.008, 0.025 + Game.mods().debtInterest) * 100).toFixed(1).replace(".0", "") + "% 的利息在悄悄长大，尽早还清它。";
      if (stats.satiety < 25) tip = "饿着肚子，连体面都会变薄。去吃点东西吧。";
      else if (stats.energy < 22) tip = "身体已经在报警了。今晚早点睡。";
      else if (stats.mood < 22) tip = "心里那根弦绷得太紧，找点便宜的小事让自己开心。";
      else if (stats.health < 30) tip = "健康是唯一不能长期透支的账户。";
      else if (s.day === 1) tip = "先找份工作，再考虑明天。";
      if (tip !== lastStatTip) {
        tipEl.textContent = tip;
        lastStatTip = tip;
      }
    }

    lastStats = Object.assign({}, stats);
  }

  function showStatDelta(row, delta) {
    const span = document.createElement("span");
    span.className = "stat-delta";
    span.textContent = (delta > 0 ? "+" : "") + delta;
    span.style.color = delta > 0 ? "#7fe0b0" : "#ff9a9a";
    row.appendChild(span);
    setTimeout(() => span.remove(), 1300);
  }

  function showMoneyDelta(delta) {
    const box = document.querySelector(".money-box");
    if (!box) return;
    const old = box.querySelector(".money-float");
    if (old) old.remove();
    const span = document.createElement("span");
    span.className = "money-float " + (delta > 0 ? "up" : "down");
    span.textContent = (delta > 0 ? "+" : "-") + fmt(Math.abs(delta));
    box.appendChild(span);
    if (delta > 0) {
      requestAnimationFrame(() => {
        if (box.isConnected) FX.coins(box.getBoundingClientRect());
      });
    }
    setTimeout(() => span.remove(), 1450);
  }

  function animateMoney(to) {
    const moneyEl = el("money");
    if (!moneyEl) return;
    cancelAnimationFrame(moneyRaf);
    const from = moneyDisplay;
    const start = performance.now();
    const dur = 620;
    function tick(now) {
      const p = Math.min(1, (now - start) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      const v = Math.round(from + (to - from) * e);
      moneyDisplay = v;
      moneyEl.textContent = fmt(v);
      if (p < 1) moneyRaf = requestAnimationFrame(tick);
      else moneyDisplay = to;
    }
    moneyRaf = requestAnimationFrame(tick);
  }

  function renderSkills() {
    const wrap = el("skills");
    if (!wrap) return;
    setHtml(wrap, D.skills
      .map((sk) => {
        const info = Game.skillInfo(sk.key);
        const lv = info.level;
        const pct = info.max ? Math.min(100, Math.round((info.xp / Math.max(1, info.need)) * 100)) : 100;
        let pips = "";
        for (let i = 0; i < info.max; i++) {
          pips += '<i class="' + (i < lv ? "on" : "") +
            ((i === 2 || i === 5 || i === 8 || i === 9) ? " milestone" : "") + '"></i>';
        }
        const acts = (D.skillActions || []).filter((a) => a.skill === sk.key && lv >= a.level);
        const actInfo = acts
          .map((a) => '<span class="skill-unlock on">' + contentIcon(a.icon, "su-ico") + a.name + "</span>")
          .join("");
        return (
          '<div class="skill" data-skill="' + sk.key + '" role="button" tabindex="0" title="查看' + esc(sk.name) + '详情">' +
            '<div class="skill-top"><b><span class="skill-ico">' + ico(SKILL_ICONS[sk.key]) + "</span>" + sk.name +
            '</b><span class="skill-lv">Lv.' + lv + "</span></div>" +
            '<div class="skill-pips">' + pips + "</div>" +
            '<div class="skill-xp"><i style="width:' + pct + '%"></i></div>' +
            '<div class="skill-effect" title="' + esc(info.effect) + '">' + esc(info.effect) +
              (lv >= info.max ? " · 已满级" : "") + "</div>" +
            (actInfo ? '<div class="skill-unlocks">' + actInfo + "</div>" : "") +
          "</div>"
        );
      })
      .join(""));
  }

  function renderGoals() {
    const wrap = el("goals");
    if (!wrap) return;
    const sorted = D.goals.slice().sort((a, b) => {
      let da = false;
      let db = false;
      try { da = a.done(Game.state); } catch (e) {}
      try { db = b.done(Game.state); } catch (e) {}
      if (da !== db) return da ? 1 : -1;
      return 0;
    });
    const visible = goalsExpanded ? sorted : sorted.slice(0, 4);
    const hidden = D.goals.length - visible.length;
    setHtml(wrap, visible
      .map((g) => {
        let done = false;
        let cur = 0;
        try {
          done = g.done(Game.state);
          cur = typeof g.cur === "function" ? Number(g.cur(Game.state)) || 0 : done ? 1 : 0;
        } catch (e) {
          done = false;
        }
        const goal = Number.isFinite(g.goal) ? g.goal : 1;
        const pct = done ? 100 : Math.max(0, Math.min(100, Math.round((cur / Math.max(1, goal)) * 100)));
        const moneyLike = g.label.indexOf("¥") >= 0;
        const valueText = done
          ? "完成"
          : (moneyLike ? fmt(Math.round(cur)) : compactNum(cur)) + " / " +
            (moneyLike ? fmt(goal) : compactNum(goal));
        return (
          '<div class="goal ' + (done ? "done" : "") + '">' +
            '<div class="goal-line"><span class="goal-dot">' + ico("check") + '</span><span class="goal-label">' + esc(g.label) + "</span></div>" +
            '<div class="goal-foot"><span class="goal-val">' + valueText + "</span></div>" +
            (done ? "" : '<div class="goal-bar"><i style="width:' + pct + '%"></i></div>') +
          "</div>"
        );
      })
      .join("") +
      (D.goals.length > 6
        ? '<button type="button" class="goal-more" data-goals-all>' +
          (goalsExpanded ? "收起目标" : "展开全部 " + D.goals.length + " 个目标" + (hidden ? " · 还有 " + hidden + " 个" : "")) +
          "</button>"
        : ""));
  }

  /* ============================================================
     日志
     ============================================================ */
  function formatLog(text) {
    return esc(text).replace(/(¥[\d,]+)/g, '<span class="hl">$1</span>');
  }

  const LOG_LIMITS = { high: [360, 640], mid: [260, 520], low: [180, 360] };
  const LOG_PAGE = 120;

  function renderLog(force) {
    const logEl = el("log");
    if (!logEl) return;
    const scrollEl = el("log-scroll");
    ensureLogScroll();

    const entries = Game.state.log || [];
    const limits = QUALITY.effective === "low" ? LOG_LIMITS.low : QUALITY.effective === "high" ? LOG_LIMITS.high : LOG_LIMITS.mid;
    const lastSeq = entries.length ? entries[entries.length - 1].seq || 0 : 0;
    const reset =
      force ||
      !logEl.firstElementChild ||
      lastLogCount > entries.length ||
      (entries.length > 0 && lastSeq < lastLogSeq);

    let added = 0;
    if (reset) {
      logEl.innerHTML = "";
      logMoreBtn = null;
      logNodeCount = 0;
      logFirstSeq = 0;
      const start = Math.max(0, entries.length - limits[0]);
      const frag = document.createDocumentFragment();
      for (let i = start; i < entries.length; i++) {
        frag.appendChild(buildLogItem(entries[i], false, i - start));
      }
      logEl.appendChild(frag);
      logNodeCount = entries.length - start;
      if (entries[start]) logFirstSeq = entries[start].seq || 0;
      lastLogSeq = lastSeq;
      lastLogCount = entries.length;
      added = logNodeCount;
    } else {
      let start = entries.length;
      while (start > 0 && (entries[start - 1].seq || 0) > lastLogSeq) start--;
      if (start < entries.length) {
        const frag = document.createDocumentFragment();
        for (let i = start; i < entries.length; i++) {
          frag.appendChild(buildLogItem(entries[i], true, i - start));
        }
        logEl.appendChild(frag);
        added = entries.length - start;
        logNodeCount += added;
      }
      lastLogSeq = lastSeq;
      lastLogCount = entries.length;
      if (logNodeCount > limits[1] + LOG_PAGE) trimLogDom(limits[1]);
    }

    renderLogWhisper(entries, reset, added);

    const more = ensureLogMore();
    if (more) {
      if (logEl.firstElementChild !== more) logEl.insertBefore(more, logEl.firstElementChild);
      more.style.display = entries.length && (entries[0].seq || 0) < logFirstSeq ? "" : "none";
    }

    if (scrollEl && (reset || (added && logNearBottom))) {
      logNearBottom = true;
      requestAnimationFrame(() => {
        scrollEl.scrollTop = scrollEl.scrollHeight;
      });
    }
  }

  function ensureLogScroll() {
    if (logScrollBound) return;
    const scrollEl = el("log-scroll");
    if (!scrollEl) return;
    logScrollBound = true;
    scrollEl.addEventListener(
      "scroll",
      () => {
        if (logScrollRaf) return;
        logScrollRaf = requestAnimationFrame(() => {
          logScrollRaf = 0;
          logNearBottom = scrollEl.scrollHeight - scrollEl.scrollTop - scrollEl.clientHeight < 110;
        });
      },
      { passive: true }
    );
  }

  function buildLogItem(entry, animate, index) {
    const div = document.createElement("div");
    div.className = "log-item type-" + (entry.type || "narrative") + (animate ? "" : " no-anim");
    div.dataset.seq = entry.seq || 0;
    let meta = "";
    if (entry.type === "day") {
      meta = '<span class="tag">第 ' + entry.day + " 天</span><span>城市日记</span>";
    } else {
      const slot = entry.slot >= D.slots.length ? { key: "深夜" } : D.slots[entry.slot] || D.slots[0];
      meta = "<span>第 " + entry.day + " 天 · " + slot.key + "</span>";
    }
    div.innerHTML =
      '<div class="log-meta">' + meta + '</div><p>' + formatLog(entry.text) + "</p>";
    if (animate) div.style.animationDelay = Math.min(index * 35, 140) + "ms";
    return div;
  }

  function trimLogDom(target) {
    const logEl = el("log");
    if (!logEl) return;
    const items = logEl.querySelectorAll(".log-item");
    const removeCount = items.length - target;
    if (removeCount <= 0) return;
    for (let i = 0; i < removeCount; i++) items[i].remove();
    logNodeCount = target;
    const first = logEl.querySelector(".log-item");
    logFirstSeq = first ? Number(first.dataset.seq) || 0 : 0;
  }

  function ensureLogMore() {
    if (logMoreBtn && logMoreBtn.isConnected) return logMoreBtn;
    const logEl = el("log");
    if (!logEl) return null;
    logMoreBtn = document.createElement("button");
    logMoreBtn.type = "button";
    logMoreBtn.className = "log-more";
    logMoreBtn.textContent = "回顾更早的日志";
    logMoreBtn.style.display = "none";
    logMoreBtn.addEventListener("click", loadOlderLogs);
    return logMoreBtn;
  }

  function loadOlderLogs() {
    const logEl = el("log");
    const scrollEl = el("log-scroll");
    if (!logEl) return;
    const entries = Game.state.log || [];
    const older = entries.filter((entry) => (entry.seq || 0) < logFirstSeq);
    if (!older.length) return;
    const slice = older.slice(-LOG_PAGE);
    const beforeH = scrollEl ? scrollEl.scrollHeight : 0;
    const beforeTop = scrollEl ? scrollEl.scrollTop : 0;
    const frag = document.createDocumentFragment();
    slice.forEach((entry, i) => frag.appendChild(buildLogItem(entry, false, i)));
    const firstItem = logEl.querySelector(".log-item");
    logEl.insertBefore(frag, firstItem || null);
    logNodeCount += slice.length;
    logFirstSeq = slice[0].seq || logFirstSeq;
    logNearBottom = false;
    if (scrollEl) {
      requestAnimationFrame(() => {
        scrollEl.scrollTop = Math.max(0, scrollEl.scrollHeight - beforeH + beforeTop);
      });
    }
    if (logMoreBtn) logMoreBtn.style.display = (entries[0].seq || 0) < logFirstSeq ? "" : "none";
  }

  function costHtml(text) {
    return esc(text)
      .replace(/⚡/g, ico("bolt", "cost-ico"))
      .replace(/🌤️/g, ico("smile", "cost-ico"))
      .replace(/❤️/g, ico("heart", "cost-ico"));
  }

  function renderLogWhisper(entries, reset, added) {
    const logEl = el("log");
    if (!logEl) return;
    const oldWhisper = logEl.querySelector(".log-whisper");
    if (entries.length >= 13) {
      if (oldWhisper) oldWhisper.remove();
      return;
    }
    if (!reset && !added) return;
    if (oldWhisper) oldWhisper.remove();
    const s = Game.state;
    let tip = "别急，城市不会一夜之间接纳谁。";
    if (s.debt > 0) tip = "欠下的东西，都会以另一种方式回来。";
    else if (s.housing.owned) tip = "有一盏灯为你亮着，已经很了不起。";
    else if (s.businesses.length) tip = "生意的好坏，不能只看今天。";
    else if (s.stats.energy < 30) tip = "撑不住的时候，就睡一觉。明天再想。";
    else if (s.day === 1) tip = "先找一份工作，再谈以后。";
    else if (s.money < 100) tip = "便利店有临期的饭团，便宜，也能吃饱。";
    else if (!s.job) tip = "这座城市不会主动敲门，你得自己出去找。";
    const whisper = document.createElement("div");
    whisper.className = "log-whisper";
    whisper.innerHTML = "<span>城市手记</span><p>「" + esc(tip) + "」</p>";
    logEl.appendChild(whisper);
  }

  /* ============================================================
     行动区
     ============================================================ */
  function renderDock() {
    const s = Game.state;
    const dock = el("action-dock");
    const tabs = el("tabs");
    const actions = el("actions");
    const hint = el("slot-hint");
    const sleepBtn = el("btn-sleep-day");
    if (!dock) return;

    if (s.pendingEvent || s.ended) dock.style.display = "none";
    else dock.style.display = "";

    if (tabs) {
      setHtml(tabs, TABS.map(
        (t) =>
          '<button class="tab ' + (activeTab === t.id ? "active" : "") + '" data-tab="' + t.id +
            '" role="tab" aria-selected="' + (activeTab === t.id ? "true" : "false") + '">' +
            ico(t.icon, "tab-ico") + t.name +
          "</button>"
      ).join(""));
    }
    if (actions) {
      const switching = activeTab !== lastRenderedTab;
      const defs = actionsForTab(activeTab);
      setHtml(actions, defs
        .map((a) => {
          const disabled = !!a.disabled || s.ended;
          const actionIcon = actionIconName(a.act) || iconKey(a.icon);
          return (
            '<button class="action-btn ' + (disabled ? "is-disabled" : "") + '" data-act="' + a.act + '"' +
              (disabled ? " disabled" : "") + ' title="' + esc(a.reason || a.name) + '">' +
              '<span class="act-icon ' + (actionIcon ? "act-icon-line" : "") + '">' +
              (actionIcon ? ico(actionIcon) : a.icon) + "</span>" +
              '<span class="act-body"><span class="act-name">' + esc(a.name) + "</span>" +
              '<span class="act-desc">' + esc(a.desc || "") + "</span></span>" +
              '<span class="act-meta">' +
                (a.pay ? '<span class="pay">' + esc(a.pay) + "</span>" : "") +
                (a.cost ? '<span class="cost">' + costHtml(a.cost) + "</span>" : "") +
              "</span>" +
            "</button>"
          );
        })
        .join(""));
      if (switching) {
        lastRenderedTab = activeTab;
        actions.classList.remove("switching");
        void actions.offsetWidth;
        actions.classList.add("switching");
        setTimeout(() => actions.classList.remove("switching"), 420);
      }
    }
    if (hint) {
      const left = D.slots.length - s.slot;
      let main = s.pendingEvent
        ? "先处理眼前的事"
        : s.ended
        ? "这段人生已经写到了最后"
        : "今天还能行动 <b>" + left + "</b> 次 · 每件事都会用掉一个时段";
      let sub = "";
      if (!s.pendingEvent && !s.ended) {
        if (s.slot >= D.slots.length - 1) sub = "夜晚行动会晚睡：睡眠恢复 -8，健康 -2";
        else if (s.slot <= 2) sub = "现在结束今天，睡眠恢复 +6";
        const odd = Math.min((s.daily && s.daily.oddJobs) || 0, Game.oddJobDailyCap || 3);
        if (odd > 0) sub += (sub ? " · " : "") + "今日零工 " + odd + "/" + (Game.oddJobDailyCap || 3);
      }
      setHtml(hint,
        '<span class="slot-hint-main">' + main + "</span>" +
        (sub ? '<span class="slot-hint-sub">' + sub + "</span>" : ""));
    }
    if (sleepBtn) {
      sleepBtn.disabled = !!(s.pendingEvent || s.ended);
      sleepBtn.style.opacity = sleepBtn.disabled ? 0.4 : "";
      setHtml(sleepBtn, '结束今天 ' + ico("moon"));
    }
    updateQuickAction();
  }

  function handleAction(act) {
    if (Game.state.ended || Game.state.pendingEvent || transitioning || actionLock) return;
    actionLock = true;
    setTimeout(() => { actionLock = false; }, 240);
    const before = {
      slot: Game.state.slot,
      day: Game.state.day,
      skills: Object.assign({}, Game.state.skills)
    };
    Sound.unlock();
    if (Game.state.settings.music !== false && !Sound.isMusicPlaying()) Sound.startMusic();
    Sound.play("click");
    if (act === "work") Game.work(false);
    else if (act === "overtime") Game.work(true);
    else if (act === "findjob") { Sound.play("open"); openJobs(); }
    else if (act === "restjob") { Game.nap(); }
    else if (act === "eat") { Sound.play("open"); openShop("食物"); }
    else if (act === "shop") { Sound.play("open"); openShop("全部"); }
    else if (act === "auto") { Sound.play("open"); openAutomation(); }
    else if (act === "housing") { Sound.play("open"); openHousing(); }
    else if (act === "nap") Game.nap();
    else if (act.indexOf("train-") === 0) Game.train(act.replace("train-", ""));
    else if (act.indexOf("skill-") === 0) {
      Game.doSkillAction(act.replace("skill-", ""));
      if (Game.state.slot !== before.slot || Game.state.day !== before.day) Sound.play("coin");
    }
    else if (act === "biz") { Sound.play("open"); openBusiness(); }
    else if (act === "manage") { Sound.play("open"); openBusiness(); }
    else if (act === "adall") {
      const res = Game.buyAllBizAds();
      if (res) Sound.play("purchase");
    }
    else if (act === "bank") { Sound.play("open"); openBank(); }
    else if (act === "ending") { Sound.play("open"); confirmEnding(); }
    else if (act === "social") Game.socialize();
    else if (act === "relax") Game.relax();
    else if (act === "pet") Game.petCat();
    else if (act.indexOf("mini-") === 0) {
      const type = act.replace("mini-", "");
      Sound.play("open");
      Minigames.open(type);
    }
    if ((act === "work" || act === "overtime") &&
        (Game.state.slot !== before.slot || Game.state.day !== before.day)) {
      Sound.play("work");
    }
    if (act === "nap" && Game.state.slot !== before.slot) Sound.play("heal");
    if (act.indexOf("train-") === 0) {
      const key = act.replace("train-", "");
      if ((Game.state.skills[key] || 0) > (before.skills[key] || 0)) Sound.play("success");
    }
    if (act === "social" || act === "relax") {
      if (Game.state.slot !== before.slot) Sound.play("heal");
    }
    if (act === "pet" && Game.state.daily.pet) Sound.play("coin");
  }

  function renderEvent() {
    const slot = el("event-slot");
    if (!slot) return;
    const pending = Game.state.pendingEvent;
    const center = document.querySelector(".col-center");
    if (center) center.classList.toggle("has-event", !!pending);
    if (!pending) {
      lastEventShownId = null;
      setHtml(slot, "");
      return;
    }
    const evt = Game.getPendingEvent();
    if (!evt) {
      setHtml(slot, "");
      return;
    }
    let isNewEvent = false;
    if (!pending.outcome && lastEventShownId !== pending.eventId) {
      lastEventShownId = pending.eventId;

    }

    let bodyHtml = "";
    if (pending.outcome !== null && pending.outcome !== undefined) {
      bodyHtml =
        '<div class="event-outcome">' +
          (pending.outcome.length
            ? pending.outcome.map((t) => "<p>" + esc(Game.personalize(t)) + "</p>").join("")

        "</div>" +
        '<button class="btn primary" data-event-continue style="width:100%;justify-content:center">继续</button>';
    } else {
      bodyHtml =
        '<div class="event-text">' + esc(Game.personalize(evt.text)) + "</div>" +
        '<div class="event-choices">' +
          evt.choices
            .map((c, i) => {
              const reqOk = !c.req || c.req(Game.state);
              return (
                '<button class="choice-btn" data-choice="' + i + '"' + (reqOk ? "" : " disabled") + ">" +
                  '<span class="num">' + (i + 1) + "</span>" +
                  '<span class="c-body"><span class="c-label">' + esc(c.label) + "</span>" +
                  '<span class="c-hint">' + esc((c.hint || "") + (reqOk ? "" : " · 条件不足")) + "</span></span>" +
                "</button>"

            .join("") +
        "</div>";
    }

    setHtml(slot,
      '<div class="event-card"><div class="event-inner">' +
        '<div class="event-head">' +
          '<div class="event-icon">' + contentIcon(evt.icon) + "</div>" +
          "<div>" +
            '<div class="event-kicker">' +
              (pending.source === "work" ? "工作事件" : pending.source === "biz" ? "经营事件" : "城市事件") +
              (pending.outcome === null || pending.outcome === undefined ? ' · 数字键选择' : "") +
            "</div>" +
            '<div class="event-title">' + esc(evt.title) + "</div>" +
          "</div>" +
        "</div>" +

      requestAnimationFrame(() => {

  function compactNum(n) {
    n = Math.round(n || 0);
    if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, "") + "亿";
    if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, "") + "万";
    return String(n);
  }

    const got = s.achievements.includes(a.id);
    const p = Game.achievementProgress(a, s);
    const at = (s.achievementLog || {})[a.id];
    return {
      got: got,
      pct: got ? 100 : p.pct,
      cur: got ? p.goal : p.cur,
      goal: p.goal,
      day: at ? at.day : 0
    };
  }

    const gotList = views.filter((x) => x.v.got).sort((x, y) => y.v.day - x.v.day);

  /* ============================================================
     成就图鉴
     ============================================================ */
  function openAchievements(focusId) {
    const s = Game.state;
    const cats = D.achievementCats || ["全部"];
    const list = D.achievements.filter((a) => achCat === "全部" || a.cat === achCat);
    const filtered = list.filter((a) => {
      const got = s.achievements.includes(a.id);
      if (achFilter === "got") return got;
      if (achFilter === "locked") return !got;
      return true;
    });
    const sorted = filtered.slice().sort((a, b) => {
      const va = achievementView(a, s);
      const vb = achievementView(b, s);
      if (va.got !== vb.got) return va.got ? -1 : 1;
      if (va.got) return vb.day - va.day;
      return vb.pct - va.pct;
    });
    const totalReward = D.achievements.reduce((n, a) => n + (a.reward || 0), 0);
    const gotReward = D.achievements.reduce(
      (n, a) => n + (s.achievements.includes(a.id) ? a.reward || 0 : 0), 0
    );
    const catHtml = cats
      .map(
        (c) =>
          '<button class="ach-tab ' + (achCat === c ? "active" : "") + '" data-ach-cat="' + c + '">' + c +
          "<b>" + D.achievements.filter((a) => (c === "全部" || a.cat === c) && s.achievements.includes(a.id)).length +
          "/" + D.achievements.filter((a) => c === "全部" || a.cat === c).length + "</b></button>"
      )
      .join("");
    const statusHtml = [
      ["all", "全部"],
      ["got", "已解锁"],
      ["locked", "未解锁"]
    ]
      .map(
        ([id, label]) =>
          '<button class="ach-tab small ' + (achFilter === id ? "active" : "") + '" data-ach-filter="' + id + '">' +
          label + "</button>"
      )
      .join("");
    const rows = sorted
      .map((a) => {
        const v = achievementView(a, s);
        return (
          '<div class="ach-detail ' + (v.got ? "got" : "") + '" data-ach-row="' + a.id + '">' +
            '<div class="ach-detail-icon">' + contentIcon(a.icon) + "</div>" +
            '<div class="ach-detail-body">' +
              '<div class="ach-detail-top"><b>' + esc(a.name) + "</b>" +
                '<span class="ach-detail-cat">' + esc(a.cat || "成就") + "</span>" +
                (v.got
                  ? '<em class="ok">第 ' + (v.day || 1) + " 天解锁</em>"
                  : '<em>' + compactNum(v.cur) + " / " + compactNum(v.goal) + "</em>") +
              "</div>" +
              '<div class="ach-detail-desc">' + esc(a.desc) + "</div>" +
              '<div class="ach-detail-bar"><i style="width:' + v.pct + '%"></i></div>' +
              '<div class="ach-detail-foot">' + (v.got ? "已完成" : "进度 " + v.pct + "%") +
                (a.reward ? ' · 奖励 <b>' + fmt(a.reward) + "</b>" : "") + "</div>" +
            "</div>" +
          "</div>"
        );
      })
      .join("");

    mountModal(
      '<div class="modal wide achievements-modal">' +
        modalHead(ico("trophy"), "成就图鉴", "你在城市里留下的痕迹") +
        '<div class="modal-body">' +
          '<p class="modal-lead">已解锁 <em>' + s.achievements.length + "</em> / " + D.achievements.length +
            " 个成就，累计拿到 <em>" + fmt(gotReward) + "</em> 奖励（总奖励 " + fmt(totalReward) + "）。" +
            "成就解锁时会直接进账，也会记在日志里。</p>" +
          '<div class="ach-tabs">' + catHtml + "</div>" +
          '<div class="ach-filters">' + statusHtml + "</div>" +
          '<div class="ach-detail-list">' +
            (rows || '<p class="ach-empty">这个分类下还没有成就。</p>') +
          "</div>" +
        "</div>" +
        '<div class="modal-foot"><button class="btn primary" data-modal-close>收好</button></div>' +
      "</div>",
      (e) => {
        const cat = e.target.closest("[data-ach-cat]");
        if (cat) {
          achCat = cat.dataset.achCat;
          Sound.play("click");
          openAchievements(focusId);
          return;
        }
        const filter = e.target.closest("[data-ach-filter]");
        if (filter) {
          achFilter = filter.dataset.achFilter;
          Sound.play("click");
          openAchievements(focusId);
        }
      }
    );

    if (focusId) {
      requestAnimationFrame(() => {
        const node = document.querySelector('[data-ach-row="' + focusId + '"]');
        if (!node) return;
        node.scrollIntoView({ block: "center" });
        node.classList.add("focus");
      });

  function dayTransition(s) {
    const splash = el("day-splash");
    if (!splash) return;
    const w = D.weather.find((x) => x.id === s.weather) || D.weather[0];
    const line = D.dayLines[(s.day - 1) % D.dayLines.length];
    splash.innerHTML =
      '<div class="splash-bg"></div>' +

        '<span class="splash-kicker">城市清晨</span>' +

        '<p class="splash-meta">' + D.weekdays[(s.day - 1) % 7] + ' · 清晨 · <span class="wx-chip">' + contentIcon(w.icon, "wx-ico") + w.name + "</span></p>" +
        '<p class="splash-line">' + line + "</p>" +

    const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      transitioning = false;
      splash.classList.remove("show");
      document.body.classList.remove("is-transitioning");
      updateQuickAction();
    }, reduceMotion ? 250 : 1950);
    Sound.play("day");
  }

  /* ============================================================
     Toast
     ============================================================ */
  function pushToast(title, desc, type, icon) {
    const wrap = el("toasts");
    if (!wrap) return;
    const maxToasts = window.innerWidth < 1060 ? 2 : 4;
    while (wrap.children.length >= maxToasts) wrap.removeChild(wrap.firstChild);
    const div = document.createElement("div");
    div.className = "toast type-" + (type || "life");
    const toastIcon = icon && iconKey(icon) ? contentIcon(icon) : esc(icon || "•");
    div.innerHTML =
      '<span class="toast-icon">' + toastIcon + "</span>" +
      '<span class="toast-body"><span class="toast-title">' + esc(title) + "</span>" +
      (desc ? '<span class="toast-desc">' + esc(desc) + "</span>" : "") + "</span>";
    wrap.appendChild(div);
    const kill = () => {
      if (div.classList.contains("out")) return;
      div.classList.add("out");
      setTimeout(() => div.remove(), 420);
    };
    div.addEventListener("click", kill);
    if (type === "ach") {
      Sound.play("achievement");
      FX.achievement();
    } else if (type === "money") {
      Sound.play("coin");
    } else if (type === "bad") {
      Sound.play("error");
    }
    setTimeout(kill, 3000);
  }

  function toast(title, desc, type, icon) {
    if (document.body.classList.contains("modal-open")) {
      toastQueue.push([title, desc, type, icon]);
      if (toastQueue.length > 8) toastQueue.shift();
      return;
    }
    pushToast(title, desc, type, icon);
  }

  function flushToasts() {
    if (document.body.classList.contains("modal-open")) return;
    const items = toastQueue.splice(0);
    items.forEach((item) => pushToast(item[0], item[1], item[2], item[3]));
  }

  function clearToasts() {
    const wrap = el("toasts");
    if (wrap) wrap.innerHTML = "";
    toastQueue.length = 0;
  }

  /* ============================================================
     通用模态框
     ============================================================ */
  function closeModal() {
    const root = el("modal-root");
    if (!root) return;
    root.classList.remove("is-open");
    root.innerHTML = "";
    root.onclick = null;
    document.body.classList.remove("modal-open");
    flushToasts();
    updateQuickAction();
  }

  function mountModal(innerHtml, onClick) {
    const root = el("modal-root");
    if (!root) return null;
    clearToasts();
    root.classList.add("is-open");
    document.body.classList.add("modal-open");
    updateQuickAction();
    root.innerHTML = '<div class="modal-backdrop" data-modal-close></div>' + innerHtml;
    root.onclick = (e) => {
      if (e.target.closest("[data-modal-close]")) {
        closeModal();
        return;
      }
      if (onClick) onClick(e);
    };
    return root;
  }

  function modalHead(icon, title, kicker) {
    return (
      '<div class="modal-head">' +
        '<div class="modal-icon">' + icon + "</div>" +
        '<div class="modal-title-wrap"><div class="modal-kicker">' + (kicker || "NEON CITY") + "</div>" +
        '<div class="modal-title">' + title + "</div></div>" +
        '<button class="modal-close" data-modal-close aria-label="关闭">' + ico("close") + "</button>" +
      "</div>"
    );
  }

  const JOB_TIERS = [
    { id: "all", label: "全部", tier: 0 },
    { id: "t1", label: "入门", tier: 1 },
    { id: "t2", label: "进阶", tier: 2 },
    { id: "t3", label: "高阶", tier: 3 },
    { id: "t4", label: "精英", tier: 4 },
    { id: "t5", label: "顶层", tier: 5 }
  ];

  function tierLabel(tier) {
    const t = JOB_TIERS.find((x) => x.tier === tier);
    return t ? t.label : "入门";
  }

  function openJobs() {
    const s = Game.state;
    const worked = s.totals.worked || 0;
    const currentPay = s.job ? Game.jobPreviewPay(Game.getJobDef(s.job.id)) : 0;
    const recommended = D.jobs
      .filter((j) => (!s.job || j.id !== s.job.id) && Game.canApply(j) && Game.jobPreviewPay(j) > currentPay * 1.05)
      .sort((a, b) => Game.jobPreviewPay(b) - Game.jobPreviewPay(a))[0];
    const visibleJobs = D.jobs
      .filter((j) => jobFilter === "all" || "t" + (j.tier || 1) === jobFilter)
      .slice()
      .sort((a, b) => (a.tier || 1) - (b.tier || 1) || a.pay - b.pay);
    const filterHtml = JOB_TIERS.map((f) => {
      const count = f.tier ? D.jobs.filter((j) => (j.tier || 1) === f.tier).length : D.jobs.length;
      return (
        '<button class="job-filter ' + (jobFilter === f.id ? "active" : "") + '" data-job-filter="' +
        f.id + '">' + f.label + "<b>" + count + "</b></button>"
      );
    }).join("");
    const cards = visibleJobs
      .map((j) => {
        const current = s.job && s.job.id === j.id;
        const workReq = Game.jobWorkReq(j);
        const workOk = worked >= workReq;
        const reqOk = Game.meetsReq(j.req);
        const prevOk = Game.jobPrevOk(j);
        const ok = workOk && reqOk && prevOk;
        const reqs = Object.keys(j.req || {})
          .map((k) => {
            const met = (s.skills[k] || 0) >= j.req[k];
            return '<span class="job-chip ' + (met ? "req" : "no") + '">' + Game.skillName(k) + " Lv." + j.req[k] + "</span>";
          })
          .join("");
        const prevNames = (j.prev || [])
          .map((pid) => (Game.getJobDef(pid) || {}).name)
          .filter(Boolean)
          .join(" / ");
        const payNow = Game.jobPreviewPay(j);
        let btn;
        if (current) btn = '<button class="btn small" disabled>当前工作</button>';
        else if (!ok) {
          btn = '<button class="btn small" disabled>' +
            (!workOk ? "班次不足" : !reqOk ? "能力不足" : "履历不足") + "</button>";
        } else btn = '<button class="btn small primary" data-job="' + j.id + '">' + (s.job ? "跳槽" : "入职") + "</button>";
        return (
          '<div class="job-card tier-' + (j.tier || 1) + " " + (current ? "current" : "") + " " + (ok || current ? "" : "locked") + '">' +
            '<div class="job-icon">' + contentIcon(j.icon) + "</div>" +
            '<div class="job-body">' +
              '<div class="job-name"><span class="job-tier-tag">' + tierLabel(j.tier || 1) + "</span>" + j.name +
                (current ? '<span class="cur-tag">当前</span>' : "") +
                (!current && recommended && recommended.id === j.id ? '<span class="job-rec">推荐</span>' : "") +
              "</div>" +
              '<div class="job-desc">' + esc(j.desc) + "</div>" +
              '<div class="job-meta">' +
                '<span class="job-chip pay">日薪 ' + fmt(j.pay) + "</span>" +
                '<span class="job-chip pay">你当前可拿 ' + fmt(payNow) + "</span>" +
                '<span class="job-chip">' + ico("bolt") + j.energy + "</span>" +
                '<span class="job-chip">' + ico("bowl") + "-" + j.satiety + "</span>" +
                (j.mood ? '<span class="job-chip">' + ico("smile") + "-" + j.mood + "</span>" : "") +
                (j.health ? '<span class="job-chip">' + ico("heart") + "-" + j.health + "</span>" : "") +
                '<span class="job-chip">' + Game.skillName(j.skill) + " +</span>" +
                (workReq ? '<span class="job-chip ' + (workOk ? "req" : "no") + '">班次 ' + worked + "/" + workReq + "</span>" : "") +
                reqs +
              "</div>" +
              (prevNames
                ? '<div class="job-prev ' + (prevOk ? "ok" : "") + '">晋升路径 · ' +
                  (prevOk ? "已满足" : "需曾任职") + "：" + esc(prevNames) + "</div>"
                : "") +
            "</div>" +
            '<div class="job-right">' + btn + "</div>" +
          "</div>"
        );
      })
      .join("");

    mountModal(
      '<div class="modal wide job-modal">' +
        modalHead(ico("briefcase"), "职业介绍所", "招工信息") +
        '<div class="modal-body">' +
          '<p class="modal-lead">这座城市不缺工作，缺的是能换钱的技能。技能达标只是门票：班次决定经验，履历决定你能不能坐上更高的位置。跳槽会重置当前岗位的职级。</p>' +
          '<div class="job-filters">' + filterHtml + "</div>" +
          '<div class="section-label">在招岗位 <span style="font-size:9px;color:var(--muted)">' + visibleJobs.length + " 个 · 已上班 " + worked + " 班次</span></div>" +
          '<div class="job-grid">' + (cards || '<div class="job-empty">这个层级暂时没有岗位。</div>') + "</div>" +
        "</div>" +
        '<div class="modal-foot"><button class="btn" data-modal-close>先看看</button></div>' +
      "</div>",
      (e) => {
        const filter = e.target.closest("[data-job-filter]");
        if (filter) {
          jobFilter = filter.dataset.jobFilter;
          Sound.play("click");
          openJobs();
          return;
        }
        const btn = e.target.closest("[data-job]");
        if (!btn) return;
        const id = btn.dataset.job;
        if (Game.changeJob(id)) {
          closeModal();
          const jd = Game.getJobDef(id);
          Sound.play("success");
          toast("入职成功", jd.name + " · 现在开始上班", "ach", jd.icon);
        }
      }
    );
  }

  /* ============================================================
     商店
     ============================================================ */
  function openShop(cat) {
    shopCat = cat || shopCat;
    mountModal(
      '<div class="modal">' +
        modalHead(ico("bag"), "生活超市", "24 小时营业") +
        '<div class="modal-body" id="modal-body"></div>' +
        '<div class="modal-foot"><button class="btn" data-modal-close>离开</button></div>' +
      "</div>",
      (e) => {
        const tab = e.target.closest("[data-shop-cat]");
        if (tab) {
          shopCat = tab.dataset.shopCat;
          renderShopBody(false);
          return;
        }
        const btn = e.target.closest("[data-item]");
        if (!btn) return;
        const item = D.items.find((i) => i.id === btn.dataset.item);
        if (!item) return;
        if (item.type === "asset") {
          Game.buyAsset(item.id);
          Sound.play("purchase");
          FX.flash("gold", 520);
          renderShopBody(true);
        } else {
          Game.useItem(item.id);
          Sound.play(item.type === "food" ? "heal" : "purchase");
          renderShopBody(true);
        }
      }
    );
    renderShopBody(false);
  }

  function renderShopBody(preserveTop) {
    const body = el("modal-body");
    if (!body) return;
    const s = Game.state;
    const cats = ["全部", "食物", "提神", "增益", "消遣", "好物"];
    let items = D.items.slice();
    const catOrder = { "食物": 0, "提神": 1, "增益": 2, "消遣": 3, "好物": 4 };
    items.sort((a, b) => (catOrder[a.category] == null ? 9 : catOrder[a.category]) - (catOrder[b.category] == null ? 9 : catOrder[b.category]));
    if (shopCat !== "全部") items = items.filter((i) => i.category === shopCat);
    const prevTop = preserveTop ? body.scrollTop : 0;

    body.innerHTML =
      '<p class="modal-lead">收银台前的灯总是很亮。你口袋里有 <em>' + fmt(s.money) +
      "</em>，可以买一点让今天好过些的东西。</p>" +
      '<div class="status-strip">' +
        D.stats.map((st) => "<span>" + ico(STAT_ICONS[st.key]) + " " + st.name + " <b>" + Math.round(s.stats[st.key]) + "</b></span>").join("") +
      "</div>" +
      '<div class="shop-tabs">' +
        cats.map((c) => '<button class="shop-tab ' + (c === shopCat ? "active" : "") + '" data-shop-cat="' + c + '">' + c + "</button>").join("") +
      "</div>" +
      items
        .map((item) => {
          const owned = item.type === "asset" && s.assets[item.id];
          const buffLeft = item.type === "buff" && Game.buffLeft ? Game.buffLeft(item.id) : 0;
          const effects = item.type === "asset" || item.type === "buff" ? item.tag : item.effects ? effectLine(item.effects) : "";
          const price = Game.itemPrice ? Game.itemPrice(item) : item.price;
          const medLimited = !!(item.effects && item.effects.health > 0 && item.type === "boost" && (s.daily.meds || 0) >= 2);
          const can = s.money >= price && !owned && !medLimited;
          const label = medLimited ? "今日已用" : owned ? "已拥有" : buffLeft ? "续期" : item.type === "asset" ? "买下" : item.type === "buff" ? "启用" : item.type === "food" ? "吃" : "用";
          return (
            '<div class="item-row" data-cat="' + (item.type || "food") + '">' +
              '<div class="item-icon">' + contentIcon(item.icon) + "</div>" +
              '<div class="item-body"><div class="item-name">' + item.name +
                (owned ? '<span class="owned">已拥有</span>' : "") +
                (buffLeft ? '<span class="owned">生效 ' + buffLeft + " 天</span>" : "") + "</div>" +
                '<div class="item-desc">' + esc(item.desc) + "</div>" +
                (effects ? '<div class="item-effect">' + esc(effects) + "</div>" : "") +
              "</div>" +
              '<div class="item-right"><span class="item-price">' + fmt(price) +
                (price !== item.price ? '<em class="price-cut">-' + Math.round((1 - price / item.price) * 100) + "%</em>" : "") +
                "</span>" +
                '<button class="btn small ' + (item.type === "asset" ? "buy" : "") + '" data-item="' + item.id + '"' +
                (can ? "" : " disabled") + ">" + label + "</button>" +
              "</div>" +
            "</div>"
          );
        })
        .join("");
    body.scrollTop = prevTop;
  }

  function effectLine(effects) {
    return D.stats
      .filter((st) => effects[st.key])
      .map((st) => st.name + (effects[st.key] > 0 ? "+" : "") + effects[st.key])
      .join(" · ");
  }

  /* ============================================================
     住房
     ============================================================ */
  function openHousing() {
    mountModal(
      '<div class="modal wide">' +
        modalHead(ico("home"), "看房", "落脚之处") +
        '<div class="modal-body" id="modal-body"></div>' +
        '<div class="modal-foot"><button class="btn" data-modal-close>暂不搬家</button></div>' +
      "</div>",
      (e) => {
        const btn = e.target.closest("[data-house]");
        if (!btn) return;
        const { house, mode } = btn.dataset;
        const res = Game.moveHousing(house, mode === "buy");
        if (res && res.ok) {
          Sound.play("success");
          document.querySelector(".modal-body").scrollTop = 0;
          renderHousingBody();
        } else if (res && res.reason) {
          toast("暂时搬不了", res.reason, "bad", "🏠");
        }
      }
    );
    renderHousingBody();
  }

  function renderHousingBody() {
    const body = el("modal-body");
    if (!body) return;
    const s = Game.state;
    const current = Game.housingDef;
    const equity = s.housing.owned ? Math.round(current.buy * 0.82) : 0;
    const funds = s.money + equity;
    body.innerHTML =
      '<p class="modal-lead">你现在的落脚处是 <em class="inline-ico">' + contentIcon(current.icon) + esc(current.name) + "</em>。" +
      (s.housing.owned ? "这是你自己的房子，每天要还房贷。换房时旧房款会自动抵扣。" : "租金按天结算，搬家需要付两个月押金。") +
      "更好的睡眠会带来更多精力。</p>" +
      '<div class="status-strip">' +
        "<span>手头现金 <b>" + fmt(s.money) + "</b></span>" +
        (equity ? "<span>旧房可折现 <b>" + fmt(equity) + "</b></span>" : "") +
        "<span>" + (s.housing.owned ? "当前房贷" : "当前租金") + " <b>" +
        fmt(s.housing.owned ? Game.getMortgage() : current.rent) + "</b></span>" +
      "</div>" +
      '<div class="housing-grid">' +
        D.housings
          .map((h) => {
            const isCurrent = s.housing.id === h.id;
            const down = Math.round(h.buy * 0.3);
            return (
              '<div class="housing-card ' + (isCurrent ? "current" : "") + '">' +
                '<div class="housing-top"><div class="housing-icon">' + contentIcon(h.icon) + "</div>" +
                  '<div class="housing-name">' + h.name +
                    "<small>" + (isCurrent ? (s.housing.owned ? "当前住所 · 自有" : "当前住所 · 租住") : h.desc) + "</small>" +
                  "</div>" +
                "</div>" +
                '<div class="housing-facts">' +
                  "<span>日租 <b>" + fmt(h.rent) + "</b></span>" +
                  "<span>睡眠恢复 <b>+" + h.rest + "</b></span>" +
                  "<span>舒适 <b>+" + h.comfort + "</b></span>" +
                "</div>" +
                '<p class="housing-desc">' + esc(h.line) + "</p>" +
                '<div class="housing-actions">' +
                  (isCurrent && !s.housing.owned
                    ? '<button class="btn small" disabled>正在租住</button>'
                    : '<button class="btn small" data-house="' + h.id + '" data-mode="rent" ' +
                      (funds < h.rent * 2 || (isCurrent && s.housing.owned) ? "disabled" : "") + ">租下 · 押金 " + fmt(h.rent * 2) + "</button>") +
                  (h.buy
                    ? '<button class="btn small buy" data-house="' + h.id + '" data-mode="buy" ' +
                      (funds < down || (isCurrent && s.housing.owned) ? "disabled" : "") + ">买下 · 首付 " + fmt(down) + "</button>"
                    : "") +
                "</div>" +
                (h.buy ? '<div class="housing-desc">总价 ' + fmt(h.buy) + " · 首付 30% · 日供 " + fmt(h.buy * 0.0007) + "</div>" : "") +
              "</div>"
            );
          })
          .join("") +
      "</div>" +
      (s.housing.owned
        ? '<p class="modal-lead" style="margin-top:14px;font-size:10px">换房时，现有房产会自动按八二折出售。</p>'
        : "");
  }

  /* ============================================================
     经营
     ============================================================ */
  function openBusiness(focusId) {
    bizFocus = focusId || "";
    mountModal(
      '<div class="modal wide">' +
        modalHead(ico("store"), "生意场", "生意经") +
        '<div class="modal-body" id="modal-body"></div>' +
        '<div class="modal-foot"><button class="btn" data-modal-close>离开</button></div>' +
      "</div>",
      (e) => {
        const buy = e.target.closest("[data-biz-buy]");
        const up = e.target.closest("[data-biz-up]");
        const manage = e.target.closest("[data-biz-manage]");
        const price = e.target.closest("[data-biz-price]");
        const ad = e.target.closest("[data-biz-ad]");
        const adAll = e.target.closest("[data-biz-ad-all]");
        const hire = e.target.closest("[data-biz-hire]");
        if (buy) {
          if (Game.buyBusiness(buy.dataset.bizBuy)) {
            Sound.play("success");
            bizFocus = buy.dataset.bizBuy;
            renderBusinessBody();
          }
        } else if (up) {
          Game.upgradeBusiness(up.dataset.bizUp);
          renderBusinessBody();
        } else if (manage) {
          closeModal();
          Game.manageBusiness(manage.dataset.bizManage);
        } else if (price) {
          const ids = price.dataset.bizPrice.split("|");
          if (Game.setBizPrice(ids[0], ids[1])) Sound.play("click");
          renderBusinessBody();
        } else if (adAll) {
          if (Game.buyAllBizAds()) Sound.play("purchase");
          renderBusinessBody();
        } else if (ad) {
          if (Game.buyBizAd(ad.dataset.bizAd)) Sound.play("purchase");
          renderBusinessBody();
        } else if (hire) {
          if (Game.hireBizStaff(hire.dataset.bizHire)) Sound.play("purchase");
          renderBusinessBody();
        }
      }
    );
    renderBusinessBody();
  }

  function renderBusinessBody() {
    const body = el("modal-body");
    if (!body) return;
    const prevTop = body.scrollTop;
    const s = Game.state;
    let html =
      '<p class="modal-lead">手头现金 <em>' + fmt(s.money) + "</em> · 商业能力 Lv." + (s.skills.business || 0) +
      " · 技术 Lv." + (s.skills.tech || 0) +
      "。每天睡醒后自动结算营收并发放工资。口碑、定价、人手会一起决定流水。</p>";

    if (s.businesses.length) {
      const plan = Game.bizAdPlan();
      html +=
        '<div class="biz-bulk"><div><b>推广总览</b><span>' +
        (plan.count ? plan.count + " 家店未在推广 · 一键投放 3 天，流水 +28%" : "所有店铺都在推广中") +
        '</span></div><button class="btn small buy" data-biz-ad-all ' + (plan.count ? "" : "disabled") + ">" +
        (plan.count ? "一键投放 · " + fmt(plan.cost) : "已投放") + "</button></div>";
      html += '<div class="section-label">我的店</div>';
      s.businesses.forEach((b) => {
        const bd = Game.getBusinessDef(b.id);
        if (!bd) return;
        const income = Game.bizGrossIncome(b);
        const payroll = Game.bizPayroll(b);
        const upkeep = Game.bizUpkeep(b);
        const net = income - payroll - upkeep;
        const upCost = Game.bizUpgradeCost(b);
        const rep = Math.round(b.rep || 50);
        const visited = s.daily.visits[b.id];
        const canManage = !visited && s.stats.energy >= 6;
        const priceNow = Game.bizPriceDef(b.price);
        const repNeed = b.level >= 4 ? 70 : b.level >= 3 ? 55 : 0;
        const priceBtns = (D.bizPrices || [])
          .map(
            (p) =>
              '<button class="price-btn ' + (p.id === priceNow.id ? "active" : "") + '" data-biz-price="' +
              b.id + "|" + p.id + '" title="' + esc(p.desc) + '">' + p.name + "</button>"
          )
          .join("");
        html +=
          '<div class="biz-card owned ' + (bizFocus === b.id ? "focus" : "") + '">' +
            '<div class="biz-head"><div class="biz-icon">' + contentIcon(bd.icon) + "</div>" +
              '<div class="biz-body"><div class="biz-name">' + bd.name +
                '<span class="biz-lv">Lv.' + b.level + "</span>" +
                (b.ads > 0 ? '<span class="biz-ad">推广 ' + b.ads + " 天</span>" : "") + "</div>" +
                '<div class="biz-stats">' +
                  "<span>日营收 <b>+" + fmt(income) + "</b></span>" +
                  "<span>工资 <b>-" + fmt(payroll) + "</b></span>" +
                  "<span>运营 <b>-" + fmt(upkeep) + "</b></span>" +
                  "<span>净利 <b>" + (net >= 0 ? "+" : "") + fmt(net) + "</b></span>" +
                  "<span>员工 <b>" + b.staff + "/" + (bd.staff + 4) + "</b></span>" +
                  "<span>定价 <b>" + priceNow.name + "</b></span>" +
                "</div>" +
              "</div>" +
            "</div>" +
            '<div class="biz-meter"><span>口碑</span><i><b style="width:' + rep + '%"></b></i><em>' + rep +
              (repNeed ? " · 升级需 " + repNeed : "") + "</em></div>" +
            '<div class="biz-price-row"><span>定价</span>' + priceBtns + "</div>" +
            '<div class="biz-actions">' +
              '<button class="btn small" data-biz-manage="' + b.id + '" ' + (canManage ? "" : "disabled") + ">" +
                (visited ? "今天看过了" : s.stats.energy < 6 ? "精力不足" : "巡店 · ⚡6") + "</button>" +
              '<button class="btn small" data-biz-ad="' + b.id + '" ' +
                (b.ads > 0 ? "disabled" : "") + ">" +
                (b.ads > 0 ? "推广中" : "投放推广") + "</button>" +
              '<button class="btn small" data-biz-hire="' + b.id + '" ' +
                (b.staff >= bd.staff + 4 ? "disabled" : "") + ">" +
                (b.staff >= bd.staff + 4 ? "人手充足" : "招人 · " + fmt(bd.salary * 6 + 200)) + "</button>" +
              '<button class="btn small buy" data-biz-up="' + b.id + '" ' +
                (b.level >= 5 || s.money < upCost || (repNeed && rep < repNeed) ? "disabled" : "") + ">" +
                (b.level >= 5 ? "已满级" : repNeed && rep < repNeed ? "口碑不足" : "升级 · " + fmt(upCost)) + "</button>" +
            "</div>" +
          "</div>";
      });
    }

    html += '<div class="section-label">待盘项目</div>';
    D.businesses.forEach((bd) => {
      if (s.businesses.some((b) => b.id === bd.id)) return;
      const ok = Game.meetsReq(bd.req);
      const mock = { id: bd.id, level: 1, rep: 50, staff: bd.staff, price: "normal", ads: 0 };
      const projectedIncome = Game.bizGrossIncome(mock);
      const payroll = Game.bizPayroll(mock);
      const upkeep = Game.bizUpkeep(mock);
      const net = projectedIncome - payroll - upkeep;
      const payback = net > 0 ? Math.ceil(bd.cost / net) : 0;
      const reqs = Object.keys(bd.req || {})
        .map((k) => '<span class="job-chip ' + ((s.skills[k] || 0) >= bd.req[k] ? "req" : "no") + '">' +
          Game.skillName(k) + " Lv." + bd.req[k] + "</span>")
        .join("");
      html +=
        '<div class="biz-card tier-' + (bd.tier || 1) + '">' +
          '<div class="biz-head"><div class="biz-icon">' + contentIcon(bd.icon) + "</div>" +
            '<div class="biz-body"><div class="biz-name">' +
              '<span class="job-tier-tag">' + tierLabel(bd.tier || 1) + "</span>" + bd.name + "</div>" +
              '<div class="biz-desc">' + esc(bd.desc) + "</div>" +
              '<div class="biz-stats"><span>投入 <b>' + fmt(bd.cost) + "</b></span>" +
                "<span>日营收 <b>+" + fmt(projectedIncome) + "</b></span>" +

  function letterOf(name) {
    const ch = Array.from(String(name || "").trim())[0];
    if (!ch) return D.protagonist.letter;
    return /[a-z]/i.test(ch) ? ch.toUpperCase() : ch;
  }

  function syncTitle() {
    const s = Game.state;
    const verEl = document.querySelector(".title-ver");
    if (verEl) {
      const ver = "NO. 03 · " + D.achievements.length + " 成就 · " + D.jobs.length + " 职业 · " +

      if (verEl.textContent !== ver) verEl.textContent = ver;
    }
    const p = s.profile || D.protagonist;
    const fresh = !!s.flags.newGame;
    const save = el("title-save");

      if (fresh) {

      cont.classList.toggle("hidden", fresh);

  function showTitle() {
    if (titleOpen) return;
    titleOpen = true;
    const root = el("modal-root");
    if (root && root.classList.contains("is-open")) closeModal();
    document.body.classList.add("title-open");
    const screen = el("title-screen");
    if (screen) {
      screen.classList.add("is-on");
      screen.setAttribute("aria-hidden", "false");
    }
    const app = el("app");
    if (app) {
      app.inert = true;
      app.setAttribute("aria-hidden", "true");
    }
    syncTitle();
    updateQuickAction();
  }

  function hideTitle() {
    if (!titleOpen) return;
    titleOpen = false;
    document.body.classList.remove("title-open");
    const screen = el("title-screen");
    if (screen) {
      screen.classList.remove("is-on");
      screen.setAttribute("aria-hidden", "true");
    }
    const app = el("app");
    if (app) {
      app.inert = false;
      app.removeAttribute("aria-hidden");
    }
    updateQuickAction();
  }

  function traitStartChips(t) {
    const st = t.start || {};
    const parts = [];
    const statNames = { energy: "精力", satiety: "饱腹", mood: "心情", health: "健康" };
    ["money", "energy", "satiety", "mood", "health"].forEach((k) => {
      const v = st[k];
      if (!v) return;
      const label = k === "money" ? "现金" : statNames[k];
      parts.push('<i class="' + (v > 0 ? "up" : "down") + '">' + label + " " + (v > 0 ? "+" : "") + v + "</i>");
    });
    Object.keys(st.skills || {}).forEach((k) => {
      const v = st.skills[k];
      if (!v) return;
      parts.push('<i class="' + (v > 0 ? "up" : "down") + '">' + Game.skillName(k) + " " + (v > 0 ? "+" : "") + v + "</i>");
    });
    return parts.length ? '<span class="cc-start-chips">' + parts.join("") + "</span>" : "";
  }

  /* 出身 + 特质叠加后的开局数值，和引擎 applyProfile 保持同一套算法 */
  function creationPreview(draft) {
    const base = D.origins.find((o) => o.id === draft.origin) || D.origins[0];
    const st = Game.traitStart(draft.traits);
    const baseStats = Object.assign({ energy: 100, satiety: 82, mood: 66, health: 88 }, base.stats);
    const stats = {
      energy: Math.round(clamp(baseStats.energy + (st.energy || 0))),
      satiety: Math.round(clamp(baseStats.satiety + (st.satiety || 0))),
      mood: Math.round(clamp(baseStats.mood + (st.mood || 0))),
      health: Math.round(clamp(baseStats.health + (st.health || 0)))
    };
    const skills = {};
    ["stamina", "social", "tech", "business"].forEach((k) => {
      skills[k] = clamp((base.skills[k] || 0) + (st.skills[k] || 0), 0, Game.maxSkill || 10);
    });
    return {
      base: base,
      money: Math.max(0, base.money + (st.money || 0)),
      stats: stats,
      skills: skills,
      delta: { money: st.money || 0, energy: st.energy || 0, satiety: st.satiety || 0, mood: st.mood || 0, health: st.health || 0 }
    };
  }

  function creationPath(pv, traits) {
    const ids = traits.map((t) => t.id);
    if (ids.indexOf("techie") >= 0) return { name: "技术路线", tip: "前期先练技术，Lv.3 起能接私活，技术类岗位加薪最快。" };
    if (ids.indexOf("outgoing") >= 0 && ids.indexOf("street_smart") >= 0) return { name: "人脉路线", tip: "事件判定很高，多接工作事件和社交，钱更多来自关系和机会。" };
    if (ids.indexOf("stubborn") >= 0 || ids.indexOf("iron_gut") >= 0) return { name: "体力路线", tip: "精力与消耗都占优，早年靠体力活攒第一笔钱最稳。" };
    if (ids.indexOf("workaholic") >= 0) return { name: "拼命路线", tip: "收入高但睡眠与心情吃紧，记得给自己留一个休息的时段。" };
    if (ids.indexOf("frugal") >= 0 || ids.indexOf("steady") >= 0) return { name: "稳健路线", tip: "省钱+低利息，适合慢慢攒钱买房、开店。" };
    if (ids.indexOf("optimist") >= 0) return { name: "心态路线", tip: "心情不易崩，适合长期主义玩法。" };
    return { name: "均衡路线", tip: "没有明显短板，先找份工作稳住现金流，再决定往哪走。" };
  }

  function openCreation() {
    const cur = Game.state.profile || {};
    const draft = {
      name: cur.name || D.protagonist.name,
      origin: Game.originById(cur.origin).id,
      traits: (cur.traits || []).filter((id) => D.traits.some((t) => t.id === id)).slice(0, 2)
    };

    const html =
      '<div class="modal wide creation-modal">' +
        modalHead(ico("spark"), "捏一个自己", "新的开始") +
        '<div class="modal-body cc-body">' +
          '<div class="cc-name-row">' +
            '<div class="cc-avatar" id="cc-avatar">' + letterOf(draft.name) + "</div>" +

              '<label for="cc-name">名字</label>' +

                '<button class="cc-mini" type="button" data-cc-random-name>随机名字</button>' +

            '<div class="cc-grid">' + D.origins.map(originCard).join("") + "</div>" +
          "</div>" +
          '<div class="cc-section">' +
            '<div class="cc-head"><h4>特质</h4><span id="cc-trait-count">已选 0 / 2 · 每个特质都有代价</span></div>' +
            '<div class="cc-grid cc-traits">' + D.traits.map(traitCard).join("") + "</div>" +
          "</div>" +
          '<div class="cc-summary" id="cc-summary"></div>' +
        "</div>" +
        '<div class="modal-foot">' +
          '<button class="btn" data-modal-close>取消</button>' +
          '<button class="btn primary" id="cc-start" data-cc-start disabled>开始生活</button>' +
        "</div>" +
      "</div>";

    const root = mountModal(html, (e) => {
      const originBtn = e.target.closest("[data-cc-origin]");
      const traitBtn = e.target.closest("[data-cc-trait]");
      if (originBtn) {
        draft.origin = originBtn.dataset.ccOrigin;
        Sound.play("click");
        sync();
      } else if (traitBtn) {
        const id = traitBtn.dataset.ccTrait;
        const at = draft.traits.indexOf(id);
        if (at >= 0) draft.traits.splice(at, 1);
        else if (draft.traits.length >= 2) {
          toast("最多选 2 个特质", "有取有舍，才是人生。", "bad", "✦");
        } else {
          draft.traits.push(id);
          Sound.play("click");
        }
        sync();
      } else if (e.target.closest("[data-cc-random-name]")) {
        let next = draft.name;
        for (let i = 0; i < 8 && next === draft.name; i++) next = D.names[Math.floor(Math.random() * D.names.length)];
        draft.name = next;
        const input = root.querySelector("#cc-name");
        if (input) input.value = next;
        Sound.play("click");
        sync();
      } else if (e.target.closest("[data-cc-random]")) {
        draft.name = D.names[Math.floor(Math.random() * D.names.length)];
        draft.origin = D.origins[Math.floor(Math.random() * D.origins.length)].id;
        const pool = D.traits.map((t) => t.id).sort(() => Math.random() - 0.5);
        draft.traits = pool.slice(0, 2);
        const input = root.querySelector("#cc-name");
        if (input) input.value = draft.name;
        Sound.play("open");
        sync();
      } else if (e.target.closest("[data-cc-start]")) {
        if (!draft.name.trim()) {
          toast("还没有名字", "总得让这座城市知道怎么称呼你。", "bad", "✍️");
          return;
        }
        if (draft.traits.length !== 2) {
          toast("还差特质", "请选择 2 个特质，决定你的长处和代价。", "bad", "✦");
          return;
        }
        startNewLife({ name: draft.name.trim(), origin: draft.origin, traits: draft.traits.slice() });
      }
    });

    if (!root) return;
    const nameInput = root.querySelector("#cc-name");
    if (nameInput) {
      nameInput.addEventListener("input", () => {
        draft.name = nameInput.value;
        sync();
      });
    }

    function sync() {
      const avatar = root.querySelector("#cc-avatar");
      if (avatar) avatar.textContent = letterOf(draft.name);
      root.querySelectorAll("[data-cc-origin]").forEach((btn) => {
        btn.classList.toggle("is-active", btn.dataset.ccOrigin === draft.origin);
      });
      root.querySelectorAll("[data-cc-trait]").forEach((btn) => {
        btn.classList.toggle("is-active", draft.traits.includes(btn.dataset.ccTrait));
      });
      const origin = D.origins.find((o) => o.id === draft.origin) || D.origins[0];
      const count = root.querySelector("#cc-trait-count");
      if (count) count.textContent = "已选 " + draft.traits.length + " / 2 · 每个特质都有代价";
      const summary = root.querySelector("#cc-summary");
      if (summary) {
        const traits = draft.traits.map((id) => D.traits.find((t) => t.id === id)).filter(Boolean);
        const pv = creationPreview(draft);
        const path = creationPath(pv, traits);
        const statRow = ["energy", "satiety", "mood", "health"].map((k) => {
          const meta = D.stats.find((s) => s.key === k) || {};
          const d = pv.delta[k] || 0;
          return '<div class="cc-pv-cell"><span>' + ico(STAT_ICONS[k]) + (meta.name || k) + "</span><b>" + pv.stats[k] +
            "</b>" + (d ? '<i class="' + (d > 0 ? "up" : "down") + '">' + (d > 0 ? "+" : "") + d + "</i>" : "") + "</div>";
        }).join("");
        const skillRow = ["stamina", "social", "tech", "business"].map((k) => {
          const meta = D.skills.find((s) => s.key === k) || {};
          return '<span class="cc-pv-skill">' + ico(SKILL_ICONS[k]) + (meta.name || k) + " <b>Lv." + pv.skills[k] + "</b></span>";
        }).join("");
        summary.innerHTML =
          '<div class="cc-preview-head"><span>开局预览</span><em>数值已计入出身与特质</em></div>' +
          '<div class="cc-preview-top"><div class="cc-pv-money"><span>起始现金</span><b>¥' +
            pv.money.toLocaleString("zh-CN") + "</b>" +
            (pv.delta.money ? '<i class="' + (pv.delta.money > 0 ? "up" : "down") + '">' +
              (pv.delta.money > 0 ? "+" : "") + pv.delta.money.toLocaleString("zh-CN") + "</i>" : "") +
          '</div><div class="cc-pv-path"><span>开局定位</span><b>' + esc(path.name) + "</b><em>" + esc(path.tip) + "</em></div></div>" +
          '<div class="cc-preview-stats">' + statRow + "</div>" +
          '<div class="cc-preview-skills">' + skillRow + "</div>" +
          '<div class="cc-summary-row"><span>出身被动</span><b>' + esc(origin.passiveText) + "</b></div>" +
          '<div class="cc-summary-row"><span>已选特质</span><b>' +
            (traits.length ? traits.map((t) => contentIcon(t.icon, "sum-ico") + " " + esc(t.name)).join(" · ") : "尚未选择") + "</b></div>";
      }
      const start = root.querySelector("#cc-start");
      if (start) {
        const ready = !!draft.name.trim() && draft.traits.length === 2;
        start.disabled = !ready;
        start.textContent = ready ? "开始生活" : draft.traits.length !== 2 ? "再选 " + (2 - draft.traits.length) + " 个特质" : "先起个名字";
      }
    }
    sync();
  }

  function openSkill(key) {
    const info = Game.skillInfo(key);
    if (!info) return;
    const pct = info.max ? Math.min(100, Math.round((info.xp / Math.max(1, info.need)) * 100)) : 100;
    const perks = info.perks.milestones.map((ms) => {
      const on = info.level >= ms.level;
      return (
        '<div class="perk-row' + (on ? " on" : "") + '">' +
          '<span class="perk-lv">Lv.' + ms.level + "</span>" +
          '<span class="perk-body"><b>' + esc(ms.name) + "</b><span>" + esc(ms.desc) + "</span></span>" +
          '<span class="perk-state">' + (on ? "已解锁" : "未解锁") + "</span>" +
        "</div>"
      );
    }).join("");
    const next = info.next;
    const myActions = (D.skillActions || []).filter((a) => a.skill === key);
    const actionHtml = myActions.length
      ? '<div class="skill-perk-title">等级解锁的行动</div><div class="skill-action-list">' +
        myActions
          .map((a) => {
            const on = info.level >= a.level;
            return (
              '<div class="skill-action ' + (on ? "on" : "") + '">' +
                '<span class="sa-icon">' + contentIcon(a.icon) + "</span>" +
                '<span class="sa-body"><b>' + esc(a.name) + "</b><span>" + esc(a.desc) + "</span></span>" +
                '<span class="sa-state">' + (on ? "已解锁 · ⚡" + a.energy : "Lv." + a.level + " 解锁") + "</span>" +
              "</div>"
            );
          })
          .join("") + "</div>"
      : "";
    const foot = info.level >= info.max
      ? '<span class="fin-note">已到达 Lv.10 · 城市上限</span>'
      : '<button class="btn primary" data-skill-train>去提升 · ' + esc(info.name) + " · " + fmt(info.trainCost) + "</button>";

    mountModal(
      '<div class="modal compact skill-detail-modal">' +
        modalHead('<span class="skill-detail-icon">' + ico(SKILL_ICONS[info.key]) + "</span>", esc(info.name) + " · Lv." + info.level, "能力详情") +
        '<div class="modal-body">' +
          '<div class="skill-detail-hero">' +
            '<div class="skill-detail-top"><span>下一级</span><b>' + (info.level >= info.max ? "已满级" : info.xp + " / " + info.need + " 经验") + "</b></div>" +
            '<div class="skill-detail-bar"><i style="width:' + pct + '%"></i></div>' +
            '<p class="skill-detail-effect">当前：' + esc(info.effect) + "</p>" +
            (info.level < info.max
              ? '<p class="skill-detail-next">升到 Lv.' + (info.level + 1) + "：" + esc(info.effectNext) + "</p>"
              : "") +
            '<p class="skill-detail-cost">每次训练 ¥' + info.trainCost + " · 经验 +" + info.trainXp +
              " · 消耗 1 个时段与 12 点精力</p>" +
            '<p class="fin-note">' + esc(info.perks.intro) + "</p>" +
          "</div>" +
          '<div class="skill-perk-title">每级成长</div>' +
          '<p class="skill-perk-line">' + esc(info.perks.short) + "</p>" +
          '<div class="skill-perk-title">里程碑专精</div>' +
          '<div class="perk-list">' + perks + "</div>" +
          actionHtml +
